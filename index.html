            });
          }
          return;
        }
        writeSlot(source, pid);
        if(!state.dutyChanges[date]) state.dutyChanges[date]=[];
        if(replaced){
          state.dutyChanges[date].push({
            id:uid(), personId:replaced, personName:personName(replaced), label,
            source, reason:'臨時換手', status:'filled', filledPersonId:pid,
            override: tier===3? (btn.dataset.subNote||'') : undefined
          });
        } else if(tier===3){
          // no one was replaced, but this pick broke a rule — still record it
          // so the exception is visible afterwards rather than silently applied
          state.dutyChanges[date].push({
            id:uid(), personId:pid, personName:personName(pid), label,
            source, reason:'例外指派', status:'filled', filledPersonId:pid,
            override: btn.dataset.subNote||''
          });
        }
        saveState(); modal.remove(); render();
      };
      if(tier===3){
        showConfirm(`⚠️ ${r.person.name} 目前的狀態是「${btn.dataset.subNote||'不可排'}」，正常情況下不該排這一格。仍要指派嗎？（會在「今日異動紀錄」標註為例外指派）`, doIt);
      } else if(tier===2 && r.blockers.length){
        const swapMsg = currentPersonId
          ? `${r.person.name} 目前在「${r.blockers[0].label}」，同一個時段。確定要讓他跟 ${personName(currentPersonId)} 互換位置嗎？（兩邊都有人，總人力不變）`
          : `${r.person.name} 目前在「${r.blockers[0].label}」，同一個時段。把他調來這裡的話，那個位置會空出來需要再找人（總人力不會增加）。確定嗎？`;
        showConfirm(swapMsg, doIt);

function dutyChangeCardHTML(){

function generateScheduleText(date){
  const lines=[];
  lines.push('🌟衛哨勤務🌟');
  lines.push(dutyDateRangeLabel(date));
  orderedCategories().filter(c=>c.enforceRest && !c.excludeFromExport).forEach(cat=>{
    lines.push('🔶'+cat.name);
    const dayAssign=(state.assign[date]||{})[cat.id]||{};
    effectiveShifts(cat, date).forEach(s=>{
      const assigned=dayAssign[s.id]||[];
      const names=Array.from({length:s.count}).map((_,i)=>assigned[i]?personName(assigned[i]):'');
      const timeLabel = s.label? s.label : (s.start+'-'+s.end);
      lines.push(`${timeLabel} ${names.filter(Boolean).join('、')||'（未排）'}`);
    });
  });
  lines.push('———勤務———');
  const nonRestCats = orderedCategories().filter(c=>!c.enforceRest && !c.excludeFromExport)
    .map(c=>({kind:'cat', ref:c, sortOrder:c.sortOrder??999}));
  const miscEntries = (state.misc[date]||[]).filter(m=>{
    const preset = state.miscPresets.find(p=>p.role===m.role);
    return !preset || !preset.excludeFromExport;
  }).map(m=>{
    const preset = state.miscPresets.find(p=>p.role===m.role);
    return {kind:'misc', ref:m, sortOrder: preset? (preset.sortOrder??999) : 999};
  });
  [...nonRestCats, ...miscEntries].sort((a,b)=>a.sortOrder-b.sortOrder).forEach(item=>{
    if(item.kind==='cat'){
      const cat=item.ref;
      lines.push('♦️'+cat.name+'：');
      const dayAssign=(state.assign[date]||{})[cat.id]||{};
      effectiveShifts(cat, date).forEach(s=>{
        const assigned=dayAssign[s.id]||[];
        const names=Array.from({length:s.count}).map((_,i)=>assigned[i]?personName(assigned[i]):'').filter(Boolean);
        const label=s.label||(s.start+'-'+s.end);
        lines.push(`${label}：${names.join('、')}`);
      });
    } else {
      const m=item.ref;
      const people=m.personIds.map(pid=>personName(pid)).join('、');
      const timePart = m.start&&m.end? `（${m.start}-${m.end}）`:'';
      lines.push(`♦️${m.role}${timePart}：${people}`);
    }
  });
  return lines.join('\n');
}

/* splits one line of the exported schedule text into a stable "key" (the
   slot/role label) and its "value" (the names) so two versions can be
   compared line-by-line even though the whole file has no field markers —
   colon-terminated lines ("♦️採買：佩真") split on the last colon, space-
   separated ones ("22-24 億安") split on the first space; anything else
   (section headers) has no value and never gets flagged as changed unless
   the header text itself is genuinely different. */
function splitDiffLine(line){
  const colonIdx = Math.max(line.lastIndexOf('：'), line.lastIndexOf(':'));
  if(colonIdx>-1) return [line.slice(0,colonIdx+1), line.slice(colonIdx+1).trim()];
  const spaceIdx = line.indexOf(' ');
  if(spaceIdx>-1) return [line.slice(0,spaceIdx), line.slice(spaceIdx+1).trim()];
  return [line, ''];
}
/* compares the text you actually published last time against a freshly
   generated version, and appends ⚠️ to every line whose value changed or
   is brand new — this is a manual, per-export tool (you paste the old
   version each time) rather than something the app remembers on its own,
   since not every generated draft actually gets published. */
function diffScheduleText(oldText, newText){
  const oldMap = new Map();
  oldText.split(/\r?\n/).forEach(l=>{
    if(!l.trim()) return;
    const [k,v] = splitDiffLine(l.trim());
    oldMap.set(k, v);
  });
  const newKeys = new Set();
  const outLines = newText.split(/\r?\n/).map(l=>{
    if(!l.trim()) return l;
    const [k,v] = splitDiffLine(l.trim());
    newKeys.add(k);
    if(!v) return l; // header-only line, nothing to compare
    if(!oldMap.has(k) || oldMap.get(k)!==v) return `${l} ⚠️`;
    return l;
  });
  const removed=[];
  oldMap.forEach((v,k)=>{ if(v && !newKeys.has(k)) removed.push(`${k}${v}`); });
  return {text: outLines.join('\n'), removed};
}

function normalizePriorityArray(arr){
  const result = [...arr];
  RANK_DEFS.forEach(r=>{ if(!result.includes(r.rank)) result.push(r.rank); });
  return result;
}
function defaultPriorityArray(cat){
  if(cat.needsNCO) return normalizePriorityArray(NCO_LEAD_PRIORITY);
  if(cat.preferLowRank) return normalizePriorityArray(LOW_RANK_PRIORITY);
  return RANK_DEFS.map(r=>r.rank);
}
function defaultHelperPriorityArray(){
  return normalizePriorityArray(MEAL_HELPER_PRIORITY);
}
function categoryPriorityLabel(cat){
  if(cat.needsNCO){
    const lead = cat.customPriority || normalizePriorityArray(NCO_LEAD_PRIORITY);
    const helper = cat.customPriorityHelper || normalizePriorityArray(MEAL_HELPER_PRIORITY);
    return `帶隊(第1位)優先：${lead.join('→')}｜其餘成員優先：${helper.join('→')}｜整天班全部依：${helper.join('→')}`;
  }
  if(cat.preferLowRank){
    return `優先順序：${(cat.customPriority || normalizePriorityArray(LOW_RANK_PRIORITY)).join('→')}`;
  }
  return `優先順序：${(cat.customPriority || RANK_DEFS.map(r=>r.rank)).join('→')}`;
}
function buildScheduleCardItems(){
  const dayMisc = state.misc[currentDate]||[];
  const miscByRole = {};
  dayMisc.forEach(m=>{
    if(!miscByRole[m.role]) miscByRole[m.role]=[];
    miscByRole[m.role].push(m);
  });
  const miscGroups = Object.keys(miscByRole).map(role=>{
    const preset = state.miscPresets.find(p=>p.role===role);
    return {kind:'misc', role, entries:miscByRole[role], preset, sortOrder: preset?(preset.sortOrder??999):999};
  });
  const catItems = orderedCategories().map(cat=>({kind:'cat', cat, sortOrder:cat.sortOrder??999}));
  return [...catItems, ...miscGroups].sort((a,b)=>a.sortOrder-b.sortOrder);
}

/* explains WHY a shift is still short of its "最少需要幾位士官" requirement —
   distinguishes "nobody at all is available for the empty slots" from
   "people are available but none of them are 士官以上", since those call
   for different action (wait/reassign elsewhere vs. can't be filled at all
   without pulling someone from another duty) */
/* for a category flagged mustOutrankOthers (安全士官): everyone assigned to
   OTHER sentry categories overlapping this shift must not outrank the
   person holding this post. Returns the offending assignments, or [] when
   the ranking is fine. */
function outrankViolations(pid, cat, shift, date){
  if(!cat.mustOutrankOthers || !pid) return [];
  const holder = state.personnel.find(p=>p.id===pid);
  if(!holder) return [];
  const sMin = toMin(shift.start), eMin = wrapEndMin(sMin, toMin(shift.end));
  const out=[];
  const dayAssign = state.assign[date]||{};
  orderedCategories().forEach(other=>{
    if(other.id===cat.id) return;
    const otherAssign = dayAssign[other.id]||{};
    effectiveShifts(other, date).forEach(osft=>{
      const oS = toMin(osft.start), oE = wrapEndMin(oS, toMin(osft.end));
      if(!windowsOverlapOnce(sMin,eMin,oS,oE)) return;
      (otherAssign[osft.id]||[]).forEach(opid=>{
        if(!opid) return;
        const op = state.personnel.find(p=>p.id===opid);
        if(!op) return;
        // lower rankIndex = higher rank; violation when the other post outranks this one
        if(rankIndex(op.rank) < rankIndex(holder.rank)){
          out.push(`${other.name} ${osft.label||osft.start+'-'+osft.end} 的 ${op.name}（${op.rank}）階級高於此處的 ${holder.name}（${holder.rank}）`);
        }
      });
    });
  });
  return out;
}
function minNCOStatusHTML(cat, s, date, assigned, ncoCount){
  if(ncoCount>=s.minNCO) return `<div class="hint" style="margin-bottom:6px">此班需至少 ${s.minNCO} 位士官(含)以上，目前 ${ncoCount} 位</div>`;
  const sMin=toMin(s.start), eMin=wrapEndMin(sMin, toMin(s.end));
  const stillEligible = p => !assigned.includes(p.id) && !rankExcludedFromCategory(p.rank,cat) && !isPersonUnavailable(p.id, date, sMin, eMin, {catId:cat.id, shiftId:s.id});
  const anyAvailable = state.personnel.some(stillEligible);
  const ncoAvailable = state.personnel.some(p=>['士官','軍官'].includes(rankCategory(p.rank)) && stillEligible(p));
  let note;
  if(!anyAvailable) note='目前完全沒有人有空可排這一班';
  else if(!ncoAvailable) note='有人有空，但沒有士官以上人員有空，需人工確認調整（自動排班不會硬塞士兵充當帶隊）';
  else note='有士官有空，尚未指派';
  return `<div class="badge-issue" style="margin-bottom:6px">⚠️ 此班需至少 ${s.minNCO} 位士官(含)以上，目前 ${ncoCount} 位（${note}）</div>`;
}

function assignableOptions(cat, shift, selectedId, slotIdx){
  const s=toMin(shift.start), e0=toMin(shift.end);
  const info = p=>{
    const excluded = rankExcludedFromCategory(p.rank, cat);
    const unavailable = excluded || isPersonUnavailable(p.id, currentDate, s, wrapEndMin(s, e0), {catId:cat.id, shiftId:shift.id}) || isPersonOnExclusiveStandby(p.id, currentDate) || isDutyOfficer(p.id, currentDate);
    return {excluded, unavailable};
  };
  // available people first (in the usual priority/group order), unavailable
  // ones pushed to the bottom — matches the same "eligible people on top"
  // convention as the 其他勤務 picker, instead of mixing them in wherever
  // their rank/group would otherwise place them
  const sorted=[...state.personnel].sort((a,b)=>{
    const ia=info(a), ib=info(b);
    if(ia.unavailable!==ib.unavailable) return ia.unavailable? 1 : -1;
    return dutySortIndex(a.rank,cat,slotIdx,shift)-dutySortIndex(b.rank,cat,slotIdx,shift) || groupIndex(a.group)-groupIndex(b.group);
  });
  return sorted.map(p=>{
    const {unavailable} = info(p);
    return `<option value="${p.id}" ${p.id===selectedId?'selected':''}>${unavailable?'❗ ':''}${esc(p.name)}（${p.group||'未分組'}·${p.rank}${p.license? '·🚗'+esc(p.license):''}）</option>`;
  }).join('');
}

  /* --- 班別時段 scope handling: "default" edits cat.shifts (applies to

     "today", per-date-for-every-date-in-range for "range"), so switching

  let editScope='default';

  updateScopeUI();
  document.querySelectorAll('input[name="editScope"]').forEach(r=>{
    r.addEventListener('change', ()=>{
      editScope = document.querySelector('input[name="editScope"]:checked').value;
      if(editScope==='today' && !todayShiftsDraft){
        const existing = (state.dailyShiftOverrides[currentDate]||{})[cat.id];
        todayShiftsDraft = existing? existing.map(s=>({...s})) : cat.shifts.map(s=>({...s}));
      }
      if(editScope==='range' && !rangeShiftsDraft){
        rangeShiftsDraft = cat.shifts.map(s=>({...s}));
      }
      shiftEditRowRerender();
      updateScopeUI();
    });
  });
  function shiftEditRowRerender(){
    document.getElementById('shiftEditList').innerHTML = activeShiftsArray().map((s,i)=>shiftEditRow(s,i)).join('');
    wireShiftRows();
  }
  function wireShiftRows(){
    document.querySelectorAll('[data-shift-del]').forEach(b=>{
      b.onclick=()=>{ activeShiftsArray().splice(Number(b.dataset.shiftDel),1); shiftEditRowRerender(); };
    });
  }
  wireShiftRows();
  document.getElementById('addShift').onclick=()=>{
    activeShiftsArray().push(sh('08:00','12:00')); shiftEditRowRerender();
  };
  function readShiftDraftValues(){
    const arr = activeShiftsArray();
    return [...document.querySelectorAll('.shiftEditItem')].map((row,i)=>({
      id: arr[i]? arr[i].id : uid(),
      start: getTimeSelectValue('se-start-'+i),
      end: getTimeSelectValue('se-end-'+i),
      count: Math.max(1, Number(row.querySelector('.se-count').value)||1),
      label: row.querySelector('.se-label').value.trim(),
      restUntil: getTimeSelectValue('se-rest-'+i),

    }));

  document.getElementById('restoreShiftsBtn').onclick=()=>{
    const defaults = state.categoryShiftDefaults[cat.id];
    if(!defaults){ showAlert('這個類別目前還沒有存過預設班別，請先按下面「將目前設定存為預設班別」建立一份。'); return; }
    showConfirm(`確定要把${editScope!=='default'? '目前這份':''}班別時段還原成你設定的預設班別嗎？目前編輯中尚未儲存的調整會被取代（已經存檔的排班紀錄不會受影響）。`, ()=>{
      const cloned = defaults.map(s=>({...s, id:uid()}));
      if(editScope==='today') todayShiftsDraft = cloned;
      else if(editScope==='range') rangeShiftsDraft = cloned;
      else cat.shifts = cloned;
      shiftEditRowRerender();

  document.getElementById('setAsDefaultBtn').onclick=()=>{
    showConfirm('確定要把目前畫面上的班別設定存為這個類別的「預設班別」嗎？之後「恢復預設班別」都會用這份（不影響已經排定的班表）。', ()=>{
      state.categoryShiftDefaults[cat.id] = readShiftDraftValues().map(s=>({...s}));
      saveState();
      showAlert('已存為這個類別的預設班別。');
    });
  };
  document.getElementById('clearTodayOverrideBtn').onclick=()=>{
    showConfirm('確定要移除「今天」的專屬班別設定嗎？之後今天會改回套用這個類別的預設班別時段。', ()=>{
      if(state.dailyShiftOverrides[currentDate]) delete state.dailyShiftOverrides[currentDate][cat.id];
      todayShiftsDraft = cat.shifts.map(s=>({...s}));
      saveState();
      shiftEditRowRerender();
      updateScopeUI();
    });
  };
  wireCloseConfirm(modal, document.getElementById('closeModal'));
  document.getElementById('duplicateCatBtn').onclick=()=>{
    showPrompt('新類別名稱？（例：G028後門）', cat.name+'（複製）', (newName)=>{
      const newId=uid();
      const newShifts = cat.shifts.map(s=>({...s, id:uid()}));
      const newCat = {
        ...cat,
        id:newId, name:newName, shifts:newShifts,
        excludeRanks: [...(cat.excludeRanks||[])],
        avoidRanks: [...(cat.avoidRanks||[])],
        customPriority: cat.customPriority? [...cat.customPriority] : undefined,
        customPriorityHelper: cat.customPriorityHelper? [...cat.customPriorityHelper] : undefined,
        sortOrder: nextSortOrder(),
      };
      state.categories.push(newCat);
      state.categoryShiftDefaults[newId] = newShifts.map(s=>({...s}));
      saveState();
      modal.remove();
      showAlert(`已建立「${newName}」，複製自「${cat.name}」的全部設定，可以再進去微調細節。`);
      render();
    });
  };
  document.getElementById('deleteCatBtn').onclick=()=>{
    showConfirm(`確定要刪除「${cat.name}」這個類別嗎？會一併移除這個類別的預設班別設定、所有日期的專屬班別設定，以及所有日期已經排定的人員。如果刪錯了，可以用畫面左上角的復原（↩️）按鈕還原。`, ()=>{
      state.categories = state.categories.filter(c=>c.id!==cat.id);
      delete state.categoryShiftDefaults[cat.id];
      Object.keys(state.dailyShiftOverrides).forEach(d=>{ delete state.dailyShiftOverrides[d][cat.id]; });
      Object.keys(state.assign).forEach(d=>{ delete state.assign[d][cat.id]; });
      Object.keys(state.dutyChanges).forEach(d=>{
        state.dutyChanges[d] = (state.dutyChanges[d]||[]).filter(ch=>!(ch.source.kind==='cat' && ch.source.catId===cat.id));
      });
      saveState();
      modal.remove();
      showAlert(`已刪除「${cat.name}」。`);
      render();

  };
  document.getElementById('saveCat').onclick=()=>{
    cat.name=document.getElementById('catName').value.trim()||cat.name;
    cat.enforceRest=document.getElementById('catRest').checked;
    cat.preferLowRank=document.getElementById('catLow').checked;

    cat.isSentry=document.getElementById('catSentry').checked;
    cat.mustOutrankOthers=document.getElementById('catOutrank').checked;
    cat.excludeRanks=[...document.getElementById('catExclude').selectedOptions].map(o=>o.value);
    cat.avoidRanks=[...document.getElementById('catAvoid').selectedOptions].map(o=>o.value);
    cat.customPriority=[...priorityDraft];
    if(cat.needsNCO) cat.customPriorityHelper=[...priorityHelperDraft];
    else delete cat.customPriorityHelper;
    const draftShifts = readShiftDraftValues();
    if(editScope==='today'){
      if(!state.dailyShiftOverrides[currentDate]) state.dailyShiftOverrides[currentDate]={};
      state.dailyShiftOverrides[currentDate][cat.id] = draftShifts;
    } else if(editScope==='range'){
      const rs=document.getElementById('scopeRangeStart').value, re=document.getElementById('scopeRangeEnd').value;
      if(!rs||!re||rs>re){ showAlert('請確認日期範圍正確（起始日不能晚於結束日）'); return; }
      dateRangeList(rs,re).forEach(d=>{
        if(!state.dailyShiftOverrides[d]) state.dailyShiftOverrides[d]={};
        state.dailyShiftOverrides[d][cat.id] = draftShifts.map(s=>({...s, id:uid()}));

      cat.shifts.length = 0;
      draftShifts.forEach(d=>cat.shifts.push(d));

  function shiftEditRow(s,i){
    return `<div class="shift-row shiftEditItem" data-i="${i}">

        <div class="grow"><label>補休至(選填，下班後自動排除其他勤務至此時間)</label>${timeSelectHTML('se-rest-'+i, s.restUntil, {allowEmpty:true})}</div>
      </div>

        <div style="width:120px"><label>最少需要幾位士官(含)以上(選填，0代表不限)</label><input type="text" class="se-minnco" value="${s.minNCO||0}"></div>
      </div>

function runDailyCheck(){
  const out=[];
  const seen=new Set();
  state.categories.filter(c=>c.enforceRest).forEach(cat=>{
    const dayAssign=(state.assign[currentDate]||{})[cat.id]||{};
    effectiveShifts(cat, currentDate).forEach(s=>{
      (dayAssign[s.id]||[]).forEach(pid=>{
        if(!pid) return;
        const issues=restIssues(pid,currentDate,cat.id,s);
        issues.forEach(i=>{
          const key=pid+'|'+i; if(seen.has(key)) return; seen.add(key);
          out.push(`⚠️ ${personName(pid)}（${cat.name} ${s.label||s.start+'-'+s.end}）：${i}`);
        });
        if(assignedSameShiftYesterday(pid,currentDate,cat.id,s.id)){
          out.push(`⚠️ ${personName(pid)}（${cat.name} ${s.label||s.start+'-'+s.end}）：昨天也值這個時段，連續兩天同時段`);
        }
        if(wouldRestWindowConflict(pid,currentDate,s,{catId:cat.id,shiftId:s.id})){
          out.push(`⚠️ ${personName(pid)}（${cat.name} ${s.label||s.start+'-'+s.end}）：下班補休時段跟其他已排的勤務衝突`);
        }
        if(prepGapConflict(pid,currentDate,cat,s)){
          out.push(`⚠️ ${personName(pid)}（${cat.name} ${s.label||s.start+'-'+s.end}）：開始前不到30分鐘還在忙其他勤務，沒時間準備`);
        }
      });
    });
  });
  const mealCat = state.categories.find(c=>c.needsNCO);
  if(mealCat){
    const dayAssign=(state.assign[currentDate]||{})[mealCat.id]||{};
    const allPeople = effectiveShifts(mealCat, currentDate).flatMap(s=>dayAssign[s.id]||[]).filter(Boolean);
    const hasNCO = allPeople.some(pid=>['士官','軍官'].includes(rankCategory(personRank(pid))));
    if(allPeople.length && !hasNCO) out.push(`⚠️ ${mealCat.name}：當日尚無「士官」以上人員帶隊`);
  }
  state.categories.filter(c=>c.preferLowRank).forEach(cat=>{
    const dayAssign=(state.assign[currentDate]||{})[cat.id]||{};
    effectiveShifts(cat, currentDate).forEach(s=>{
      (dayAssign[s.id]||[]).forEach(pid=>{
        if(pid && rankCategory(personRank(pid))==='軍官') out.push(`⚠️ ${cat.name} ${s.label||s.start+'-'+s.end}：${personName(pid)} 為軍官，建議改排較低階`);
      });
    });
  });
  state.categories.filter(c=>c.needsNCO).forEach(cat=>{
    const dayAssign=(state.assign[currentDate]||{})[cat.id]||{};
    effectiveShifts(cat, currentDate).forEach(s=>{
      (dayAssign[s.id]||[]).forEach(pid=>{
        if(pid && rankCategory(personRank(pid))==='軍官') out.push(`⚠️ ${cat.name} ${s.label||s.start+'-'+s.end}：${personName(pid)} 為軍官，盡量避免安排軍官擔任打飯班`);
      });
    });
  });
  state.categories.forEach(cat=>{
    const dayAssign=(state.assign[currentDate]||{})[cat.id]||{};
    effectiveShifts(cat, currentDate).forEach(s=>{
      (dayAssign[s.id]||[]).forEach(pid=>{
        if(!pid) return;
        const busy = isPersonUnavailable(pid, currentDate, toMin(s.start), wrapEndMin(toMin(s.start), toMin(s.end)), {catId:cat.id, shiftId:s.id});
        if(busy){
          const key='busy|'+pid+'|'+cat.id+'|'+s.id; if(seen.has(key)) return; seen.add(key);
          out.push(`⚠️ ${personName(pid)}（${cat.name} ${s.label||s.start+'-'+s.end}）：此時段該員請假/長期事故/補休中或已排其他勤務`);
        }
      });
    });
  });
  document.getElementById('dailyCheckOut').innerHTML = out.length?
    out.map(o=>`<div class="warn" style="margin-top:6px">${esc(o)}</div>`).join('') :
    `<div class="ok" style="margin-top:6px">✅ 目前排班未發現違規</div>`;
}

let miscSelectedRoles=null;
let miscFreeformFilterState={search:'',group:''};
let miscFreeformCheckedIds=new Set();
let miscEditingId=null;
let adhocQueryState={time:'10:00',mode:'byRank',officer:0,nco:0,enlisted:0,anyCount:0,skill:'',license:'',needMedCert:false,hasRun:false,results:null};
function adhocCandidateMatches(p){
  if(adhocQueryState.skill && !(p.skills||[]).includes(adhocQueryState.skill)) return false;
  if(adhocQueryState.license && !licenseCovers(p.license, adhocQueryState.license)) return false;
  if(adhocQueryState.needMedCert && !p.medCert) return false;
  return true;
}
function runAdhocQuery(){
  const {time, officer, nco, enlisted, mode, anyCount} = adhocQueryState;
  const qMin = toMin(time);
  const wanted = {軍官:Number(officer)||0, 士官:Number(nco)||0, 士兵:Number(enlisted)||0};
  const byCategory = {軍官:[], 士官:[], 士兵:[]};
  const anyList = [];
  state.personnel.forEach(p=>{
    const cat = rankCategory(p.rank);
    if(!cat) return;
    if(!adhocCandidateMatches(p)) return;
    if(isPersonUnavailable(p.id, currentDate, qMin, qMin+1)) return;
    const freeMin = freeDurationFrom(p.id, currentDate, qMin);
    const freeUntilMin = qMin+freeMin;
    let nextCommitment = null;
    if(freeUntilMin < 1440){
      const reasons = unavailabilityReasonsInRange(p.id, currentDate, freeUntilMin, Math.min(freeUntilMin+1,1440));
      if(reasons.length) nextCommitment = reasons[0];
    }
    const row = {p, freeMin, freeUntilMin, nextCommitment};
    byCategory[cat].push(row);
    anyList.push(row);
  });
  Object.keys(byCategory).forEach(cat=>{
    byCategory[cat].sort((a,b)=>b.freeMin-a.freeMin);
  });
  anyList.sort((a,b)=>b.freeMin-a.freeMin);
  adhocQueryState.results = {mode, wanted, anyCount:Number(anyCount)||0, byCategory, anyList};
  adhocQueryState.hasRun = true;
}
function renderAdhocQueryResult(){
  if(!adhocQueryState.results) return '';
  const {mode, wanted, anyCount, byCategory, anyList} = adhocQueryState.results;
  const p2=n=>String(n).padStart(2,'0');
  const fmtMin=m=>`${p2(Math.floor(m/60)%24)}:${p2(m%60)}`;
  const rowHtml = ({p,freeMin,freeUntilMin,nextCommitment})=>`
        <div class="row" style="align-items:flex-start;margin-bottom:4px">
          <div class="muted grow">・${esc(p.name)}（${p.group||'未分組'}·${p.rank}${personBadges(p)}）：可用到 ${fmtMin(freeUntilMin)}（共${Math.floor(freeMin/60)}時${freeMin%60}分）${nextCommitment? ` → 之後：${esc(nextCommitment)}`:''}</div>
          <button class="ghost small" data-adhoc-add="${p.id}" data-adhoc-start="${adhocQueryState.time}" data-adhoc-end="${fmtMin(freeUntilMin)}">加入</button>
        </div>`;
  if(mode==='anyCount'){
    const enough = !anyCount || anyList.length>=anyCount;
    return `<div style="margin-bottom:10px">
      ${anyCount? `<div class="${enough?'hint':'badge-issue'}" style="margin-bottom:4px">${enough?'':'⚠️ '}需要 ${anyCount} 人，目前有空的共 ${anyList.length} 人</div>` : `<div class="hint" style="margin-bottom:4px">共 ${anyList.length} 人有空</div>`}
      ${anyList.length? anyList.map(rowHtml).join('') : `<div class="empty">此時段沒有人有空</div>`}
    </div>`;
  }
  return ['軍官','士官','士兵'].map(cat=>{
    const candidates = byCategory[cat];
    if(!wanted[cat] && !candidates.length) return '';
    const enough = !wanted[cat] || candidates.length >= wanted[cat];
    return `<div style="margin-bottom:10px">
      ${wanted[cat]? `<div class="${enough?'hint':'badge-issue'}" style="margin-bottom:4px">${enough?'':'⚠️ '}需要${cat} ${wanted[cat]} 人，目前有空的共 ${candidates.length} 人</div>` : `<div class="hint" style="margin-bottom:4px">${cat}（共 ${candidates.length} 人有空）</div>`}
      ${candidates.length? candidates.map(rowHtml).join('') : `<div class="empty">此時段沒有${cat}有空</div>`}
    </div>`;
  }).join('');
}

    if(lt.mode==='range' && lt.start && lt.end && windowsOverlapRecurring(s,e,toMin(lt.start),toMin(lt.end))) return true;
  }
  for(const u of (state.unavail[date]||[]).filter(u=>u.personId===personId)){
    if(u.allDay) return true;
    if(incidentBlocksWindow(u, s, e, false)) return true;
  }
  for(const w of personCompRestWindows(personId, date)){
    if(windowsOverlapRecurring(s,e,toMin(w.start),toMin(w.end))) return true;
  }
  const dayAssign = state.assign[date]||{};
  for(const cat of state.categories){
    const catAssign = dayAssign[cat.id]||{};
    for(const sft of effectiveShifts(cat, date)){
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapRecurring(s,e,shiftBusyStartMin(cat,sft),wrapEndMin(toMin(sft.start),toMin(sft.end)))) return true;
    }
  }
  for(const mm of (state.misc[date]||[])){
    if(mm.id===excludeEntryId) continue;
    if((mm.nominalIds||[]).includes(personId)) continue; // 掛名：doesn't block
    if(mm.start && mm.end && (mm.personIds||[]).includes(personId) && windowsOverlapOnce(s,e,toMin(mm.start),toMin(mm.end))) return true;
    if(mm.restUntil && mm.end && (mm.personIds||[]).includes(personId) && windowsOverlapRecurring(s,e,toMin(mm.end),toMin(mm.restUntil))) return true;
  }
  if(isPersonOnExclusiveStandby(personId, date, excludeEntryId)) return true;
  return false;
}
function miscEditBusyReasons(personId, date, s, eRaw, excludeEntryId){
  const e = wrapEndMin(s, eRaw);
  const out=[];
  const person = state.personnel.find(p=>p.id===personId);
  if(person){
    const lt = effectiveLongTerm(person, date);
    if(lt.mode==='allday') out.push('長期事故：全天不可排');
    else if(lt.mode==='range' && lt.start && lt.end && windowsOverlapRecurring(s,e,toMin(lt.start),toMin(lt.end))) out.push(`長期事故：每天 ${lt.start}-${lt.end} 不可排`);
  }
  (state.unavail[date]||[]).filter(u=>u.personId===personId).forEach(u=>{
    const hit = u.allDay || incidentBlocksWindow(u, s, e, false);
    if(hit) out.push(`${u.allDay? '全天':`${u.start}-${u.end}`}${u.reason? '（'+u.reason+'）':'（未註記原因）'}`);
  });
  for(const w of personCompRestWindows(personId, date)){
    if(windowsOverlapRecurring(s,e,toMin(w.start),toMin(w.end))) out.push(`補休中（${w.catName} ${w.label} 後，至 ${w.end}）`);
  }
  const dayAssign = state.assign[date]||{};
  state.categories.forEach(cat=>{
    const catAssign = dayAssign[cat.id]||{};
    effectiveShifts(cat, date).forEach(sft=>{
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapRecurring(s,e,shiftBusyStartMin(cat,sft),wrapEndMin(toMin(sft.start),toMin(sft.end)))){
        out.push(`勤務中：${cat.name} ${sft.label||sft.start+'-'+sft.end}${cat.enforceRest?'（含準備時間）':''}`);
      }
    });
  });
  (state.misc[date]||[]).forEach(mm=>{
    if(mm.id===excludeEntryId) return;
    if(!(mm.personIds||[]).includes(personId)) return;
    if(mm.start && mm.end && windowsOverlapOnce(s,e,toMin(mm.start),toMin(mm.end))) out.push(`勤務中：${mm.role}${mm.start&&mm.end?` (${mm.start}-${mm.end})`:''}`);
    else if(mm.restUntil && mm.end && windowsOverlapRecurring(s,e,toMin(mm.end),toMin(mm.restUntil))) out.push(`補休中（${mm.role} 後，至 ${mm.restUntil}）`);
  });
  if(isPersonOnExclusiveStandby(personId, date, excludeEntryId)) out.push('今天已擔任只能待命的勤務，不能再接其他任務');
  return [...new Set(out)];
}
/* the searchable, sorted (available-first) person checkbox list used by the
   freeform (no defined roles) branch of the inline 其他勤務 editor — reads
   the entry's OWN current start/end select values (so changing the time
   live-updates who's flagged busy) and applies the entry's preset
   requirements (license/EMT/skill) the same way the top "新增項目" form does */
function inlineMiscPeopleListHTML(m, searchFilter){
  const preset = presetForEntry(m);
  const startExists = !!document.getElementById('inlineStart-'+m.id+'__h');
  const startVal = startExists? getTimeSelectValue('inlineStart-'+m.id) : m.start;
  const endExists = !!document.getElementById('inlineEnd-'+m.id+'__h');
  const endVal = endExists? getTimeSelectValue('inlineEnd-'+m.id) : m.end;
  const hasTime = !!(startVal && endVal);
  const s = hasTime? toMin(startVal) : null;
  const eRaw = hasTime? toMin(endVal) : null;
  const checkedIds = new Set(m.personIds||[]);
  const container = document.getElementById('inlineMiscPeopleList-'+m.id);
  if(container){
    container.querySelectorAll('.inline-misc-person-cb').forEach(cb=>{
      if(cb.checked) checkedIds.add(cb.value); else checkedIds.delete(cb.value);
    });
  }
  let list=[...state.personnel];
  if(searchFilter) list = list.filter(p=>p.name.includes(searchFilter));
  if(!list.length) return `<div class="empty">找不到符合的人員</div>`;
  const withInfo = list.map(p=>{
    const reasons=[];
    if(hasTime && isPersonBusyForMiscEdit(p.id, currentDate, s, eRaw, m.id)){
      miscEditBusyReasons(p.id, currentDate, s, eRaw, m.id).forEach(r=>reasons.push(r));
    }
    if(preset) driverQualificationIssues(p, preset).forEach(r=>reasons.push(r));
    if(preset && personHasConflictingStandby(p.id, currentDate, preset, m.id)) reasons.push('今天已擔任其他全天待命勤務，資格衝突（避免真的需要出動時人被卡住）');
    if(isPersonOnExclusiveStandby(p.id, currentDate, m.id)) reasons.push('今天已擔任只能待命的勤務，不能再接其他任務');
    return {p, checked:checkedIds.has(p.id), reasons};
  });
  withInfo.sort((a,b)=>{
    const ba=a.reasons.length>0?1:0, bb=b.reasons.length>0?1:0;
    if(ba!==bb) return ba-bb;
    return rankPriorityIndex(a.p.rank,preset)-rankPriorityIndex(b.p.rank,preset) || groupIndex(a.p.group)-groupIndex(b.p.group);
  });
  return withInfo.map(({p,checked,reasons})=>{
    const busy = reasons.length>0;
    return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0;${busy?'color:var(--danger)':''}">
      <input type="checkbox" class="inline-misc-person-cb" value="${p.id}" style="width:auto" ${checked?'checked':''}>
      ${esc(p.name)}（${p.group||'未分組'}·${p.rank}${personBadges(p)}）${busy? ` 🚫不可排（${[...new Set(reasons)].join('・')}）`:''}
    </label>`;
  }).join('');
}

function roleIneligibilityReasons(person, role, preset, driver, date, s, eRaw, excludeMiscId, otherSelectedIds){
  const reasons=[];
  if(otherSelectedIds && otherSelectedIds.includes(person.id)) reasons.push('已擔任這個項目的其他角色');
  if(role==='駕駛'){
    driverQualificationIssues(person, preset).forEach(r=>reasons.push(r));
  } else if(role==='車長'){
    if(!['士官','軍官'].includes(rankCategory(person.rank))) reasons.push('需為士官以上');
    if(driver && rankIndex(person.rank)>rankIndex(driver.rank)) reasons.push('階級不可低於駕駛');
    if(preset && preset.requiredMedCert && !person.medCert) reasons.push('需具備EMT或醫生證書');
    if(preset && preset.chiefRequiredMedCert && !person.medCert) reasons.push('需具備EMT或醫生證書');
    if(preset && (preset.chiefRequiredLicenses||[]).length && !preset.chiefRequiredLicenses.some(l=>licenseCovers(person.license, l))) reasons.push(`需持有${preset.chiefRequiredLicenses.join('或')}駕照`);
    ((preset&&preset.chiefRequiredSkills)||[]).forEach(sk=>{ if(!(person.skills||[]).includes(sk)) reasons.push(`需具備${sk}專長`); });
  } else if(role.startsWith('話務')){
    if(!person.license) reasons.push('需至少小型車駕照');
  }
  if(s!=null && eRaw!=null){
    const e = wrapEndMin(s, eRaw);
    if(isPersonUnavailable(person.id, date, s, e)){
      unavailabilityReasonsInRange(person.id, date, s, e).forEach(r=>reasons.push(r));
    }
  }
  if(preset && personHasConflictingStandby(person.id, date, preset, excludeMiscId)) reasons.push('今天已擔任其他全天待命勤務，資格衝突');
  if(isPersonOnExclusiveStandby(person.id, date, excludeMiscId)) reasons.push('今天已擔任只能待命的勤務，不能再接其他任務');
  if(role!=='值星' && isDutyOfficer(person.id, date)) reasons.push('今日值星，原則上不自行出勤');
  return [...new Set(reasons)];
}
/* single-person picker rendered as a searchable tap-list — same look as
   every other person-picker in the app (search box + eligible-first list,
   🚫 + combined reason for anyone who can't take it) — instead of a native
   <select>, which is what 駕駛/車長/話務 role assignment used to use.
   Keeps a hidden input with `idPrefix` as its id holding the chosen
   person id, so every existing call site that reads
   `document.getElementById(idPrefix).value` keeps working unchanged. */
function rolePickerHTML(idPrefix, selectedId, reasonsFn){
  const list=state.personnel.filter(p=>!isDeparted(p)).sort((a,b)=>{
    const ra=reasonsFn(a), rb=reasonsFn(b);
    const pa=ra.length?1:0, pb=rb.length?1:0;
    if(pa!==pb) return pa-pb;
    return groupIndex(a.group)-groupIndex(b.group) || rankIndex(a.rank)-rankIndex(b.rank);
  });
  return `
    <input type="hidden" id="${idPrefix}" value="${selectedId||''}">
    <input type="text" class="role-picker-search" data-role-picker-search="${idPrefix}" placeholder="輸入姓名關鍵字" style="margin-bottom:6px">
    <div class="role-picker-list" id="${idPrefix}-list" style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px">
      ${rolePickerRows(idPrefix, list, selectedId, reasonsFn)}
    </div>`;
}
function rolePickerRows(idPrefix, list, selectedId, reasonsFn){
  const optOut = `<label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0">
      <input type="radio" name="${idPrefix}-radio" class="role-picker-radio" data-role-picker="${idPrefix}" value="" ${!selectedId?'checked':''} style="width:auto"> （未指派）
    </label>`;
  if(!list.length) return optOut + `<div class="empty">找不到符合的人員</div>`;
  return optOut + list.map(p=>{
    const reasons = reasonsFn(p);
    return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0">
      <input type="radio" name="${idPrefix}-radio" class="role-picker-radio" data-role-picker="${idPrefix}" value="${p.id}" ${p.id===selectedId?'checked':''} style="width:auto">
      ${esc(p.name)}（${p.group||'未分組'}·${p.rank}${personBadges(p)}）${reasons.length? ` <span class="warn">🚫不可排（${reasons.map(esc).join('・')}）</span>`:''}
    </label>`;
  }).join('');
}
/* wires the hidden-input-sync for every role-picker radio on the page,
   plus simple client-side name filtering for its search box (shows/hides
   already-rendered rows rather than re-fetching — the rows already carry
   everything needed to filter on name). changeCb(idPrefix, newValue), if
   given, runs whatever used to be wired to the old <select>'s change
   event (e.g. refreshing the 車長 picker's reasons when 駕駛 changes). */
function wireRolePickers(changeCb){
  document.querySelectorAll('.role-picker-radio').forEach(r=>{
    r.onchange=()=>{
      const idPrefix = r.dataset.rolePicker;
      document.getElementById(idPrefix).value = r.value;
      if(changeCb) changeCb(idPrefix, r.value);
    };
  });
  document.querySelectorAll('[data-role-picker-search]').forEach(input=>{
    input.oninput=()=>{
      const idPrefix = input.dataset.rolePickerSearch;
      const term = input.value.trim();
      const listEl = document.getElementById(idPrefix+'-list');
      if(!listEl) return;
      listEl.querySelectorAll('label').forEach(label=>{
        const radio = label.querySelector('input[type="radio"]');
        if(radio && radio.value===''){ label.style.display='flex'; return; }
        label.style.display = (!term || label.textContent.includes(term))? 'flex':'none';
      });
    };
  });
}
function wireMiscInlineEditors(){
  if(miscInlineEditId){
    const m = (state.misc[currentDate]||[]).find(mm=>mm.id===miscInlineEditId);
    if(m && !m.roles){
      const searchInput = document.getElementById('inlineMiscSearch-'+m.id);

      };

      ['inlineStart-'+m.id+'__h','inlineStart-'+m.id+'__m','inlineEnd-'+m.id+'__h','inlineEnd-'+m.id+'__m'].forEach(subId=>{
        const el=document.getElementById(subId);
        if(el) el.addEventListener('change', refreshList);
      });
      wireRolePickers();
    } else if(m && m.roles){
      // re-render every role-picker's rows for THIS entry whenever any one
      // of them changes — e.g. picking 駕駛 must immediately re-check
      // whether each 車長 candidate still outranks them, which the picker
      // can only reflect by recomputing reasonsFn with the new driver
      const preset = presetForEntry(m);
      const sMin = m.start? toMin(m.start) : null;
      const eMinRaw = m.end? toMin(m.end) : null;
      const refreshRoleLists = ()=>{
        m.roles.forEach((r,i)=>{
          const idPrefix = 'inlineRoleSel-'+m.id+'-'+i;
          const listEl = document.getElementById(idPrefix+'-list');
          const hiddenInput = document.getElementById(idPrefix);
          if(!listEl || !hiddenInput) return;
          const currentVal = hiddenInput.value;
          let driver=null;
          if(r==='車長'){
            const driverIdx=m.roles.indexOf('駕駛');
            if(driverIdx>-1){
              const driverInput=document.getElementById('inlineRoleSel-'+m.id+'-'+driverIdx);
              driver = driverInput? state.personnel.find(p=>p.id===driverInput.value) : null;
            }
          }
          const otherSelectedIds = m.roles.map((_,idx)=>{
            if(idx===i) return null;
            const otherInput = document.getElementById('inlineRoleSel-'+m.id+'-'+idx);
            return otherInput? otherInput.value : null;
          }).filter(Boolean);
          const reasonsFn = p=>roleIneligibilityReasons(p, r, preset, driver, currentDate, sMin, eMinRaw, m.id, otherSelectedIds);
          const sorted=[...state.personnel].sort((a,b)=>{
            const ra=reasonsFn(a), rb=reasonsFn(b);
            const pa=ra.length?1:0, pb=rb.length?1:0;
            if(pa!==pb) return pa-pb;
            return groupIndex(a.group)-groupIndex(b.group) || rankIndex(a.rank)-rankIndex(b.rank);
          });
          listEl.innerHTML = rolePickerRows(idPrefix, sorted, currentVal, reasonsFn);
        });
        wireRolePickers(refreshRoleLists);
      };
      wireRolePickers(refreshRoleLists);
    } else {
      wireRolePickers();
    }
  } else {
    wireRolePickers();
  }
  document.querySelectorAll('[data-inline-save]').forEach(btn=>{
    btn.onclick=()=>{
      const id = btn.dataset.inlineSave;
      const m = (state.misc[currentDate]||[]).find(mm=>mm.id===id);
      if(!m) return;
      const roleInput = document.getElementById('inlineRole-'+id);
      if(roleInput) m.role = roleInput.value.trim()||m.role;
      m.start = getTimeSelectValue('inlineStart-'+id);
      m.end = getTimeSelectValue('inlineEnd-'+id);
      if(m.roles){
        m.personIds = m.roles.map((_,i)=>{
          const input=document.getElementById(`inlineRoleSel-${id}-${i}`);
          return input? (input.value||undefined) : m.personIds[i];
        });
        m.lockedSlots = m.roles.map((_,i)=>{
          const cb=document.querySelector(`[data-inline-lock="${id}-${i}"]`);
          return cb? cb.checked : false;
        });
      } else {
        m.personIds = [...document.querySelectorAll('.inline-misc-person-cb:checked')].map(cb=>cb.value);
        const skipCb=document.getElementById('inlineSkipAutoFill-'+id);
        m.skipAutoFill = skipCb? skipCb.checked : false;
      }
      miscInlineEditId=null;
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-inline-cancel]').forEach(btn=>{
    btn.onclick=()=>{ miscInlineEditId=null; render(); };
  });
}

  function refreshPeopleFlags(){

    const e0 = hasTime? toMin(endVal) : null;

      if(!rows.length) return;
      const withInfo = rows.map(row=>{
        const pid = row.dataset.miscPersonRow;
        const person = state.personnel.find(p=>p.id===pid);
        const cb = row.querySelector('input');
        const checked = cb ? cb.checked : miscFreeformCheckedIds.has(pid);
        const reasons=[];
        if(person){
          if(hasTime && isPersonUnavailable(pid, currentDate, s, wrapEndMin(s, e0))){
            unavailabilityReasonsInRange(pid, currentDate, s, wrapEndMin(s, e0)).forEach(msg=>reasons.push(msg));
          }
          if(presetForForm) driverQualificationIssues(person, presetForForm).forEach(m=>reasons.push(m));
          if(presetForForm && personHasConflictingStandby(pid, currentDate, presetForForm, miscEditingId)) reasons.push('今天已擔任其他全天待命勤務，資格衝突');
          if(isPersonOnExclusiveStandby(pid, currentDate, miscEditingId)) reasons.push('今天已擔任只能待命的勤務，不能再接其他任務');
        }
        return {pid, person, checked, reasons};
      }).filter(x=>x.person);
      withInfo.sort((a,b)=>{
        const ba=a.reasons.length>0?1:0, bb=b.reasons.length>0?1:0;
        if(ba!==bb) return ba-bb;
        return rankPriorityIndex(a.person.rank,presetForForm)-rankPriorityIndex(b.person.rank,presetForForm) || groupIndex(a.person.group)-groupIndex(b.person.group);
      });
      container.innerHTML = withInfo.map(({pid,person,checked,reasons})=>{
        const busy = reasons.length>0;
        return `<label data-misc-person-row="${pid}" style="display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0;${busy?'color:var(--danger)':''}">
          <input type="checkbox" class="misc-person-cb" value="${pid}" style="width:auto" ${checked?'checked':''}>
          ${esc(person.name)}（${person.group||'未分組'}·${person.rank}${personBadges(person)}）${busy? ` 🚫不可排（${[...new Set(reasons)].join('・')}）`:''}
        </label>`;

      wireMiscCheckboxes();
      return;

      const listEl = document.getElementById('mRoleSel'+idx+'-list');
      const hiddenInput = document.getElementById('mRoleSel'+idx);
      if(!listEl || !hiddenInput) return;

      let driver=null;

        const driverIdx=miscSelectedRoles.indexOf('駕駛');
        if(driverIdx>-1){
          const driverInput=document.getElementById('mRoleSel'+driverIdx);
          driver = driverInput? state.personnel.find(p=>p.id===driverInput.value) : null;
        }
      }
      const otherSelectedIds = miscSelectedRoles.map((_,i2)=>{
        if(i2===idx) return null;
        const otherInput = document.getElementById('mRoleSel'+i2);
        return otherInput? otherInput.value : null;
      }).filter(Boolean);
      const reasonsFn = p=>roleIneligibilityReasons(p, r, presetForForm, driver, currentDate, s, e0, miscEditingId, otherSelectedIds);
      const sorted=[...state.personnel].sort((a,b)=>{
        const ra=reasonsFn(a), rb=reasonsFn(b);
        const pa=ra.length?1:0, pb=rb.length?1:0;
        if(pa!==pb) return pa-pb;
        return groupIndex(a.group)-groupIndex(b.group) || rankIndex(a.rank)-rankIndex(b.rank);
      });
      listEl.innerHTML = rolePickerRows('mRoleSel'+idx, sorted, currentVal, reasonsFn);

  document.getElementById('mAdd').onclick=()=>{
    const role=document.getElementById('mRole').value.trim();
    if(!role) return;
    const start=getTimeSelectValue('mStart'), end=getTimeSelectValue('mEnd');
    if(!state.misc[currentDate]) state.misc[currentDate]=[];
    const existing = miscEditingId? state.misc[currentDate].find(m=>m.id===miscEditingId) : null;
    if(miscSelectedRoles){
      const personIds=miscSelectedRoles.map((_,i)=>document.getElementById('mRoleSel'+i).value);
      const lockedSlots=miscSelectedRoles.map((_,i)=>{
        const cb=document.querySelector(`.mp-lock-slot[data-lock-idx="${i}"]`);
        return cb? cb.checked : false;
      });
      if(existing){
        existing.role=role; existing.start=start; existing.end=end; existing.restUntil=miscSelectedRestUntil;
        existing.roles=miscSelectedRoles; existing.personIds=personIds; existing.lockedSlots=lockedSlots;
      } else {
        state.misc[currentDate].push({id:uid(),role,start,end,restUntil:miscSelectedRestUntil,roles:miscSelectedRoles,personIds,lockedSlots});
      }
    } else {
      const personIds=[...miscFreeformCheckedIds];
      const skipAutoFill = document.getElementById('mSkipAutoFill') ? document.getElementById('mSkipAutoFill').checked : false;
      const reqLicenseEls = document.querySelectorAll('.m-req-license:checked');
      const requiredLicenses = reqLicenseEls.length? [...reqLicenseEls].map(cb=>cb.value) : undefined;
      const reqMedCertEl = document.getElementById('mReqMedCert');
      const requiredMedCert = reqMedCertEl && reqMedCertEl.checked ? true : undefined;
      const reqSkillEls = document.querySelectorAll('.m-req-skill:checked');
      const requiredSkills = reqSkillEls.length? [...reqSkillEls].map(cb=>cb.value) : undefined;
      if(existing){
        existing.role=role; existing.start=start; existing.end=end; existing.restUntil=miscSelectedRestUntil;
        existing.personIds=personIds; existing.skipAutoFill=skipAutoFill; delete existing.roles;
        existing.requiredLicenses=requiredLicenses; existing.requiredMedCert=requiredMedCert; existing.requiredSkills=requiredSkills;
      } else {
        state.misc[currentDate].push({id:uid(),role,start,end,restUntil:miscSelectedRestUntil,personIds,skipAutoFill,requiredLicenses,requiredMedCert,requiredSkills});
      }
      miscFreeformCheckedIds.clear();
    }
    const wasNewEntry = !existing;
    miscSelectedRoles=null;
    miscSelectedPresetRole=null;
    miscSelectedRestUntil='';
    miscEditingId=null;
    if(wasNewEntry){
      autoAssignMiscForDate(currentDate);
    }
    const saveAsPresetCb = document.getElementById('mSaveAsPreset');
    if(saveAsPresetCb && saveAsPresetCb.checked && !state.miscPresets.some(mp=>mp.role===role)){
      state.miscPresets.push({role, times:[{start,end}], roles:miscSelectedRoles||null, standbyMode:'off',
        requiredLicenses:[], requiredMedCert:false, requiredSkills:[], chiefRequiredSkills:[],
        chiefRequiredLicenses:[], chiefRequiredMedCert:false, restUntil:miscSelectedRestUntil||'',
        sortOrder:(state.miscPresets.length?Math.max(...state.miscPresets.map(p=>p.sortOrder||0)):0)+1});
    }
    saveState(); render();
  };
  if(document.getElementById('mCancelEdit')){
    document.getElementById('mCancelEdit').onclick=()=>{
      miscEditingId=null;
      miscSelectedRoles=null;
      miscSelectedPresetRole=null;
      miscSelectedRestUntil='';
      miscFreeformCheckedIds.clear();
      render();
    };
  }
  wireMiscCardEvents();
  wireCardListDrag('miscCardsContainer', 'misc', cardDefs);
}

/* ---------------- init ---------------- */
render();
</script>
</body>
</html>
