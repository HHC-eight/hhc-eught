<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>衛哨排班</title>
<style>
:root{
  --bg:#11161c;
  --panel:#1a2029;
  --panel2:#212936;
  --line:#2c3542;
  --text:#e7ebf0;
  --dim:#8b97a6;
  --accent:#c98a3c;
  --accent2:#7d9a5f;
  --danger:#c9573c;
  --ok:#5a9a6f;
  /* 標題區固定在最上層，其他彈窗/抽屜都要往下讓出這個高度，不然會被蓋到。
     這裡只是保底估計值，實際高度由 JS 量出來後覆寫（見 syncBannerHeight），
     這樣不管標題區內容怎麼調整、換行與否、字體大小不同，都不會需要再手動
     調整這個數字。 */
  --banner-h:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",Segoe UI,sans-serif;}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom));}
h1,h2,h3{font-weight:600;margin:0 0 10px;}
h1{font-size:17px;letter-spacing:.5px;}
h2{font-size:14px;color:var(--accent);}
h3{font-size:13px;color:var(--dim);font-weight:500;}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);}
.unit-banner{position:fixed;top:0;left:0;right:0;z-index:999;display:flex;flex-direction:column;gap:4px;padding:calc(6px + env(safe-area-inset-top)) 14px 6px;background:linear-gradient(180deg,#1a2117,var(--bg));border-bottom:1px solid rgba(125,154,95,.35);box-shadow:0 2px 8px rgba(0,0,0,.3);}
.unit-banner-row1{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
.unit-banner-center{display:flex;align-items:center;justify-content:center;gap:8px;}
.unit-banner-badge{width:18px;height:18px;border-radius:50%;background:var(--accent2);color:#0d130a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.unit-banner-text{font-size:12px;letter-spacing:2.5px;color:var(--accent2);font-weight:600;}
/* 標題區改成 fixed，脫離文件流，所以幫 body 補上等高的上邊距，內容才不
   會被蓋住；抓不到確切高度時用估計值，寧可多留一點空白也不要蓋到內容 */
body{padding-top:var(--banner-h);}
.topbar-main{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;}
.container{padding:12px 12px 40px;max-width:640px;margin:0 auto;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.2);}
button.primary{box-shadow:0 1px 4px rgba(201,138,60,.35);}
select[data-assign-cat]{border-left:3px solid var(--line);}
select[data-assign-cat]:has(option[value=""]:checked){border-left:3px solid var(--accent);}
.row{display:flex;gap:8px;align-items:center;}
.row.wrap{flex-wrap:wrap;}
.grow{flex:1;min-width:0;}
label{display:block;font-size:11px;color:var(--dim);margin-bottom:3px;}
input[type=text],input[type=date],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:9px 8px;border-radius:6px;font-size:14px;font-family:inherit;
}
select{-webkit-appearance:none;appearance:none;}
input[type=checkbox]{width:22px !important;height:22px !important;min-width:22px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
button{
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  padding:9px 12px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;
}
button.primary{background:var(--accent);border-color:var(--accent);color:#1a140a;font-weight:600;}
button.ghost{background:transparent;}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent;}
button.small{padding:5px 9px;font-size:12px;}
.topbar button.small{padding:3px 6px;font-size:11px;}
.topbar select{font-size:10px;padding:3px 4px;}
.topbar h1#pageTitle{font-size:13px;}
button{transition:transform .12s ease, opacity .12s ease;}
button:active{opacity:.6;transform:scale(.94);}
button:disabled{opacity:.3;cursor:default;}
button:disabled:active{transform:none;}
@keyframes pressFlash{0%{background-color:var(--accent);color:#1a140a;}100%{background-color:inherit;color:inherit;}}
button.press-flash{animation:pressFlash .4s ease;}
button.pressed,.pill-btn.pressed{opacity:.6;transform:scale(.94);}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom);}
.tabs button{flex:1;background:transparent;border:none;border-radius:0;padding:11px 4px;font-size:12px;color:var(--dim);}
.tabs button.active{color:var(--accent);font-weight:600;}
.list-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;}
.tag.rank-軍官{color:#c9573c;border-color:#c9573c;}
.tag.rank-士官{color:#c98a3c;border-color:#c98a3c;}
.tag.rank-士兵{color:#7d9a5f;border-color:#7d9a5f;}
.muted{color:var(--dim);font-size:12px;}
.warn{color:var(--danger);font-size:12px;}
.ok{color:var(--ok);font-size:12px;}
.shift-row{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;background:var(--panel2);}
.shift-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-bottom:6px;}
.shift-head>.muted{margin-left:auto;}
.shift-time{font-size:13px;font-weight:600;}
.slot-select{margin-bottom:4px;}
.badge-issue{display:inline-block;font-size:11px;color:var(--danger);margin-top:2px;}
.section-title{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:0;min-height:22px;}
.section-title h2,.section-title h3{margin:0;flex:1 1 auto;min-width:0;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.section-title>.row,.section-title>button{flex-shrink:0;margin-left:auto;}
.hr-table{width:100%;border-collapse:collapse;font-size:11px;}
.hr-table td,.hr-table th{padding:3px 2px;text-align:center;border-bottom:1px solid var(--line);}
.hr-table th{color:var(--dim);font-weight:500;}
.bar-wrap{background:var(--panel2);border-radius:3px;overflow:hidden;height:14px;position:relative;}
.bar-fill{background:var(--accent2);height:100%;}
.pill-btn{display:inline-block;padding:4px 9px;border-radius:14px;border:1px solid var(--line);font-size:12px;margin:2px 3px 0 0;background:var(--panel2);transition:transform .12s ease, opacity .12s ease;}
.pill-btn:active{opacity:.6;transform:scale(.93);}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:20px 0;}
.divider{height:1px;background:var(--line);margin:12px 0;}
textarea{min-height:50px;resize:vertical;}
.hint{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5;}
.time-select-pair{display:inline-flex;align-items:center;gap:3px;width:100%;}
.time-select-pair select{width:auto;flex:1;min-width:0;}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;}
.drawer{position:fixed;top:var(--banner-h);left:0;bottom:0;width:min(84vw,320px);background:var(--panel);border-right:1px solid var(--line);z-index:91;overflow:auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:2px 0 12px rgba(0,0,0,.4);}
.fullscreen-modal{position:fixed;top:var(--banner-h);left:0;right:0;bottom:0;background:var(--bg);overflow:auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom));z-index:80;}
.sheet-modal{position:fixed;top:var(--banner-h);left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:80;}
.sheet-inner{background:var(--panel);width:100%;max-height:88vh;overflow:auto;border-radius:12px 12px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));}
.drawer h2{margin:0 0 10px;font-size:16px;}
.drawer-item{display:flex;align-items:center;gap:8px;width:100%;padding:10px 8px;margin-bottom:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:14px;text-align:left;cursor:pointer;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-head{text-align:center;font-size:11px;color:var(--dim);padding:2px 0;}
.cal-cell{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2px;cursor:pointer;overflow:hidden;}
.cal-cell.empty{border:none;background:transparent;cursor:default;}
.cal-cell.has{border-color:var(--accent);}
.cal-cell.standby-marked{border-color:var(--ok);}
.cal-cell.leave-marked{border-color:var(--danger);}
.cal-cell.leave-marked .cal-mark{color:var(--danger);}
.cal-cell.leave-partial-marked{border-color:var(--warn,#d9a441);border-style:dashed;}
.cal-cell.leave-partial-marked .cal-mark{color:var(--warn,#d9a441);font-style:italic;}
.cal-cell.incident-marked{border-color:var(--warn,#d9a441);}
.cal-cell.standby-marked .cal-mark{color:var(--ok);}
.cal-cell.holiday .cal-day{color:var(--danger);}
.cal-day{font-size:11px;color:var(--dim);line-height:1.2;}
.cal-mark{font-size:10px;color:var(--accent);line-height:1.15;text-align:center;word-break:break-all;}
.cal-mark-outside{color:var(--warn,#d9a441);font-style:italic;}
.time-select-colon{color:var(--dim);}
</style>
</head>
<body>

<div class="unit-banner">
  <div class="unit-banner-row1">
    <span class="row" style="gap:4px;justify-self:start">
      <button class="ghost small" id="undoBtn" title="復原上一步" disabled>↩️</button>
      <button class="ghost small" id="redoBtn" title="取消復原（重做）" disabled>↪️</button>
    </span>
    <span class="unit-banner-center"><span class="unit-banner-badge">★</span><span class="unit-banner-text">陸軍第八軍團 本部連</span></span>
    <button class="ghost" id="unitRulesBtn" title="我們的規則" style="justify-self:end;padding:2px 6px;font-size:11px">⚙️</button>
  </div>
</div>
<div class="topbar">
  <div class="topbar-main" style="flex-direction:column;align-items:stretch;gap:6px">
    <div class="row" style="gap:4px;align-items:center">
      <button class="ghost small" id="preplanDrawerBtn" title="預排">☰</button>
      <h1 id="pageTitle" class="grow" style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🌟 衛哨排班系統 <span class="muted" style="font-size:10px;font-weight:400">v148</span></h1>
      <button class="ghost small" id="adhocQueryTopBtn" title="臨時任務查詢">🚨</button>
      <button class="ghost small" id="clearRangeBtn" title="清除一段時間">🧹</button>
      <button class="ghost small" id="exportBtn" title="匯出">📤</button>
    </div>
    <div class="row wrap" style="gap:4px;align-items:center">
      <button class="ghost small" id="globalDatePrev">◀</button>
      <button class="ghost small" id="globalDateLabel"></button>
      <button class="ghost small" id="globalDateNext">▶</button>
      <button class="ghost small" id="globalDateToday">今天</button>
    </div>
  </div>
</div>

<div class="container" id="app"></div>

<div class="tabs">
  <button data-tab="schedule">📋 排班</button>
  <button data-tab="stats">📊 統計</button>
</div>

<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
/* ---------------- storage ---------------- */
const LS_KEY='drs_data_v1';
/* independent save-checkpoints — separate from the 50-step in-memory undo
   stack, which is lost on reload and only goes back so far. Each of the 9
   預排 types and the personnel roster gets its own checkpoint list (scope
   string), stored under its own localStorage key so restoring one never
   touches another. Capped at 20 per scope, oldest dropped first. */
function checkpointKey(scope){ return 'drs_checkpoint_'+scope; }
function listCheckpoints(scope){
  try{ return JSON.parse(localStorage.getItem(checkpointKey(scope))||'[]'); }
  catch(e){ return []; }
}
function saveCheckpoint(scope, data, label){
  const list = listCheckpoints(scope);
  list.unshift({ts:Date.now(), label:label||'', data:JSON.stringify(data)});
  if(list.length>20) list.length=20;
  localStorage.setItem(checkpointKey(scope), JSON.stringify(list));
}
function deleteCheckpoint(scope, idx){
  const list = listCheckpoints(scope);
  list.splice(idx,1);
  localStorage.setItem(checkpointKey(scope), JSON.stringify(list));
}
function checkpointTimeLabel(ts){
  const d=new Date(ts);
  return `${d.getFullYear()-1911}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
/* generic modal reused by every scope — currentDataFn returns what to save,
   applyDataFn receives a restored snapshot and writes it back into state */
function openCheckpointModal(scope, title, currentDataFn, applyDataFn){
  const modal=document.createElement('div');
  modal.className='sheet-modal'; modal.style.zIndex='97';
  const draw=()=>{
    const list = listCheckpoints(scope);
    modal.innerHTML=`
      <div class="sheet-inner">
        <div class="section-title"><h2 style="margin:0">存檔點：${esc(title)}</h2><button class="ghost small" id="cpClose">關閉</button></div>
        <div class="hint" style="margin-bottom:8px">跟復原/重做不同，存檔點是手動建立、永久保存（最多留20個，滿了會自動丟掉最舊的），關閉分頁或重新整理也不會消失，適合在做大幅調整前先存一份。</div>
        <div class="row wrap" style="margin-bottom:8px">
          <div class="grow"><label>備註（選填）</label><input type="text" id="cpLabel" placeholder="例：9月整月排定"></div>
        </div>
        <button class="primary" id="cpSave" style="width:100%;margin-bottom:8px">📌 建立存檔點</button>
        <div class="divider"></div>
        <h3>已存的存檔點（${list.length}）</h3>
        ${list.length? list.map((c,i)=>`
          <div class="list-item">
            <span class="grow">${checkpointTimeLabel(c.ts)}${c.label? `　${esc(c.label)}`:''}</span>
            <button class="ghost small" data-cp-restore="${i}">回復</button>
            <button class="ghost small danger" data-cp-del="${i}">刪除</button>
          </div>`).join('') : `<div class="empty">還沒有存檔點</div>`}
      </div>`;
    document.getElementById('cpClose').onclick=()=>modal.remove();
    document.getElementById('cpSave').onclick=()=>{
      const label=document.getElementById('cpLabel').value.trim();
      saveCheckpoint(scope, currentDataFn(), label);
      showAlert('已建立存檔點。');
      draw();
    };
    modal.querySelectorAll('[data-cp-restore]').forEach(b=>{
      b.onclick=()=>{
        const idx=Number(b.dataset.cpRestore);
        const c=list[idx];
        showConfirm(`確定要回復到「${checkpointTimeLabel(c.ts)}${c.label?'　'+c.label:''}」嗎？現在的內容會被取代（可以用左上角復原按鈕撤銷這次回復）。`, ()=>{
          applyDataFn(JSON.parse(c.data));
          saveState();
          showAlert('已回復。');
          modal.remove();
          render();
        });
      };
    });
    modal.querySelectorAll('[data-cp-del]').forEach(b=>{
      b.onclick=()=>{
        deleteCheckpoint(scope, Number(b.dataset.cpDel));
        draw();
      };
    });
  };
  document.body.appendChild(modal);
  draw();
}
function loadState(){
  const raw=localStorage.getItem(LS_KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return {
    personnel: [],
    categories: defaultCategories(),
    unavail: {},      // date -> [{id,personId,allDay,start,end}]
    assign: {},       // date -> categoryId -> shiftId -> [personId,...]
    misc: {},         // date -> [{id,role,text}]
    miscCustomPresets: [] // [{role,start,end}] user-added quick-add presets for 其他勤務
  };
}
function saveState(){
  // stash the state as it was BEFORE this change onto the undo stack, so
  // repeated undo presses can keep walking back through history — capped
  // to avoid unbounded memory/localStorage growth over a long session
  if(typeof lastSavedSnapshot!=='undefined'){
    undoStack.push(lastSavedSnapshot);
    if(undoStack.length>UNDO_LIMIT) undoStack.shift();
  }
  redoStack=[]; // a fresh change invalidates whatever "future" redo had
  lastSavedSnapshot = JSON.stringify(state);
  localStorage.setItem(LS_KEY, lastSavedSnapshot);
  if(typeof refreshUndoButton==='function') refreshUndoButton();
}
const UNDO_LIMIT=50;
let undoStack=[];
let redoStack=[];
let lastSavedSnapshot; // set on first load, see below
function undoLastAction(){
  if(!undoStack.length) return;
  const prevSnapshot = undoStack.pop();
  redoStack.push(lastSavedSnapshot);
  state = JSON.parse(prevSnapshot);
  lastSavedSnapshot = prevSnapshot;
  localStorage.setItem(LS_KEY, prevSnapshot);
  if(typeof refreshUndoButton==='function') refreshUndoButton();
  render();
}
function redoLastAction(){
  if(!redoStack.length) return;
  const nextSnapshot = redoStack.pop();
  undoStack.push(lastSavedSnapshot);
  state = JSON.parse(nextSnapshot);
  lastSavedSnapshot = nextSnapshot;
  localStorage.setItem(LS_KEY, nextSnapshot);
  if(typeof refreshUndoButton==='function') refreshUndoButton();
  render();
}

function uid(){ return Math.random().toString(36).slice(2,9); }

/* explicit press feedback for every button/pill, via one delegated listener
   on document (so it keeps working through re-renders without re-wiring) —
   iOS Safari's :active pseudo-class doesn't reliably fire on tap by itself,
   so we toggle a class directly on touch/mouse down and up instead. */
(function(){
  function pressOn(ev){
    const el = ev.target.closest('button, .pill-btn');
    if(el){
      el.classList.add('pressed');
      if(navigator.vibrate){ try{ navigator.vibrate(10); }catch(e){} }
    }
  }
  function pressOff(){
    document.querySelectorAll('.pressed').forEach(el=>el.classList.remove('pressed'));
  }
  document.addEventListener('touchstart', pressOn, {passive:true});
  document.addEventListener('touchend', pressOff, {passive:true});
  document.addEventListener('touchcancel', pressOff, {passive:true});
  document.addEventListener('mousedown', pressOn);
  document.addEventListener('mouseup', pressOff);
  document.addEventListener('mouseleave', pressOff);
})();

/* ---------------- rank system ---------------- */
const RANK_DEFS=[
  {rank:'少校',cat:'軍官'},{rank:'上尉',cat:'軍官'},{rank:'中尉',cat:'軍官'},{rank:'少尉',cat:'軍官'},
  {rank:'士官長',cat:'士官'},{rank:'上士',cat:'士官'},{rank:'中士',cat:'士官'},{rank:'下士',cat:'士官'},
  {rank:'上兵',cat:'士兵'},{rank:'一兵',cat:'士兵'},{rank:'二兵',cat:'士兵'},{rank:'訓練役',cat:'士兵'}
];
function rankIndex(rank){ const i=RANK_DEFS.findIndex(r=>r.rank===rank); return i<0?RANK_DEFS.length:i; }
function rankCategory(rank){ const r=RANK_DEFS.find(r=>r.rank===rank); return r?r.cat:''; }
/* 官/士/兵人數統計的共用計算方式——這個系統裡有很多地方（休假分組、不在
   營、在勤、事故分類、排組統計表…）都要顯示這種「幾官幾士幾兵」的小計，
   以前每個地方各自寫一次迴圈，容易漏改（例如這次要加女生數就要找11個地
   方）。統一用這兩個函式：rankGenderBreakdown 算出計數，
   fmtRankBreakdown 轉成顯示文字，之後這類統計的顯示格式要調整，只要改
   這裡，全部用到的地方會一起生效。 */
function rankGenderBreakdown(people){
  const bd={軍官:0,士官:0,士兵:0,軍官女:0,士官女:0,士兵女:0};
  people.forEach(p=>{
    const k=rankCategory(p.rank);
    if(!k) return;
    bd[k]++;
    if(p.gender==='女') bd[k+'女']++;
  });
  return bd;
}
function fmtRankBreakdown(bd){
  const f=(cat)=> `${bd[cat]}(${bd[cat+'女']})`;
  return `${f('軍官')}官${f('士官')}士${f('士兵')}兵`;
}
function rankOptionsHTML(selected){
  const groups=['軍官','士官','士兵'];
  return groups.map(g=>`<optgroup label="${g}">${RANK_DEFS.filter(r=>r.cat===g).map(r=>`<option value="${r.rank}" ${r.rank===selected?'selected':''}>${r.rank}</option>`).join('')}</optgroup>`).join('');
}
/* duty-assignment priority (distinct from roster display order in RANK_DEFS):
   for 低階優先 categories (橋哨/指管) 下士 is the top preferred rank;
   for 需士官帶隊 categories (打飯班) the lead preference order is 下士 → 中士 → 上士 → 士官長 */
const LOW_RANK_PRIORITY=['下士','二兵','一兵','上兵','中士','上士','士官長','少尉','中尉','上尉','少校'];

function presetTimes(preset){
  if(preset.times && preset.times.length) return preset.times;

/* find the preset a misc entry was created from, by role name — used to
   read its configured requirements (license/cert/skill). Returns null for
   entries whose preset was since deleted/renamed (no requirements applied). */
function presetForEntry(entry){
  const preset = state.miscPresets.find(p=>p.role===entry.role);
  if(preset) return preset;
  // ad-hoc entries created via 新增項目 without a matching 常用項目 can still
  // carry their own one-off requirement fields (set in that form's

/* two presets "compete for the same qualification" if they share a

   driver from also being double-booked into another duty that needs that
   same rare qualification, even outside their narrow scheduled window */
function requirementOverlap(presetA, presetB){
  if(!presetA || !presetB) return false;
  if((presetA.requiredLicenses||[]).some(l=>(presetB.requiredLicenses||[]).includes(l))) return true;
  if(presetA.requiredMedCert && presetB.requiredMedCert) return true;
  if((presetA.requiredSkills||[]).some(s=>(presetB.requiredSkills||[]).includes(s))) return true;
  return false;

  if(!targetPreset) return false;

    if(m.id===excludeMiscId) return false;
    if(!(m.personIds||[]).includes(personId)) return false;
    const preset = presetForEntry(m);

function chiefEligible(person, preset, driver){

  if(preset && (preset.chiefRequiredSkills||[]).some(sk=>!(person.skills||[]).includes(sk))) return false;

/* 「掛名」跟「暫停這次的衝突」是兩種不同語意的例外標記，都是綁在這一筆

  const out=[];

    if((entry.nominalIds||[]).includes(pid)) return;

    if(!p) return;

    if(hard.length) out.push({pid, message:`${p.name}：${hard.join('・')}`, isHardBlock: true});
    (state.misc[date]||[]).forEach(other=>{
      if(other.id===entry.id || !other.start || !other.end) return;
      if(!(other.personIds||[]).includes(pid)) return;
      if((other.nominalIds||[]).includes(pid)) return;
      const os=toMin(other.start), oe=wrapEndMin(os, toMin(other.end));
      if(windowsOverlapOnce(s,e,os,oe)){
        out.push({pid, message:`${p.name}：同時段還被排在「${other.role} (${other.start}-${other.end})」`});
      }
    });
  });

function validateMiscEntry(entry){
  if(!entry.roles){
    if(!(entry.personIds&&entry.personIds.length) && !entry.skipAutoFill){
      const preset = presetForEntry(entry);
      const sMin = entry.start? toMin(entry.start) : null;
      const eMinRaw = entry.end? toMin(entry.end) : null;
      const hasTime = sMin!==null && eMinRaw!==null;
      const availableCandidates = state.personnel.filter(p=>
        !(hasTime && isPersonUnavailable(p.id, currentDate, sMin, wrapEndMin(sMin, eMinRaw)))
      );
      const qualifiedCandidates = preset? availableCandidates.filter(p=>driverQualificationIssues(p, preset).length===0) : availableCandidates;
      if(availableCandidates.length && preset && !qualifiedCandidates.length){
        const reqParts=[];
        if((preset.requiredLicenses||[]).length) reqParts.push('駕照：'+preset.requiredLicenses.join('或'));
        if(preset.requiredMedCert) reqParts.push('救護證照(EMT或醫生證書)');
        if((preset.requiredSkills||[]).length) reqParts.push('專長：'+preset.requiredSkills.join('、'));
        if((preset.requiredRanks||[]).length) reqParts.push('階級：'+preset.requiredRanks.join('或'));
        return [`沒有符合需求（${reqParts.join('；')}）的人員可派，可手動指定或到「常用項目」調整資格要求`];
      }
      return [`目前未指派（自動排班找不到符合資格且有空的人，可能都在忙其他勤務或休假，可手動指定或稍後再試）`];
    }
    return [];
  }
  const issues=[];
  const preset=presetForEntry(entry);
  const chiefIdx=entry.roles.indexOf('車長');
  const driverIdx=entry.roles.indexOf('駕駛');
  if(chiefIdx>-1 && driverIdx>-1){
    const chief=state.personnel.find(p=>p.id===entry.personIds[chiefIdx]);
    const driver=state.personnel.find(p=>p.id===entry.personIds[driverIdx]);
    if(driver){
      driverQualificationIssues(driver, preset).forEach(msg=>issues.push(`駕駛 ${driver.name}：${msg}`));
    }
    if(chief && !['士官','軍官'].includes(rankCategory(chief.rank))) issues.push(`車長 ${chief.name}：需為士官以上`);
    if(chief && driver && rankIndex(chief.rank)>rankIndex(driver.rank)) issues.push(`車長 ${chief.name} 階級不可低於駕駛 ${driver.name}`);
    if(chief && preset && preset.requiredMedCert && !chief.medCert) issues.push(`車長 ${chief.name}：需具備EMT或醫生證書`);
    if(chief && preset && preset.chiefRequiredMedCert && !chief.medCert) issues.push(`車長 ${chief.name}：需具備EMT或醫生證書`);
    if(chief && preset && (preset.chiefRequiredLicenses||[]).length && !preset.chiefRequiredLicenses.some(l=>licenseCovers(chief.license, l))){
      issues.push(`車長 ${chief.name}：需持有${preset.chiefRequiredLicenses.join('或')}駕照`);
    }
    if(chief && preset) (preset.chiefRequiredSkills||[]).forEach(sk=>{
      if(!(chief.skills||[]).includes(sk)) issues.push(`車長 ${chief.name}：需具備${sk}專長`);
    });
    if(chief && driver && chief.id===driver.id) issues.push(`車長跟駕駛不能是同一人（${chief.name}）`);
  }
  entry.roles.forEach((r,i)=>{
    if(r.startsWith('話務')){
      const p=state.personnel.find(pp=>pp.id===entry.personIds[i]);
      if(p && !p.license) issues.push(`${p.name}：話務需至少小型車駕照`);
    }
    if(!entry.personIds[i] && !(entry.lockedSlots && entry.lockedSlots[i])){
      issues.push(`${r}：目前未指派（自動排班找不到符合資格且有空的人，可能都在忙其他勤務或休假，可手動指定或稍後再試）`);
    }
  });
  return issues;
}
/* if the chief ends up junior to the driver (violates "車長不可低階於駕駛"),
   swap them instead of just flagging it — but only when the swap actually
   works: the newly-promoted driver (the old chief) still needs to meet the
   driver's own requirements, most importantly a valid license, since a
   swap that fixes rank order by breaking the license rule isn't a fix at
   all. If the swap wouldn't be clean, nothing changes and the existing
   warning in validateMiscEntry still applies. */
function autoSwapDriverChief(entry, presetOverride){
  if(!entry.roles) return false;
  const chiefIdx=entry.roles.indexOf('車長');
  const driverIdx=entry.roles.indexOf('駕駛');
  if(chiefIdx===-1 || driverIdx===-1) return false;
  const chiefId=entry.personIds[chiefIdx], driverId=entry.personIds[driverIdx];
  if(!chiefId || !driverId || chiefId===driverId) return false;
  const chief=state.personnel.find(p=>p.id===chiefId);
  const driver=state.personnel.find(p=>p.id===driverId);
  if(!chief || !driver) return false;
  if(rankIndex(chief.rank)<=rankIndex(driver.rank)) return false; // already fine, no swap needed
  const preset = presetOverride || presetForEntry(entry);
  // the old chief would become the new driver — needs the driver's license
  if(preset && driverQualificationIssues(chief, preset).length) return false;
  // the old driver would become the new chief — needs to meet chief requirements
  if(!['士官','軍官'].includes(rankCategory(driver.rank))) return false;
  if(preset && preset.chiefRequiredMedCert && !driver.medCert) return false;
  if(preset && (preset.chiefRequiredLicenses||[]).length && !preset.chiefRequiredLicenses.some(l=>licenseCovers(driver.license,l))) return false;
  entry.personIds[chiefIdx]=driverId;
  entry.personIds[driverIdx]=chiefId;
  return true;

   陣列(空陣列＝不限)。不符資格的人還是選得到，只是會排到清單最下面、
   旁邊加警告文字提醒——不是強制擋掉，畢竟人力有限時可能還是得排。跟現
   有的其他勤務常用項目資格(駕照/EMT/專長)共用同一套檢查邏輯
   (driverQualificationIssues)，這裡設定的專長要求會跟該類型對應的常用
   項目(如果有的話)的專長要求合併一起檢查。 */
if(!state.unitRules.preplanSkillReqs) state.unitRules.preplanSkillReqs = {};

/* ---------------- 崗位定義（統一的職務/崗位規則） ----------------
   把原本分散三個地方的同一件事——miscPresets 的駕照/專長/人數/時段、
   unitRules.preplanSkillReqs 額外疊加的專長、還有寫死在 BUILTIN_PREPLAN_
   TYPES 裡的名稱/圖示/說明——收成一份使用者能隨時編輯的清單。不是整個
   砍掉重練：舊資料結構(miscPresets/preplanSkillReqs/BUILTIN_PREPLAN_TYPES
   的顯示欄位)還在，且仍是排班驗證、自動排班等十幾處程式碼實際讀取的地
   方；這裡新增的是「編輯的入口只剩一個」——改崗位定義，會同步寫回那些
   舊欄位，讀取端完全不用動，也不會有兩邊各自為政、對不起來的問題。
   留守、休假暨事故大表兩種不是「崗位」（沒有駕照/專長/人數這種資源需
   求，是整段時間的名單/行事曆性質），不收進這份清單。 */
if(!state.dutyDefinitions){
  state.dutyDefinitions = [];
  const linkedRoles = new Set();
  BUILTIN_PREPLAN_TYPES.filter(t=>t.mode!=='standby' && t.mode!=='leaveTable').forEach(t=>{
    const preset = t.presetRole ? state.miscPresets.find(p=>p.role===t.presetRole) : null;
    const extraSkills = (state.unitRules.preplanSkillReqs && state.unitRules.preplanSkillReqs[t.key]) || [];
    if(t.presetRole) linkedRoles.add(t.presetRole);
    state.dutyDefinitions.push({
      key:t.key, name:t.name, icon:t.icon, mode:t.mode, hint:t.hint||'',
      isVehicle: t.mode==='roles',
      requiredLicenses: preset?[...(preset.requiredLicenses||[])]:[],
      requiredMedCert: preset?!!preset.requiredMedCert:false,
      requiredSkills: [...new Set([...(preset?preset.requiredSkills||[]:[]), ...extraSkills])],
      requiredRanks: preset?[...(preset.requiredRanks||[])]:[],
      chiefRequiredLicenses: preset?[...(preset.chiefRequiredLicenses||[])]:[],
      chiefRequiredMedCert: preset?!!preset.chiefRequiredMedCert:false,
      chiefRequiredSkills: preset?[...(preset.chiefRequiredSkills||[])]:[],
      chiefRequiredRanks: preset?[...(preset.chiefRequiredRanks||[])]:[],
      requiredCount: preset&&preset.requiredCount!==undefined?preset.requiredCount:null,
      restUntil: preset?preset.restUntil||'':'',
      times: preset?preset.times.map(x=>({...x})):[],
      sortOrder: preset&&preset.sortOrder!==undefined?preset.sortOrder:500,
      excludeFromExport: preset?!!preset.excludeFromExport:false,
      isSentry: preset?!!preset.isSentry:false,
      isAllDayAway: preset?!!preset.isAllDayAway:false,
      standbyMode: preset?preset.standbyMode||'off':'off',
      presetRole: t.presetRole||null, builtin:true, deletable:false, linkedPreplan:true,
    });
  });
  state.customPreplanTypes.forEach(c=>{
    linkedRoles.add(c.name);
    state.dutyDefinitions.push({
      key:c.key, name:c.name, icon:c.icon||'📋', mode:'people', hint:c.hint||'（自訂項目）',
      isVehicle:false, requiredLicenses:[], requiredMedCert:false,
      requiredSkills:[...((state.unitRules.preplanSkillReqs&&state.unitRules.preplanSkillReqs[c.key])||[])],
      requiredRanks:[],
      chiefRequiredLicenses:[], chiefRequiredMedCert:false, chiefRequiredSkills:[], chiefRequiredRanks:[],
      requiredCount:null, restUntil:'', times:[], sortOrder:900,
      excludeFromExport:false, isSentry:false, isAllDayAway:false, standbyMode:'off',
      presetRole:c.name, builtin:false, deletable:true, linkedPreplan:true,
    });
  });
  // 駕駛/車長雙角色是唯一算「出車任務」的roles樣式——有些常用項目的roles
  // 只是拿來放一句自訂的單一角色說明文字（例如話務用roles存「話務(需小型
  // 車以上駕照)」這個顯示用標籤，不是真的要分駕駛/車長兩個人），這種不
  // 該被當成出車任務、也不該被存回去時覆蓋掉，所以額外保留原始roles。
  const isDriverChief = arr => Array.isArray(arr) && arr.length===2 && arr[0]==='駕駛' && arr[1]==='車長';
  state.miscPresets.forEach(p=>{
    if(linkedRoles.has(p.role)) return;
    state.dutyDefinitions.push({
      key:'misc_'+p.role, name:p.role, icon:'📋', mode: p.roles?'roles':'people', hint:'',
      isVehicle: isDriverChief(p.roles),
      customRoles: (p.roles && !isDriverChief(p.roles))? [...p.roles] : null,
      requiredLicenses:[...(p.requiredLicenses||[])], requiredMedCert:!!p.requiredMedCert,
      requiredSkills:[...(p.requiredSkills||[])], requiredRanks:[...(p.requiredRanks||[])],
      chiefRequiredLicenses:[...(p.chiefRequiredLicenses||[])], chiefRequiredMedCert:!!p.chiefRequiredMedCert,
      chiefRequiredSkills:[...(p.chiefRequiredSkills||[])], chiefRequiredRanks:[...(p.chiefRequiredRanks||[])],
      requiredCount: p.requiredCount!==undefined?p.requiredCount:null,
      restUntil:p.restUntil||'', times:p.times.map(x=>({...x})),
      sortOrder:p.sortOrder!==undefined?p.sortOrder:999,
      excludeFromExport:!!p.excludeFromExport, isSentry:!!p.isSentry, isAllDayAway:!!p.isAllDayAway,
      standbyMode:p.standbyMode||'off', presetRole:p.role, builtin:true, deletable:false, linkedPreplan:false,
    });
  });
}
// 需求階級是後來加的欄位——不管dutyDefinitions是剛剛才第一次建立、還是
// 舊資料已經存在很久，都統一補上空陣列(不限)，避免舊資料裡沒有這個欄位
// 導致UI的checkbox畫不出勾選狀態、或driverQualificationIssues/chiefEligible
// 讀到undefined.includes()而出錯。
state.dutyDefinitions.forEach(d=>{
  if(d.requiredRanks===undefined) d.requiredRanks=[];
  if(d.chiefRequiredRanks===undefined) d.chiefRequiredRanks=[];
});
/* 其他勤務項目(沒有連結預排類型的崗位)分成「平日」「假日」兩份完全獨立
   的清單(dayType欄位)，各自能設定不同時段/人數/需求，匯入預設只會匯入
   跟今天日期類型相符的那一份(見importDefaultMiscDuties)。舊資料裡的項
   目還沒有dayType——一律先當「平日」保留原本的key/名稱，同時複製一份
   「假日」版本(換一把新key，名稱加註「（假日）」避免撞名，其餘設定原封
   不動)，讓升級後平日假日都能繼續匯入到，維持升級前「每天都會匯入」的
   行為；之後使用者可以自己去調整或刪除不需要的那一份。已連結預排類型
   的崗位不分平日/假日，不受影響。這裡直接呼叫syncDutyDefinitionToLegacy
   (下面才定義，但function宣告會整個檔案hoist，這裡呼叫沒問題)幫新複製
   的假日版本也建立好對應的legacy miscPresets項目。 */
(function migrateDutyDefDayType(){
  const needsMigration = state.dutyDefinitions.filter(d=>!d.linkedPreplan && !d.dayType);
  if(!needsMigration.length) return;
  needsMigration.forEach(d=>{
    d.dayType='weekday';
    const holidayName = d.name+'（假日）';
    const holidayDef = {
      key:'misc_'+uid(), name:holidayName, icon:d.icon, mode:d.mode, hint:d.hint,
      isVehicle:d.isVehicle, customRoles: d.customRoles? [...d.customRoles] : d.customRoles,
      requiredLicenses:[...d.requiredLicenses], requiredMedCert:d.requiredMedCert, requiredSkills:[...d.requiredSkills],
      requiredRanks:[...(d.requiredRanks||[])],
      chiefRequiredLicenses:[...d.chiefRequiredLicenses], chiefRequiredMedCert:d.chiefRequiredMedCert, chiefRequiredSkills:[...d.chiefRequiredSkills],
      chiefRequiredRanks:[...(d.chiefRequiredRanks||[])],
      requiredCount:d.requiredCount, restUntil:d.restUntil, times: d.times.map(t=>({...t})),
      sortOrder:d.sortOrder, excludeFromExport:d.excludeFromExport, isSentry:d.isSentry, isAllDayAway:d.isAllDayAway,
      standbyMode:d.standbyMode, presetRole:holidayName, builtin:d.builtin, deletable:d.deletable, linkedPreplan:false,
      dayType:'holiday',
    };
    state.dutyDefinitions.push(holidayDef);
    syncDutyDefinitionToLegacy(holidayDef);
  });
  saveState();
})();
/* 存一筆崗位定義的變更後呼叫——寫回 miscPresets（讀取端唯一在乎的地
   方）、如果有連到預排類型就順便更新 BUILTIN_PREPLAN_TYPES/自訂類型的
   名稱圖示說明並 rebuildPreplanTypes()，專長要求同時寫進 preplanSkillReqs
   （疊加式的那個舊機制），這樣不管哪段舊程式碼查哪一份，看到的都是同一
   個、剛剛存的值，不會有兩邊對不起來的情況。 */
function syncDutyDefinitionToLegacy(def){
  const fields = {
    role:def.presetRole,
    roles: def.isVehicle?['駕駛','車長']:(def.customRoles||null),
    times: def.times.map(x=>({...x})),
    restUntil: def.restUntil||'',
    requiredLicenses:[...def.requiredLicenses], requiredMedCert:!!def.requiredMedCert, requiredSkills:[...def.requiredSkills],
    requiredRanks:[...(def.requiredRanks||[])],
    chiefRequiredLicenses:[...def.chiefRequiredLicenses], chiefRequiredMedCert:!!def.chiefRequiredMedCert, chiefRequiredSkills:[...def.chiefRequiredSkills],
    chiefRequiredRanks:[...(def.chiefRequiredRanks||[])],
    requiredCount: def.requiredCount, rankPriority: null,
    sortOrder: def.sortOrder, excludeFromExport: def.excludeFromExport,
    isSentry: def.isSentry, isAllDayAway: def.isAllDayAway, standbyMode: def.standbyMode,
  };
  let preset = state.miscPresets.find(p=>p.role===def.presetRole);
  if(preset){ Object.assign(preset, fields); }
  else state.miscPresets.push({...fields, fixed: def.mode==='roles'});
  if(def.linkedPreplan){
    const bi = BUILTIN_PREPLAN_TYPES.findIndex(t=>t.key===def.key);
    if(bi>=0){ BUILTIN_PREPLAN_TYPES[bi].name=def.name; BUILTIN_PREPLAN_TYPES[bi].icon=def.icon; BUILTIN_PREPLAN_TYPES[bi].hint=def.hint; }
    else{ const c=state.customPreplanTypes.find(c=>c.key===def.key); if(c){ c.name=def.name; c.icon=def.icon; c.hint=def.hint; } }
    rebuildPreplanTypes();
    state.unitRules.preplanSkillReqs[def.key] = [...def.requiredSkills];
  }
}

if(!state.preplanOrder) state.preplanOrder = PREPLAN_TYPES.map(t=>t.key);
/* last-used times / rest-until values per preplan type, so recurring duties
   don't have to be re-typed every single day — the editor opens pre-filled
   with whatever was entered last time for that duty */
if(!state.preplanDefaults) state.preplanDefaults = {};
function preplanDefault(key, field, fallback){
  const d = state.preplanDefaults[key];
  return (d && d[field]!==undefined && d[field]!=='') ? d[field] : fallback;
}
function rememberPreplanDefaults(key, fields){
  if(!state.preplanDefaults[key]) state.preplanDefaults[key]={};
  Object.entries(fields).forEach(([k,v])=>{ if(v!==undefined && v!=='') state.preplanDefaults[key][k]=v; });
}
function orderedPreplanTypes(){
  const order = state.preplanOrder||[];
  const known = PREPLAN_TYPES.filter(t=>order.includes(t.key)).sort((a,b)=>order.indexOf(a.key)-order.indexOf(b.key));
  const rest = PREPLAN_TYPES.filter(t=>!order.includes(t.key));
  return [...known, ...rest];
}
function preplanFor(key, date){
  return ((state.preplan[key]||{})[date]) || null;
}
function setPreplan(key, date, value){
  if(!state.preplan[key]) state.preplan[key]={};
  if(value===null){
    delete state.preplan[key][date];
    // a deleted 留守 block leaves its sub-duty 其他勤務 entries stranded
    // with nothing to re-import and clear them — since they're tagged with
    // which block wrote them, they can be cleaned up right here instead of
    // waiting for a whole-month reimport that won't happen for a block that
    // no longer exists
    if(key==='standby'){
      Object.keys(state.misc).forEach(d=>{
        state.misc[d] = state.misc[d].filter(m=>m.standbyAnchor!==date);
      });
    }
  }
  else state.preplan[key][date]=value;
}
// now that every migration/backfill above has run, this is the true
// "fully-formed" initial state — snapshot it as the undo baseline so
// undoing all the way back never lands on a state missing required fields
lastSavedSnapshot = JSON.stringify(state);
/* 事故/請假 (uses a preset reason list or a custom typed one) */
/* 衛哨 (安全士官/橋哨/指管) rule: the same person should not stand the same
   time-slot two days running — check whether they held this exact shift
   (same category + same shift) on the immediately preceding calendar date. */
function assignedSameShiftYesterday(personId, date, catId, shiftId){
  const prev=prevDateStr(date);
  const arr=((state.assign[prev]||{})[catId]||{})[shiftId] || [];
  return arr.includes(personId);
}

/* ---------------- time utils ---------------- */
function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
/* an end time that's not later than the start time means the duty wraps past
   midnight into the next day (e.g. 07:00→07:00 is a full 24h shift) — used
   everywhere an availability check needs the "real" end minute, not the
   raw clock time. Only special-casing literal 00:00 (as some older code did)
   misses every other wrap case, like 07:00→07:00 or 06:30→06:30. */
function wrapEndMin(startMin, endMin){
  return endMin<=startMin ? endMin+1440 : endMin;
}
/* rank sort index that respects a preset's custom priority order (if set),
   falling back to the normal rank hierarchy otherwise */
function rankPriorityIndex(rank, preset){
  const order = preset && preset.rankPriority;
  if(!order) return rankIndex(rank);
  const i = order.indexOf(rank);
  return i<0? order.length : i;
}
function fmtMin(m){ m=((m%1440)+1440)%1440; const h=Math.floor(m/60), mm=m%60; return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
function shiftDuration(s){ let a=toMin(s.start), b=toMin(s.end); if(b<=a) b+=1440; return b-a; }
function timeOptionsFine(step){
  let opts=[]; for(let m=0;m<=1440;m+=step){ let h=Math.floor(m/60), mm=m%60; opts.push(String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')); }
  return opts;
}
/* time-select granularity is a global, adjustable setting (default 10 min) —
   every time picker in the app goes through this so changing it applies
   everywhere at once */
function timeOptions(){
  return timeOptionsFine(state.timeStepMinutes||10);
}
/* every time picker in the app is a pair of small 時/分 selects instead of
   one long combined dropdown (which at a 5-10 min step ran to 150-300
   options and took forever to scroll) — these three helpers are the only
   place that builds/reads/writes that pair, so every call site converts
   the same way: render with timeSelectHTML(id, value), read back with
   getTimeSelectValue(id), and programmatically update with
   setTimeSelectValue(id, value). id is a plain string for a fixed-id field;
   for a per-row field in a repeated list, pass a string that embeds the
   row index (e.g. `se-start-3`) so each row's pair has unique ids. */
function timeSelectHTML(id, value, opts){
  opts = opts||{};
  const hasVal = !!value;
  const [h,m] = hasVal? value.split(':') : ['',''];
  const step = state.timeStepMinutes||10;
  const hourOpts = Array.from({length:25},(_,i)=>String(i).padStart(2,'0')); // 00-24 (24 supports "24:00" end markers)
  const minOpts = []; for(let mm=0; mm<60; mm+=step) minOpts.push(String(mm).padStart(2,'0'));
  if(hasVal && !minOpts.includes(m)) minOpts.push(m); // keep a saved value visible even if it doesn't align to the current step
  minOpts.sort((a,b)=>Number(a)-Number(b));
  const emptyOpt = opts.allowEmpty? `<option value="">--</option>` : '';
  return `<span class="time-select-pair" data-time-id="${esc(id)}">
    <select id="${esc(id)}__h" class="time-select-h">${emptyOpt}${hourOpts.map(hh=>`<option value="${hh}" ${hh===h?'selected':''}>${hh}</option>`).join('')}</select>
    <span class="time-select-colon">:</span>
    <select id="${esc(id)}__m" class="time-select-m">${emptyOpt}${minOpts.map(mm=>`<option value="${mm}" ${mm===m?'selected':''}>${mm}</option>`).join('')}</select>
  </span>`;
}
function getTimeSelectValue(id){
  const hEl=document.getElementById(id+'__h'), mEl=document.getElementById(id+'__m');
  if(!hEl||!mEl) return '';
  if(!hEl.value || !mEl.value) return '';
  return `${hEl.value}:${mEl.value}`;
}
function setTimeSelectValue(id, value){
  const hEl=document.getElementById(id+'__h'), mEl=document.getElementById(id+'__m');
  if(!hEl||!mEl) return;
  if(!value){ hEl.value=''; mEl.value=''; return; }
  const [h,m] = value.split(':');
  hEl.value=h;
  if(![...mEl.options].some(o=>o.value===m)){
    const opt=document.createElement('option'); opt.value=m; opt.textContent=m; mEl.appendChild(opt);
  }
  mEl.value=m;
}

/* Build absolute (non-wrapping) start/end minutes for every shift in a category
   so that shifts from DIFFERENT categories land on the SAME shared timeline —
   this is what makes the cross-category 6-hour rest check meaningful.
   The previous version anchored each category's own list independently
   (chaining forward from its first listed shift), which only lined up
   correctly when every category happened to start its list at the same hour
   (22:00, true for 安全士官/橋哨). 指管 and 打飯班 start their lists at 06:00,
   so under that old scheme their shifts landed roughly a full day off from
   安全士官/橋哨's equivalent 06:00-08:00 etc., and real overlaps across
   categories (e.g. someone double-booked in 橋哨 and 指管 the same evening)
   went undetected.
   Fix: anchor every category to one shared reference point instead — the
   roster "day" is treated as running from 22:00 through 22:00 the next
   calendar day (matching the unit's own shift-change convention), so any
   raw start time >=22:00 is "today" and anything earlier is "the next
   calendar day of this same roster cycle". This gives every category's
   shifts a directly comparable absolute position, independent of what order
   its own shift list happens to be written in. */
/* 衛哨 (rest-enforced) shifts need 30 minutes of prep beforehand — the
   assignee is effectively occupied starting that much earlier than the
   shift's listed start time, for every check that cares about real
   occupancy (rest gaps, double-booking, misc-duty conflicts). */
/* 衛哨 shifts need 30 minutes of prep beforehand — but this is a gap
   requirement against whatever the person was doing right before (其他勤務
   or a non-rest-enforced category shift like 打飯班), NOT extra padding on
   the sentry-to-sentry 6-hour rule itself. See prepGapConflict below; the
   6h rest math (absoluteShiftTimes/restIssues) intentionally stays on
   nominal shift times only. */
const PREP_MINUTES = 30;
const DAY_START_MIN = 22*60; // 22:00 — the roster day's reference hour
/* a 衛哨 (enforceRest) shift's assignee is effectively occupied starting
   PREP_MINUTES before its listed start time — used everywhere a general
   "is this person busy" check considers an upcoming category assignment,
   not just the one-off prepGapConflict check that runs when someone is
   being assigned INTO the sentry shift itself. Without this, free-time
   queries (指定時間查詢/臨時任務查詢) and availability dropdowns would show
   someone as free right up until the shift's clock start, ignoring the
   prep window the rest of the app already enforces. */
function shiftBusyStartMin(cat, sft){
  const startMin = toMin(sft.start);
  return cat.isSentry ? ((startMin-PREP_MINUTES)%1440+1440)%1440 : startMin;
}
/* the shifts actually in effect for a category on a given date: a
   per-day override if one has been saved for that (date, category) pair,
   otherwise the category's own (all-dates) shift template. Every place that
   reasons about a category's shift TIMES for a specific date — rest-rule
   checks, auto-assign, rendering, exports — goes through this, so a
   day-specific override is honored everywhere consistently rather than
   just in the display. */
function effectiveShifts(cat, date){
  const override = (state.dailyShiftOverrides||{})[date];
  if(override && override[cat.id]) return override[cat.id];
  return cat.shifts;
}
function absoluteShiftTimes(category, date){
  const out={};
  effectiveShifts(category, date).forEach(s=>{
    const sr=toMin(s.start), er=toMin(s.end);
    const dur = er<=sr ? (er+1440-sr) : (er-sr);
    const abs_s = sr>=DAY_START_MIN ? sr : sr+1440;
    out[s.id]={abs_s, abs_e:abs_s+dur};
  });
  return out;
}

/* generic "does raw window A overlap raw window B" check.
   - Once: for one-off, same-cycle entries (daily leave, a specific shift's time,
     comp-rest windows we've already anchored) — expands each window only once
     for its own internal midnight wrap, no further shifting.
   - Recurring: for windows that repeat every day (a person's daily recurring
     long-term block) or that must be matched against a query which may land
     on the "next segment" of the same duty-day chain (compensatory rest,
     since night-block shifts are listed with small raw times that
     chronologically follow the late-evening shifts) — tries every day-length
     offset so either side may be the one that's "ahead". */
function expandWindow(s,e){ if(e<=s) e+=1440; return [s,e]; }
function windowsOverlapOnce(aS,aE,bS,bE){
  const [as,ae]=expandWindow(aS,aE);
  const [bs,be]=expandWindow(bS,bE);
  return as<be && bs<ae;
}
function windowsOverlapRecurring(aS,aE,bS,bE){
  const [as,ae]=expandWindow(aS,aE);
  const [bs,be]=expandWindow(bS,bE);
  for(const off of [-1440,0,1440]){
    if(as < be+off && bs+off < ae) return true;
  }
  return false;
}

/* ---------------- long-term unavailability ---------------- */
/* p.longTerm = {mode:'off'|'allday'|'range', start, end, reason, inCamp}.
   Falls back to the legacy boolean field p.longTermUnavailable from
   earlier versions. `reason` is a free label (usually one of
   LONGTERM_REASON_PRESETS) explaining WHY duty assignment skips this
   person; `inCamp` is independent of that — it says whether they're
   still physically present (主官/懷孕/受傷 etc. — around, just never
   handed duty) versus genuinely away (受訓 etc.), which is what
   distinguishes "在勤人員" headcounts from duty-assignment eligibility.
   Duty exclusion itself is unconditional for any allday/range entry
   regardless of inCamp — inCamp only affects presence-style displays. */
const LONGTERM_REASON_PRESETS = ['主官','高勤傳令','高勤文書','受訓','懷孕','受傷'];
const LONGTERM_REASON_DEFAULT_INCAMP = {主官:true, 高勤傳令:true, 高勤文書:true, 受訓:false, 懷孕:true, 受傷:true};
/* user-editable reason-preset pools, kept separate as requested: one for
   長期事故 (roster-level, e.g. 主官/受訓) and one for single-day 事故登載
   (e.g. 出車/體檢) — a custom reason typed into either form can optionally
   be added to that form's own pool, and both pools can have entries
   removed later */
if(!state.longtermReasonOptions) state.longtermReasonOptions=[...LONGTERM_REASON_PRESETS];
if(!state.dailyReasonOptions) state.dailyReasonOptions=[...UNAVAIL_REASON_PRESETS];
function isDeparted(p){ return !!(p.departureDate && p.departureDate<=todayStr()); }
function personLongTerm(p){
  if(p.longTerm) return {inCamp:true, ...p.longTerm}; // inCamp defaults true for records saved before this field existed
  if(p.longTermUnavailable) return {mode:'allday', inCamp:true};
  return {mode:'off'};
}
function longTermLabel(p){
  const lt=personLongTerm(p);
  if(lt.mode==='off') return '';
  const reasonPart = lt.reason? lt.reason : (lt.mode==='allday'? '長期全天不可排' : '長期不可排');
  const timePart = lt.mode==='range'? ` ${lt.start}–${lt.end}` : (lt.mode==='allday'? '（全天）':'');
  const campPart = lt.inCamp? '在營，不排勤務' : '不在營';
  return `${reasonPart}${timePart}（${campPart}）`;
}

/* ---------------- compensatory rest (補休) ---------------- */
/* Shifts may define restUntil: a clock time until which the assignee is
   automatically excused from any other duty after that shift ends
   (e.g. a 22:00-24:00 sentry shift with restUntil '08:00'). This is computed
   live from current assignments — nothing extra to store. */
function personCompRestWindows(personId, date){
  const dayAssign = state.assign[date]||{};
  const out=[];
  state.categories.forEach(cat=>{
    const catAssign=dayAssign[cat.id]||{};
    effectiveShifts(cat, date).forEach(s=>{
      if(!s.restUntil) return;
      if((catAssign[s.id]||[]).includes(personId)){
        out.push({start:s.end, end:s.restUntil, catName:cat.name, label:s.label||(s.start+'-'+s.end)});
      }
    });
  });
  return out;
}

/* effectiveLongTerm used to also check a separate "suspend today" list
   (state.longTermSuspensions), but that mechanism never actually had a
   way to create a suspension through the UI — it was fully dead. The
   real need it was meant for ("this person is technically blocked but
   will actually make it to this one shift") is now handled per-entry via
   confirmedConflictIds (see miscEntryConflictsDetailed), which is tied to
   the specific schedule entry rather than globally overriding a person's
   availability for the whole day. */
function effectiveLongTerm(person, date){
  return personLongTerm(person);
}
/* ---------------- availability ---------------- */
/* excludeCatShift: {catId,shiftId} — skip this exact shift when checking for
   double-booking against the person's OTHER current assignments (so a shift's
   own dropdown doesn't flag the person it's already assigned to). */
/* Does a timed incident block the window [s,e) on a given day?
   An incident whose end is at or before its start (e.g. 22:00-02:00) runs
   past midnight: on its own day it blocks start→24:00, and on the FOLLOWING
   day it blocks 00:00→end. `spillover` selects which half to test. */
function incidentBlocksWindow(u, s, e, spillover){
  if(!u.start || !u.end) return false;
  const us=toMin(u.start), ue=toMin(u.end);
  const crossesMidnight = ue<=us;
  if(!crossesMidnight) return spillover? false : windowsOverlapOnce(s,e,us,ue);
  if(spillover) return ue>0 && windowsOverlapOnce(s,e,0,ue);
  return windowsOverlapOnce(s,e,us,1440);
}
function isPersonUnavailable(personId, date, s, e, excludeCatShift){
  // s,e in minutes-of-day (0-1440-ish), plain (not absolute-unwrapped)
  const person = state.personnel.find(p=>p.id===personId);
  if(person){
    if(person.departureDate && date>=person.departureDate) return true;
    const lt = effectiveLongTerm(person, date);
    if(lt.mode==='allday') return true;
    if(lt.mode==='range' && lt.start && lt.end && windowsOverlapRecurring(s,e,toMin(lt.start),toMin(lt.end))) return true;
  }
  const entries=(state.unavail[date]||[]).filter(u=>u.personId===personId);
  for(const u of entries){
    if(u.allDay) return true;
    if(incidentBlocksWindow(u, s, e, false)) return true;
  }
  /* an incident logged as e.g. 22:00-02:00 runs past midnight, so the
     00:00-02:00 half belongs to the NEXT calendar day — check yesterday's
     entries for any that spill over into this one */
  const prevEntries=(state.unavail[prevDateStr(date)]||[]).filter(u=>u.personId===personId);
  for(const u of prevEntries){
    if(u.allDay) continue;
    if(incidentBlocksWindow(u, s, e, true)) return true;
  }
  for(const w of personCompRestWindows(personId, date)){
    if(windowsOverlapRecurring(s,e,toMin(w.start),toMin(w.end))) return true;
  }
  /* avoid double-booking against the person's other current assignments.
     The busy window runs from the (possibly prep-time-shifted) start to the
     wrapped end; both ends can fall outside 0-1440 — a sentry shift starting
     00:00 has its 30-minute prep at 23:30 the previous day, and an all-day
     shift like 06:30-06:30 wraps a full 24h — so this must use the
     wrap-aware overlap, otherwise those cases produce a backwards window
     that never matches and the person gets booked twice. */
  const dayAssign = state.assign[date]||{};
  for(const cat of state.categories){
    const catAssign = dayAssign[cat.id]||{};
    for(const sft of effectiveShifts(cat, date)){
      if(excludeCatShift && excludeCatShift.catId===cat.id && excludeCatShift.shiftId===sft.id) continue;
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapRecurring(s,e,shiftBusyStartMin(cat,sft),wrapEndMin(toMin(sft.start),toMin(sft.end)))) return true;
    }
  }
  // avoid double-booking against 其他勤務 (misc) commitments that have a defined time window
  for(const m of (state.misc[date]||[])){
    if((m.nominalIds||[]).includes(personId)) continue; // 掛名：rostered but not actually blocking
    if(m.start && m.end && (m.personIds||[]).includes(personId) && windowsOverlapOnce(s,e,toMin(m.start),toMin(m.end))) return true;
    // a misc duty may also grant 補休 afterwards (e.g. 值班 07:00-07:00 補休至12:00)
    if(m.restUntil && m.end && (m.personIds||[]).includes(personId) && windowsOverlapRecurring(s,e,toMin(m.end),toMin(m.restUntil))) return true;
  }
  return false;
}

function personName(id){ const p=state.personnel.find(p=>p.id===id); return p?p.name:'—'; }
/* the 🚗駕照·⛑️EMT·🔧專長 badge string used consistently across every person
   dropdown/checkbox in the app, so qualifications are visible wherever
   you're picking someone regardless of which UI widget it's rendered in */
function personBadges(p){
  return `${p.license? '·🚗'+esc(p.license):''}${p.medCert? '·⛑️'+esc(p.medCert):''}${(p.skills&&p.skills.length)? '·🔧'+p.skills.map(esc).join('/'):''}`;
}
/* for the ad-hoc "who's free right now, and for how long" query: steps forward
   in 15-minute increments from queryMin until the person becomes unavailable
   (leave, long-term, comp-rest, or an existing assignment) or the day ends */
/* explains WHY a person is unavailable at a given minute — used by the
   指定時間查詢 so the result shows the actual reason, not just a count */
function unavailabilityReasonsInRange(personId, date, s, e){
  const out=[];
  const person = state.personnel.find(p=>p.id===personId);
  if(person){
    if(person.departureDate && date>=person.departureDate) out.push(`已離退（${minguoLabel(person.departureDate)}起）`);
    const lt = effectiveLongTerm(person, date);
    if(lt.mode==='allday') out.push('長期事故：全天不可排');
    else if(lt.mode==='range' && lt.start && lt.end && windowsOverlapRecurring(s,e,toMin(lt.start),toMin(lt.end))) out.push(`長期事故：每天 ${lt.start}-${lt.end} 不可排`);
  }
  (state.unavail[date]||[]).filter(u=>u.personId===personId).forEach(u=>{
    const hit = u.allDay || incidentBlocksWindow(u, s, e, false);
    if(hit) out.push(`${u.allDay? '全天':`${u.start}-${u.end}`}${u.reason? '（'+u.reason+'）':'（未註記原因）'}`);
  });
  for(const w of personCompRestWindows(personId, date)){
    if(windowsOverlapRecurring(s,e,toMin(w.start),toMin(w.end))) out.push(`補休中（${w.catName} ${w.label} 後，至 ${w.end}）`);
  }
  const dayAssign = state.assign[date]||{};
  state.categories.forEach(cat=>{
    const catAssign = dayAssign[cat.id]||{};
    effectiveShifts(cat, date).forEach(sft=>{
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapRecurring(s,e,shiftBusyStartMin(cat,sft),wrapEndMin(toMin(sft.start),toMin(sft.end)))){
        out.push(`勤務中：${cat.name} ${sft.label||sft.start+'-'+sft.end}${cat.enforceRest?'（含準備時間）':''}`);
      }
    });
  });
  (state.misc[date]||[]).forEach(m=>{
    if(!(m.personIds||[]).includes(personId)) return;
    if(m.start && m.end && windowsOverlapOnce(s,e,toMin(m.start),toMin(m.end))) out.push(`勤務中：${m.role}${m.start&&m.end?` (${m.start}-${m.end})`:''}`);
    else if(m.restUntil && m.end && windowsOverlapRecurring(s,e,toMin(m.end),toMin(m.restUntil))) out.push(`補休中（${m.role} 後，至 ${m.restUntil}）`);
  });
  // de-dupe: duplicate underlying records (e.g. someone accidentally
  // registered twice) shouldn't repeat the exact same reason text over and
  // over in the displayed list
  const deduped = [...new Set(out)];
  return deduped.length? deduped : ['不可排（原因不明）'];
}
function freeDurationFrom(personId, date, queryMin){
  if(isPersonUnavailable(personId, date, queryMin, queryMin+1)) return 0;
  const step=15; let t=queryMin;
  while(t<1440){
    if(isPersonUnavailable(personId, date, t, Math.min(t+step,1440))) break;
    t+=step;
  }
  return Math.min(t,1440)-queryMin;
}
function personRank(id){ const p=state.personnel.find(p=>p.id===id); return p?p.rank:''; }

/* gather all assignment instances for a person on a date, across enforceRest categories,
   with absolute minute ranges, for rest / daily-hour checking */
function personEnforcedShifts(personId, date, excludeCatShift){
  const dayAssign = state.assign[date]||{};
  const out=[];
  state.categories.filter(c=>c.enforceRest).forEach(cat=>{
    const abs = absoluteShiftTimes(cat, date);
    const catAssign = dayAssign[cat.id]||{};
    effectiveShifts(cat, date).forEach(s=>{
      if(excludeCatShift && excludeCatShift.catId===cat.id && excludeCatShift.shiftId===s.id) return;
      const list = catAssign[s.id]||[];
      if(list.includes(personId)){
        out.push({catId:cat.id,catName:cat.name,shiftId:s.id,label:s.label|| (s.start+'-'+s.end), ...abs[s.id]});
      }
    });
  });
  return out.sort((a,b)=>a.abs_s-b.abs_s);
}

function restIssues(personId, date, catId, shift){
  // returns array of warning strings if assigning personId to this shift breaks the 6h rest / 6h per day rule
  const cat = state.categories.find(c=>c.id===catId);
  if(!cat.enforceRest) return [];
  const abs = absoluteShiftTimes(cat, date)[shift.id];
  const existing = personEnforcedShifts(personId, date, {catId, shiftId:shift.id});
  const all = [...existing, {abs_s:abs.abs_s, abs_e:abs.abs_e, catName:cat.name, label: shift.label||(shift.start+'-'+shift.end)}].sort((a,b)=>a.abs_s-b.abs_s);
  const issues=[];
  let totalMin=0;
  for(let i=0;i<all.length;i++){
    totalMin += (all[i].abs_e-all[i].abs_s);
    if(i>0){
      const gap = all[i].abs_s - all[i-1].abs_e;
      if(gap < 0){ issues.push(`與「${all[i-1].catName} ${all[i-1].label}」時段重疊`); }
      else if(gap < 360){ issues.push(`與「${all[i-1].catName} ${all[i-1].label}」間隔僅 ${Math.round(gap/60*10)/10} 小時（需滿6小時）`); }
    }
  }
  if(totalMin>360){ issues.push(`當日累計勤務 ${Math.round(totalMin/60*10)/10} 小時，超過上限6小時`); }
  return issues;
}

/* would assigning this shift create a 補休(comp-rest) window that overlaps a
   commitment the person ALREADY has — a 其他勤務(misc) entry with a defined
   time, or a non-enforceRest category shift (e.g. 打飯班) — that restIssues
   above doesn't check (it only compares against OTHER enforceRest shifts)? */
function wouldRestWindowConflict(personId, date, shift, excludeCatShift){
  if(!shift.restUntil) return false;
  const winStart=toMin(shift.end), winEnd=toMin(shift.restUntil);
  for(const m of (state.misc[date]||[])){
    if(m.start && m.end && (m.personIds||[]).includes(personId) && windowsOverlapRecurring(toMin(m.start),toMin(m.end),winStart,winEnd)) return true;
  }
  const dayAssign=state.assign[date]||{};
  for(const cat of state.categories){
    if(cat.enforceRest) continue;
    const catAssign=dayAssign[cat.id]||{};
    for(const sft of effectiveShifts(cat, date)){
      if(excludeCatShift && excludeCatShift.catId===cat.id && excludeCatShift.shiftId===sft.id) continue;
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapRecurring(toMin(sft.start),toMin(sft.end),winStart,winEnd)) return true;
    }
  }
  return false;
}

/* 衛哨 shifts need PREP_MINUTES of prep beforehand — check whether the
   person was still doing something else (其他勤務 or a non-rest-enforced
   category shift like 打飯班) too close before this shift starts. This is
   the one place PREP_MINUTES applies; it deliberately does NOT feed into
   the sentry-to-sentry 6-hour rule (restIssues/absoluteShiftTimes), which
   stays on nominal shift times. Example: 採買 ending at 08:00 immediately
   followed by an 08:00-12:00 衛哨 shift leaves no prep time — flagged;
   two 衛哨 shifts 6 hours apart are NOT affected by this rule. */
function prepGapConflict(personId, date, cat, shift){
  if(!cat.enforceRest) return false;
  const shiftStart=toMin(shift.start);
  const prepStart=((shiftStart-PREP_MINUTES)%1440+1440)%1440;
  for(const m of (state.misc[date]||[])){
    if(m.start && m.end && (m.personIds||[]).includes(personId) && windowsOverlapOnce(prepStart,shiftStart,toMin(m.start),toMin(m.end))) return true;
  }
  const dayAssign=state.assign[date]||{};
  for(const c of state.categories){
    if(c.enforceRest) continue;
    const catAssign=dayAssign[c.id]||{};
    for(const sft of effectiveShifts(c, date)){
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapOnce(prepStart,shiftStart,toMin(sft.start),toMin(sft.end))) return true;
    }
  }
  return false;
}

/* the smallest gap this candidate would end up with, immediately before or
   after this shift, against their other enforceRest shifts today — used to
   prefer spacing people out further apart rather than always clustering
   everyone right at the 6-hour minimum */
function minAdjacentGap(personId, date, cat, shift){
  if(!cat.enforceRest) return Infinity;
  const abs=absoluteShiftTimes(cat, date)[shift.id];
  const existing=personEnforcedShifts(personId, date, {catId:cat.id, shiftId:shift.id});
  let minGap=Infinity;
  existing.forEach(ex=>{
    if(ex.abs_e<=abs.abs_s) minGap=Math.min(minGap, abs.abs_s-ex.abs_e);
    else if(abs.abs_e<=ex.abs_s) minGap=Math.min(minGap, ex.abs_s-abs.abs_e);
  });
  return minGap;
}

/* Fills only EMPTY slots for the given date — never overwrites an existing
   manual assignment. Greedy, shift-by-shift in each category's listed order:
   skip anyone unavailable/already double-booked for that slot, then rank
   candidates by (fewest rest-rule issues, duty priority for that category,
   fewest shifts already given out today, roster rank order). */
/* would placing `person` in this category's shift break the supervising-rank
   rule, either because this IS the supervising post and someone senior is
   already on another overlapping post, or because this is an ordinary post
   and the person would outrank whoever holds the supervising post? */
function wouldBreakOutrankRule(person, cat, shift, date, arr, idx){
  const sMin = toMin(shift.start), eMin = wrapEndMin(sMin, toMin(shift.end));
  const dayAssign = state.assign[date]||{};
  const overlappingAssigned = [];
  orderedCategories().forEach(other=>{
    const otherAssign = dayAssign[other.id]||{};
    effectiveShifts(other, date).forEach(osft=>{
      const oS = toMin(osft.start), oE = wrapEndMin(oS, toMin(osft.end));
      if(!windowsOverlapOnce(sMin,eMin,oS,oE)) return;
      (otherAssign[osft.id]||[]).forEach((opid,oidx)=>{
        if(!opid) return;
        if(other.id===cat.id && osft.id===shift.id && oidx===idx) return; // the slot being filled
        const op = state.personnel.find(p=>p.id===opid);
        if(op) overlappingAssigned.push({cat:other, person:op});
      });
    });
  });
  if(cat.mustOutrankOthers){
    // this is the supervising post — nobody else overlapping may outrank it
    return overlappingAssigned.some(a=>!a.cat.mustOutrankOthers && rankIndex(a.person.rank) < rankIndex(person.rank));
  }
  // ordinary post — must not outrank whoever holds a supervising post
  return overlappingAssigned.some(a=>a.cat.mustOutrankOthers && rankIndex(person.rank) < rankIndex(a.person.rank));
}
function autoAssignDay(date){
  if(!state.assign[date]) state.assign[date]={};
  const assignCount={};
  const allSlots=[];
  state.categories.forEach(cat=>{
    if(!state.assign[date][cat.id]) state.assign[date][cat.id]={};
    const abs=absoluteShiftTimes(cat, date);
    effectiveShifts(cat, date).forEach(s=>{
      if(!state.assign[date][cat.id][s.id]) state.assign[date][cat.id][s.id]=[];
      allSlots.push({cat, s, absStart:abs[s.id].abs_s});
    });
  });
  allSlots.sort((a,b)=>a.absStart-b.absStart);
  allSlots.forEach(({cat,s})=>{
    const arr=state.assign[date][cat.id][s.id];
    const sMin=toMin(s.start), eMin=wrapEndMin(sMin, toMin(s.end));
    // "最少需要幾位士官(含)以上" is a HARD floor: while it's still unmet,
    // only 士官/軍官 candidates are considered for the remaining empty
    // slots, so auto-assign leaves a slot empty rather than quietly
    // filling it with a non-NCO just to hit the headcount. Once the floor
    // is met (or every empty slot has been tried), the rest fill normally.
    let ncoStillNeeded = Math.max(0, (s.minNCO||0) - arr.filter(pid=>pid && ['士官','軍官'].includes(rankCategory(personRank(pid)))).length);
    for(let idx=0; idx<s.count; idx++){
      if(!arr[idx]){
        const rawCandidatesAll = state.personnel.filter(p=>
          !arr.includes(p.id) && !rankExcludedFromCategory(p.rank,cat) &&
          !isPersonUnavailable(p.id, date, sMin, eMin, {catId:cat.id, shiftId:s.id}) &&
          !isPersonOnExclusiveStandby(p.id, date) &&
          !isDutyOfficer(p.id, date)
        );
        const rawCandidates = ncoStillNeeded>0
          ? rawCandidatesAll.filter(p=>['士官','軍官'].includes(rankCategory(p.rank)))
          : rawCandidatesAll;
        const restOk = cat.enforceRest
          ? rawCandidates.filter(p=>restIssues(p.id,date,cat.id,s).length===0 && !assignedSameShiftYesterday(p.id,date,cat.id,s.id) && !wouldRestWindowConflict(p.id,date,s,{catId:cat.id,shiftId:s.id}) && !prepGapConflict(p.id,date,cat,s))
          : rawCandidates;
        /* 安全士官-style rank supervision is applied as a PREFERENCE, not a
           hard filter: prefer candidates that keep the ranking valid, but
           if none exist, still fill the slot rather than leaving a hole
           (the card will show a ⚠️ so it's visible and fixable by hand). */
        const rankOk = restOk.filter(p=>!wouldBreakOutrankRule(p, cat, s, date, arr, idx));
        const candidates = rankOk.length? rankOk : restOk;
        if(candidates.length){
        candidates.sort((a,b)=>{
          const aCnt=assignCount[a.id]||0, bCnt=assignCount[b.id]||0;
          if(aCnt!==bCnt) return aCnt-bCnt;
          const aDuty=dutySortIndex(a.rank,cat,idx,s), bDuty=dutySortIndex(b.rank,cat,idx,s);
          if(aDuty!==bDuty) return aDuty-bDuty;
          const aGap=minAdjacentGap(a.id,date,cat,s), bGap=minAdjacentGap(b.id,date,cat,s);
          if(aGap!==bGap) return bGap-aGap;
          return rankIndex(a.rank)-rankIndex(b.rank);
        });
        const chosen=candidates[0];
        arr[idx]=chosen.id;
        assignCount[chosen.id]=(assignCount[chosen.id]||0)+1;
        if(['士官','軍官'].includes(rankCategory(chosen.rank))) ncoStillNeeded=Math.max(0,ncoStillNeeded-1);
        }
      } else {
        assignCount[arr[idx]]=(assignCount[arr[idx]]||0)+1;
      }
    }
  });
  saveState();
}

const MISC_SIBLING_ROLE={'採買':'愛心便當','愛心便當':'採買'};
function autoAssignMiscForDate(date){
  if(!state.misc[date]) state.misc[date]=[];
  state.miscPresets.filter(p=>p.fixed).forEach(preset=>{
    const roles = preset.roles;
    const times = presetTimes(preset);
    if(times.length===1){
      const exists = state.misc[date].some(m=>m.role===preset.role);
      if(!exists){
        const t=times[0];
        state.misc[date].push({
          id:uid(), role:preset.role, start:t.start, end:t.end, restUntil:preset.restUntil||'',
          roles: roles?[...roles]:undefined,
          personIds: roles? roles.map(()=>undefined) : []
        });
      }
      return;
    }
    times.forEach(t=>{
      const exists = state.misc[date].some(m=>m.role===preset.role && m.start===t.start && m.end===t.end);
      if(!exists){
        state.misc[date].push({
          id:uid(), role:preset.role, start:t.start, end:t.end, restUntil:preset.restUntil||'',
          roles: roles?[...roles]:undefined,
          personIds: roles? roles.map(()=>undefined) : []
        });
      }
    });
  });
  /* process entries with the strictest requirements first (most required
     license/EMT/skill types, weighted by how many of the entry's role
     slots actually need one — an item where BOTH driver and chief need
     EMT is harder to fill than one where only the driver does, so it
     should get first pick of the few EMT-qualified people), so a rare
     qualification doesn't get used up by an earlier, less picky entry
     that could have been filled by almost anyone. Entries tied on
     requirement count fall back to the card's own display order
     (sortOrder) — this only reorders the AUTO-ASSIGN pass itself, not the
     entries' stored order or how they're displayed. */
  function miscEntryRequirementScore(entry){
    const preset = presetForEntry(entry);
    if(!preset) return 0;
    let score = 0;
    if((preset.requiredLicenses||[]).length) score++;
    if(preset.requiredMedCert) score++;
    if((preset.requiredSkills||[]).length) score++;
    if(entry.roles && entry.roles.includes('車長')){
      if(preset.requiredMedCert) score++; // chief shares the same EMT requirement as the driver
      if(preset.chiefRequiredMedCert) score++;
      if((preset.chiefRequiredLicenses||[]).length) score++;
      if((preset.chiefRequiredSkills||[]).length) score++;
    }
    return score;
  }
  const processingOrder = [...state.misc[date]].sort((a,b)=>{
    const sa=miscEntryRequirementScore(a), sb=miscEntryRequirementScore(b);
    if(sa!==sb) return sb-sa;
    const pa=presetForEntry(a), pb=presetForEntry(b);
    return (pa?(pa.sortOrder??999):999) - (pb?(pb.sortOrder??999):999);
  });
  processingOrder.forEach(entry=>{
    if(!entry.roles){
      if(!entry.personIds) entry.personIds=[];
      entry.personIds = entry.personIds.filter(Boolean);
      const presetForSort = presetForEntry(entry);
      const targetCount = (presetForSort && presetForSort.requiredCount) || 1;
      if(entry.personIds.length<targetCount && !entry.skipAutoFill){
        const sMin = entry.start? toMin(entry.start) : null;
        const eMinRaw = entry.end? toMin(entry.end) : null;
        const already = new Set(entry.personIds);
        const candidates = state.personnel.filter(p=>
          !already.has(p.id) &&
          !(sMin!==null && eMinRaw!==null && isPersonUnavailable(p.id, date, sMin, wrapEndMin(sMin, eMinRaw))) &&
          driverQualificationIssues(p, presetForSort).length===0 &&
          !personHasConflictingStandby(p.id, date, presetForSort, entry.id) &&
          !isPersonOnExclusiveStandby(p.id, date, entry.id) &&
          (entry.role==='值星' || !isDutyOfficer(p.id, date))
        );
        if(candidates.length){
          candidates.sort((a,b)=>{
            const skillMatch = p=> (p.skills||[]).includes(entry.role) ? 0 : 1;
            const sa=skillMatch(a), sb=skillMatch(b);
            if(sa!==sb) return sa-sb;
            return rankPriorityIndex(a.rank,presetForSort)-rankPriorityIndex(b.rank,presetForSort) || groupIndex(a.group)-groupIndex(b.group);
          });
          const need = targetCount - entry.personIds.length;
          candidates.slice(0, need).forEach(c=>entry.personIds.push(c.id));
        }
      }
      return;
    }
    if(!entry.personIds) entry.personIds=entry.roles.map(()=>undefined);
    const preset=presetForEntry(entry);
    const sMinEntry = entry.start? toMin(entry.start) : null;
    const eMinRawEntry = entry.end? toMin(entry.end) : null;
    const freeForEntry = p=>
      !entry.personIds.includes(p.id) &&
      !(sMinEntry!==null && eMinRawEntry!==null && isPersonUnavailable(p.id, date, sMinEntry, wrapEndMin(sMinEntry, eMinRawEntry))) &&
      !personHasConflictingStandby(p.id, date, preset, entry.id) &&
      !isPersonOnExclusiveStandby(p.id, date, entry.id) &&
      (entry.role==='值星' || !isDutyOfficer(p.id, date));
    /* 駕駛+車長 must be solved as a PAIR, not one slot at a time. Filling
       駕駛 greedily with the highest-priority candidate can strand the
       車長 slot: 車長 may not rank below 駕駛, so picking the most senior
       qualified person as driver leaves nobody eligible to be chief, and
       the slot silently stays empty even when a workable pairing existed
       (e.g. 上士+中士 both EMT-qualified → should be 駕駛=中士,
       車長=上士, not 駕駛=上士 + empty). Search valid (driver, chief)
       combinations and prefer the one that fills BOTH slots. */
    const driverIdx = entry.roles.indexOf('駕駛');
    const chiefIdx = entry.roles.indexOf('車長');
    if(driverIdx>-1 && chiefIdx>-1 && !entry.personIds[driverIdx] && !entry.personIds[chiefIdx]
       && !(entry.lockedSlots && (entry.lockedSlots[driverIdx] || entry.lockedSlots[chiefIdx]))){
      const driverPool = state.personnel.filter(p=>freeForEntry(p) && driverQualificationIssues(p, preset).length===0);
      const chiefPool = state.personnel.filter(p=>freeForEntry(p) && chiefEligible(p, preset, null));
      const rankOf = p=>rankPriorityIndex(p.rank,preset);
      let best=null;
      driverPool.forEach(d=>{
        chiefPool.forEach(c=>{
          if(c.id===d.id) return;
          if(!chiefEligible(c, preset, d)) return;
          // prefer the pairing whose combined priority is best, so the
          // usual "lower rank drives" outcome falls out naturally
          const score = rankOf(d)+rankOf(c);
          if(!best || score<best.score) best={d,c,score};
        });
      });
      if(best){
        entry.personIds[driverIdx]=best.d.id;
        entry.personIds[chiefIdx]=best.c.id;
      } else {
        // no pairing fills both — fall back to filling whichever single
        // slot we can, rather than leaving the whole item untouched
        if(driverPool.length) entry.personIds[driverIdx]=driverPool.sort((a,b)=>rankOf(a)-rankOf(b))[0].id;
        else if(chiefPool.length) entry.personIds[chiefIdx]=chiefPool.sort((a,b)=>rankOf(a)-rankOf(b))[0].id;
      }
    }
    entry.roles.forEach((r,i)=>{
      if(entry.personIds[i]) return;
      if(entry.lockedSlots && entry.lockedSlots[i]) return;
      let eligibleFn;
      if(r==='駕駛'){
        eligibleFn = p=>driverQualificationIssues(p, preset).length===0;
      } else if(r==='車長'){
        const dIdx=entry.roles.indexOf('駕駛');
        const driver = dIdx>-1? state.personnel.find(p=>p.id===entry.personIds[dIdx]) : null;
        eligibleFn = p=>chiefEligible(p, preset, driver);
      } else if(r.startsWith('話務')){
        eligibleFn = p=>!!p.license;
      } else {
        eligibleFn = ()=>true;
      }
      const candidates = state.personnel.filter(p=>freeForEntry(p) && eligibleFn(p));
      if(candidates.length){
        candidates.sort((a,b)=>rankPriorityIndex(a.rank,preset)-rankPriorityIndex(b.rank,preset) || groupIndex(a.group)-groupIndex(b.group));
        let chosen = candidates[0];
        const siblingRole = MISC_SIBLING_ROLE[entry.role];
        if(siblingRole){
          const sibling = state.misc[date].find(m=>m.role===siblingRole && m.roles);
          const siblingIdx = sibling? sibling.roles.indexOf(r) : -1;
          const siblingPersonId = siblingIdx>-1? sibling.personIds[siblingIdx] : null;
          const match = siblingPersonId && candidates.find(c=>c.id===siblingPersonId);
          if(match) chosen = match;
        }
        entry.personIds[i]=chosen.id;
      }
    });
  });
  saveState();
}

/* ---------------- 彈窗開啟時鎖住背景頁面的捲動 ----------------
   整個系統的主要內容是靠 window/body 本身在捲動的（render() 會存/還原
   window.scrollY），彈窗（不管是 .sheet-modal、.fullscreen-modal 還是各
   種直接用 style.cssText 蓋出來的 position:fixed 小視窗）疊在最上層，但
   背景的 body 本身其實還是可以捲動的——手指在彈窗上滑動時，很容易滑動
   到背景頁面而不是彈窗自己的內容，兩邊搶著回應同一個手勢，就會出現「往
   下滑一半又彈回去、按不到關閉按鈕」這種情況，而且不是哪一個彈窗特別壞
   掉，是每一個彈窗都有這個風險。
   用 MutationObserver 監看 body 底下有沒有新增/移除的元素，只要目前有
   任何一個「看起來像彈窗」的元素還在（開頁時就有的固定元素，例如標題
   區、分頁列，不算），就把 body 本身的捲動鎖住；等所有彈窗都關閉、這些
   動態元素都被移除了，才把捲動還給背景頁面。這樣不用一個一個彈窗自己去
   加開關鎖定的程式碼，新彈窗以後也會自動套用到同一套保護。 */
(function(){
  const staticChildren = new Set(document.body.children);
  function isModalLike(el){
    if(el.nodeType!==1) return false;
    if(el.classList && (el.classList.contains('sheet-modal')||el.classList.contains('fullscreen-modal')||el.classList.contains('drawer')||el.classList.contains('drawer-backdrop'))) return true;
    return getComputedStyle(el).position==='fixed';
  }
  function refreshBodyScrollLock(){
    const hasModal = [...document.body.children].some(el=>!staticChildren.has(el) && isModalLike(el));
    document.body.style.overflow = hasModal? 'hidden' : '';
  }
  if(typeof MutationObserver!=='undefined') new MutationObserver(refreshBodyScrollLock).observe(document.body, {childList:true});
})();
