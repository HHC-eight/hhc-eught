  const modal=document.createElement('div');
  modal.className='sheet-modal'; modal.style.zIndex='93';
  const searchBlock = (id)=>`<div class="row wrap" style="margin-bottom:6px">
      <div class="grow"><label>搜尋姓名</label><input type="text" id="${id}" placeholder="輸入姓名關鍵字"></div>
    </div>`;
  const listBox = (inner, id)=>`<div id="${id}-selsum" class="hint" style="margin-bottom:4px">已選：（無）</div><div id="${id}" class="pp-picklist" style="max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px">${inner}</div>`;
  /* checkbox/radio lists can run to dozens of names — without this, seeing
     who you've actually picked means scrolling back up through the whole
     filtered list. Keeps a running "已選：X、Y" line above each list. */
  const wireSelectedSummary=(listId)=>{
    const listEl=document.getElementById(listId), sumEl=document.getElementById(listId+'-selsum');
    if(!listEl||!sumEl) return;
    const update=()=>{
      const checked=[...listEl.querySelectorAll('input:checked')].filter(i=>i.value);
      const names=checked.map(i=>{ const p=state.personnel.find(x=>x.id===i.value); return p?p.name:''; }).filter(Boolean);
      sumEl.textContent='已選：'+(names.length? names.join('、') : '（無）');
    };
    listEl.addEventListener('change', update);
    update();
  };
  const checkRows = (selectedIds, cls, reasonsFn, nominalIds)=>{
    if(!pool.length) return `<div class="empty">目前沒有人員</div>`;
    const nomSet = new Set(nominalIds||[]);
    const withReasons = pool.map(p=>({p, reasons: reasonsFn? reasonsFn(p) : []}));
    withReasons.sort((a,b)=>(a.reasons.length>0)-(b.reasons.length>0));
    return withReasons.map(({p,reasons})=>`
      <label style="display:flex;align-items:flex-start;gap:6px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);${reasons.length?'opacity:.6':''}">
        <input type="checkbox" class="${cls}" value="${p.id}" style="width:auto;flex-shrink:0;margin-top:2px" ${selectedIds.includes(p.id)?'checked':''}>
        <span class="grow">${esc(p.name)}（${p.group||'未分組'}·${p.rank}${personBadges(p)}）${reasons.length? `<br><span class="warn" style="font-size:11px">🚫${esc(reasons.join('・'))}</span>`:''}</span>
        <label style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--dim);flex-shrink:0;margin-top:2px" title="掛名：排進去但不算忙碌，可以同時被排別的任務">
          <input type="checkbox" class="${cls}-nom" value="${p.id}" style="width:auto" ${nomSet.has(p.id)?'checked':''}>掛
        </label>
      </label>`).join('');
  };
  const radioRows = (selectedId, cls, name, reasonsFn, nominalIds)=>{
    if(!pool.length) return `<div class="empty">沒有符合資格的人員</div>`;
    const nomSet = new Set(nominalIds||[]);
    const withReasons = pool.map(p=>({p, reasons: reasonsFn? reasonsFn(p) : []}));
    withReasons.sort((a,b)=>(a.reasons.length>0)-(b.reasons.length>0));
    return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0">
        <input type="radio" name="${name}" class="${cls}" value="" style="width:auto" ${!selectedId?'checked':''}> （未指派）
      </label>`+withReasons.map(({p,reasons})=>`
      <label style="display:flex;align-items:flex-start;gap:6px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);${reasons.length?'opacity:.6':''}">
        <input type="radio" name="${name}" class="${cls}" value="${p.id}" style="width:auto;margin-top:2px" ${p.id===selectedId?'checked':''}>
        <span class="grow">${esc(p.name)}（${p.group||'未分組'}·${p.rank}${personBadges(p)}）${reasons.length? `<br><span class="warn" style="font-size:11px">🚫${esc(reasons.join('・'))}</span>`:''}</span>
        <label style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--dim);flex-shrink:0;margin-top:2px" title="掛名：排進去但不算忙碌，可以同時被排別的任務">
          <input type="checkbox" class="${cls}-nom" value="${p.id}" style="width:auto" ${nomSet.has(p.id)?'checked':''}>掛
        </label>
      </label>`).join('');
  };
  const timeRow = (idBase, st, en, label)=>`
    <div class="row wrap" style="margin-bottom:6px">
      <div class="grow"><label>${label||'開始'}</label>${timeSelectHTML(idBase+'Start', st, {allowEmpty:true})}</div>
      <div class="grow"><label>結束</label>${timeSelectHTML(idBase+'End', en, {allowEmpty:true})}</div>
    </div>`;
  const restRow = (id, val, label)=>`
    <div class="row wrap" style="margin-bottom:6px">
      <div class="grow"><label>${label||'補休至（選填）'}</label>${timeSelectHTML(id, val||'', {allowEmpty:true})}</div>
    </div>`;
  const supportRow = (id, val)=>`
    <div class="row wrap" style="margin-bottom:6px">
      <div class="grow"><label>支援單位/人員（選填，直接打字）</label><input type="text" id="${id}" value="${esc(val||'')}" placeholder="例：三連 王小明"></div>
    </div>`;
  let body='';
  // one shared preset-based eligibility check for every non-roles mode —
  // roles mode (駕駛/車長) already has its own more detailed per-role check
  const requiredSkillsForType = state.unitRules.preplanSkillReqs[key]||[];
  const presetReasonsFn = (preset || requiredSkillsForType.length)? (p=>{
    const issues = driverQualificationIssues(p, preset);
    requiredSkillsForType.forEach(sk=>{
      if(!(p.skills||[]).includes(sk) && !issues.includes(skillRequirementLabel(sk))) issues.push(skillRequirementLabel(sk));
    });
    return issues;
  }) : null;
  const groupBlockHTML = (g, gi)=>`
    <div class="pp-group" data-group-idx="${gi}" style="border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px">
      <div class="row" style="margin-bottom:6px;align-items:center"><span class="grow muted" style="font-weight:600">第${gi+1}組</span><button class="ghost small danger" data-remove-group="${gi}">移除這組</button></div>
      ${type.editableTime? timeRow('ppT'+gi, g.start||preplanDefault(key,'start',t0.start), g.end||preplanDefault(key,'end',t0.end)) : ''}
      ${restRow('ppRest'+gi, g.restUntil||preplanDefault(key,'rest',(preset&&preset.restUntil)||''))}
      ${supportRow('ppSupport'+gi, g.support)}
      ${searchBlock('ppSearch'+gi)}
      <div class="row wrap" style="margin-bottom:6px">
        <button class="ghost small" data-select-all-group="${gi}">全選(顯示中)</button>
        <button class="ghost small" data-clear-all-group="${gi}">全部取消</button>
      </div>
      ${listBox(checkRows(g.personIds||[], 'pp-person'+gi, presetReasonsFn, g.nominalIds), 'ppList'+gi)}
    </div>`;
  if(type.mode==='people'){
    const initialGroups = peopleGroupsOf(plan).length? peopleGroupsOf(plan) : [{}];
    body = `<div id="ppGroupsWrap">${initialGroups.map((g,gi)=>groupBlockHTML(g,gi)).join('')}</div>
      <button class="ghost" id="ppAddGroup" style="width:100%;margin-bottom:8px">＋新增一組（同一天不同時段/不同人時使用）</button>`;
  } else if(type.mode==='roles'){
    const driverIdx=type.roles.indexOf('駕駛'), chiefIdx=type.roles.indexOf('車長');
    const currentDriver = driverIdx>-1? state.personnel.find(p=>p.id===(plan.personIds||[])[driverIdx]) : null;
    body = (type.editableTime? timeRow('ppT', plan.start||preplanDefault(key,'start',t0.start), plan.end||preplanDefault(key,'end',t0.end)) : '')
      + restRow('ppRest', plan.restUntil||preplanDefault(key,'rest',(preset&&preset.restUntil)||''))
      + supportRow('ppSupport', plan.support)
      + type.roles.map((r,i)=>{
          const extraSkillIssues = p=>requiredSkillsForType.filter(sk=>!(p.skills||[]).includes(sk)).map(skillRequirementLabel);
          const reasonsFn = (r==='車長')? (p=>{
            const reasons=[];
            if(!['士官','軍官'].includes(rankCategory(p.rank))) reasons.push('需為士官以上');
            if(currentDriver && rankIndex(p.rank)>rankIndex(currentDriver.rank)) reasons.push('階級不可低於駕駛');
            if(preset && preset.chiefRequiredMedCert && !p.medCert) reasons.push('需具備EMT或醫生證書');
            if(preset && (preset.chiefRequiredLicenses||[]).length && !preset.chiefRequiredLicenses.some(l=>licenseCovers(p.license,l))) reasons.push('需持有'+preset.chiefRequiredLicenses.join('或')+'駕照');
            return [...reasons, ...extraSkillIssues(p)];
          }) : (r==='駕駛')? (p=>[...(preset? driverQualificationIssues(p, preset):[]), ...extraSkillIssues(p)]) : (requiredSkillsForType.length? extraSkillIssues : null);
          const selId=(plan.personIds||[])[i]||'';
          return `<div class="hint" style="margin:6px 0 2px"><b>${esc(r)}</b></div>`
            + searchBlock('ppSearch'+i)
            + listBox(radioRows(selId, 'pp-role'+i, 'pprole'+i, reasonsFn, plan.nominalIds), 'ppList'+i)
            + `<div class="row wrap" style="margin:6px 0 2px"><div class="grow"><label>${esc(r)}支援（選填，找不到適合的人時手打）</label><input type="text" id="ppRoleNote${i}" value="${esc((plan.notes||[])[i]||'')}" placeholder="例：三連支援"></div></div>`;
        }).join('');
  } else if(type.mode==='dayNight'){
    const times = preset? presetTimes(preset) : [];
    const dt = times[0]||{start:'',end:''}, nt = times[1]||times[0]||{start:'',end:''};
    body = `<div class="hint" style="margin:6px 0 2px"><b>日班</b></div>`
      + timeRow('ppDayT', plan.dayStart||preplanDefault(key,'dayStart',dt.start), plan.dayEnd||preplanDefault(key,'dayEnd',dt.end))
      + restRow('ppDayRest', plan.dayRestUntil||preplanDefault(key,'dayRest',''), '日班補休至（選填）')
      + searchBlock('ppSearchD')
      + listBox(checkRows(plan.dayPersonIds||(plan.dayPersonId?[plan.dayPersonId]:[]), 'pp-day', presetReasonsFn, plan.dayNominalIds), 'ppListD')
      + `<div class="divider"></div><div class="hint" style="margin:6px 0 2px"><b>夜班</b></div>`
      + timeRow('ppNightT', plan.nightStart||preplanDefault(key,'nightStart',nt.start), plan.nightEnd||preplanDefault(key,'nightEnd',nt.end))
      + restRow('ppNightRest', plan.nightRestUntil||preplanDefault(key,'nightRest',''), '夜班補休至（選填）')
      + searchBlock('ppSearchN')
      + listBox(checkRows(plan.nightPersonIds||(plan.nightPersonId?[plan.nightPersonId]:[]), 'pp-night', presetReasonsFn, plan.nightNominalIds), 'ppListN')
      + supportRow('ppSupport', plan.support);
  } else if(type.mode==='fixedSlots'){
    body = supportRow('ppSupport', plan.support)
      + type.slots.map((sl,i)=>{
        const cfg=(plan.slots||{})[i]||{};
        const ids=cfg.personIds||(cfg.personId?[cfg.personId]:[]);
        const on=ids.length>0;
        return `<div class="card" style="padding:8px 10px">
          <div class="row" style="align-items:center;margin-bottom:4px">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px" class="grow">
              <input type="checkbox" class="pp-slot-on" data-slot="${i}" style="width:auto" ${on?'checked':''}>
              <b>${sl}</b>
            </label>
          </div>
          <div class="pp-slot-body" data-slot-body="${i}" style="display:${on?'block':'none'}">
            ${restRow('ppSlotRest'+i, cfg.restUntil||preplanDefault(key,'slotRest'+i,''))}
            ${searchBlock('ppSearchS'+i)}
            ${listBox(checkRows(ids, 'pp-slot'+i, presetReasonsFn, cfg.nominalIds), 'ppListS'+i)}
          </div>
        </div>`;
      }).join('');
  }
  modal.innerHTML=`
    <div class="sheet-inner">
      <div class="section-title"><h2 style="margin:0">${type.icon} ${type.name}：${minguoLabel(date)}</h2><button class="ghost small" id="ppClose">關閉</button></div>
      <div class="hint" style="margin-bottom:8px">${type.hint}</div>
      ${body}
      <div class="row wrap" style="margin-top:10px">
        <button class="ghost grow" id="ppCopy">複製到其他日期</button>
        <button class="ghost grow danger" id="ppDelete">清除這天</button>
        <button class="primary grow" id="ppSave">儲存</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  const close=()=>modal.remove();
  document.getElementById('ppClose').onclick=close;
  // wire every search box to its own list, keeping the keyboard up
  const wireSearch=(searchId, listId)=>{
    const se=document.getElementById(searchId), le=document.getElementById(listId);
    if(!se||!le) return;
    se.oninput=()=>{
      const term=se.value.trim();
      le.querySelectorAll('label').forEach(l=>{ l.style.display=(!term||l.textContent.includes(term))?'flex':'none'; });
    };
    keepSearchFocusOnPick(le, se);
  };
  if(type.mode==='people'){
    let groupCounter = modal.querySelectorAll('.pp-group').length;
    const wireGroup=(gi)=>{
      wireSearch('ppSearch'+gi,'ppList'+gi); wireSelectedSummary('ppList'+gi);
      const selAllBtn=modal.querySelector(`[data-select-all-group="${gi}"]`);
      const clrAllBtn=modal.querySelector(`[data-clear-all-group="${gi}"]`);
      if(selAllBtn) selAllBtn.onclick=()=>modal.querySelectorAll('.pp-person'+gi).forEach(cb=>{ if(cb.closest('label').style.display!=='none') cb.checked=true; });
      if(clrAllBtn) clrAllBtn.onclick=()=>modal.querySelectorAll('.pp-person'+gi).forEach(cb=>cb.checked=false);
      const rmBtn=modal.querySelector(`[data-remove-group="${gi}"]`);
      if(rmBtn) rmBtn.onclick=()=>{
        if(modal.querySelectorAll('.pp-group').length<=1){ showAlert('至少要留一組。'); return; }
        const block=modal.querySelector(`.pp-group[data-group-idx="${gi}"]`);
        if(block) block.remove();
      };
    };
    [...modal.querySelectorAll('.pp-group')].forEach(b=>wireGroup(Number(b.dataset.groupIdx)));
    document.getElementById('ppAddGroup').onclick=()=>{
      const wrap=document.getElementById('ppGroupsWrap');
      wrap.insertAdjacentHTML('beforeend', groupBlockHTML({}, groupCounter));
      wireGroup(groupCounter);
      groupCounter++;
    };
  } else if(type.mode==='roles'){
    type.roles.forEach((_,i)=>{ wireSearch('ppSearch'+i,'ppList'+i); wireSelectedSummary('ppList'+i); });
    const driverIdx=type.roles.indexOf('駕駛'), chiefIdx=type.roles.indexOf('車長');
    if(driverIdx>-1 && chiefIdx>-1){
      // picking 駕駛 changes who's eligible/ranked-in for 車長, so the chief
      // list has to be regenerated live rather than staying frozen from
      // whatever the driver was when the sheet first opened
      modal.querySelectorAll('.pp-role'+driverIdx).forEach(radio=>{
        radio.addEventListener('change', ()=>{
          const driverId=radio.value;
          const driver=driverId? state.personnel.find(p=>p.id===driverId) : null;
          const reasonsFn = p=>{
            const reasons=[];
            if(!['士官','軍官'].includes(rankCategory(p.rank))) reasons.push('需為士官以上');
            if(driver && rankIndex(p.rank)>rankIndex(driver.rank)) reasons.push('階級不可低於駕駛');
            if(preset && preset.chiefRequiredMedCert && !p.medCert) reasons.push('需具備EMT或醫生證書');
            if(preset && (preset.chiefRequiredLicenses||[]).length && !preset.chiefRequiredLicenses.some(l=>licenseCovers(p.license,l))) reasons.push('需持有'+preset.chiefRequiredLicenses.join('或')+'駕照');
            return reasons;
          };
          const chiefListEl=document.getElementById('ppList'+chiefIdx);
          const currentChief=modal.querySelector('.pp-role'+chiefIdx+':checked');
          const currentVal=currentChief? currentChief.value : '';
          if(chiefListEl) chiefListEl.innerHTML=radioRows(currentVal, 'pp-role'+chiefIdx, 'pprole'+chiefIdx, reasonsFn, plan.nominalIds);
        });
      });
    }
  } else if(type.mode==='dayNight'){
    wireSearch('ppSearchD','ppListD'); wireSearch('ppSearchN','ppListN'); wireSelectedSummary('ppListD'); wireSelectedSummary('ppListN');
  } else if(type.mode==='fixedSlots'){
    type.slots.forEach((_,i)=>{ wireSearch('ppSearchS'+i,'ppListS'+i); wireSelectedSummary('ppListS'+i); });
    modal.querySelectorAll('.pp-slot-on').forEach(cb=>{
      cb.onchange=()=>{
        const b=modal.querySelector(`[data-slot-body="${cb.dataset.slot}"]`);
        if(b) b.style.display=cb.checked?'block':'none';
      };
    });
    if(key==='patrol'){
      // 查哨的硬規則(同性別、至少1士官)是「已選的這幾個人之間」互相比較出來
      // 的，不是單看某個人的資格，所以用即時檢查取代靜態的 reasonsFn：每次
      // 勾選變動，就重新看這個時段目前勾了誰，有沒有違反硬規則。
      const isNCO=p=>rankCategory(p.rank)==='士官'||rankCategory(p.rank)==='軍官';
      type.slots.forEach((_,i)=>{
        const warnBox=document.createElement('div');
        warnBox.className='badge-issue'; warnBox.style.display='none'; warnBox.style.marginTop='6px';
        const listEl=modal.querySelector(`#ppListS${i}`);
        if(listEl) listEl.parentNode.insertBefore(warnBox, listEl.nextSibling);
        const refresh=()=>{
          const ids=[...modal.querySelectorAll(`.pp-slot${i}:checked`)].map(cb=>cb.value);
          const people=ids.map(id=>state.personnel.find(p=>p.id===id)).filter(Boolean);
          const msgs=[];
          if(people.length>=2){
            const genders=new Set(people.map(p=>p.gender).filter(Boolean));
            if(genders.size>1) msgs.push('⚠️ 目前選的人性別不同（查哨規則要求同性別配對）');
          }
          if(people.length>=1 && !people.some(isNCO)) msgs.push('⚠️ 目前選的人裡沒有士官（查哨規則要求至少1位士官）');
          if(msgs.length){ warnBox.innerHTML=msgs.join('<br>'); warnBox.style.display='block'; }
          else warnBox.style.display='none';
        };
        modal.querySelectorAll(`.pp-slot${i}`).forEach(cb=>{ cb.addEventListener('change', refresh); });
        refresh();
      });
    }
  }
  const collect=()=>{
    const support=(document.getElementById('ppSupport')||{}).value||'';
    if(type.mode==='people'){
      const groupBlocks = [...modal.querySelectorAll('.pp-group')];
      const groups = groupBlocks.map(b=>{
        const gi = b.dataset.groupIdx;
        const ids=[...modal.querySelectorAll('.pp-person'+gi+':checked')].map(cb=>cb.value);
        const nominalIds=[...modal.querySelectorAll('.pp-person'+gi+'-nom:checked')].map(cb=>cb.value).filter(id=>ids.includes(id));
        const supportEl=document.getElementById('ppSupport'+gi);
        return {
          personIds:ids, nominalIds, support:supportEl? supportEl.value : '',
          start:type.editableTime? getTimeSelectValue('ppT'+gi+'Start') : undefined,
          end:type.editableTime? getTimeSelectValue('ppT'+gi+'End') : undefined,
          restUntil:getTimeSelectValue('ppRest'+gi),
        };
      }).filter(g=>g.personIds.length || g.support);
      if(!groups.length) return null;
      return {groups};
    }
    if(type.mode==='roles'){
      const ids=type.roles.map((_,i)=>{
        const sel=modal.querySelector(`.pp-role${i}:checked`);
        return sel && sel.value? sel.value : undefined;
      });
      const notes=type.roles.map((_,i)=>{
        const el=document.getElementById('ppRoleNote'+i);
        return el? el.value.trim() : '';
      });
      const nominalIds=type.roles.map((_,i)=>{
        const nom=modal.querySelector(`.pp-role${i}-nom:checked`);
        return (nom && nom.checked && nom.value===ids[i])? ids[i] : null;
      }).filter(Boolean);
      if(!ids.some(Boolean) && !notes.some(Boolean) && !support) return null;
      return {personIds:ids, notes, nominalIds, support,
        start:type.editableTime? getTimeSelectValue('ppTStart') : undefined,
        end:type.editableTime? getTimeSelectValue('ppTEnd') : undefined,
        restUntil:getTimeSelectValue('ppRest')};
    }
    if(type.mode==='dayNight'){
      const dayIds=[...modal.querySelectorAll('.pp-day:checked')].map(cb=>cb.value);
      const nightIds=[...modal.querySelectorAll('.pp-night:checked')].map(cb=>cb.value);
      const dayNominalIds=[...modal.querySelectorAll('.pp-day-nom:checked')].map(cb=>cb.value).filter(id=>dayIds.includes(id));
      const nightNominalIds=[...modal.querySelectorAll('.pp-night-nom:checked')].map(cb=>cb.value).filter(id=>nightIds.includes(id));
      if(!dayIds.length && !nightIds.length && !support) return null;
      return {dayPersonIds:dayIds, nightPersonIds:nightIds, dayNominalIds, nightNominalIds, support,
        dayStart:getTimeSelectValue('ppDayTStart'), dayEnd:getTimeSelectValue('ppDayTEnd'),
        nightStart:getTimeSelectValue('ppNightTStart'), nightEnd:getTimeSelectValue('ppNightTEnd'),
        dayRestUntil:getTimeSelectValue('ppDayRest'), nightRestUntil:getTimeSelectValue('ppNightRest')};
    }
    if(type.mode==='fixedSlots'){
      const slots={};
      type.slots.forEach((_,i)=>{
        const on=modal.querySelector(`.pp-slot-on[data-slot="${i}"]`);
        if(!on||!on.checked) return;
        const ids=[...modal.querySelectorAll(`.pp-slot${i}:checked`)].map(cb=>cb.value);
        const nominalIds=[...modal.querySelectorAll(`.pp-slot${i}-nom:checked`)].map(cb=>cb.value).filter(id=>ids.includes(id));
        slots[i]={personIds:ids, nominalIds, restUntil:getTimeSelectValue('ppSlotRest'+i)};
      });
      if(!Object.keys(slots).length && !support) return null;
      return {slots, support};
    }
    return null;
  };
  document.getElementById('ppDelete').onclick=()=>{
    setPreplan(key, date, null);
    saveState(); close(); if(onSaved) onSaved();
  };
  document.getElementById('ppCopy').onclick=()=>{
    const value=collect();
    if(!value){ showAlert('這天還沒有填任何內容，沒有東西可以複製。'); return; }
    setPreplan(key, date, value); saveState();
    openPreplanCopyModal(key, date, ()=>{ close(); if(onSaved) onSaved(); });
  };
  document.getElementById('ppSave').onclick=()=>{
    const value=collect();
    setPreplan(key, date, value);
    // remember the shape (times / rest) so the next day opens pre-filled
    if(value){
      if(type.mode==='dayNight'){
        rememberPreplanDefaults(key,{dayStart:value.dayStart,dayEnd:value.dayEnd,
          nightStart:value.nightStart,nightEnd:value.nightEnd,
          dayRest:value.dayRestUntil,nightRest:value.nightRestUntil});
      } else if(type.mode==='fixedSlots'){
        const f={};
        Object.entries(value.slots||{}).forEach(([i,cfg])=>{ if(cfg && cfg.restUntil) f['slotRest'+i]=cfg.restUntil; });
        rememberPreplanDefaults(key,f);
      } else {
        rememberPreplanDefaults(key,{start:value.start,end:value.end,rest:value.restUntil});
      }
    }
    saveState(); close(); if(onSaved) onSaved();
  };
}
/* copy one day's plan onto other dates — the common "20th is the same as
   the 19th" case, without retyping */
function openPreplanCopyModal(key, fromDate, onDone){
  const type=PREPLAN_TYPES.find(t=>t.key===key);
  const ym=monthOf(fromDate);
  const total=daysInMonth(ym);
  const modal=document.createElement('div');
  modal.className='sheet-modal'; modal.style.zIndex='95';
  modal.innerHTML=`
    <div class="sheet-inner">
      <div class="section-title"><h2 style="margin:0">複製「${type.name} ${minguoLabel(fromDate)}」</h2><button class="ghost small" id="pcClose">關閉</button></div>
      <div class="hint" style="margin-bottom:8px">勾選要套用同樣內容的日期（會覆蓋那些日期原本的這個項目），或直接框一段日期範圍快速勾選。</div>
      <div class="row wrap" style="margin-bottom:8px">
        <div class="grow"><label>從</label><input type="date" id="pcRangeFrom"></div>
        <div class="grow"><label>到</label><input type="date" id="pcRangeTo"></div>
        <button class="ghost small" id="pcRangeApply" style="align-self:flex-end">套用範圍</button>
      </div>
      <div style="max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px">
        ${Array.from({length:total},(_,i)=>{
          const d=`${ym}-${String(i+1).padStart(2,'0')}`;
          if(d===fromDate) return '';
          const has=!!preplanFor(key,d);
          return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0">
            <input type="checkbox" class="pc-date" value="${d}" style="width:auto">
            ${minguoLabel(d)}${isHolidayDate(d)?' <span class="warn">假</span>':''}${has?' <span class="hint">（已有內容，會被覆蓋）</span>':''}
          </label>`;
        }).join('')}
      </div>
      <button class="primary" id="pcSave" style="width:100%">複製過去</button>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('pcClose').onclick=()=>{ modal.remove(); if(onDone) onDone(); };
  document.getElementById('pcRangeApply').onclick=()=>{
    const from=document.getElementById('pcRangeFrom').value, to=document.getElementById('pcRangeTo').value;
    if(!from||!to||from>to){ showAlert('請確認範圍正確'); return; }
    const range=new Set(dateRangeList(from,to));
    modal.querySelectorAll('.pc-date').forEach(cb=>{ if(range.has(cb.value)) cb.checked=true; });
  };
  document.getElementById('pcSave').onclick=()=>{
    const dates=[...modal.querySelectorAll('.pc-date:checked')].map(cb=>cb.value);
    if(!dates.length){ showAlert('請至少勾選一個日期'); return; }
    const src=preplanFor(key, fromDate);
    dates.forEach(d=>setPreplan(key, d, JSON.parse(JSON.stringify(src))));
    saveState();
    showAlert(`已複製到 ${dates.length} 個日期。`);
    modal.remove(); if(onDone) onDone();
  };
}
/* 休假暨事故大表: pick a person, then tick every day they're off — the reverse of
   the per-day editors, matching how leave is actually decided (per person,
   for a stretch of days). Stored per person; import turns each ticked day
   into a proper leave block with buffers. */
/* is this person listed on a 留守 block covering the given date? Used so the
   leave calendar and the standby planner stay in sync in both directions —
   whichever you fill in first, the other one shows it. */
function standbyStatusFor(personId, date){
  const owner = preplanOwnerFor('standby', date);
  if(!owner) return null;
  return (owner.plan.personIds||[]).includes(personId)? 'staying' : 'off';
}
/* groups the ticked dates into consecutive runs and works out, per run,
   whether it needs someone's approval to keep its length. Only categories
   with fiveDayRule even have a cap — 受訓/住院 etc. routinely run well
   past 5 days for legitimate reasons, so a category can opt out entirely
   rather than needing approval every single time. The unit (for
   categories that DO have the rule) is effective days, not calendar days:
   the buffer itself never counts (前一天18:00起不多算一天), but starting
   the buffer at 12:00 instead (榮譽假) adds half a day, since that's an
   extra 6 hours of time off the normal 18:00 start doesn't give. Checked
   by exact (start,end) so shrinking or growing an already-approved run
   always asks again rather than silently inheriting an approval that
   covered a different length. */
function analyzeLeaveRuns(pickedSet, honorSet, approvedRuns, category){
  const dates=[...pickedSet].sort();
  const approved = approvedRuns||[];
  const runs=[];
  if(!dates.length) return runs;
  let runStart=dates[0], prev=dates[0];
  const push=(end)=>{
    const actualDays=daysBetweenInclusive(runStart, end); // 實際勾選天數，不含前後緩衝
    const isHonor=category&&category.honorOption&&honorSet.has(runStart);
    const effectiveDays = actualDays + (isHonor? 0.5 : 0);
    const needsApproval = !!(category&&category.fiveDayRule) && effectiveDays>5;
    const isApproved = approved.some(r=>r.start===runStart && r.end===end);
    runs.push({start:runStart, end, actualDays, effectiveDays, isHonor, needsApproval, isApproved});
  };
  for(let i=1;i<dates.length;i++){
    if(dates[i]===nextDateStr(prev)){ prev=dates[i]; continue; }
    push(prev); runStart=dates[i]; prev=dates[i];
  }
  push(prev);
  return runs;
}
function leaveRunWarnings(pickedSet, honorSet, approvedRuns, category){
  return analyzeLeaveRuns(pickedSet, honorSet, approvedRuns, category).filter(r=>r.needsApproval).map(r=>{
    const dayLabel = Number.isInteger(r.effectiveDays)? `${r.effectiveDays}天` : `${r.effectiveDays}天（榮譽假12:00起算多算0.5天）`;
    if(r.isApproved){
      return `✅ ${minguoLabel(r.start)}~${minguoLabel(r.end)}（${dayLabel}）已經過同意，維持這個天數。`;
    }
    return `⚠️ ${minguoLabel(r.start)}~${minguoLabel(r.end)}（${dayLabel}）超過5天上限，按「確認」時需要再確認同意才能保留這個天數。`;
  });
}

/* 收假提早：選一個日期（某段假期原本該0730收假的那個隔天），列出這天原

            return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)">

function openLeaveTableEditor(date, onSaved, presetPid){
  let ym = monthOf(date);
  let selectedPid = presetPid || null;
  let selectedCat = '休假';
  let picked = new Set();       // full-day dates ticked in the current month, current category
  let honorDates = new Set();   // subset of picked that are 榮譽假（最寬鬆，前一天12:00起）— only meaningful if category.honorOption
  let partialDates = new Map(); // date -> {start,end} — this day only, not a full day, no buffer even if the category has one
  let noteDraft = ''; // 備註——只有沒有前後緩衝的類型(受訓/出國/懷孕/住院/事假/其他事故)才有這個欄位，整個類型這次編輯共用一則備註，不分段
  /* switching categories used to reload straight from the SAVED store,
     which silently discarded whatever you'd just tapped for the category
     you were leaving if you hadn't hit 確認 yet — so the merged calendar
     never showed a category you were still mid-editing, making it look
     like merging wasn't happening at all. This keeps an in-memory (not
     yet persisted) draft per category for the current person, so tapping
     through several categories in one sitting builds up visibly on the
     calendar even before you save each one; 確認 still only ever commits
     the currently-selected category to state.preplan.leave. Resets
     whenever you switch to a different person, since drafts are scoped
     to "what you're mid-editing for this person right now". */
  let sessionDrafts = {}; // catName -> {picked:Set, honorDates:Set, partialDates:Map}
  const modal=document.createElement('div');
  modal.className='fullscreen-modal'; modal.style.zIndex='93';
  const store=()=>state.preplan.leave||{};
  const categoryOf=(name)=>state.leaveCategories.find(c=>c.name===name);
  const catRec=(pid,cat)=>((store()[pid]||{})[cat])||{dates:[],honorDates:[],approvedRuns:[],partialTimes:{}};
  /* 休假暨事故大表 is the ONLY place 不在營 gets edited now — but a block can also
     come from elsewhere (an older import, a manually-registered incident
     that happens to carry a leaveId) without ever being entered here. If
     that happens the calendar would silently disagree with what's actually
     in effect, so on every load this pulls in any leaveId-linked dates for
     the selected person+category that aren't already reflected in the plan
     and merges them in — the calendar always shows what's really scheduled. */
  const scanForOrphaned=(pid,cat)=>{
    if(!pid) return;
    const category=categoryOf(cat);
    const rec = catRec(pid,cat);
    const known = new Set(rec.dates||[]);
    const found = new Set();
    const foundHonor = new Set();
    const relevantReasons = category&&category.honorOption? [cat,'榮譽假'] : [cat];
    Object.entries(state.unavail).forEach(([d,arr])=>{
      (arr||[]).forEach(u=>{
        if(u.personId===pid && u.leaveId && u.allDay && relevantReasons.includes(u.reason)){
          found.add(d);
          if(u.reason==='榮譽假') foundHonor.add(d);
        }
      });
    });
    let changed=false;
    found.forEach(d=>{ if(!known.has(d)){ known.add(d); changed=true; } });
    if(changed){
      if(!state.preplan.leave) state.preplan.leave={};
      if(!state.preplan.leave[pid]) state.preplan.leave[pid]={};
      const mergedHonor=new Set([...(rec.honorDates||[]), ...foundHonor]);
      state.preplan.leave[pid][cat]={dates:[...known].sort(), honorDates:[...mergedHonor].sort(), approvedRuns:rec.approvedRuns||[], partialTimes:rec.partialTimes||{}};
    }
  };
  const saveDraftForCurrentCat=()=>{
    if(!selectedPid) return;
    sessionDrafts[selectedCat] = {picked:new Set(picked), honorDates:new Set(honorDates), partialDates:new Map(partialDates), noteDraft};
  };
  /* 有沒有還沒按「確認」存進去的變更——包含目前正在編輯的這個類型（picked/
     honorDates/partialDates/noteDraft 都是本地變數，不會自動存檔），也
     包含本次session切換過但還沒存的其他類型草稿（sessionDrafts）。用來在
     關閉前提醒，避免點一點就以為存了、結果一離開全部消失。 */
  const hasUnsavedChanges=()=>{
    if(!selectedPid) return false;
    const catsToCheck = new Set([selectedCat, ...Object.keys(sessionDrafts)]);
    for(const cat of catsToCheck){
      const live = cat===selectedCat? {picked, honorDates, partialDates, noteDraft} : sessionDrafts[cat];
      if(!live) continue;
      const rec = catRec(selectedPid, cat);
      const recDates=new Set((rec.dates||[]).filter(d=>d.startsWith(ym)));
      const recHonor=new Set((rec.honorDates||[]).filter(d=>d.startsWith(ym)));
      const recPartial=new Map(Object.entries(rec.partialTimes||{}).filter(([d])=>d.startsWith(ym)));
      const setsDiffer=(a,b)=> a.size!==b.size || [...a].some(x=>!b.has(x));
      if(setsDiffer(live.picked, recDates)) return true;
      if(setsDiffer(live.honorDates, recHonor)) return true;
      if(live.partialDates.size!==recPartial.size) return true;
      for(const [d,t] of live.partialDates){
        const rt=recPartial.get(d);
        if(!rt || rt.start!==t.start || rt.end!==t.end) return true;
      }
      if((live.noteDraft||'')!==(rec.note||'')) return true;
    }
    return false;
  };
  const loadPerson=()=>{
    // full reset — used when switching to a different person, or on first
    // open, where any in-progress draft belongs to the OLD person and
    // shouldn't carry over
    sessionDrafts = {};
    scanForOrphaned(selectedPid, selectedCat);
    const rec=catRec(selectedPid, selectedCat);
    picked = new Set((rec.dates||[]).filter(d=>d.startsWith(ym)));
    honorDates = new Set((rec.honorDates||[]).filter(d=>picked.has(d)));
    partialDates = new Map(Object.entries(rec.partialTimes||{}).filter(([d])=>d.startsWith(ym)));
    noteDraft = rec.note||'';
  };
  const loadCategory=(cat)=>{
    // switching categories for the SAME person — prefer this session's
    // unsaved draft for that category if there is one, so taps made
    // before hitting 確認 aren't silently lost when you switch away
    scanForOrphaned(selectedPid, cat);
    if(sessionDrafts[cat]){
      picked = new Set(sessionDrafts[cat].picked);
      honorDates = new Set(sessionDrafts[cat].honorDates);
      partialDates = new Map(sessionDrafts[cat].partialDates);
      noteDraft = sessionDrafts[cat].noteDraft||'';
      return;
    }
    const rec=catRec(selectedPid, cat);
    picked = new Set((rec.dates||[]).filter(d=>d.startsWith(ym)));
    honorDates = new Set((rec.honorDates||[]).filter(d=>picked.has(d)));
    partialDates = new Map(Object.entries(rec.partialTimes||{}).filter(([d])=>d.startsWith(ym)));
    noteDraft = rec.note||'';
  };
  if(selectedPid) loadPerson();
  const draw=()=>{
    const person = selectedPid? state.personnel.find(p=>p.id===selectedPid) : null;
    const category = categoryOf(selectedCat);
    const [y,m]=ym.split('-').map(Number);
    const total=daysInMonth(ym);
    const firstDow=new Date(y,m-1,1).getDay();
    // every category's picked/honor/partial data for this person this month
    // — the currently-selected one from live local state, everything else
    // from this session's draft if there is one, else the persisted record.
    // Buffer preview is computed for EVERY category that has one, not just
    // the selected category, so switching categories never makes an
    // already-ticked category's buffer preview disappear from view.
    const categoryDataFor = (catName)=>{
      if(catName===selectedCat) return {picked, honorDates, partialDates, noteDraft};
      if(sessionDrafts[catName]) return sessionDrafts[catName];
      const rec=catRec(selectedPid, catName);
      return {
        picked: new Set((rec.dates||[]).filter(d=>d.startsWith(ym))),
        honorDates: new Set((rec.honorDates||[]).filter(d=>d.startsWith(ym))),
        partialDates: new Map(Object.entries(rec.partialTimes||{}).filter(([d])=>d.startsWith(ym))),
        noteDraft: rec.note||'',
      };
    };
    const bufferPreviewFor = (cat, pickedSet)=>{
      const preview={};
      if(!cat || !cat.buffer || !pickedSet.size) return preview;
      const sorted=[...pickedSet].sort();
      let runStart=sorted[0], prev=sorted[0];
      const flush=(end)=>{
        preview[prevDateStr(runStart)]='front';
        preview[nextDateStr(end)]='back';
      };
      for(let i=1;i<sorted.length;i++){
        if(sorted[i]===nextDateStr(prev)){ prev=sorted[i]; continue; }
        flush(prev); runStart=sorted[i]; prev=sorted[i];
      }
      flush(prev);
      return preview;
    };
    const allCatInfo = person? state.leaveCategories.map(c=>{
      const data=categoryDataFor(c.name);
      return {cat:c, data, buf:bufferPreviewFor(c, data.picked)};
    }) : [];
    const cells=[];
    for(let i=0;i<firstDow;i++) cells.push('<div class="cal-cell empty"></div>');
    for(let d=1;d<=total;d++){
      const ds=`${ym}-${String(d).padStart(2,'0')}`;
      const hol = isHolidayDate(ds);
      const sb = person? standbyStatusFor(person.id, ds) : null;
      // one fragment per category that has anything on this day — every
      // one gets shown, none summarized away behind a "+N"
      const fragments=[];
      allCatInfo.forEach(({cat, data, buf})=>{
        if(data.partialDates.has(ds)){
          const pt=data.partialDates.get(ds);
          fragments.push({text:`${cat.name.slice(0,1)}${pt.start}-${pt.end}`, cls:'leave-partial-marked'});
        } else if(data.picked.has(ds)){
          const isHonor=data.honorDates.has(ds);
          const label = isHonor? '12'+cat.name.slice(0,1) : cat.name.slice(0,2);
          fragments.push({text: label, cls:'has'});
        } else if(buf[ds]){
          fragments.push({text:`${cat.name.slice(0,1)}緩衝${buf[ds]==='front'?'前':'後'}`, cls:'leave-partial-marked'});
        }
      });
      let mark, cls;
      if(fragments.length){
        mark = fragments.map(f=>f.text).join('・');
        cls = fragments.some(f=>f.cls==='has')? 'has' : 'leave-partial-marked';
      } else if(sb==='staying'){
        mark = '留守';
        cls = 'standby-marked';
      } else {
        mark=''; cls='';
      }
      cells.push(`<div class="cal-cell ${cls} ${hol?'holiday':''}" data-lt-date="${ds}">
        <div class="cal-day">${d}</div><div class="cal-mark">${mark}</div>
      </div>`);
    }
    const allDates=(catRec(selectedPid,selectedCat).dates||[]);
    const prominentCats=state.leaveCategories.filter(c=>c.prominent);
    const otherCats=state.leaveCategories.filter(c=>!c.prominent);
    modal.innerHTML=`
      <div class="section-title"><h2 style="margin:0">🏖️ 休假暨事故大表</h2><button class="ghost small" id="ltClose">關閉</button></div>
      <div class="hint" style="margin-bottom:8px">先選人、選類型，再點月曆登記那個類型的日子——月曆會同時顯示這個人這個月所有類型的記錄，但點擊只會動到目前選中的類型。有緩衝的類型（例如休假）點一天等於前後多算半天到一天，畫面上會用虛線框預覽緩衝落在哪一天；沒有緩衝的類型（例如受訓）就是單純整天登記。</div>
      <div class="hint" style="margin-bottom:4px">類型（點哪個就切換到那個類型繼續操作）</div>

        ${prominentCats.map(c=>`<button class="${c.name===selectedCat?'primary':'ghost'} small lt-cat-btn" data-lt-cat="${esc(c.name)}">${esc(c.name)}</button>`).join('')}
        ${otherCats.length? otherCats.map(c=>`<button class="${c.name===selectedCat?'primary':'ghost'} small lt-cat-btn" data-lt-cat="${esc(c.name)}" style="opacity:.75">${esc(c.name)}</button>`).join('') : ''}
        <button class="ghost small" id="ltNewCat">＋新增類型</button>
      </div>
      <div class="row wrap" style="margin-bottom:6px">
        <div class="grow"><label>搜尋姓名</label><input type="text" id="ltSearch" placeholder="輸入姓名關鍵字"></div>
      </div>
      <div id="ltPeople" style="max-height:22vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px">
        ${state.personnel.slice().sort((a,b)=>groupIndex(a.group)-groupIndex(b.group)||rankIndex(a.rank)-rankIndex(b.rank))
          .map(p=>{
            const catCounts = state.leaveCategories.map(c=>{
              const rec=catRec(p.id, c.name);
              const cnt=(rec.dates||[]).filter(d=>d.startsWith(ym)).length + Object.keys(rec.partialTimes||{}).filter(d=>d.startsWith(ym)).length;
              return {name:c.name, cnt};
            }).filter(x=>x.cnt>0);
            const totalCnt = catCounts.reduce((s,x)=>s+x.cnt,0);
            const summary = catCounts.length? ` <span class="ok">${catCounts.map(x=>`${x.name.slice(0,1)}${x.cnt}`).join('・')}（共${totalCnt}天）</span>` : '';
            return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0">
              <input type="radio" name="ltp" class="lt-person" value="${p.id}" style="width:auto" ${p.id===selectedPid?'checked':''}>
              ${esc(p.name)}（${p.group||'未分組'}·${p.rank}）${summary}
            </label>`;
          }).join('')}
      </div>
      ${person? `
        <div class="row" style="gap:6px;align-items:center;margin-bottom:6px">
          <button class="ghost small" id="ltPrev">◀</button>
          <span class="grow" style="text-align:center;font-weight:600">${esc(person.name)}・${esc(selectedCat)}　民國${y-1911}年${m}月<br><span class="hint">本類型本月整天 ${picked.size} 天${partialDates.size?`・部分時段 ${partialDates.size} 天`:''}・累計 ${allDates.length} 天</span></span>
          <button class="ghost small" id="ltNext">▶</button>
        </div>
        <div class="cal-grid" style="margin-bottom:6px">
          ${['日','一','二','三','四','五','六'].map(w=>`<div class="cal-head">${w}</div>`).join('')}
          ${cells.join('')}
        </div>
        ${leaveRunWarnings(
            new Set([...(catRec(selectedPid,selectedCat).dates||[]).filter(d=>!d.startsWith(ym)), ...picked]),
            new Set([...(catRec(selectedPid,selectedCat).honorDates||[]).filter(d=>!d.startsWith(ym)), ...honorDates]),
            catRec(selectedPid,selectedCat).approvedRuns||[],

          ).map(w=>`<div class="${w.startsWith('✅')?'hint':'badge-issue'}">${esc(w)}</div>`).join('')}
        <div class="hint" style="margin-bottom:8px">
          ${category&&category.buffer? `這個類型有前後緩衝：點一天＝整天登記（前一天18:00起）${category.honorOption?'；再點一次＝榮譽假（前一天12:00起，比一般多算0.5天）；再點一次取消。':'；再點一次取消。'}虛線框是緩衝預覽，時間可以在右上角⚙️「我們的規則」調整。如果某段假期因為任務/處罰需要更晚才開始休假、或提早收假，用下面「特殊狀況調整」的「⏰開始延後」「↩️收假提早」個別調整那一段。` : `這個類型沒有前後緩衝，點一天就是那天整天不可排，再點一次取消。`}
          ${category&&category.fiveDayRule? ' 超過5天（含緩衝的有效天數）需要同意才能保留。' : ''}
          「留守」＝留守表已排他這天留守，跟這裡無關聯除非你也點成這個類型。虛線框的部分時段格子點一下會直接刪除。
        </div>
        ${category && !category.buffer? `
        <div class="row wrap" style="margin-bottom:8px">
          <div class="grow"><label>備註（這個類型這次登記的具體原因，例如「出車支援○○任務」「體檢」）</label>
            <textarea id="ltNote" rows="2" placeholder="不填也可以，純粹方便之後查閱">${esc(noteDraft)}</textarea>
          </div>
        </div>` : ''}
        <div class="row wrap" style="margin-bottom:8px">
          <button class="ghost grow" id="ltClearMonth">清空本月（此類型）</button>
          <button class="primary grow" id="ltSave">確認</button>
        </div>
        <div class="divider"></div>
        <div class="hint" style="margin-bottom:4px">不到一天的部分時段（用輸入的方式新增；已新增的可以直接點月曆上的格子刪除，或用下面的刪除按鈕）</div>
        <div class="row wrap" style="margin-bottom:6px">
          <div class="grow"><label>日期</label><input type="date" id="ltPartialDate" value="${ym}-01" min="${ym}-01" max="${ym}-${String(daysInMonth(ym)).padStart(2,'0')}"></div>
        </div>
        <div class="row wrap" style="margin-bottom:6px">
          <div class="grow"><label>開始</label>${timeSelectHTML('ltPartialStart','08:00')}</div>
          <div class="grow"><label>結束</label>${timeSelectHTML('ltPartialEnd','12:00')}</div>
        </div>
        <button class="ghost" id="ltAddPartial" style="width:100%;margin-bottom:8px">＋新增部分時段</button>
        ${partialDates.size? [...partialDates.entries()].sort().map(([d,t])=>`
          <div class="list-item">
            <span class="grow">${minguoLabel(d)}：${t.start}-${t.end}</span>
            <button class="ghost small danger" data-lt-del-partial="${d}">刪除</button>
          </div>`).join('') : ''}
      ` : `<div class="empty">請先選擇一位人員</div>`}
      <div class="divider"></div>
      <button class="primary" id="ltImport" style="width:100%">📥 匯入本月到實際班表（全部類型）</button>
      <button class="ghost" id="ltCheckpoint" style="width:100%;margin-top:6px">📌 存檔點</button>
      <div class="hint">連續的日子會自動合併成一段。重複匯入不會疊加。會處理這個月所有人員、所有類型。</div>
      <div class="divider"></div>
      <h3>特殊狀況調整（少數人因任務/處罰需要跟一般緩衝不一樣）</h3>
      <button class="ghost" id="ltDelayedStart" style="width:100%;margin-bottom:6px">⏰ 開始延後（這天才開始休假的人，改成更晚才不可排）</button>
      <button class="ghost" id="ltEarlyReturn" style="width:100%">↩️ 收假提早（最後一天真的提早結束，改成前一天24:00收假）</button>
      <div class="divider"></div>
      ${(()=>{
        const seen=new Set(); const blocks=[];
        Object.keys(state.unavail).sort().forEach(d=>{
          (state.unavail[d]||[]).forEach(u=>{
            if(u.leaveId && !seen.has(u.leaveId)){
              seen.add(u.leaveId);
              blocks.push({leaveId:u.leaveId, personId:u.personId, reason:u.reason, start:u.leaveStart||d, end:u.leaveEnd||d});
            }
          });
        });
        // 展開後看不完303筆一行一行的清單沒有用——改成依人整理，每個人的所有
        // 記錄濃縮成一行文字，一眼就能看完這個人這陣子的狀況
        const shortDate = ds=>{ const [,m,d]=ds.split('-').map(Number); return `${m}/${d}`; };
        const blockText = (b)=>{
          // 找出這個leaveId所有相關entries，取得最早跟最晚的時間，判斷有沒有緩衝
          const allEntries=[];
          Object.entries(state.unavail).forEach(([d,arr])=>{
            (arr||[]).forEach(u=>{ if(u.leaveId===b.leaveId) allEntries.push({date:d, ...u}); });
          });
          allEntries.sort((x,y)=>x.date.localeCompare(y.date) || (x.start||'').localeCompare(y.start||''));
          const first=allEntries[0], last=allEntries[allEntries.length-1];
          const hasBuffer = first && last && (!first.allDay || !last.allDay);
          const noteEntry = allEntries.find(u=>u.note);
          const noteSuffix = noteEntry? `（${noteEntry.note}）` : '';
          if(hasBuffer){
            return `${shortDate(first.date)} ${first.start}-${shortDate(last.date)} ${last.end}${b.reason}${noteSuffix}`;
          }

        };
        const byPerson={};
        blocks.forEach(b=>{ if(!byPerson[b.personId]) byPerson[b.personId]=[]; byPerson[b.personId].push(b); });
        const personLines = Object.entries(byPerson).map(([pid,pblocks])=>{
          pblocks.sort((a,b)=>a.start.localeCompare(b.start));
          return {pid, text: pblocks.map(blockText).join('，'), firstCat: pblocks[0].reason==='榮譽假'?'休假':pblocks[0].reason};
        }).sort((a,b)=>personName(a.pid).localeCompare(personName(b.pid), 'zh-Hant'));
        const inner = personLines.length? personLines.map(pl=>`
          <div class="list-item" style="align-items:flex-start">
            <span class="grow">${esc(personName(pl.pid))}：${esc(pl.text)}</span>
            <button class="ghost small" data-lt-goto="${pl.pid}" data-lt-goto-cat="${esc(pl.firstCat)}">去改</button>
          </div>`).join('') : `<div class="empty">目前沒有已生效的記錄</div>`;
        return collapsibleCardHTML('ltCurrentBlocks', `目前已生效的不在營記錄（${blocks.length}筆，${personLines.length}人）`, inner);
      })()}`;
    modal.querySelector('#ltClose').onclick=()=>{
      if(hasUnsavedChanges()){
        showConfirm('有幾個項目點過還沒按「確認」存檔，關閉的話這些改動會不見。確定要直接關閉嗎？', ()=>modal.remove());

      }

    };

      ()=>state.preplan.leave||{},
      (data)=>{ state.preplan.leave=data; loadPerson(); draw(); });
    modal.querySelector('#ltDelayedStart').onclick=()=>openDelayedStartModal(ym+'-01', ()=>{ if(selectedPid) loadPerson(); draw(); });
    modal.querySelector('#ltEarlyReturn').onclick=()=>openEarlyReturnModal(ym+'-01', ()=>{ if(selectedPid) loadPerson(); draw(); });
    modal.querySelectorAll('.lt-cat-btn').forEach(b=>{
      b.onclick=()=>{ saveDraftForCurrentCat(); selectedCat=b.dataset.ltCat; loadCategory(selectedCat); draw(); };
    });
    modal.querySelector('#ltNewCat').onclick=()=>{
      openNewLeaveCategoryModal(()=>{ draw(); });
    };
    modal.querySelectorAll('[data-lt-goto]').forEach(b=>{
      b.onclick=()=>{ selectedPid=b.dataset.ltGoto; selectedCat=b.dataset.ltGotoCat||'休假'; loadPerson(); draw(); };
    });
    modal.querySelectorAll('[data-lt-del-block]').forEach(b=>{
      b.onclick=()=>{
        showConfirm('確定要刪除這整段記錄嗎？', ()=>{
          const leaveId=b.dataset.ltDelBlock;
          // find which person/category/dates this block covers before it's

          let ownerPid=null, ownerReason=null, blockDates=[];
          Object.entries(state.unavail).forEach(([d,arr])=>{
            (arr||[]).forEach(u=>{ if(u.leaveId===leaveId){ ownerPid=u.personId; ownerReason=u.reason; if(u.allDay) blockDates.push(d); } });
          });
          deleteLeaveById(leaveId);
          const ownerCat = ownerReason==='榮譽假'? '休假' : ownerReason;
          if(ownerPid && ownerCat && state.preplan.leave && state.preplan.leave[ownerPid] && state.preplan.leave[ownerPid][ownerCat]){
            const rec=state.preplan.leave[ownerPid][ownerCat];
            rec.dates=(rec.dates||[]).filter(d=>!blockDates.includes(d));
            if(rec.honorDates) rec.honorDates=rec.honorDates.filter(d=>!blockDates.includes(d));
            if(!rec.dates.length) delete state.preplan.leave[ownerPid][ownerCat];
          }
          saveState();
          if(selectedPid) loadPerson();
          draw();
        });
      };
    });
    const se=modal.querySelector('#ltSearch'), le=modal.querySelector('#ltPeople');
    se.oninput=()=>{

      le.querySelectorAll('label').forEach(l=>{ l.style.display=(!term||l.textContent.includes(term))?'flex':'none'; });
    };
    keepSearchFocusOnPick(le, se);
    modal.querySelectorAll('.lt-person').forEach(r=>{
      r.onchange=()=>{ selectedPid=r.value; loadPerson(); draw(); };
    });
    modal.querySelector('#ltImport').onclick=()=>{
      const st=store();
      let totalDays=0;

      if(!totalDays){ showAlert('本月還沒有排任何不在營記錄。'); return; }
      showConfirm(`確定要把本月已排的 ${totalDays} 人日（所有類型）依連續日期自動合併並匯入實際班表嗎？每個人每個類型在這個月範圍內原本的紀錄會被清除重建（不會疊加），範圍外不受影響。`, ()=>{
        const {count,downgraded}=importLeaveTable(ym);

        let msg=`已建立 ${count} 段。`;
        if(downgraded.length){
          msg+=`\n\n⚠️ 有 ${downgraded.length} 段因為超過5天，榮譽假已自動退回一般休假（18:00起）：\n`
             + downgraded.slice(0,8).map(d=>`・${d.name}：${minguoLabel(d.start)}~${minguoLabel(d.end)}`).join('\n')
             + (downgraded.length>8? `\n…還有 ${downgraded.length-8} 段`:'');
        }
        showAlert(msg);
        render(); draw();
      });
    };
    modal.querySelectorAll('[data-lt-del-partial]').forEach(b=>{
      b.onclick=()=>{ partialDates.delete(b.dataset.ltDelPartial); draw(); };
    });
    if(modal.querySelector('#ltAddPartial')){
      modal.querySelector('#ltAddPartial').onclick=()=>{
        const d=document.getElementById('ltPartialDate').value;
        if(!d || !d.startsWith(ym)){ showAlert('請選擇這個月份內的日期'); return; }
        if(picked.has(d)){ showAlert('這天已經是整天登記，請先在月曆上點掉那天再新增部分時段。'); return; }
        const start=getTimeSelectValue('ltPartialStart'), end=getTimeSelectValue('ltPartialEnd');
        partialDates.set(d, {start,end});
        draw();
      };
    }
    if(person){
      modal.querySelectorAll('[data-lt-date]').forEach(c=>{
        c.onclick=()=>{
          const ds=c.dataset.ltDate;
          if(partialDates.has(ds)){
            // 虛線框的部分時段格子：點一下直接刪除
            partialDates.delete(ds);
          } else if(picked.has(ds) && category && category.honorOption && !honorDates.has(ds)){
            // 整天 → 榮譽假（只有有榮譽假選項的類型，例如休假）
            honorDates.add(ds);
          } else if(picked.has(ds)){
            // 整天（或榮譽假）格子：再點一下直接刪除
            picked.delete(ds); honorDates.delete(ds);
          } else {
            // 空白格子：點一下＝整天登記
            picked.add(ds);
          }
          draw();
        };
      });
      modal.querySelector('#ltPrev').onclick=()=>{ ym=shiftMonth(ym,-1); preplanMonth=ym; loadPerson(); draw(); };
      modal.querySelector('#ltNext').onclick=()=>{ ym=shiftMonth(ym,1); preplanMonth=ym; loadPerson(); draw(); };
      modal.querySelector('#ltClearMonth').onclick=()=>{ picked=new Set(); honorDates=new Set(); partialDates=new Map(); draw(); };
      { const noteEl = modal.querySelector('#ltNote'); if(noteEl) noteEl.oninput=(e)=>{ noteDraft=e.target.value; }; }
      modal.querySelector('#ltSave').onclick=()=>{
        const rec=catRec(selectedPid,selectedCat);
        const curDates=(rec.dates||[]).filter(d=>!d.startsWith(ym));
        const curHonor=(rec.honorDates||[]).filter(d=>!d.startsWith(ym));
        const curApproved=rec.approvedRuns||[];
        const curPartial=Object.fromEntries(Object.entries(rec.partialTimes||{}).filter(([d])=>!d.startsWith(ym)));
        const mergedDates=[...curDates, ...picked].sort();
        const mergedHonor=[...curHonor, ...honorDates].sort();
        const mergedPartial={...curPartial, ...Object.fromEntries(partialDates)};
        const runs = analyzeLeaveRuns(new Set(mergedDates), new Set(mergedHonor), curApproved, category);
        const unapproved = runs.filter(r=>r.needsApproval && !r.isApproved);
        const doSave=(approvedRuns)=>{
          if(!state.preplan.leave) state.preplan.leave={};
          if(!state.preplan.leave[selectedPid]) state.preplan.leave[selectedPid]={};
          if(mergedDates.length || Object.keys(mergedPartial).length) state.preplan.leave[selectedPid][selectedCat]={dates:mergedDates, honorDates:mergedHonor, approvedRuns, partialTimes:mergedPartial, note:noteDraft.trim()};
          else delete state.preplan.leave[selectedPid][selectedCat];
          delete sessionDrafts[selectedCat]; // now persisted — the draft shadow is no longer needed
          saveState();
          showAlert(`已儲存 ${person.name} 的${selectedCat}（本月整天 ${picked.size} 天${category&&category.honorOption?`，其中榮譽假 ${honorDates.size} 天`:''}${partialDates.size?`，部分時段 ${partialDates.size} 天`:''}）。`);
          draw(); if(onSaved) onSaved();
        };
        if(unapproved.length){
          const lines = unapproved.map(r=>`${minguoLabel(r.start)}~${minguoLabel(r.end)}（${r.effectiveDays}天${r.isHonor?'，含榮譽假0.5天':''}）`);
          showConfirm(`以下這幾段超過天數上限，需要同意才能保留：\n${lines.join('\n')}\n\n確定已經過同意，要保留這個天數嗎？不同意的話請先縮短天數再儲存。`, ()=>{
            const newlyApproved = unapproved.map(r=>({start:r.start, end:r.end}));
            doSave([...curApproved, ...newlyApproved]);
          });
        } else {
          doSave(curApproved);
        }
      };
    }
  };
  document.body.appendChild(modal);
  draw();
}
/* writes one day's plan for one duty type into the real schedule, replacing
   whatever that same duty currently holds on that date (other duties on
   that date are untouched). Returns true if anything was written. */
function importPreplanForDate(key, date){
  const type = PREPLAN_TYPES.find(t=>t.key===key);
  if(!type) return false;
  const plan = preplanFor(key, date);
  if(!plan){
    // nothing planned for this day — for the 7 regular day-keyed types this
    // still means "clear whatever this role wrote here before" so a
    // whole-month reimport after deleting a day's plan actually removes the
    // stale entry instead of leaving it behind forever. 留守 is excluded:
    // its "date" is a block's anchor, not a per-day slot, so a blank anchor
    // here is normal for most days and clearing on it would be wrong.
    if(key!=='standby' && state.misc[date]){
      const roleName = type.presetRole || type.name;
      const before = state.misc[date].length;
      state.misc[date] = state.misc[date].filter(m=>m.role!==roleName);
      return state.misc[date].length!==before;
    }
    return false;
  }
  const preset = type.presetRole? state.miscPresets.find(p=>p.role===type.presetRole) : null;
  if(!state.misc[date]) state.misc[date]=[];
  const roleName = type.presetRole || type.name;
  if(key==='standby'){
    /* A 留守 block spans several days and writes to all of them at once:
       - non-standby people get leave for the whole block (from the leave
         start time the day before, through the block, to the end time the
         day after) — same shape as a normal leave block so all the usual
         availability logic applies
       - standby people get their sub-duty assignments written as 其他勤務
       - per-person overrides shorten either end for that individual
       The `date` argument is the block's anchor (the key it's stored
       under); everything is driven off plan.startDate/endDate. */
    const blockDates = dateRangeList(plan.startDate, plan.endDate);
    const dayBefore = prevDateStr(plan.startDate);
    const dayAfter  = nextDateStr(plan.endDate);
    const keep = new Set(plan.personIds||[]);
    const TAG='休假（留守期間非留守人員）';
    // clear anything this block wrote before, so re-import is idempotent
    [dayBefore, ...blockDates, dayAfter].forEach(d=>{
      if(state.unavail[d]) state.unavail[d]=state.unavail[d].filter(u=>u.reason!==TAG);
    });
    state.personnel.forEach(p=>{
      if(keep.has(p.id)) return;
      const startT = plan.leaveStartTime||state.unitRules.standbyDefaults.leaveStartTime;
      const endT = plan.endTime||state.unitRules.standbyDefaults.endTime;
      if(!state.unavail[dayBefore]) state.unavail[dayBefore]=[];
      state.unavail[dayBefore].push({id:uid(),personId:p.id,allDay:false,start:startT,end:'24:00',reason:TAG});
      blockDates.forEach(d=>{
        if(!state.unavail[d]) state.unavail[d]=[];
        state.unavail[d].push({id:uid(),personId:p.id,allDay:true,start:'',end:'',reason:TAG});
      });
      if(!state.unavail[dayAfter]) state.unavail[dayAfter]=[];
      state.unavail[dayAfter].push({id:uid(),personId:p.id,allDay:false,start:'00:00',end:endT,reason:TAG});
    });
    // per-person overrides: someone leaving early is unavailable from then on
    Object.entries(plan.overrides||{}).forEach(([pid, ov])=>{
      if(!keep.has(pid)) return;
      if(ov.end){
        const last = blockDates[blockDates.length-1];
        if(!state.unavail[last]) state.unavail[last]=[];
        state.unavail[last].push({id:uid(),personId:pid,allDay:false,start:ov.end,end:'24:00',reason:'留守提早離營'});
      }
      if(ov.start){
        if(!state.unavail[dayBefore]) state.unavail[dayBefore]=[];
        state.unavail[dayBefore].push({id:uid(),personId:pid,allDay:false,start:plan.startTime||state.unitRules.standbyDefaults.startTime,end:ov.start,reason:'留守較晚到營'});
      }
    });
    // sub-duties become ordinary 其他勤務 entries on their own dates —
    // except roles that are ALSO their own top-level preplan type (e.g.
    // 中央監控值班), which are that type's own responsibility to import so
    // the two don't fight over the same 其他勤務 entry
    const linkedRoles=new Set(PREPLAN_TYPES.filter(t=>t.mode!=='standby' && t.key!=='duty' && t.presetRole).map(t=>t.presetRole));
    Object.entries(plan.subDuties||{}).forEach(([role, byDate])=>{
      if(linkedRoles.has(role)) return;
      const subCfg=state.standbySubConfigs[role]||{};
      const isRoleMode=Array.isArray(subCfg.roles) && subCfg.roles.length===2;
      Object.entries(byDate).forEach(([d, cfg])=>{
        if(!cfg || (!(cfg.personIds||[]).some(Boolean) && !cfg.support)) return;
        if(!state.misc[d]) state.misc[d]=[];
        state.misc[d]=state.misc[d].filter(m=>m.role!==role);
        const rp=state.miscPresets.find(x=>x.role===role);
        const newEntry={id:uid(), role, start:cfg.start||'', end:cfg.end||'',
          restUntil:cfg.restUntil||(rp&&rp.restUntil)||'', personIds:[...(cfg.personIds||[])],
          ...(isRoleMode? {roles:[...subCfg.roles]} : {}),
          standbyAnchor:date, // traces this entry back to the 留守 block that wrote it, so a
                               // future cleanup pass can safely remove sub-duty entries whose
                               // block no longer exists, without touching same-named entries
                               // someone entered by hand
          fromPreplan:true, // 從留守子項目匯入寫入的，清除範圍時可以選擇排除
          ...(cfg.support? {support:cfg.support}:{})};
        if(isRoleMode) autoSwapDriverChief(newEntry, {requiredLicenses:subCfg.requiredLicenses||[], requiredMedCert:!!subCfg.requiredMedCert,
          chiefRequiredLicenses:subCfg.chiefRequiredLicenses||[], chiefRequiredMedCert:!!subCfg.chiefRequiredMedCert});
        state.misc[d].push(newEntry);
      });
    });
    return true;
  }
  // every other type maps onto a 其他勤務 entry (or entries) for that date
  state.misc[date]=state.misc[date].filter(m=>m.role!==roleName);
  const times = preset? presetTimes(preset) : [];
  const t0 = times[0] || {start:'',end:''};
  /* merges the plan-level free-text support with any per-slot note (raw
     text from names the text-import couldn't match to exactly one person)
     into a single display string, so unresolved names still show up on the
     schedule card without ever touching the personnel roster */
  const mergeSupport=(...parts)=>{ const s=parts.filter(Boolean).join('、'); return s? {support:s} : {}; };
  if(type.mode==='people'){
    const groups = peopleGroupsOf(plan);
    let wroteAny=false;
    groups.forEach(g=>{
      const ids=(g.personIds||[]).filter(Boolean);
      if(!ids.length && !g.support && !g.note) return;
      state.misc[date].push({id:uid(), role:roleName,
        start:g.start||plan.start||t0.start, end:g.end||plan.end||t0.end,
        restUntil:g.restUntil||plan.restUntil||(preset&&preset.restUntil)||'', personIds:ids,
        nominalIds:g.nominalIds||[], fromPreplan:true, ...mergeSupport(g.support, g.note)});
      wroteAny=true;
    });
    if(!wroteAny) return false;
  } else if(type.mode==='roles'){
    const ids=(plan.personIds||[]).slice(0,type.roles.length);
    const notes=(plan.notes||[]).filter(Boolean).join('、');
    if(!ids.some(Boolean) && !plan.support && !notes) return false;
    const newEntry={id:uid(), role:roleName,
      start:plan.start||t0.start, end:plan.end||t0.end,
      restUntil:plan.restUntil||(preset&&preset.restUntil)||'', roles:[...type.roles], personIds:ids,
      nominalIds:plan.nominalIds||[], lockedSlots:type.roles.map(()=>false), fromPreplan:true, ...mergeSupport(plan.support, notes)};
    autoSwapDriverChief(newEntry);
    state.misc[date].push(newEntry);
  } else if(type.mode==='dayNight'){
    const dayT = times[0]||{start:'',end:''};
    const nightT = times[1]||times[0]||{start:'',end:''};
    const dayIds=(plan.dayPersonIds||(plan.dayPersonId?[plan.dayPersonId]:[])).filter(Boolean);
    const nightIds=(plan.nightPersonIds||(plan.nightPersonId?[plan.nightPersonId]:[])).filter(Boolean);
    let wrote=false;
    if(dayIds.length || plan.dayNote){
      state.misc[date].push({id:uid(), role:roleName,
        start:plan.dayStart||dayT.start, end:plan.dayEnd||dayT.end,
        restUntil:plan.dayRestUntil||'', personIds:dayIds, nominalIds:plan.dayNominalIds||[],
        shiftLabel:'日班', fromPreplan:true, ...mergeSupport(plan.support, plan.dayNote)});
      wrote=true;
    }
    if(nightIds.length || plan.nightNote){
      state.misc[date].push({id:uid(), role:roleName,
        start:plan.nightStart||nightT.start, end:plan.nightEnd||nightT.end,
        restUntil:plan.nightRestUntil||(preset&&preset.restUntil)||'', personIds:nightIds, nominalIds:plan.nightNominalIds||[],
        shiftLabel:'夜班', fromPreplan:true, ...mergeSupport(plan.support, plan.nightNote)});
      wrote=true;
    }
    return wrote;
  } else if(type.mode==='fixedSlots'){
    let wrote=false;
    Object.entries(plan.slots||{}).forEach(([idx,cfg])=>{
      const label=type.slots[Number(idx)];
      if(!label || !cfg) return;
      const [st,en]=label.split('-');
      const ids=(cfg.personIds||(cfg.personId?[cfg.personId]:[])).filter(Boolean);
      if(!ids.length && !plan.support && !cfg.note) return;
      state.misc[date].push({id:uid(), role:roleName, start:st, end:en,
        restUntil:cfg.restUntil||'', personIds:ids, nominalIds:cfg.nominalIds||[],
        fromPreplan:true, ...mergeSupport(plan.support, cfg.note)});
      wrote=true;
    });
    return wrote;
  }
  return true;
}
/* 休假暨事故大表 import: turn each person's ticked dates into proper leave blocks,
   merging consecutive days into one block so buffers land in the right
   places (rather than one buffered block per day). */
/* imports the 休假暨事故大表 into real leave blocks. Consecutive days merge into
   one block; a block is 榮譽假 if its FIRST day was marked honor (honor is
   a per-day flag on the calendar, not a whole-person setting, since the
   same person might want it for one stretch but not another). Returns the
   segment count plus any requests that got silently downgraded (buffer
   >5 days) so the caller can tell the user instead of it happening quietly. */
function importLeaveTable(monthPrefix){
  const store=state.preplan.leave||{};
  let count=0;
  const downgraded=[];
  Object.entries(store).forEach(([pid, catStore])=>{
    const person=state.personnel.find(p=>p.id===pid);
    Object.entries(catStore||{}).forEach(([catName, rec])=>{
      const category = state.leaveCategories.find(c=>c.name===catName);
      if(!category) return; // this category was deleted since it was saved — skip rather than crash
      const dates=(rec.dates||[]).filter(d=>!monthPrefix || d.startsWith(monthPrefix)).sort();
      const partialEntries=Object.entries(rec.partialTimes||{}).filter(([d])=>!monthPrefix || d.startsWith(monthPrefix));
      if(!dates.length && !partialEntries.length) return;
      const honorSet=new Set(rec.honorDates||[]);
      const approvedRuns=rec.approvedRuns||[];
      // drop this person's existing generated blocks for THIS category (only
      // this one — a person can have several categories' blocks touching
      // overlapping dates, e.g. 休假 ending the same week 受訓 starts) that
      // fall in range, before regenerating them fresh — this covers both
      // full-day runs and any previously-imported partial-time entries
      const relevantReasons = category.honorOption? [category.name,'榮譽假'] : [category.name];
      const staleLeaveIds=new Set();
      [...dates, ...partialEntries.map(([d])=>d)].forEach(d=>{
        (state.unavail[d]||[]).forEach(u=>{
          if(u.personId===pid && u.leaveId && relevantReasons.includes(u.reason)) staleLeaveIds.add(u.leaveId);
        });
      });
      staleLeaveIds.forEach(lid=>deleteLeaveById(lid));
      // group consecutive full-day dates into buffered/plain runs
      if(dates.length){
        let runStart=dates[0], prev=dates[0];
        const flush=(end)=>{
          const isApproved = approvedRuns.some(r=>r.start===runStart && r.end===end);
          const tier = honorSet.has(runStart)? 'honor' : 'normal';
          const r=createLeaveSegment(pid, runStart, end, category, tier, isApproved, rec.note);
          count++;
          if(r.honorDowngraded) downgraded.push({personId:pid, name:person?person.name:pid, start:runStart, end});
        };
        for(let i=1;i<dates.length;i++){
          if(dates[i]===nextDateStr(prev)){ prev=dates[i]; continue; }
          flush(prev); runStart=dates[i]; prev=dates[i];
        }
        flush(prev);
      }
      // each partial-time day is its own independent entry — never merged
      // into a run, never buffered, regardless of the category's buffer
      // setting, since "just this window" is exactly what it says
      partialEntries.forEach(([d,{start,end}])=>{
        if(!state.unavail[d]) state.unavail[d]=[];
        const entry={id:uid(), personId:pid, allDay:false, start, end, reason:category.name,
          leaveId:uid(), leaveStart:d, leaveEnd:d, inCamp:false};
        if(rec.note) entry.note=rec.note;
        state.unavail[d].push(entry);
        count++;
      });
    });
  });
  return {count, downgraded};
}
/* clears one or more kinds of data across a date range in one action,
   instead of going day-by-day with 還原這一天. Each kind is independently
   selectable so e.g. "just wipe 查哨 and 督伙 for October" is a single
   operation instead of clearing everything and redoing the rest. */
/* every 休假/事故 (unavail) record that would be touched by clearing this
   range, grouped back into whole leave blocks (by leaveId) rather than
   individual day-entries — used both to preview what's about to happen and
   to make sure a leave block never gets deleted "from the middle", leaving
   a broken partial record with mismatched buffers. */
function leaveBlocksInRange(from, to){
  const dates = new Set(dateRangeList(from, to));
  const seenLeaveIds = new Set();
  const plainEntries = []; // non-leave incidents, one per date+entry
  const blocks = []; // {leaveId, personId, personName, start, end}
  Object.entries(state.unavail).forEach(([d, arr])=>{
    if(!dates.has(d)) return;
    (arr||[]).forEach(u=>{
      if(u.leaveId){
        if(seenLeaveIds.has(u.leaveId)) return;
        seenLeaveIds.add(u.leaveId);
        blocks.push({leaveId:u.leaveId, personId:u.personId, personName:personName(u.personId),
          reason:u.reason, start:u.leaveStart||d, end:u.leaveEnd||d});
      } else {
        plainEntries.push({date:d, personId:u.personId, personName:personName(u.personId), reason:u.reason});
      }
    });
  });

function clearDateRange(from, to, opts){
  const dates = new Set(dateRangeList(from, to));
  let cleared = 0;
  const clearDateKeyed = (obj)=>{ dates.forEach(d=>{ if(obj[d]!==undefined){ delete obj[d]; cleared++; } }); };
  if(opts.assign) clearDateKeyed(state.assign);
  if(opts.misc){
    if(opts.excludeFromPreplan){
      // keep entries that came from a 預排 import, only clear the rest —
      // a preplan-derived entry stays exactly as current as the last time
      // you imported it, so wiping it here would just mean re-importing to
      // get it back, with no benefit over leaving it alone
      dates.forEach(d=>{
        if(state.misc[d]===undefined) return;
        const before=state.misc[d].length;
        state.misc[d]=state.misc[d].filter(m=>m.fromPreplan);
        cleared += before-state.misc[d].length;
        if(!state.misc[d].length) delete state.misc[d];
      });
    } else {
      clearDateKeyed(state.misc);
    }
  }
  if(opts.unavail){
    // leave blocks are deleted whole (via deleteLeaveById) even when only
    // part of the block falls inside the range, so a block never ends up
    // half-deleted with orphaned buffer entries outside the range; anything
    // left afterward under an in-range date is a plain (non-leave)
    // incident, which is removed per-date as usual
    const {blocks} = leaveBlocksInRange(from, to);
    blocks.forEach(b=>{
      deleteLeaveById(b.leaveId);
      cleared++;
      // keep 休假暨事故大表's planning record in sync so it doesn't keep showing
      // dates as ticked for a block that no longer exists
      const ownerCat = b.reason==='榮譽假'? '休假' : b.reason;
      const rec = state.preplan.leave && state.preplan.leave[b.personId] && state.preplan.leave[b.personId][ownerCat];
      if(rec){
        const blockDates = dateRangeList(b.start, b.end);
        rec.dates=(rec.dates||[]).filter(d=>!blockDates.includes(d));
        if(rec.honorDates) rec.honorDates=rec.honorDates.filter(d=>!blockDates.includes(d));
        if(!rec.dates.length) delete state.preplan.leave[b.personId][ownerCat];
      }
    });
    dates.forEach(d=>{
      if(state.unavail[d]!==undefined){
        cleared += state.unavail[d].length;
        delete state.unavail[d];
      }
    });
  }
  if(opts.dailyShiftOverrides) clearDateKeyed(state.dailyShiftOverrides);
  if(opts.dutyChanges) clearDateKeyed(state.dutyChanges);
  (opts.preplanKeys||[]).forEach(key=>{
    const store = state.preplan[key];
    if(!store) return;
    if(key==='leave'){
      // keyed by person then category — trim the range out of each
      // person+category's date list (and honorDates) rather than deleting
      // the whole record
      Object.keys(store).forEach(pid=>{
        Object.keys(store[pid]||{}).forEach(cat=>{
          const rec=store[pid][cat];
          const before=(rec.dates||[]).length;
          rec.dates=(rec.dates||[]).filter(d=>!dates.has(d));
          if(rec.honorDates) rec.honorDates=rec.honorDates.filter(d=>!dates.has(d));
          if(rec.dates.length!==before) cleared++;
          if(!rec.dates.length) delete store[pid][cat];
        });
        if(!Object.keys(store[pid]).length) delete store[pid];
      });
    } else if(key==='standby'){
      // keyed by the block's own anchor date — a block counts as "in range"
      // if its anchor falls inside [from,to], even though the block itself
      // may run a day or two past the range's edge
      Object.keys(store).forEach(anchor=>{ if(dates.has(anchor)){ delete store[anchor]; cleared++; } });
    } else {
      clearDateKeyed(store);
    }
  });
  return cleared;
}
/* dry-run count of what each selected item would remove, for the
   pre-confirm preview — never mutates state */
function previewClearRange(from, to, opts){
  const dates = dateRangeList(from, to);
  const counts = {};
  const countDateKeyed = (obj)=>dates.filter(d=>obj[d]!==undefined).length;
  if(opts.assign) counts['衛哨排班'] = countDateKeyed(state.assign);
  if(opts.misc){
    if(opts.excludeFromPreplan){
      let n=0;
      dates.forEach(d=>{ (state.misc[d]||[]).forEach(m=>{ if(!m.fromPreplan) n++; }); });
      counts['其他勤務（不含預排匯入的部分）'] = n;
    } else {
      let n=0;
      dates.forEach(d=>{ n += (state.misc[d]||[]).length; });
      counts['其他勤務'] = n;
    }
  }
  if(opts.unavail){
    const {blocks, plainEntries} = leaveBlocksInRange(from, to);
    if(blocks.length) counts['不在營紀錄（整段）'] = blocks.length;
    if(plainEntries.length) counts['事故登記'] = plainEntries.length;
  }
  if(opts.dailyShiftOverrides) counts['當日班別設定'] = countDateKeyed(state.dailyShiftOverrides);
  if(opts.dutyChanges) counts['異動紀錄'] = countDateKeyed(state.dutyChanges);
  (opts.preplanKeys||[]).forEach(key=>{
    const store = state.preplan[key]||{};
    const type = PREPLAN_TYPES.find(t=>t.key===key);
    const label = '預排-'+(type? type.name : key);
    if(key==='leave'){
      const n = Object.values(store).reduce((n2,byCat)=>n2+Object.values(byCat||{}).reduce((n3,rec)=>n3+(rec.dates||[]).filter(d=>dates.includes(d)).length,0),0);
      if(n) counts[label]=n;
    } else if(key==='standby'){
      const n = Object.keys(store).filter(a=>dates.includes(a)).length;
      if(n) counts[label]=n;
    } else {
      const n = countDateKeyed(store);
      if(n) counts[label]=n;
    }
  });
  return counts;
}

          await navigator.share({files:[file], title:fileName});
          return;

    }catch(err){
      try{ ta.focus(); ta.select(); document.execCommand('copy'); btn.textContent='已複製 ✓'; }
      catch(err2){ showAlert('複製失敗，請手動選取文字方塊內容複製。'); }
    }
  };
}

/* everything from today onward that references this person, across every
   place a personId can end up — used before deleting someone from the
   roster so a transfer/discharge/mistake doesn't silently leave a duty
   short-handed without anyone noticing until the day arrives. Past dates
   are deliberately excluded: history isn't something that needs a warning
   or a reassignment, only what's still ahead does. */
function personFutureCommitments(personId){
  const today = todayStr();
  const out = [];
  Object.entries(state.assign).forEach(([d,cats])=>{
    if(d<today) return;
    Object.entries(cats).forEach(([catId,shifts])=>{
      const cat = state.categories.find(c=>c.id===catId);
      Object.entries(shifts).forEach(([sid,arr])=>{
        if((arr||[]).includes(personId)){
          const sh = cat? effectiveShifts(cat,d).find(s=>s.id===sid) : null;
          out.push({date:d, label:`${cat?cat.name:'?'}${sh?` ${sh.start}-${sh.end}`:''}`});
        }
      });
    });
  });
  Object.entries(state.misc).forEach(([d,arr])=>{
    if(d<today) return;
    (arr||[]).forEach(m=>{ if((m.personIds||[]).includes(personId)) out.push({date:d, label:`${m.role}${m.start?` ${m.start}-${m.end}`:''}`}); });
  });
  Object.entries(state.preplan||{}).forEach(([key,store])=>{
    const type = PREPLAN_TYPES.find(t=>t.key===key);
    if(!type) return;
    if(key==='leave'){
      const byCat = store[personId];
      if(byCat) Object.entries(byCat).forEach(([cat,rec])=>{
        const future=(rec.dates||[]).filter(d=>d>=today);
        if(future.length) out.push({date:future.sort()[0], label:`休假暨事故大表-${cat}`});
      });
      return;
    }
    Object.entries(store).forEach(([d,plan])=>{
      if(key==='standby'){
        if(d<today && plan.endDate<today) return;
        if((plan.personIds||[]).includes(personId)) out.push({date:d, label:'留守'});
        return;
      }
      if(d<today) return;
      const ids = plan.personIds || plan.dayPersonIds || plan.nightPersonIds ||
        Object.values(plan.slots||{}).flatMap(s=>s&&s.personIds||[]);
      if((ids||[]).includes(personId)) out.push({date:d, label:`預排-${type.name}`});
    });
  });
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
/* thoroughly removes a person from every place a personId can be stored —
   assign, misc (incl. nominalIds), unavail, and every 預排 type — not just
   assign+unavail like before, which left dangling references in 其他勤務
   and predata that would silently show "—" instead of a name. */
function purgePersonEverywhere(personId){
  Object.values(state.unavail).forEach(arr=>{
    const i=arr.findIndex(u=>u.personId===personId);
    if(i>-1) arr.splice(i,1);
  });
  Object.values(state.assign).forEach(cats=>Object.values(cats).forEach(shifts=>Object.keys(shifts).forEach(sid=>{
    shifts[sid]=shifts[sid].filter(pid=>pid!==personId);
  })));
  Object.values(state.misc).forEach(arr=>{
    (arr||[]).forEach(m=>{
      if(m.personIds) m.personIds = m.personIds.map(id=>id===personId? undefined : id);
      if(m.nominalIds) m.nominalIds = m.nominalIds.filter(id=>id!==personId);
      if(m.confirmedConflictIds) m.confirmedConflictIds = m.confirmedConflictIds.filter(id=>id!==personId);
    });
  });
  Object.entries(state.preplan||{}).forEach(([key,store])=>{
    if(key==='leave'){ delete store[personId]; return; }
    const type = PREPLAN_TYPES.find(t=>t.key===key);
    Object.values(store).forEach(plan=>{
      if(!plan) return;
      // 'roles' mode (救護車/採買) keeps position (index 0=駕駛, 1=車長), so
      // that slot is cleared rather than removed; every other personIds-like
      // field (留守名單, dayNight的日/夜班) is an unordered list and should
      // just have the person filtered out entirely
      if(type && type.mode==='roles' && Array.isArray(plan.personIds)){
        plan.personIds = plan.personIds.map(id=>id===personId? undefined : id);
      } else if(Array.isArray(plan.personIds)){
        plan.personIds = plan.personIds.filter(id=>id!==personId);
      }
      ['dayPersonIds','nightPersonIds','nominalIds','dayNominalIds','nightNominalIds'].forEach(f=>{
        if(Array.isArray(plan[f])) plan[f] = plan[f].filter(id=>id!==personId);
      });
      if(plan.slots) Object.values(plan.slots).forEach(s=>{
        if(s && s.personIds) s.personIds = s.personIds.filter(id=>id!==personId);
        if(s && s.nominalIds) s.nominalIds = s.nominalIds.filter(id=>id!==personId);
      });
      if(plan.overrides) delete plan.overrides[personId];
      if(plan.subDuties) Object.values(plan.subDuties).forEach(byDate=>{
        Object.values(byDate).forEach(cfg=>{ if(cfg && cfg.personIds) cfg.personIds=cfg.personIds.filter(id=>id!==personId); });
      });
    });
  });
}
