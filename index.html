        const on=ids.length>0;
        return `<div class="card" style="padding:8px 10px">
          <div class="row" style="align-items:center;margin-bottom:4px">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px" class="grow">
              <input type="checkbox" class="pp-slot-on" data-slot="${i}" style="width:auto" ${on?'checked':''}>
              <b>${sl}</b>
            </label>
          </div>
          <div class="pp-slot-body" data-slot-body="${i}" style="display:${on?'block':'none'}">
            ${restRow('ppSlotRest'+i, cfg.restUntil||preplanDefault(key,'slotRest'+i,''))}
            ${searchBlock('ppSearchS'+i)}
            ${listBox(checkRows(ids, 'pp-slot'+i, presetReasonsFn), 'ppListS'+i)}
          </div>
        </div>`;
      }).join('');
  }
  modal.innerHTML=`
    <div class="sheet-inner">
      <div class="section-title"><h2 style="margin:0">${type.icon} ${type.name}：${minguoLabel(date)}</h2><button class="ghost small" id="ppClose">關閉</button></div>
      <div class="hint" style="margin-bottom:8px">${type.hint}</div>
      ${body}
      <div class="row wrap" style="margin-top:10px">
        <button class="ghost grow" id="ppCopy">複製到其他日期</button>
        <button class="ghost grow danger" id="ppDelete">清除這天</button>
        <button class="primary grow" id="ppSave">儲存</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  const close=()=>modal.remove();
  document.getElementById('ppClose').onclick=close;
  // wire every search box to its own list, keeping the keyboard up
  const wireSearch=(searchId, listId)=>{
    const se=document.getElementById(searchId), le=document.getElementById(listId);
    if(!se||!le) return;
    se.oninput=()=>{
      const term=se.value.trim();
      le.querySelectorAll('label').forEach(l=>{ l.style.display=(!term||l.textContent.includes(term))?'flex':'none'; });
    };
    keepSearchFocusOnPick(le, se);
  };
  if(type.mode==='people'){
    wireSearch('ppSearch','ppList'); wireSelectedSummary('ppList');
    document.getElementById('ppSelectAll').onclick=()=>modal.querySelectorAll('.pp-person').forEach(cb=>{ if(cb.closest('label').style.display!=='none') cb.checked=true; });
    document.getElementById('ppClearAll').onclick=()=>modal.querySelectorAll('.pp-person').forEach(cb=>cb.checked=false);
  } else if(type.mode==='roles'){
    type.roles.forEach((_,i)=>{ wireSearch('ppSearch'+i,'ppList'+i); wireSelectedSummary('ppList'+i); });
    const driverIdx=type.roles.indexOf('駕駛'), chiefIdx=type.roles.indexOf('車長');
    if(driverIdx>-1 && chiefIdx>-1){
      // picking 駕駛 changes who's eligible/ranked-in for 車長, so the chief
      // list has to be regenerated live rather than staying frozen from
      // whatever the driver was when the sheet first opened
      modal.querySelectorAll('.pp-role'+driverIdx).forEach(radio=>{
        radio.addEventListener('change', ()=>{
          const driverId=radio.value;
          const driver=driverId? state.personnel.find(p=>p.id===driverId) : null;
          const reasonsFn = p=>{
            const reasons=[];
            if(!['士官','軍官'].includes(rankCategory(p.rank))) reasons.push('需為士官以上');
            if(driver && rankIndex(p.rank)>rankIndex(driver.rank)) reasons.push('階級不可低於駕駛');
            if(preset && preset.chiefRequiredMedCert && !p.medCert) reasons.push('需具備EMT或醫生證書');
            if(preset && (preset.chiefRequiredLicenses||[]).length && !preset.chiefRequiredLicenses.some(l=>licenseCovers(p.license,l))) reasons.push('需持有'+preset.chiefRequiredLicenses.join('或')+'駕照');
            return reasons;
          };
          const chiefListEl=document.getElementById('ppList'+chiefIdx);
          const currentChief=modal.querySelector('.pp-role'+chiefIdx+':checked');
          const currentVal=currentChief? currentChief.value : '';
          if(chiefListEl) chiefListEl.innerHTML=radioRows(currentVal, 'pp-role'+chiefIdx, 'pprole'+chiefIdx, reasonsFn);
        });
      });
    }
  } else if(type.mode==='dayNight'){
    wireSearch('ppSearchD','ppListD'); wireSearch('ppSearchN','ppListN'); wireSelectedSummary('ppListD'); wireSelectedSummary('ppListN');
  } else if(type.mode==='fixedSlots'){
    type.slots.forEach((_,i)=>{ wireSearch('ppSearchS'+i,'ppListS'+i); wireSelectedSummary('ppListS'+i); });
    modal.querySelectorAll('.pp-slot-on').forEach(cb=>{
      cb.onchange=()=>{
        const b=modal.querySelector(`[data-slot-body="${cb.dataset.slot}"]`);
        if(b) b.style.display=cb.checked?'block':'none';
      };
    });
  }
  const collect=()=>{
    const support=(document.getElementById('ppSupport')||{}).value||'';
    if(type.mode==='people'){
      const ids=[...modal.querySelectorAll('.pp-person:checked')].map(cb=>cb.value);
      if(!ids.length && !support) return null;
      return {personIds:ids, support,
        start:type.editableTime? getTimeSelectValue('ppTStart') : undefined,
        end:type.editableTime? getTimeSelectValue('ppTEnd') : undefined,
        restUntil:getTimeSelectValue('ppRest')};
    }
    if(type.mode==='roles'){
      const ids=type.roles.map((_,i)=>{
        const sel=modal.querySelector(`.pp-role${i}:checked`);
        return sel && sel.value? sel.value : undefined;
      });
      if(!ids.some(Boolean) && !support) return null;
      return {personIds:ids, support,
        start:type.editableTime? getTimeSelectValue('ppTStart') : undefined,
        end:type.editableTime? getTimeSelectValue('ppTEnd') : undefined,
        restUntil:getTimeSelectValue('ppRest')};
    }
    if(type.mode==='dayNight'){
      const dayIds=[...modal.querySelectorAll('.pp-day:checked')].map(cb=>cb.value);
      const nightIds=[...modal.querySelectorAll('.pp-night:checked')].map(cb=>cb.value);
      if(!dayIds.length && !nightIds.length && !support) return null;
      return {dayPersonIds:dayIds, nightPersonIds:nightIds, support,
        dayStart:getTimeSelectValue('ppDayTStart'), dayEnd:getTimeSelectValue('ppDayTEnd'),
        nightStart:getTimeSelectValue('ppNightTStart'), nightEnd:getTimeSelectValue('ppNightTEnd'),
        dayRestUntil:getTimeSelectValue('ppDayRest'), nightRestUntil:getTimeSelectValue('ppNightRest')};
    }
    if(type.mode==='fixedSlots'){
      const slots={};
      type.slots.forEach((_,i)=>{
        const on=modal.querySelector(`.pp-slot-on[data-slot="${i}"]`);
        if(!on||!on.checked) return;
        const ids=[...modal.querySelectorAll(`.pp-slot${i}:checked`)].map(cb=>cb.value);
        slots[i]={personIds:ids, restUntil:getTimeSelectValue('ppSlotRest'+i)};
      });
      if(!Object.keys(slots).length && !support) return null;
      return {slots, support};
    }
    return null;
  };
  document.getElementById('ppDelete').onclick=()=>{
    setPreplan(key, date, null);
    saveState(); close(); if(onSaved) onSaved();
  };
  document.getElementById('ppCopy').onclick=()=>{
    const value=collect();
    if(!value){ showAlert('這天還沒有填任何內容，沒有東西可以複製。'); return; }
    setPreplan(key, date, value); saveState();
    openPreplanCopyModal(key, date, ()=>{ close(); if(onSaved) onSaved(); });
  };
  document.getElementById('ppSave').onclick=()=>{
    const value=collect();
    setPreplan(key, date, value);
    // remember the shape (times / rest) so the next day opens pre-filled
    if(value){
      if(type.mode==='dayNight'){
        rememberPreplanDefaults(key,{dayStart:value.dayStart,dayEnd:value.dayEnd,
          nightStart:value.nightStart,nightEnd:value.nightEnd,
          dayRest:value.dayRestUntil,nightRest:value.nightRestUntil});
      } else if(type.mode==='fixedSlots'){
        const f={};
        Object.entries(value.slots||{}).forEach(([i,cfg])=>{ if(cfg && cfg.restUntil) f['slotRest'+i]=cfg.restUntil; });
        rememberPreplanDefaults(key,f);
      } else {
        rememberPreplanDefaults(key,{start:value.start,end:value.end,rest:value.restUntil});
      }
    }
    saveState(); close(); if(onSaved) onSaved();
  };
}

/* 休假大表: pick a person, then tick every day they're off — the reverse of
   the per-day editors, matching how leave is actually decided (per person,
   for a stretch of days). Stored per person; import turns each ticked day
   into a proper leave block with buffers. */
/* is this person listed on a 留守 block covering the given date? Used so the
   leave calendar and the standby planner stay in sync in both directions —
   whichever you fill in first, the other one shows it. */
function standbyStatusFor(personId, date){
  const owner = preplanOwnerFor('standby', date);
  if(!owner) return null;
  return (owner.plan.personIds||[]).includes(personId)? 'staying' : 'off';
}
/* 休假大表: pick a person, then tap the days they're off on a month grid.
   Consecutive days merge into one leave block on import; 榮譽假 shifts the
   block's start from 18:00 the previous day to 12:00. */
/* everything already planned for one person on one date, gathered from the
   preplans and the live schedule — the personal calendar's read-only half */
function personDayItems(personId, date){
  const out=[];
  PREPLAN_TYPES.forEach(t=>{
    if(t.mode==='leaveTable' || t.mode==='personCalendar') return;
    if(t.mode==='standby'){
      const owner=preplanOwnerFor('standby', date);
      if(owner && (owner.plan.personIds||[]).includes(personId)){
        out.push({kind:'preplan', key:'standby', anchor:owner.anchor, label:'🏠 留守'});
        Object.entries(owner.plan.subDuties||{}).forEach(([role,byDate])=>{
          const cfg=(byDate||{})[date];
          if(cfg && (cfg.personIds||[]).includes(personId)){
            out.push({kind:'preplan', key:'standby', anchor:owner.anchor,
              label:`🏠 ${role}${cfg.start&&cfg.end? ` (${cfg.start}-${cfg.end})`:''}`});
          }
        });
      }
      return;
    }
    const plan=preplanFor(t.key, date);
    if(!plan) return;
    const has=(plan.personIds||[]).includes(personId)
      || plan.dayPersonId===personId || plan.nightPersonId===personId
      || Object.values(plan.slots||{}).some(c=>c && c.personId===personId);
    if(has) out.push({kind:'preplan', key:t.key, anchor:date, label:`${t.icon} ${t.name}`});
  });
  // leave from the 休假大表
  const lv=(state.preplan.leave||{})[personId];
  if(lv && (lv.dates||[]).includes(date)) out.push({kind:'leave', label:'🏖️ 休假（大表）'});
  // live schedule
  orderedCategories().forEach(cat=>{
    const ca=(state.assign[date]||{})[cat.id]||{};
    effectiveShifts(cat,date).forEach(s=>{
      if((ca[s.id]||[]).includes(personId)) out.push({kind:'assign', label:`📋 ${cat.name} ${s.label||s.start+'-'+s.end}`});
    });
  });
  (state.misc[date]||[]).forEach(m=>{
    if((m.personIds||[]).includes(personId)) out.push({kind:'misc', label:`🗂 ${m.role}${m.start&&m.end? ` (${m.start}-${m.end})`:''}`});
  });
  // personal incidents
  (state.unavail[date]||[]).filter(u=>u.personId===personId).forEach(u=>{
    out.push({kind:'unavail', id:u.id, leaveId:u.leaveId,
      label:`🚫 ${u.allDay?'全天':`${u.start}-${u.end}`}${u.reason? '（'+u.reason+'）':''}`});
  });
  return out;
}
/* 個人月曆: one person, one month, everything they're on. Planned duties are
   pulled in automatically (and can be opened for editing); personal
   incidents are entered right here — this replaces 人員事故登載. */
function openPersonCalendarEditor(date, onSaved){
  let ym=monthOf(date);
  let pid=null;
  const modal=document.createElement('div');
  modal.className='fullscreen-modal'; modal.style.zIndex='93';
  const draw=()=>{
    const person=pid? state.personnel.find(p=>p.id===pid):null;
    const [y,m]=ym.split('-').map(Number);
    const total=daysInMonth(ym);
    const firstDow=new Date(y,m-1,1).getDay();
    const cells=[];
    for(let i=0;i<firstDow;i++) cells.push('<div class="cal-cell empty"></div>');
    for(let d=1;d<=total;d++){
      const ds=`${ym}-${String(d).padStart(2,'0')}`;
      const items=person? personDayItems(person.id, ds):[];
      const hasLeave=items.some(x=>x.kind==='leave'||(x.kind==='unavail'&&/假/.test(x.label)));
      const hasIncident=items.some(x=>x.kind==='unavail'&&!/假/.test(x.label));
      const hasDuty=items.some(x=>['preplan','assign','misc'].includes(x.kind));
      let mark = hasLeave? '休' : (hasDuty? String(items.filter(x=>['preplan','assign','misc'].includes(x.kind)).length) : '');
      if(hasIncident) mark = (mark? mark+'･':'')+'事';
      const cls = hasLeave? 'leave-marked' : (hasIncident? 'incident-marked' : (hasDuty? 'has':''));
      cells.push(`<div class="cal-cell ${cls} ${isHolidayDate(ds)?'holiday':''}" data-pc-date="${ds}">
        <div class="cal-day">${d}</div><div class="cal-mark">${esc(mark)}</div>
      </div>`);
    }
    let monthCount=0;
    if(person) for(let d=1;d<=total;d++){ if(personDayItems(person.id,`${ym}-${String(d).padStart(2,'0')}`).length) monthCount++; }
    modal.innerHTML=`
      <div class="section-title"><h2 style="margin:0">👤 個人月曆</h2><button class="ghost small" id="pcClose">關閉</button></div>
      <div class="hint" style="margin-bottom:8px">預排好的勤務會自動帶入，個人事故在這裡補登。點日期查看與編輯當天內容。</div>
      <div class="row wrap" style="margin-bottom:6px">
        <div class="grow"><label>搜尋姓名</label><input type="text" id="pcSearch" placeholder="輸入姓名關鍵字"></div>
      </div>
      <div id="pcPeople" style="max-height:22vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px">
        ${state.personnel.slice().sort((a,b)=>groupIndex(a.group)-groupIndex(b.group)||rankIndex(a.rank)-rankIndex(b.rank))
          .map(p=>`<label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0">
            <input type="radio" name="pcp" class="pc-person" value="${p.id}" style="width:auto" ${p.id===pid?'checked':''}>
            ${esc(p.name)}（${p.group||'未分組'}·${p.rank}${personBadges(p)}）
          </label>`).join('')}
      </div>
      ${person? `
        <div class="row" style="gap:6px;align-items:center;margin-bottom:6px">
          <button class="ghost small" id="pcPrev">◀</button>
          <span class="grow" style="text-align:center;font-weight:600">${esc(person.name)}　民國${y-1911}年${m}月<br><span class="hint">本月有 ${monthCount} 天有安排</span></span>
          <button class="ghost small" id="pcNext">▶</button>
        </div>
        <div class="cal-grid" style="margin-bottom:6px">
          ${['日','一','二','三','四','五','六'].map(w=>`<div class="cal-head">${w}</div>`).join('')}
          ${cells.join('')}
        </div>
        <div class="hint">數字＝當天勤務筆數；「休」＝休假；「事」＝有個人事故。</div>
      ` : `<div class="empty">請先選擇一位人員</div>`}`;
    document.getElementById('pcClose').onclick=()=>modal.remove();
    const se=document.getElementById('pcSearch'), le=document.getElementById('pcPeople');
    se.oninput=()=>{ const t=se.value.trim();
      le.querySelectorAll('label').forEach(l=>{ l.style.display=(!t||l.textContent.includes(t))?'flex':'none'; }); };
    keepSearchFocusOnPick(le, se);
    modal.querySelectorAll('.pc-person').forEach(r=>{ r.onchange=()=>{ pid=r.value; draw(); }; });
    if(person){
      document.getElementById('pcPrev').onclick=()=>{ ym=shiftMonth(ym,-1); preplanMonth=ym; draw(); };
      document.getElementById('pcNext').onclick=()=>{ ym=shiftMonth(ym,1); preplanMonth=ym; draw(); };
      modal.querySelectorAll('[data-pc-date]').forEach(c=>{
        c.onclick=()=>openPersonDayEditor(person.id, c.dataset.pcDate, draw);
      });
    }
  };
  document.body.appendChild(modal);
  draw();
}

/* live warning shown right on the leave calendar (not just at import time):
   groups the ticked dates into consecutive runs and flags any run whose
   honor-day would actually fall back to a normal 18:00 start because the
   whole block (including front/back buffer) exceeds 5 days. */
/* groups the ticked dates into consecutive runs and works out, per run,
   whether it needs someone's approval to keep its length: 榮譽假 over 5
   days (含前後緩衝), or ANY leave over 6 days (含前後緩衝) — approval is
   the same single flag either way, checked by exact (start,end) so
   shrinking or growing an already-approved run always asks again rather
   than silently inheriting an approval that covered a different length. */
function analyzeLeaveRuns(pickedSet, honorSet, approvedRuns){
  const dates=[...pickedSet].sort();
  const approved = approvedRuns||[];
  const runs=[];
  if(!dates.length) return runs;
  let runStart=dates[0], prev=dates[0];
  const push=(end)=>{
    const bufferDays=daysBetweenInclusive(prevDateStr(runStart), nextDateStr(end));
    const isHonor=honorSet.has(runStart);
    const needsApproval = bufferDays>6 || (isHonor && bufferDays>5);
    const isApproved = approved.some(r=>r.start===runStart && r.end===end);
    runs.push({start:runStart, end, bufferDays, isHonor, needsApproval, isApproved});
  };
  for(let i=1;i<dates.length;i++){
    if(dates[i]===nextDateStr(prev)){ prev=dates[i]; continue; }
    push(prev); runStart=dates[i]; prev=dates[i];
  }
  push(prev);
  return runs;
}
function leaveRunWarnings(pickedSet, honorSet, approvedRuns){
  return analyzeLeaveRuns(pickedSet, honorSet, approvedRuns).filter(r=>r.needsApproval).map(r=>{
    const reasonLabel = r.isHonor? '榮譽假':'休假';
    if(r.isApproved){
      return `✅ ${minguoLabel(r.start)}~${minguoLabel(r.end)}（含前後緩衝共${r.bufferDays}天）已經過同意，${reasonLabel}維持這個天數。`;
    }
    return `⚠️ ${minguoLabel(r.start)}~${minguoLabel(r.end)}（含前後緩衝共${r.bufferDays}天）超過${r.isHonor&&r.bufferDays<=6?'5天，榮譽假':'6天'}上限，按「確認休假」時需要再確認同意才能保留這個天數。`;
  });
}
function openLeaveTableEditor(date, onSaved, presetPid){
  let ym = monthOf(date);
  let selectedPid = presetPid || null;
  let picked = new Set();       // dates ticked in the current month
  let honorDates = new Set();   // subset of picked that are 榮譽假
  const modal=document.createElement('div');
  modal.className='fullscreen-modal'; modal.style.zIndex='93';
  const store=()=>state.preplan.leave||{};
  /* 休假大表 is the ONLY place leave gets edited now — but leave can also
     come from elsewhere (an older import, a manually-registered incident
     that happens to carry a leaveId) without ever being entered here. If
     that happens the calendar would silently disagree with what's actually
     in effect, so on every load this pulls in any leaveId-linked dates for
     the selected person that aren't already reflected in the plan and
     merges them in — the calendar always shows what's really scheduled. */
  const scanForOrphanedLeave=(pid)=>{
    if(!pid) return;
    const rec = store()[pid] || {dates:[], honorDates:[]};
    const known = new Set(rec.dates||[]);
    const found = new Set();
    const foundHonor = new Set();
    Object.entries(state.unavail).forEach(([d,arr])=>{
      (arr||[]).forEach(u=>{
        if(u.personId===pid && u.leaveId && u.allDay){
          found.add(d);
          if(u.reason==='榮譽假') foundHonor.add(d);
        }
      });
    });
    let changed=false;
    found.forEach(d=>{ if(!known.has(d)){ known.add(d); changed=true; } });
    if(changed){
      if(!state.preplan.leave) state.preplan.leave={};
      const mergedHonor=new Set([...(rec.honorDates||[]), ...foundHonor]);
      state.preplan.leave[pid]={dates:[...known].sort(), honorDates:[...mergedHonor].sort()};
    }
  };
  const loadPerson=()=>{
    scanForOrphanedLeave(selectedPid);
    const rec=store()[selectedPid]||{};
    picked = new Set((rec.dates||[]).filter(d=>d.startsWith(ym)));
    honorDates = new Set((rec.honorDates||(rec.honor? rec.dates||[] : [])).filter(d=>picked.has(d)));
  };
  if(selectedPid) loadPerson();
  const draw=()=>{
    const person = selectedPid? state.personnel.find(p=>p.id===selectedPid) : null;
    const [y,m]=ym.split('-').map(Number);
    const total=daysInMonth(ym);
    const firstDow=new Date(y,m-1,1).getDay();
    const cells=[];
    for(let i=0;i<firstDow;i++) cells.push('<div class="cal-cell empty"></div>');
    for(let d=1;d<=total;d++){
      const ds=`${ym}-${String(d).padStart(2,'0')}`;
      const on = picked.has(ds);
      const isHonor = on && honorDates.has(ds);
      const hol = isHolidayDate(ds);
      const sb = person? standbyStatusFor(person.id, ds) : null;
      // 留守 already decided for this person -> show it so the two planners agree
      let mark = isHonor? '12休' : (on? '休' : (sb==='staying'? '留守' : ''));
      const cls = on? 'has' : (sb==='staying'? 'standby-marked':'');
      cells.push(`<div class="cal-cell ${cls} ${hol?'holiday':''}" data-lt-date="${ds}">
        <div class="cal-day">${d}</div><div class="cal-mark">${mark}</div>
      </div>`);
    }
    const allDates=((store()[selectedPid]||{}).dates||[]);
    modal.innerHTML=`
      <div class="section-title"><h2 style="margin:0">🏖️ 休假大表</h2><button class="ghost small" id="ltClose">關閉</button></div>
      <div class="hint" style="margin-bottom:8px">先選人，再點月曆：點一下＝休假，再點一下＝榮譽假（顯示「12休」，從前一天12:00提早開始），第三下取消。按「確認休假」儲存。假日若沒點休假，代表他那天留守。</div>
      <div class="row wrap" style="margin-bottom:6px">
        <div class="grow"><label>搜尋姓名</label><input type="text" id="ltSearch" placeholder="輸入姓名關鍵字"></div>
      </div>
      <div id="ltPeople" style="max-height:22vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px">
        ${state.personnel.slice().sort((a,b)=>groupIndex(a.group)-groupIndex(b.group)||rankIndex(a.rank)-rankIndex(b.rank))
          .map(p=>{
            const cnt=((store()[p.id]||{}).dates||[]).filter(d=>d.startsWith(ym)).length;
            return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0">
              <input type="radio" name="ltp" class="lt-person" value="${p.id}" style="width:auto" ${p.id===selectedPid?'checked':''}>
              ${esc(p.name)}（${p.group||'未分組'}·${p.rank}）${cnt? ` <span class="ok">本月${cnt}天</span>`:''}
            </label>`;
          }).join('')}
      </div>
      ${person? `
        <div class="row" style="gap:6px;align-items:center;margin-bottom:6px">

          <span class="grow" style="text-align:center;font-weight:600">${esc(person.name)}　民國${y-1911}年${m}月<br><span class="hint">本月已點 ${picked.size} 天・累計 ${allDates.length} 天</span></span>
          <button class="ghost small" id="ltNext">▶</button>

        <div class="cal-grid" style="margin-bottom:6px">

            new Set([...((store()[selectedPid]||{}).honorDates||[]).filter(d=>!d.startsWith(ym)), ...honorDates]),
            (store()[selectedPid]||{}).approvedRuns||[]
          ).map(w=>`<div class="${w.startsWith('✅')?'hint':'badge-issue'}">${esc(w)}</div>`).join('')}
        <div class="hint" style="margin-bottom:8px">「休」＝一般休假（前一天18:00起）；「12休」＝榮譽假（前一天12:00起）；「留守」＝留守表已排他這天留守，跟這裡無關聯除非你也點成休假。榮譽假整段（含前後緩衝）超過5天、或一般休假超過6天，需要經過同意才能保留，按「確認休假」時會再問一次。</div>

      <div class="divider"></div>
      ${(()=>{
        const seen=new Set(); const blocks=[];
        Object.keys(state.unavail).sort().forEach(d=>{
          (state.unavail[d]||[]).forEach(u=>{
            if(u.leaveId && !seen.has(u.leaveId)){
              seen.add(u.leaveId);

            }
          });
        });
        return collapsibleCardHTML('ltCurrentBlocks', `目前已生效的休假（${blocks.length}筆）`, blocks.length? blocks.map(b=>`
          <div class="list-item">
            <span class="grow">${esc(personName(b.personId))}：${minguoLabel(b.start)} ~ ${minguoLabel(b.end)}</span>
            <button class="ghost small" data-lt-goto="${b.personId}">去改</button>
            <button class="ghost small danger" data-lt-del-block="${b.leaveId}">刪除整段</button>
          </div>`).join('') : `<div class="empty">目前沒有已生效的休假</div>`);
      })()}`;
    document.getElementById('ltClose').onclick=()=>modal.remove();
    document.getElementById('ltCheckpoint').onclick=()=>openCheckpointModal('leave', '休假大表',
      ()=>state.preplan.leave||{},
      (data)=>{ state.preplan.leave=data; loadPerson(); draw(); });
    modal.querySelectorAll('[data-lt-goto]').forEach(b=>{
      b.onclick=()=>{ selectedPid=b.dataset.ltGoto; loadPerson(); draw(); };
    });
    modal.querySelectorAll('[data-lt-del-block]').forEach(b=>{
      b.onclick=()=>{
        showConfirm('確定要刪除這整段休假嗎？', ()=>{
          const leaveId=b.dataset.ltDelBlock;
          // find which person/dates this block covers before it's gone, so
          // the 休假大表 planning record can be kept in sync — otherwise the
          // calendar would keep showing dates as ticked for a leave that no
          // longer exists in the actual schedule
          let ownerPid=null, blockDates=[];
          Object.entries(state.unavail).forEach(([d,arr])=>{
            (arr||[]).forEach(u=>{ if(u.leaveId===leaveId){ ownerPid=u.personId; if(u.allDay) blockDates.push(d); } });
          });
          deleteLeaveById(leaveId);
          if(ownerPid && state.preplan.leave && state.preplan.leave[ownerPid]){
            const rec=state.preplan.leave[ownerPid];
            rec.dates=(rec.dates||[]).filter(d=>!blockDates.includes(d));
            if(rec.honorDates) rec.honorDates=rec.honorDates.filter(d=>!blockDates.includes(d));
            if(!rec.dates.length) delete state.preplan.leave[ownerPid];
          }
          saveState();
          if(selectedPid) loadPerson();
          draw();
        });
      };
    });
    const se=document.getElementById('ltSearch'), le=document.getElementById('ltPeople');
    se.oninput=()=>{
      const term=se.value.trim();
      le.querySelectorAll('label').forEach(l=>{ l.style.display=(!term||l.textContent.includes(term))?'flex':'none'; });
    };
    keepSearchFocusOnPick(le, se);
    modal.querySelectorAll('.lt-person').forEach(r=>{
      r.onchange=()=>{ selectedPid=r.value; loadPerson(); draw(); };
    });
    document.getElementById('ltImport').onclick=()=>{
      const st=store();
      const totalDays=Object.values(st).reduce((n,r)=>n+((r.dates||[]).filter(d=>d.startsWith(ym)).length),0);
      if(!totalDays){ showAlert('本月還沒有排任何休假。'); return; }
      showConfirm(`確定要把本月已排的 ${totalDays} 人日休假，依連續日期自動合併並匯入實際班表嗎？每個人在這個月範圍內原本的休假紀錄會被清除重建（不會疊加），範圍外的休假不受影響。`, ()=>{
        const {count,downgraded}=importLeaveTable(ym);
        saveState();
        let msg=`已建立 ${count} 段休假。`;
        if(downgraded.length){
          msg+=`\n\n⚠️ 有 ${downgraded.length} 段因為含前後緩衝超過5天，榮譽假已自動退回一般休假（18:00起）：\n`
             + downgraded.slice(0,8).map(d=>`・${d.name}：${minguoLabel(d.start)}~${minguoLabel(d.end)}`).join('\n')
             + (downgraded.length>8? `\n…還有 ${downgraded.length-8} 段`:'');
        }
        showAlert(msg);
        render(); draw();
      });
    };
    if(person){
      modal.querySelectorAll('[data-lt-date]').forEach(c=>{
        c.onclick=()=>{
          const ds=c.dataset.ltDate;
          // cycle: off -> 休 -> 12休 -> off
          if(!picked.has(ds)){ picked.add(ds); }
          else if(!honorDates.has(ds)){ honorDates.add(ds); }
          else { picked.delete(ds); honorDates.delete(ds); }
          draw();
        };
      });
      document.getElementById('ltPrev').onclick=()=>{ ym=shiftMonth(ym,-1); preplanMonth=ym; loadPerson(); draw(); };
      document.getElementById('ltNext').onclick=()=>{ ym=shiftMonth(ym,1); preplanMonth=ym; loadPerson(); draw(); };
      document.getElementById('ltClearMonth').onclick=()=>{ picked=new Set(); honorDates=new Set(); draw(); };
      document.getElementById('ltSave').onclick=()=>{
        const curDates=((store()[selectedPid]||{}).dates||[]).filter(d=>!d.startsWith(ym));
        const curHonor=((store()[selectedPid]||{}).honorDates||[]).filter(d=>!d.startsWith(ym));
        const curApproved=((store()[selectedPid]||{}).approvedRuns||[]);
        const mergedDates=[...curDates, ...picked].sort();
        const mergedHonor=[...curHonor, ...honorDates].sort();
        const runs = analyzeLeaveRuns(new Set(mergedDates), new Set(mergedHonor), curApproved);
        const unapproved = runs.filter(r=>r.needsApproval && !r.isApproved);
        const doSave=(approvedRuns)=>{
          if(!state.preplan.leave) state.preplan.leave={};
          if(mergedDates.length) state.preplan.leave[selectedPid]={dates:mergedDates, honorDates:mergedHonor, approvedRuns};
          else delete state.preplan.leave[selectedPid];
          saveState();
          showAlert(`已儲存 ${person.name} 的休假（本月 ${picked.size} 天，其中榮譽假 ${honorDates.size} 天）。`);
          draw(); if(onSaved) onSaved();
        };
        if(unapproved.length){
          // 超過天數上限（榮譽假5天或一般假6天，含前後緩衝）一律要同意才能保留，
          // 不同意就不儲存，逼你要嘛縮短天數要嘛真的走同意流程
          const lines = unapproved.map(r=>`${minguoLabel(r.start)}~${minguoLabel(r.end)}（含前後緩衝共${r.bufferDays}天，${r.isHonor?'榮譽假':'一般休假'}）`);
          showConfirm(`以下這幾段休假超過天數上限，需要同意才能保留：\n${lines.join('\n')}\n\n確定已經過同意，要保留這個天數嗎？不同意的話請先縮短天數再儲存。`, ()=>{
            const newlyApproved = unapproved.map(r=>({start:r.start, end:r.end}));
            doSave([...curApproved, ...newlyApproved]);
          });
        } else {
          doSave(curApproved);
        }
      };
    }
  };
  document.body.appendChild(modal);
  draw();
}
/* writes one day's plan for one duty type into the real schedule, replacing
   whatever that same duty currently holds on that date (other duties on
   that date are untouched). Returns true if anything was written. */
function importPreplanForDate(key, date){
  const type = PREPLAN_TYPES.find(t=>t.key===key);
  if(!type) return false;
  const plan = preplanFor(key, date);
  if(!plan){
    // nothing planned for this day — for the 7 regular day-keyed types this
    // still means "clear whatever this role wrote here before" so a
    // whole-month reimport after deleting a day's plan actually removes the
    // stale entry instead of leaving it behind forever. 留守 is excluded:
    // its "date" is a block's anchor, not a per-day slot, so a blank anchor
    // here is normal for most days and clearing on it would be wrong.
    if(key!=='standby' && state.misc[date]){
      const roleName = type.presetRole || type.name;
      const before = state.misc[date].length;
      state.misc[date] = state.misc[date].filter(m=>m.role!==roleName);
      return state.misc[date].length!==before;
    }
    return false;
  }
  const preset = type.presetRole? state.miscPresets.find(p=>p.role===type.presetRole) : null;
  if(!state.misc[date]) state.misc[date]=[];
  const roleName = type.presetRole || type.name;
  if(key==='standby'){
    /* A 留守 block spans several days and writes to all of them at once:
       - non-standby people get leave for the whole block (from the leave
         start time the day before, through the block, to the end time the
         day after) — same shape as a normal leave block so all the usual
         availability logic applies
       - standby people get their sub-duty assignments written as 其他勤務
       - per-person overrides shorten either end for that individual
       The `date` argument is the block's anchor (the key it's stored
       under); everything is driven off plan.startDate/endDate. */
    const blockDates = dateRangeList(plan.startDate, plan.endDate);
    const dayBefore = prevDateStr(plan.startDate);
    const dayAfter  = nextDateStr(plan.endDate);
    const keep = new Set(plan.personIds||[]);
    const TAG='休假（留守期間非留守人員）';
    // clear anything this block wrote before, so re-import is idempotent
    [dayBefore, ...blockDates, dayAfter].forEach(d=>{
      if(state.unavail[d]) state.unavail[d]=state.unavail[d].filter(u=>u.reason!==TAG);
    });
    state.personnel.forEach(p=>{
      if(keep.has(p.id)) return;
      const startT = plan.leaveStartTime||STANDBY_DEFAULTS.leaveStartTime;
      const endT = plan.endTime||STANDBY_DEFAULTS.endTime;
      if(!state.unavail[dayBefore]) state.unavail[dayBefore]=[];
      state.unavail[dayBefore].push({id:uid(),personId:p.id,allDay:false,start:startT,end:'24:00',reason:TAG});
      blockDates.forEach(d=>{
        if(!state.unavail[d]) state.unavail[d]=[];
        state.unavail[d].push({id:uid(),personId:p.id,allDay:true,start:'',end:'',reason:TAG});
      });
      if(!state.unavail[dayAfter]) state.unavail[dayAfter]=[];
      state.unavail[dayAfter].push({id:uid(),personId:p.id,allDay:false,start:'00:00',end:endT,reason:TAG});
    });
    // per-person overrides: someone leaving early is unavailable from then on
    Object.entries(plan.overrides||{}).forEach(([pid, ov])=>{
      if(!keep.has(pid)) return;
      if(ov.end){
        const last = blockDates[blockDates.length-1];
        if(!state.unavail[last]) state.unavail[last]=[];
        state.unavail[last].push({id:uid(),personId:pid,allDay:false,start:ov.end,end:'24:00',reason:'留守提早離營'});
      }
      if(ov.start){
        if(!state.unavail[dayBefore]) state.unavail[dayBefore]=[];
        state.unavail[dayBefore].push({id:uid(),personId:pid,allDay:false,start:plan.startTime||STANDBY_DEFAULTS.startTime,end:ov.start,reason:'留守較晚到營'});
      }
    });
    // sub-duties become ordinary 其他勤務 entries on their own dates —
    // except roles that are ALSO their own top-level preplan type (e.g.
    // 中央監控值班), which are that type's own responsibility to import so
    // the two don't fight over the same 其他勤務 entry
    const linkedRoles=new Set(PREPLAN_TYPES.filter(t=>t.mode!=='standby' && t.key!=='duty' && t.presetRole).map(t=>t.presetRole));
    Object.entries(plan.subDuties||{}).forEach(([role, byDate])=>{
      if(linkedRoles.has(role)) return;
      Object.entries(byDate).forEach(([d, cfg])=>{
        if(!cfg || (!(cfg.personIds||[]).length && !cfg.support)) return;
        if(!state.misc[d]) state.misc[d]=[];
        state.misc[d]=state.misc[d].filter(m=>m.role!==role);
        const rp=state.miscPresets.find(x=>x.role===role);
        state.misc[d].push({id:uid(), role, start:cfg.start||'', end:cfg.end||'',
          restUntil:cfg.restUntil||(rp&&rp.restUntil)||'', personIds:[...(cfg.personIds||[])],
          standbyAnchor:date, // traces this entry back to the 留守 block that wrote it, so a
                               // future cleanup pass can safely remove sub-duty entries whose
                               // block no longer exists, without touching same-named entries
                               // someone entered by hand
          ...(cfg.support? {support:cfg.support}:{})});
      });
    });
    return true;
  }
  // every other type maps onto a 其他勤務 entry (or entries) for that date
  state.misc[date]=state.misc[date].filter(m=>m.role!==roleName);
  const times = preset? presetTimes(preset) : [];
  const t0 = times[0] || {start:'',end:''};
  /* merges the plan-level free-text support with any per-slot note (raw
     text from names the text-import couldn't match to exactly one person)
     into a single display string, so unresolved names still show up on the
     schedule card without ever touching the personnel roster */
  const mergeSupport=(...parts)=>{ const s=parts.filter(Boolean).join('、'); return s? {support:s} : {}; };
  if(type.mode==='people'){
    const ids=(plan.personIds||[]).filter(Boolean);
    if(!ids.length && !plan.support && !plan.note) return false;
    state.misc[date].push({id:uid(), role:roleName,
      start:plan.start||t0.start, end:plan.end||t0.end,
      restUntil:plan.restUntil||(preset&&preset.restUntil)||'', personIds:ids,
      nominalIds:plan.nominalIds||[], ...mergeSupport(plan.support, plan.note)});
  } else if(type.mode==='roles'){
    const ids=(plan.personIds||[]).slice(0,type.roles.length);
    const notes=(plan.notes||[]).filter(Boolean).join('、');
    if(!ids.some(Boolean) && !plan.support && !notes) return false;
    state.misc[date].push({id:uid(), role:roleName,
      start:plan.start||t0.start, end:plan.end||t0.end,
      restUntil:plan.restUntil||(preset&&preset.restUntil)||'', roles:[...type.roles], personIds:ids,
      nominalIds:plan.nominalIds||[], lockedSlots:type.roles.map(()=>false), ...mergeSupport(plan.support, notes)});
  } else if(type.mode==='dayNight'){
    const dayT = times[0]||{start:'',end:''};
    const nightT = times[1]||times[0]||{start:'',end:''};
    const dayIds=(plan.dayPersonIds||(plan.dayPersonId?[plan.dayPersonId]:[])).filter(Boolean);
    const nightIds=(plan.nightPersonIds||(plan.nightPersonId?[plan.nightPersonId]:[])).filter(Boolean);
    let wrote=false;
    if(dayIds.length || plan.dayNote){
      state.misc[date].push({id:uid(), role:roleName,
        start:plan.dayStart||dayT.start, end:plan.dayEnd||dayT.end,
        restUntil:plan.dayRestUntil||'', personIds:dayIds, nominalIds:plan.dayNominalIds||[],
        shiftLabel:'日班', ...mergeSupport(plan.support, plan.dayNote)});
      wrote=true;
    }
    if(nightIds.length || plan.nightNote){
      state.misc[date].push({id:uid(), role:roleName,
        start:plan.nightStart||nightT.start, end:plan.nightEnd||nightT.end,
        restUntil:plan.nightRestUntil||(preset&&preset.restUntil)||'', personIds:nightIds, nominalIds:plan.nightNominalIds||[],
        shiftLabel:'夜班', ...mergeSupport(plan.support, plan.nightNote)});
      wrote=true;
    }
    return wrote;
  } else if(type.mode==='fixedSlots'){
    let wrote=false;
    Object.entries(plan.slots||{}).forEach(([idx,cfg])=>{
      const label=type.slots[Number(idx)];
      if(!label || !cfg) return;
      const [st,en]=label.split('-');
      const ids=(cfg.personIds||(cfg.personId?[cfg.personId]:[])).filter(Boolean);
      if(!ids.length && !plan.support && !cfg.note) return;
      state.misc[date].push({id:uid(), role:roleName, start:st, end:en,
        restUntil:cfg.restUntil||'', personIds:ids, nominalIds:cfg.nominalIds||[],
        ...mergeSupport(plan.support, cfg.note)});
      wrote=true;
    });
    return wrote;
  }
  return true;
}
/* 休假大表 import: turn each person's ticked dates into proper leave blocks,
   merging consecutive days into one block so buffers land in the right
   places (rather than one buffered block per day). */
/* imports the 休假大表 into real leave blocks. Consecutive days merge into
   one block; a block is 榮譽假 if its FIRST day was marked honor (honor is
   a per-day flag on the calendar, not a whole-person setting, since the
   same person might want it for one stretch but not another). Returns the
   segment count plus any requests that got silently downgraded (buffer
   >5 days) so the caller can tell the user instead of it happening quietly. */
function importLeaveTable(monthPrefix){
  const store=state.preplan.leave||{};
  let count=0;
  const downgraded=[];
  Object.entries(store).forEach(([pid, rec])=>{
    const dates=(rec.dates||[]).filter(d=>!monthPrefix || d.startsWith(monthPrefix)).sort();
    if(!dates.length) return;
    const honorSet=new Set(rec.honorDates||(rec.honor? dates:[]));
    const approvedRuns=rec.approvedRuns||[];
    // drop this person's existing generated blocks that fall in range first
    dates.forEach(d=>{
      const lid=findLeaveIdForPerson(pid, d);
      if(lid) deleteLeaveById(lid);
    });
    // group consecutive days
    let runStart=dates[0], prev=dates[0];
    const person=state.personnel.find(p=>p.id===pid);
    const flush=(end)=>{
      const isApproved = approvedRuns.some(r=>r.start===runStart && r.end===end);
      const r=createLeaveSegment(pid, runStart, end, honorSet.has(runStart), isApproved);
      count++;
      if(r.honorDowngraded) downgraded.push({personId:pid, name:person?person.name:pid, start:runStart, end});
    };
    for(let i=1;i<dates.length;i++){
      if(dates[i]===nextDateStr(prev)){ prev=dates[i]; continue; }
      flush(prev); runStart=dates[i]; prev=dates[i];
    }
    flush(prev);
  });
  return {count, downgraded};
}
/* clears one or more kinds of data across a date range in one action,
   instead of going day-by-day with 還原這一天. Each kind is independently
   selectable so e.g. "just wipe 查哨 and 督伙 for October" is a single
   operation instead of clearing everything and redoing the rest. */
/* every 休假/事故 (unavail) record that would be touched by clearing this
   range, grouped back into whole leave blocks (by leaveId) rather than
   individual day-entries — used both to preview what's about to happen and
   to make sure a leave block never gets deleted "from the middle", leaving
   a broken partial record with mismatched buffers. */
function leaveBlocksInRange(from, to){
  const dates = new Set(dateRangeList(from, to));
  const seenLeaveIds = new Set();
  const plainEntries = []; // non-leave incidents, one per date+entry
  const blocks = []; // {leaveId, personId, personName, start, end}
  Object.entries(state.unavail).forEach(([d, arr])=>{
    if(!dates.has(d)) return;
    (arr||[]).forEach(u=>{
      if(u.leaveId){
        if(seenLeaveIds.has(u.leaveId)) return;
        seenLeaveIds.add(u.leaveId);
        blocks.push({leaveId:u.leaveId, personId:u.personId, personName:personName(u.personId),
          start:u.leaveStart||d, end:u.leaveEnd||d});
      } else {
        plainEntries.push({date:d, personId:u.personId, personName:personName(u.personId), reason:u.reason});
      }
    });
  });
  return {blocks, plainEntries};
}
function clearDateRange(from, to, opts){
  const dates = new Set(dateRangeList(from, to));
  let cleared = 0;
  const clearDateKeyed = (obj)=>{ dates.forEach(d=>{ if(obj[d]!==undefined){ delete obj[d]; cleared++; } }); };
  if(opts.assign) clearDateKeyed(state.assign);
  if(opts.misc) clearDateKeyed(state.misc);
  if(opts.unavail){
    // leave blocks are deleted whole (via deleteLeaveById) even when only
    // part of the block falls inside the range, so a block never ends up
    // half-deleted with orphaned buffer entries outside the range; anything
    // left afterward under an in-range date is a plain (non-leave)
    // incident, which is removed per-date as usual
    const {blocks} = leaveBlocksInRange(from, to);
    blocks.forEach(b=>{
      deleteLeaveById(b.leaveId);
      cleared++;
      // keep 休假大表's planning record in sync so it doesn't keep showing
      // dates as ticked for a leave that no longer exists
      const rec = state.preplan.leave && state.preplan.leave[b.personId];
      if(rec){
        const blockDates = dateRangeList(b.start, b.end);
        rec.dates=(rec.dates||[]).filter(d=>!blockDates.includes(d));
        if(rec.honorDates) rec.honorDates=rec.honorDates.filter(d=>!blockDates.includes(d));
        if(!rec.dates.length) delete state.preplan.leave[b.personId];
      }
    });
    dates.forEach(d=>{
      if(state.unavail[d]!==undefined){
        cleared += state.unavail[d].length;
        delete state.unavail[d];
      }
    });
  }
  if(opts.dailyShiftOverrides) clearDateKeyed(state.dailyShiftOverrides);
  if(opts.longTermSuspensions) clearDateKeyed(state.longTermSuspensions);
  if(opts.dutyChanges) clearDateKeyed(state.dutyChanges);
  (opts.preplanKeys||[]).forEach(key=>{
    const store = state.preplan[key];
    if(!store) return;
    if(key==='leave'){
      // keyed by person, not date — trim the range out of each person's
      // date list (and honorDates) rather than deleting the whole record
      Object.keys(store).forEach(pid=>{
        const rec=store[pid];
        const before=(rec.dates||[]).length;
        rec.dates=(rec.dates||[]).filter(d=>!dates.has(d));
        if(rec.honorDates) rec.honorDates=rec.honorDates.filter(d=>!dates.has(d));
        if(rec.dates.length!==before) cleared++;
        if(!rec.dates.length) delete store[pid];
      });
    } else if(key==='standby'){
      // keyed by the block's own anchor date — a block counts as "in range"
      // if its anchor falls inside [from,to], even though the block itself
      // may run a day or two past the range's edge
      Object.keys(store).forEach(anchor=>{ if(dates.has(anchor)){ delete store[anchor]; cleared++; } });
    } else {
      clearDateKeyed(store);
    }
  });
  return cleared;
}
/* dry-run count of what each selected item would remove, for the
   pre-confirm preview — never mutates state */
function previewClearRange(from, to, opts){
  const dates = dateRangeList(from, to);
  const counts = {};
  const countDateKeyed = (obj)=>dates.filter(d=>obj[d]!==undefined).length;
  if(opts.assign) counts['衛哨排班'] = countDateKeyed(state.assign);
  if(opts.misc) counts['其他勤務'] = countDateKeyed(state.misc);
  if(opts.unavail){
    const {blocks, plainEntries} = leaveBlocksInRange(from, to);
    if(blocks.length) counts['休假紀錄（整段）'] = blocks.length;
    if(plainEntries.length) counts['事故登記'] = plainEntries.length;
  }
  if(opts.dailyShiftOverrides) counts['當日班別設定'] = countDateKeyed(state.dailyShiftOverrides);
  if(opts.longTermSuspensions) counts['長期事故暫停狀態'] = countDateKeyed(state.longTermSuspensions);
  if(opts.dutyChanges) counts['異動紀錄'] = countDateKeyed(state.dutyChanges);
  (opts.preplanKeys||[]).forEach(key=>{
    const store = state.preplan[key]||{};
    const type = PREPLAN_TYPES.find(t=>t.key===key);
    const label = '預排-'+(type? type.name : key);
    if(key==='leave'){
      const n = Object.values(store).reduce((n2,rec)=>n2+(rec.dates||[]).filter(d=>dates.includes(d)).length,0);
      if(n) counts[label]=n;
    } else if(key==='standby'){
      const n = Object.keys(store).filter(a=>dates.includes(a)).length;
      if(n) counts[label]=n;
    } else {
      const n = countDateKeyed(store);
      if(n) counts[label]=n;
    }
  });
  return counts;
}

          await navigator.share({files:[file], title:fileName});
          return;

    }catch(err){
      try{ ta.focus(); ta.select(); document.execCommand('copy'); btn.textContent='已複製 ✓'; }
      catch(err2){ showAlert('複製失敗，請手動選取文字方塊內容複製。'); }
    }
  };
}

/* everything from today onward that references this person, across every
   place a personId can end up — used before deleting someone from the
   roster so a transfer/discharge/mistake doesn't silently leave a duty
   short-handed without anyone noticing until the day arrives. Past dates
   are deliberately excluded: history isn't something that needs a warning
   or a reassignment, only what's still ahead does. */
function personFutureCommitments(personId){
  const today = todayStr();
  const out = [];
  Object.entries(state.assign).forEach(([d,cats])=>{
    if(d<today) return;
    Object.entries(cats).forEach(([catId,shifts])=>{
      const cat = state.categories.find(c=>c.id===catId);
      Object.entries(shifts).forEach(([sid,arr])=>{
        if((arr||[]).includes(personId)){
          const sh = cat? effectiveShifts(cat,d).find(s=>s.id===sid) : null;
          out.push({date:d, label:`${cat?cat.name:'?'}${sh?` ${sh.start}-${sh.end}`:''}`});
        }
      });
    });
  });
  Object.entries(state.misc).forEach(([d,arr])=>{
    if(d<today) return;
    (arr||[]).forEach(m=>{ if((m.personIds||[]).includes(personId)) out.push({date:d, label:`${m.role}${m.start?` ${m.start}-${m.end}`:''}`}); });
  });
  Object.entries(state.preplan||{}).forEach(([key,store])=>{
    const type = PREPLAN_TYPES.find(t=>t.key===key);
    if(!type) return;
    if(key==='leave'){
      const rec = store[personId];
      if(rec && (rec.dates||[]).some(d=>d>=today)) out.push({date:(rec.dates||[]).filter(d=>d>=today).sort()[0], label:'休假大表'});
      return;
    }
    Object.entries(store).forEach(([d,plan])=>{
      if(key==='standby'){
        if(d<today && plan.endDate<today) return;
        if((plan.personIds||[]).includes(personId)) out.push({date:d, label:'留守'});
        return;
      }
      if(d<today) return;
      const ids = plan.personIds || plan.dayPersonIds || plan.nightPersonIds ||
        Object.values(plan.slots||{}).flatMap(s=>s&&s.personIds||[]);
      if((ids||[]).includes(personId)) out.push({date:d, label:`預排-${type.name}`});
    });
  });
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
/* thoroughly removes a person from every place a personId can be stored —
   assign, misc (incl. nominalIds), unavail, and every 預排 type — not just
   assign+unavail like before, which left dangling references in 其他勤務
   and predata that would silently show "—" instead of a name. */
function purgePersonEverywhere(personId){
  Object.values(state.unavail).forEach(arr=>{
    const i=arr.findIndex(u=>u.personId===personId);
    if(i>-1) arr.splice(i,1);
  });
  Object.values(state.assign).forEach(cats=>Object.values(cats).forEach(shifts=>Object.keys(shifts).forEach(sid=>{
    shifts[sid]=shifts[sid].filter(pid=>pid!==personId);
  })));
  Object.values(state.misc).forEach(arr=>{
    (arr||[]).forEach(m=>{
      if(m.personIds) m.personIds = m.personIds.map(id=>id===personId? undefined : id);
      if(m.nominalIds) m.nominalIds = m.nominalIds.filter(id=>id!==personId);
    });
  });
  Object.entries(state.preplan||{}).forEach(([key,store])=>{
    if(key==='leave'){ delete store[personId]; return; }
    const type = PREPLAN_TYPES.find(t=>t.key===key);
    Object.values(store).forEach(plan=>{
      if(!plan) return;
      // 'roles' mode (救護車/採買) keeps position (index 0=駕駛, 1=車長), so
      // that slot is cleared rather than removed; every other personIds-like
      // field (留守名單, dayNight的日/夜班) is an unordered list and should
      // just have the person filtered out entirely
      if(type && type.mode==='roles' && Array.isArray(plan.personIds)){
        plan.personIds = plan.personIds.map(id=>id===personId? undefined : id);
      } else if(Array.isArray(plan.personIds)){
        plan.personIds = plan.personIds.filter(id=>id!==personId);
      }
      ['dayPersonIds','nightPersonIds','nominalIds','dayNominalIds','nightNominalIds'].forEach(f=>{
        if(Array.isArray(plan[f])) plan[f] = plan[f].filter(id=>id!==personId);
      });
      if(plan.slots) Object.values(plan.slots).forEach(s=>{
        if(s && s.personIds) s.personIds = s.personIds.filter(id=>id!==personId);
        if(s && s.nominalIds) s.nominalIds = s.nominalIds.filter(id=>id!==personId);
      });
      if(plan.overrides) delete plan.overrides[personId];
      if(plan.subDuties) Object.values(plan.subDuties).forEach(byDate=>{
        Object.values(byDate).forEach(cfg=>{ if(cfg && cfg.personIds) cfg.personIds=cfg.personIds.filter(id=>id!==personId); });
      });
    });
  });
  Object.values(state.longTermSuspensions||{}).forEach(arr=>{
    const i=(arr||[]).indexOf(personId);
    if(i>-1) arr.splice(i,1);
  });
}

function wirePeopleListButtons(){
    document.querySelectorAll('[data-del-person]').forEach(b=>{

          state.personnel = state.personnel.filter(p=>p.id!==id);
          purgePersonEverywhere(id);
          saveState(); render();
        };
        if(commitments.length){
          const lines = commitments.slice(0,10).map(c=>`${minguoLabel(c.date)}：${c.label}`);
          showConfirm(`⚠️ ${person?person.name:'此人'}今天以後還有 ${commitments.length} 筆排班/預排：\n${lines.join('\n')}${commitments.length>10?`\n…還有 ${commitments.length-10} 筆`:''}\n\n刪除後這些名額會變成空缺，需要自己找人補上。確定要刪除嗎？（如果只是要記錄他離開，之後不用再排班，也可以考慮先不刪除，等這些班表處理完再刪）`, proceed);
        } else {
          showConfirm('刪除此人員？（也會一併移除其請假紀錄與排班；已搜尋後續日期均無執勤）', proceed);
        }
      };

      b.onclick=()=>openPersonEditor(b.dataset.editPerson);
    });
    document.querySelectorAll('[data-reactivate-person]').forEach(b=>{
      b.onclick=()=>{
        const p=state.personnel.find(x=>x.id===b.dataset.reactivatePerson);
        if(!p) return;
        showConfirm(`確定要恢復 ${p.name} 嗎？會清掉離退日期，之後可以再被排班。`, ()=>{
          delete p.departureDate;
          saveState(); render();
        });
      };
    });
  }
  function applyPeopleFilter(){
    const kw=document.getElementById('pplSearch').value.trim();
    const gf=document.getElementById('pplGroupFilter').value;
    const lf=[...document.querySelectorAll('.ppl-license-cb:checked')].map(cb=>cb.value);
    const mf=[...document.querySelectorAll('.ppl-medcert-cb:checked')].map(cb=>cb.value);
    const sf=[...document.querySelectorAll('.ppl-skill-cb:checked')].map(cb=>cb.value);
    pplFilterState = {kw, group:gf, license:lf, medCert:mf, skills:sf};
    const filterFn = p=>{
      if(isDeparted(p)) return false;
      if(kw && !p.name.includes(kw)) return false;
      if(gf==='__none' && p.group) return false;
      if(gf && gf!=='__none' && p.group!==gf) return false;
      if(lf.length){
        const matchLicense = lf.includes('__none')? !p.license : false;
        if(!matchLicense && !lf.includes(p.license)) return false;
      }
      if(mf.length){
        const matchMed = mf.includes('__none')? !p.medCert : false;
        if(!matchMed && !mf.includes(p.medCert)) return false;
      }
      if(sf.length){
        const matchSkill = sf.includes('__none')? !(p.skills&&p.skills.length) : (p.skills||[]).some(s=>sf.includes(s));
        if(!matchSkill) return false;
      }
      return true;
    };
    const area=document.getElementById('pplListArea');
    const html=renderPeopleGroups(groups, filterFn);
    area.innerHTML = html || `<div class="empty">找不到符合的人員</div>`;
    wirePeopleListButtons();
    const activeTotal = state.personnel.filter(p=>!isDeparted(p)).length;
    const filteredPeople = state.personnel.filter(filterFn);
    document.getElementById('pplSummary').innerHTML = personListSummaryHTML(filteredPeople, state.personnel.filter(p=>!isDeparted(p)));
    const filteredTotal = filteredPeople.length;
    const isFiltering = kw || gf || lf.length || mf.length || sf.length;
    document.getElementById('pplCountLabel').textContent = isFiltering
      ? `名冊（篩選出 ${filteredTotal} / 共 ${activeTotal} 人）`
      : `名冊（${activeTotal}人）`;
  }
  document.getElementById('pplSearch').oninput=applyPeopleFilter;
  document.getElementById('pplGroupFilter').onchange=applyPeopleFilter;
  document.querySelectorAll('.ppl-license-cb, .ppl-medcert-cb, .ppl-skill-cb').forEach(cb=>{
    cb.onchange=applyPeopleFilter;
  });
  if(pplFilterState.kw || pplFilterState.group || pplFilterState.license.length || pplFilterState.medCert.length || pplFilterState.skills.length){
    applyPeopleFilter();
  }
  document.getElementById('pplClearFilter').onclick=()=>{

    document.getElementById('pplGroupFilter').value='';
    document.querySelectorAll('.ppl-license-cb, .ppl-medcert-cb, .ppl-skill-cb').forEach(cb=>cb.checked=false);

function renderLeaveGroupSummary(date){
  const entries = (state.unavail[date]||[]).filter(u=>!isLeaveBufferEntry(u) && isLeaveReason(u.reason));
  const personIds = [...new Set(entries.map(u=>u.personId))];
  const people = personIds.map(id=>state.personnel.find(p=>p.id===id)).filter(Boolean);
  if(!people.length) return `<div class="empty">今天沒有人休假</div>`;
  const byGroup = {};
  people.forEach(p=>{
    const g = p.group || '未分組';
    if(!byGroup[g]) byGroup[g]=[];
    byGroup[g].push(p);
  });
  const total = {軍官:0,士官:0,士兵:0};
  people.forEach(p=>{ const k=rankCategory(p.rank); if(k) total[k]++; });
  let html = `<div class="muted" style="margin-bottom:8px">全連共 ${people.length} 人休假・${total.軍官}官${total.士官}士${total.士兵}兵</div>`;
  html += Object.entries(byGroup).sort((a,b)=>groupIndex(a[0])-groupIndex(b[0])).map(([g,members])=>{
    const bd = {軍官:0,士官:0,士兵:0};
    members.forEach(p=>{ const k=rankCategory(p.rank); if(k) bd[k]++; });
    const sorted = members.slice().sort((a,b)=>rankIndex(a.rank)-rankIndex(b.rank));
    const inner = sorted.map(p=>{
      const lid = findLeaveIdForPerson(p.id, date);
      return `<div class="row" style="margin-bottom:2px">
        <span class="muted grow">・${esc(p.name)}（${p.rank}）</span>
        ${lid? `<button class="ghost small" data-goto-leave-table="${p.id}">去休假大表改</button>` : ''}
      </div>`;
    }).join('');
    return collapsibleCardHTML('leaveGroup-'+g, `${esc(g)}（${members.length}人・${bd.軍官}官${bd.士官}士${bd.士兵}兵）`, inner);
  }).join('');
  return html;
}
/* creates one leave block (with its own leaveId + buffer entries) for one
   person — extracted so both the 新增人員休假 form and the 編輯休假 modal
   (which can split one block into several) share the exact same logic */
function createLeaveSegment(personId, s, e, honorRequested, approved){
  const bufferDays=daysBetweenInclusive(prevDateStr(s), nextDateStr(e));
  const honorApplies = honorRequested && (bufferDays<=5 || approved);
  const firstRoster=prevDateStr(s);
  const lastRoster=nextDateStr(e);
  const firstStart = honorApplies? '12:00':'18:00';
  const reasonLabel = honorApplies? '榮譽假':'休假';
  const leaveId=uid();
  if(!state.unavail[firstRoster]) state.unavail[firstRoster]=[];
  state.unavail[firstRoster].push({id:uid(),personId,allDay:false,start:firstStart,end:'24:00',reason:reasonLabel,leaveId,leaveStart:s,leaveEnd:e});
  dateRangeList(s,e).forEach(d=>{
    if(!state.unavail[d]) state.unavail[d]=[];
    state.unavail[d].push({id:uid(),personId,allDay:true,start:'',end:'',reason:reasonLabel,leaveId,leaveStart:s,leaveEnd:e});
  });
  if(!state.unavail[lastRoster]) state.unavail[lastRoster]=[];
  state.unavail[lastRoster].push({id:uid(),personId,allDay:false,start:'00:00',end:'07:30',reason:reasonLabel,leaveId,leaveStart:s,leaveEnd:e});
  // report back whether the requested 榮譽假 actually took effect, so callers
  // (like the leave-table importer) can surface it instead of it silently
  // falling back to a normal 18:00 start
  return {honorApplied: honorApplies, honorDowngraded: !!honorRequested && !honorApplies, leaveId};
}
function deleteLeaveById(leaveId){
  Object.keys(state.unavail).forEach(d=>{
    state.unavail[d]=(state.unavail[d]||[]).filter(u=>u.leaveId!==leaveId);
  });

function isLeaveReason(reason){ return !!reason && reason.includes('假'); }
function isLeaveBufferEntry(u){
  if(u.allDay) return false;
  return (u.start==='18:00' && u.end==='24:00') || (u.start==='12:00' && u.end==='24:00') || (u.start==='00:00' && u.end==='07:30');
}
function onDutyList(date){
  const dayEntries = state.unavail[date]||[];
  const awayIds = new Set(dayEntries.filter(u=>u.allDay && (isLeaveReason(u.reason) || u.inCamp===false)).map(u=>u.personId));
  // NOTE: 全日出勤（營外）(e.g. 採買/督伙 all day) does NOT remove someone
  // from 在勤人員 — they still have an assigned task and count as "on
  // duty", just physically away; renderOnDutyList annotates them with the
  // task name instead. Only 休假 and 在營=否 (長期事故/單日事故) genuinely
  // take someone off the roster for the day.
  return state.personnel.filter(p=>{
    if(awayIds.has(p.id)) return false;
    const lt = effectiveLongTerm(p, date);
    // 「在營」only makes someone disappear from this whole-day list when it's
    // a whole-day setting (mode='allday') — a 時段性不可排(mode='range')'s
    // 在營=否 only means they're away during THAT time window each day, not
    // all day, so it must not exclude them from a day-level list like this
    if(lt.mode==='allday' && !lt.inCamp) return false;
    return true;
  }).sort((a,b)=>groupIndex(a.group)-groupIndex(b.group) || rankIndex(a.rank)-rankIndex(b.rank));
}
function isHolidayDate(date){
  const d = new Date(date+'T00:00:00');
  const dow = d.getDay();
  if((state.holidayWeekdays||[]).includes(dow)) return true;
  if((state.holidayDates||[]).includes(date)) return true;
  return false;
}
function outingBlackoutForDate(date){
  if(isHolidayDate(date)) return true;
  if(isHolidayDate(nextDateStr(date))) return true;
  return false;
}
function isEligibleForOuting(personId, date){
  if(outingBlackoutForDate(date)) return false;
  const person = state.personnel.find(p=>p.id===personId);
  if(person && person.outingRestriction==='none') return false;
  const curfewIsShort = (state.outingCurfewDates||[]).includes(date) || !!(person && person.outingRestriction==='dayOnly');
  if(curfewIsShort){
    // shortened outing (18:00-24:00, must be back in camp by 24:00): only
    // a sentry duty actually falling inside that window (prep time
    // included) is a real conflict — an early-morning shift the next
    // segment over is unaffected since the person's already back by then
    const dayAssign = state.assign[date]||{};
    for(const cat of state.categories){
      if(!cat.isSentry) continue;
      const catAssign = dayAssign[cat.id]||{};
      for(const sft of effectiveShifts(cat, date)){
        if(!(catAssign[sft.id]||[]).includes(personId)) continue;
        if(windowsOverlapOnce(18*60, 24*60, shiftBusyStartMin(cat,sft), toMin(sft.end))) return false;
      }
    }
  } else if(state.outingExcludeOvernightSentry){
    const dayAssign = state.assign[date]||{};
    for(const cat of state.categories){
      if(!cat.isSentry) continue;
      const catAssign = dayAssign[cat.id]||{};
      for(const sft of effectiveShifts(cat, date)){
        if(!(catAssign[sft.id]||[]).includes(personId)) continue;
        const sMin=toMin(sft.start);
        if(sMin>=22*60 || sMin<6*60) return false;
      }
    }
  }
  const excluded = state.outingExcludedMiscRoles||[];
  for(const m of (state.misc[date]||[])){
    if(!(m.personIds||[]).includes(personId)) continue;
    if(excluded.includes(m.role)) return false;
    const preset = presetForEntry(m);
    if(preset && preset.isSentry && m.start && m.end){
      if(curfewIsShort){
        if(windowsOverlapOnce(18*60,24*60,toMin(m.start),toMin(m.end))) return false;
      } else if(state.outingExcludeOvernightSentry){
        const sMin=toMin(m.start);
        if(sMin>=22*60 || sMin<6*60) return false;
      }
    }
  }
  return true;
}

  const parts=[];
  (state.unavail[date]||[]).filter(u=>u.personId===personId && isLeaveBufferEntry(u)).forEach(u=>{
    if(u.end==='24:00') parts.push(`今日${u.start}休假${u.start==='12:00'?'（榮譽假）':''}`);
    else if(u.start==='00:00' && u.end==='07:30') parts.push(`今日${u.end}收假`);
  });
  const dayAssign = (state.assign[date]||{});
  state.categories.forEach(cat=>{
    const catAssign = dayAssign[cat.id]||{};
    effectiveShifts(cat, date).forEach(sft=>{
      if((catAssign[sft.id]||[]).includes(personId)){
        parts.push(`${cat.name} ${sft.label||sft.start+'-'+sft.end}`);
      }
    });
  });
  (state.misc[date]||[]).forEach(m=>{
    if((m.personIds||[]).includes(personId)){
      const preset = presetForEntry(m);
      const awayTag = preset && preset.isAllDayAway ? '🚗營外・' : '';
      parts.push(`${awayTag}${m.role}${m.start&&m.end? ` (${m.start}-${m.end})`:''}`);

/* On mobile, tapping a checkbox in a filtered list blurs the search box and
   the keyboard slides away — so picking several people while filtering means
   re-tapping the search field every time. Suppressing the default mousedown
   on the list keeps focus (and the keyboard) on the search input; the click
   still reaches the label and toggles the checkbox as usual. */
/* On mobile, tapping a checkbox in a filtered list blurs the search box and
   the keyboard slides away — so picking several people while filtering means
   re-tapping the search field every time. Earlier this suppressed touchstart
   outright, which also killed scrolling; instead let every gesture through
   untouched and simply restore focus to the search box after a pick, which
   keeps the keyboard up without interfering with scrolling or tapping. */
function keepSearchFocusOnPick(listEl, searchEl){
  if(!listEl) return;
  const findSearch=()=>searchEl || (listEl.closest('div,form')||document).querySelector('input[type="text"]');
  listEl.addEventListener('mousedown', e=>{
    // desktop: preventing the default here stops focus leaving the input,
    // and the click still reaches the label so the checkbox toggles
    if(e.target.closest('label')) e.preventDefault();
  });
  listEl.addEventListener('change', e=>{
    if(!e.target.matches('input[type="checkbox"],input[type="radio"]')) return;
    const se=findSearch();
    if(se && document.activeElement!==se && se.value!==undefined && se.dataset.keepFocus!=='off'){
      // only refocus if the user was actually filtering — otherwise popping
      // the keyboard open unprompted is worse than losing it
      if(se.value.trim()) se.focus({preventScroll:true});
    }
  });
}

let collapseState={};

function wireDragReorder(containerId, arr, onReorder){
  const container = document.getElementById(containerId);
  if(!container) return;
  const rows = [...container.querySelectorAll('[data-drag-idx]')];
  if(!rows.length) return;
  const rects = rows.map(r=>r.getBoundingClientRect());
  const heights = rects.map(r=>r.height);
  const tops = rects.map(r=>r.top);
  rows.forEach((row, originalIdx)=>{
    const handle = row.querySelector('[data-drag-handle]');
    if(!handle) return;
    handle.style.touchAction='none';
    let startY=0, dragging=false, currentSlot=originalIdx;
    handle.addEventListener('touchstart', (e)=>{
      dragging=true;
      startY = e.touches[0].clientY;
      currentSlot = originalIdx;
      row.style.transition='none';
      row.style.zIndex='5';
      row.style.position='relative';
      row.style.boxShadow='0 4px 10px rgba(0,0,0,.5)';
      rows.forEach(r=>{ if(r!==row) r.style.transition='transform .15s ease'; });
      e.preventDefault();
    }, {passive:false});
    handle.addEventListener('touchmove', (e)=>{
      if(!dragging) return;
      e.preventDefault();
      const deltaY = e.touches[0].clientY - startY;
      row.style.transform = `translateY(${deltaY}px)`;
      const draggedCenter = tops[originalIdx] + heights[originalIdx]/2 + deltaY;
      let target = 0;
      for(let i=0;i<rows.length;i++){
        if(draggedCenter > tops[i] + heights[i]/2) target = i;
      }
      if(target !== currentSlot){
        rows.forEach((r,i)=>{
          if(r===row) return;
          if(target > currentSlot){
            r.style.transform = (i > currentSlot && i <= target) ? `translateY(${-heights[originalIdx]}px)` : '';
          } else {
            r.style.transform = (i >= target && i < currentSlot) ? `translateY(${heights[originalIdx]}px)` : '';
          }
        });
        currentSlot = target;
      }
    }, {passive:false});
    const finish = ()=>{
      if(!dragging) return;
      dragging=false;
      const [item] = arr.splice(originalIdx, 1);
      arr.splice(currentSlot, 0, item);
      row.style.transform=''; row.style.zIndex=''; row.style.position=''; row.style.boxShadow='';
      rows.forEach(r=>{ r.style.transform=''; r.style.transition=''; });
      onReorder();
    };
    handle.addEventListener('touchend', finish);
    handle.addEventListener('touchcancel', finish);
  });
}

/* generic drag-to-reorder card list, shared by any tab whose cards the user
   should be able to rearrange (休假/事故, 統計) — each tab keeps its own
   persisted order of card keys in state.cardOrder[tab]; a card not yet in
   the stored order (new feature, or the first time this ever runs) sorts
   after everything else, in its original definition order */
function sortedCardDefs(tab, defs){
  const order = (state.cardOrder && state.cardOrder[tab]) || [];
  return [...defs].sort((a,b)=>{
    const ai=order.indexOf(a.key), bi=order.indexOf(b.key);
    const ra = ai<0? 1000+defs.indexOf(a) : ai;
    const rb = bi<0? 1000+defs.indexOf(b) : bi;
    return ra-rb;
  });
}
function draggableCardWrap(html){
  // cards are built via collapsibleCardHTML, whose template always starts
  // with this exact section-title+h2 opening — inject the grab handle
  // right before the title text so it visually sits in the header
  return html.replace('<h2 style="margin:0">', '<h2 style="margin:0"><span data-drag-handle style="cursor:grab;padding-right:6px;color:var(--dim)">⠿</span>');

  const sorted = sortedCardDefs(tab, defs);
  return `<div id="${containerId}">${sorted.map((d,i)=>`<div data-card-key="${esc(d.key)}" data-drag-idx="${i}">${draggableCardWrap(d.html)}</div>`).join('')}</div>`;
}
function wireCardListDrag(containerId, tab, defs){
  const sorted = sortedCardDefs(tab, defs);
  const keys = sorted.map(d=>d.key);
  wireDragReorder(containerId, keys, ()=>{
    if(!state.cardOrder) state.cardOrder={};
    state.cardOrder[tab] = keys;

  });

/* ---------------- 臨時異動 (duty changes) ---------------- */
function reconcileDutyChanges(date){
  const changes = state.dutyChanges[date];
  if(!changes || !changes.length) return;
  let changed=false;
  changes.forEach(ch=>{
    if(ch.status==='filled') return;
    let currentPid = null;
    if(ch.source.kind==='cat'){
      currentPid = (((state.assign[date]||{})[ch.source.catId]||{})[ch.source.shiftId]||[])[ch.source.slotIdx] || null;
    } else if(ch.source.kind==='misc'){
      const entry = (state.misc[date]||[]).find(m=>m.id===ch.source.miscId);
      currentPid = entry? (entry.personIds||[])[ch.source.slotIdx] || null : null;
    }
    if(currentPid && currentPid!==ch.personId){
      ch.status='filled';
      ch.filledPersonId=currentPid;
      changed=true;
    }
  });
  if(changed) saveState();
}
/* every (category-shift-slot / misc-entry-slot) a person currently occupies
   today — used to populate the ⚡臨時異動 modal's checklist */
function personTodaySlots(personId, date){

    const catAssign = dayAssign[cat.id]||{};

          source: {kind:'cat', catId:cat.id, shiftId:sft.id, slotIdx:idx}
        });
      }

  });
  (state.misc[date]||[]).forEach(m=>{
    (m.personIds||[]).forEach((pid,idx)=>{
      if(pid===personId){

        });

    });
  });
  return out;
}
function clearDutySlot(date, source){

    if(entry && entry.personIds) entry.personIds[source.slotIdx]=undefined;
  }
}

/* ---------------- 當日進度摘要 ---------------- */
/* one-glance counts for the whole day, so opening 排班 immediately shows
   what still needs work instead of requiring each card to be expanded */
function dayProgressSummary(date){
  /* 衛哨 and non-sentry categories (打飯班 etc.) are counted separately —
     lumping them together made "0/29" ambiguous about what was actually
     short-staffed */
  let catFilled=0, catTotal=0, otherCatFilled=0, otherCatTotal=0;
  orderedCategories().forEach(cat=>{
    const dayAssign=(state.assign[date]||{})[cat.id]||{};
    effectiveShifts(cat, date).forEach(s=>{
      const filled=(dayAssign[s.id]||[]).filter(Boolean).length;
      if(cat.isSentry){ catTotal += s.count; catFilled += filled; }
      else { otherCatTotal += s.count; otherCatFilled += filled; }
    });
  });
  let miscFilled=0, miscTotal=0;
  (state.misc[date]||[]).forEach(m=>{
    if(m.roles){
      miscTotal += m.roles.length;
      miscFilled += m.personIds.filter((pid,i)=>pid || (m.lockedSlots&&m.lockedSlots[i])).length;
    } else {
      const n=(m.personIds||[]).filter(Boolean).length;
      miscTotal += Math.max(1,n);
      miscFilled += n;
    }
  });
  const pendingChanges = (state.dutyChanges[date]||[]).filter(ch=>ch.status!=='filled').length;
  return {catFilled, catTotal, otherCatFilled, otherCatTotal, miscFilled, miscTotal, pendingChanges};
}
function dayProgressBarHTML(){
  const s = dayProgressSummary(currentDate);
  const catShort = s.catFilled<s.catTotal;
  const otherShort = s.otherCatFilled<s.otherCatTotal;
  const miscShort = s.miscFilled<s.miscTotal;
  const allDone = !catShort && !otherShort && !miscShort && !s.pendingChanges;
  return `<div class="card" style="padding:8px 12px">
    <div class="row wrap" style="gap:10px;align-items:center">
      <span style="font-size:13px;font-weight:600">${allDone? '✅ 今日排班已完成' : '📋 今日進度'}</span>
      ${s.catTotal? `<span class="${catShort?'warn':'muted'}" style="font-size:12px">衛哨 ${s.catFilled}/${s.catTotal}${catShort?' ⚠️':''}</span>`:''}
      ${s.otherCatTotal? `<span class="${otherShort?'warn':'muted'}" style="font-size:12px">打飯班等 ${s.otherCatFilled}/${s.otherCatTotal}${otherShort?' ⚠️':''}</span>`:''}
      ${s.miscTotal? `<span class="${miscShort?'warn':'muted'}" style="font-size:12px">其他勤務 ${s.miscFilled}/${s.miscTotal}${miscShort?' ⚠️':''}</span>`:''}
      ${s.pendingChanges? `<span class="warn" style="font-size:12px">未遞補異動 ${s.pendingChanges} ⚠️</span>`:''}
    </div>
  </div>`;
}
/* ---------------- 找補位 ---------------- */
/* Ranks candidates for a specific empty (or to-be-vacated) slot by how
   disruptive picking them would be, so the common case — "someone dropped
   out mid-day, find cover without unravelling everyone else's schedule" —
   surfaces the people who cost nothing to move first.
   tier 0: free at that time AND has nothing else all day
   tier 1: free at that time but already has other duties today
   tier 2: busy at that time — taking them means dropping that other duty */
/* the non-negotiable part of unavailability: leave, incidents, long-term
   settings and comp-rest — i.e. everything EXCEPT being assigned to another
   duty, which is the movable part the substitute finder is willing to
   trade away. Returns [] when the person is genuinely free. */
function hardUnavailabilityReasons(personId, date, s, e){
  const out=[];
  const person = state.personnel.find(p=>p.id===personId);
  if(person){
    if(person.departureDate && date>=person.departureDate) out.push(`已離退（${minguoLabel(person.departureDate)}起）`);
    const lt = effectiveLongTerm(person, date);
    if(lt.mode==='allday') out.push('長期事故：全天不可排');
    else if(lt.mode==='range' && lt.start && lt.end && windowsOverlapRecurring(s,e,toMin(lt.start),toMin(lt.end))) out.push(`長期事故：每天 ${lt.start}-${lt.end} 不可排`);
  }
  (state.unavail[date]||[]).filter(u=>u.personId===personId).forEach(u=>{
    const hit = u.allDay || incidentBlocksWindow(u, s, e, false);
    if(hit) out.push(`${u.allDay? '全天':`${u.start}-${u.end}`}${u.reason? '（'+u.reason+'）':'（未註記原因）'}`);
  });
  for(const w of personCompRestWindows(personId, date)){
    if(windowsOverlapRecurring(s,e,toMin(w.start),toMin(w.end))) out.push(`補休中（${w.catName} ${w.label} 後，至 ${w.end}）`);
  }
  return [...new Set(out)];
}
function findSubstitutes(date, opts){
  const {sMin, eMin, excludeIds=[], eligibleFn, catId, shiftId, cat, shift} = opts;
  const out=[];
  state.personnel.forEach(p=>{
    if(excludeIds.includes(p.id)) return;
    if(eligibleFn && !eligibleFn(p)){
      out.push({person:p, tier:3, note:'不符合這個位置的資格要求', blockers:[]});
      return;
    }
    if(isPersonOnExclusiveStandby(p.id, date)){
      out.push({person:p, tier:3, note:'只能待命，不接其他任務', blockers:[]});
      return;
    }
    if(isDutyOfficer(p.id, date)){
      out.push({person:p, tier:3, note:'今日值星，負責安排勤務不自行出勤', blockers:[]});
      return;
    }
    const hardReasons = hardUnavailabilityReasons(p.id, date, sMin, eMin);
    if(hardReasons.length){
      out.push({person:p, tier:3, note:hardReasons.join('・'), blockers:[]});
      return;
    }
    // what they're actually doing right now (the movable part)
    const blockers = personDutiesInWindow(p.id, date, sMin, eMin, {catId, shiftId});
    const dutiesToday = personDutySummary(p.id, date);
    if(blockers.length){
      out.push({person:p, tier:2, note:'目前在：'+blockers.map(b=>b.label).join('、'), blockers});
    } else if(dutiesToday.length){
      out.push({person:p, tier:1, note:'今日已有：'+dutiesToday.join('、'), blockers:[]});
    } else {
      out.push({person:p, tier:0, note:'今日完全沒有任務', blockers:[]});
    }
  });
  // within a tier prefer whoever is carrying the lightest load today, then
  // the category's own rank preference — spreads duty instead of always
  // landing on the same person
  out.sort((a,b)=>{
    if(a.tier!==b.tier) return a.tier-b.tier;
    const la=personDutySummary(a.person.id,date).length, lb=personDutySummary(b.person.id,date).length;
    if(la!==lb) return la-lb;
    if(cat && shift) return dutySortIndex(a.person.rank,cat,0,shift)-dutySortIndex(b.person.rank,cat,0,shift);
    return rankIndex(a.person.rank)-rankIndex(b.person.rank);
  });
  return out;
}
/* every duty (category shift or misc entry) the person occupies that
   overlaps the given window — the things that would have to be dropped
   for them to cover this slot instead */
function personDutiesInWindow(personId, date, sMin, eMin, exclude){
  const out=[];
  const dayAssign = state.assign[date]||{};
  orderedCategories().forEach(cat=>{
    const catAssign = dayAssign[cat.id]||{};
    effectiveShifts(cat, date).forEach(sft=>{
      if(exclude && exclude.catId===cat.id && exclude.shiftId===sft.id) return;
      const arr = catAssign[sft.id]||[];
      const idx = arr.indexOf(personId);
      if(idx>-1 && windowsOverlapOnce(sMin,eMin,shiftBusyStartMin(cat,sft),wrapEndMin(toMin(sft.start),toMin(sft.end)))){
        out.push({kind:'cat', catId:cat.id, shiftId:sft.id, slotIdx:idx, label:`${cat.name} ${sft.label||sft.start+'-'+sft.end}`});
      }
    });
  });
  (state.misc[date]||[]).forEach(m=>{
    if(!m.start || !m.end) return;
    (m.personIds||[]).forEach((pid,idx)=>{
      if(pid!==personId) return;
      if((m.nominalIds||[]).includes(pid)) return; // 掛名：not actually occupying this slot
      if(windowsOverlapOnce(sMin,eMin,toMin(m.start),wrapEndMin(toMin(m.start),toMin(m.end)))){
        out.push({kind:'misc', miscId:m.id, slotIdx:idx, label:`${m.role}${m.start&&m.end?` (${m.start}-${m.end})`:''}`});
      }
    });
  });
  return out;
}
function openSubstituteModal(source){
  const date = currentDate;
  let sMin, eMin, label, eligibleFn, cat=null, shift=null, currentPersonId=null, excludeIds=[];
  if(source.kind==='cat'){
    cat = state.categories.find(c=>c.id===source.catId);
    shift = effectiveShifts(cat, date).find(s=>s.id===source.shiftId);
    if(!cat || !shift) return;
    sMin = toMin(shift.start); eMin = wrapEndMin(sMin, toMin(shift.end));
    label = `${cat.name} ${shift.label||shift.start+'-'+shift.end}`;
    const arr = ((state.assign[date]||{})[cat.id]||{})[shift.id]||[];
    currentPersonId = arr[source.slotIdx]||null;

  if(currentPersonId) excludeIds = excludeIds.concat([currentPersonId]);
  const results = findSubstitutes(date, {sMin, eMin, excludeIds, eligibleFn, catId:source.catId, shiftId:source.shiftId, cat, shift});
  const tierMeta = {
    0:{icon:'🟢', title:'完全有空（補進來不影響任何人）'},

    3:{icon:'⛔', title:'不可排'},
  };

  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:flex;align-items:flex-end;';
  modal.innerHTML=`
    <div class="sheet-inner">
      <div class="section-title"><h2 style="margin:0">找補位：${esc(label)}</h2><button class="ghost small" id="closeModal">關閉</button></div>
      <div class="hint" style="margin-bottom:8px">${currentPersonId? `目前是 <b>${esc(personName(currentPersonId))}</b>，選一位補上會把他換掉並留下異動紀錄。`:'這一格目前是空的，選一位補上。'}依「補進來要付出多少代價」由低到高排序，同一層裡今天班較少的人排前面。</div>
      <div class="row wrap" style="margin-bottom:8px">
        <div class="grow"><label>搜尋姓名</label><input type="text" id="subSearch" placeholder="輸入姓名關鍵字"></div>
      </div>
      <div id="subList">
      ${[0,1,2,3].map(t=>{
        if(!grouped[t].length) return '';
        return `<div style="margin-bottom:10px">
          <div class="hint" style="margin-bottom:4px"><b>${tierMeta[t].icon} ${tierMeta[t].title}（${grouped[t].length}）</b></div>
          ${grouped[t].map(r=>`
            <div class="row sub-row" data-sub-name="${esc(r.person.name)}" style="align-items:flex-start;margin-bottom:4px">
              <span class="muted grow">・${esc(r.person.name)}（${r.person.group||'未分組'}·${r.person.rank}${personBadges(r.person)}）<br><span style="font-size:11px;color:var(--dim)">${esc(r.note)}</span></span>
              ${t===3
                ? `<button class="ghost small danger" data-sub-pick="${r.person.id}" data-sub-tier="${t}" data-sub-note="${esc(r.note)}">仍要排</button>`

  document.body.appendChild(modal);

        if(swapTarget){

          writeSlot(source, pid);
          if(replaced) writeSlot(swapTarget, replaced);

          });

              openSubstituteModal(swapTarget.kind==='cat'
                ? {kind:'cat', catId:swapTarget.catId, shiftId:swapTarget.shiftId, slotIdx:swapTarget.slotIdx}
