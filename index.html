<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>衛哨排班</title>
<style>
:root{
  --bg:#11161c;
  --panel:#1a2029;
  --panel2:#212936;
  --line:#2c3542;
  --text:#e7ebf0;
  --dim:#8b97a6;
  --accent:#c98a3c;
  --accent2:#7d9a5f;
  --danger:#c9573c;
  --ok:#5a9a6f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",Segoe UI,sans-serif;}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom));}
h1,h2,h3{font-weight:600;margin:0 0 10px;}
h1{font-size:17px;letter-spacing:.5px;}
h2{font-size:14px;color:var(--accent);}
h3{font-size:13px;color:var(--dim);font-weight:500;}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);}
.unit-banner{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 14px 6px;background:linear-gradient(180deg,#1a2117,var(--bg));border-bottom:1px solid rgba(125,154,95,.35);}
.unit-banner-badge{width:18px;height:18px;border-radius:50%;background:var(--accent2);color:#0d130a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.unit-banner-text{font-size:12px;letter-spacing:2.5px;color:var(--accent2);font-weight:600;}
.topbar-main{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;}
.container{padding:12px 12px 40px;max-width:640px;margin:0 auto;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.row{display:flex;gap:8px;align-items:center;}
.row.wrap{flex-wrap:wrap;}
.grow{flex:1;min-width:0;}
label{display:block;font-size:11px;color:var(--dim);margin-bottom:3px;}
input[type=text],input[type=date],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:9px 8px;border-radius:6px;font-size:14px;font-family:inherit;
}
select{-webkit-appearance:none;appearance:none;}
input[type=checkbox]{width:22px !important;height:22px !important;min-width:22px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
button{
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  padding:9px 12px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;
}
button.primary{background:var(--accent);border-color:var(--accent);color:#1a140a;font-weight:600;}
button.ghost{background:transparent;}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent;}
button.small{padding:5px 9px;font-size:12px;}
button{transition:transform .12s ease, opacity .12s ease;}
button:active{opacity:.6;transform:scale(.94);}
button:disabled{opacity:.3;cursor:default;}
button:disabled:active{transform:none;}
@keyframes pressFlash{0%{background-color:var(--accent);color:#1a140a;}100%{background-color:inherit;color:inherit;}}
button.press-flash{animation:pressFlash .4s ease;}
button.pressed,.pill-btn.pressed{opacity:.6;transform:scale(.94);}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom);}
.tabs button{flex:1;background:transparent;border:none;border-radius:0;padding:11px 4px;font-size:12px;color:var(--dim);}
.tabs button.active{color:var(--accent);font-weight:600;}
.list-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;}
.tag.rank-軍官{color:#c9573c;border-color:#c9573c;}
.tag.rank-士官{color:#c98a3c;border-color:#c98a3c;}
.tag.rank-士兵{color:#7d9a5f;border-color:#7d9a5f;}
.muted{color:var(--dim);font-size:12px;}
.warn{color:var(--danger);font-size:12px;}
.ok{color:var(--ok);font-size:12px;}
.shift-row{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;background:var(--panel2);}
.shift-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.shift-time{font-size:13px;font-weight:600;}
.slot-select{margin-bottom:4px;}
.badge-issue{display:inline-block;font-size:11px;color:var(--danger);margin-top:2px;}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:0;min-height:22px;}
.section-title h2{margin:0;}
.hr-table{width:100%;border-collapse:collapse;font-size:11px;}
.hr-table td,.hr-table th{padding:3px 2px;text-align:center;border-bottom:1px solid var(--line);}
.hr-table th{color:var(--dim);font-weight:500;}
.bar-wrap{background:var(--panel2);border-radius:3px;overflow:hidden;height:14px;position:relative;}
.bar-fill{background:var(--accent2);height:100%;}
.pill-btn{display:inline-block;padding:4px 9px;border-radius:14px;border:1px solid var(--line);font-size:12px;margin:2px 3px 0 0;background:var(--panel2);transition:transform .12s ease, opacity .12s ease;}
.pill-btn:active{opacity:.6;transform:scale(.93);}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:20px 0;}
.divider{height:1px;background:var(--line);margin:12px 0;}
textarea{min-height:50px;resize:vertical;}
.hint{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5;}
.time-select-pair{display:inline-flex;align-items:center;gap:3px;width:100%;}
.time-select-pair select{width:auto;flex:1;min-width:0;}
.time-select-colon{color:var(--dim);}
</style>
</head>
<body>

<div class="topbar">
  <div class="unit-banner">
    <span class="unit-banner-badge">★</span>
    <span class="unit-banner-text">陸軍第八軍團 本部連</span>
  </div>
  <div class="topbar-main">
    <div class="row" style="gap:6px;align-items:center">
      <button class="ghost small" id="undoBtn" title="復原上一步" disabled>↩️</button>
      <button class="ghost small" id="redoBtn" title="取消復原（重做）" disabled>↪️</button>
      <h1 id="pageTitle">🌟 衛哨排班系統 <span class="muted" style="font-size:11px;font-weight:400">v33</span></h1>
    </div>
    <div class="row" style="gap:6px;align-items:center">
      <select id="timeStepSelect" style="font-size:11px;padding:3px 6px;width:auto">
        <option value="5">5分間隔</option>
        <option value="10">10分間隔</option>
        <option value="30">30分間隔</option>
      </select>
      <button class="ghost small" id="exportBtn">匯出</button>
    </div>
  </div>
  <div class="row wrap" style="padding:0 14px 8px;gap:6px;align-items:center">
    <span class="muted" style="font-size:11px">日期：</span>
    <button class="ghost small" id="globalDatePrev">◀</button>
    <button class="ghost small" id="globalDateLabel" style="font-size:12px"></button>
    <button class="ghost small" id="globalDateNext">▶</button>
    <button class="ghost small" id="globalDateToday">今天</button>
  </div>
</div>

<div class="container" id="app"></div>

<div class="tabs">
  <button data-tab="people">👤 人員</button>
  <button data-tab="unavail">🚫 休假/事故</button>
  <button data-tab="misc">🗂 其他勤務</button>
  <button data-tab="schedule">📋 排班</button>
  <button data-tab="stats">📊 統計</button>
</div>

<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
/* ---------------- storage ---------------- */
const LS_KEY='drs_data_v1';
function loadState(){
  const raw=localStorage.getItem(LS_KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return {
    personnel: [],
    categories: defaultCategories(),
    unavail: {},      // date -> [{id,personId,allDay,start,end}]
    assign: {},       // date -> categoryId -> shiftId -> [personId,...]
    misc: {},         // date -> [{id,role,text}]
    miscCustomPresets: [] // [{role,start,end}] user-added quick-add presets for 其他勤務
  };
}
function saveState(){
  // stash the state as it was BEFORE this change onto the undo stack, so
  // repeated undo presses can keep walking back through history — capped
  // to avoid unbounded memory/localStorage growth over a long session
  if(typeof lastSavedSnapshot!=='undefined'){
    undoStack.push(lastSavedSnapshot);
    if(undoStack.length>UNDO_LIMIT) undoStack.shift();
  }
  redoStack=[]; // a fresh change invalidates whatever "future" redo had
  lastSavedSnapshot = JSON.stringify(state);
  localStorage.setItem(LS_KEY, lastSavedSnapshot);
  if(typeof refreshUndoButton==='function') refreshUndoButton();
}
const UNDO_LIMIT=50;
let undoStack=[];
let redoStack=[];
let lastSavedSnapshot; // set on first load, see below
function undoLastAction(){
  if(!undoStack.length) return;
  const prevSnapshot = undoStack.pop();
  redoStack.push(lastSavedSnapshot);
  state = JSON.parse(prevSnapshot);
  lastSavedSnapshot = prevSnapshot;
  localStorage.setItem(LS_KEY, prevSnapshot);
  if(typeof refreshUndoButton==='function') refreshUndoButton();
  render();
}
function redoLastAction(){
  if(!redoStack.length) return;
  const nextSnapshot = redoStack.pop();
  undoStack.push(lastSavedSnapshot);
  state = JSON.parse(nextSnapshot);
  lastSavedSnapshot = nextSnapshot;
  localStorage.setItem(LS_KEY, nextSnapshot);
  if(typeof refreshUndoButton==='function') refreshUndoButton();
  render();
}

function uid(){ return Math.random().toString(36).slice(2,9); }

/* explicit press feedback for every button/pill, via one delegated listener
   on document (so it keeps working through re-renders without re-wiring) —
   iOS Safari's :active pseudo-class doesn't reliably fire on tap by itself,
   so we toggle a class directly on touch/mouse down and up instead. */
(function(){
  function pressOn(ev){
    const el = ev.target.closest('button, .pill-btn');
    if(el){
      el.classList.add('pressed');
      if(navigator.vibrate){ try{ navigator.vibrate(10); }catch(e){} }
    }
  }
  function pressOff(){
    document.querySelectorAll('.pressed').forEach(el=>el.classList.remove('pressed'));
  }
  document.addEventListener('touchstart', pressOn, {passive:true});
  document.addEventListener('touchend', pressOff, {passive:true});
  document.addEventListener('touchcancel', pressOff, {passive:true});
  document.addEventListener('mousedown', pressOn);
  document.addEventListener('mouseup', pressOff);
  document.addEventListener('mouseleave', pressOff);
})();

/* ---------------- rank system ---------------- */
const RANK_DEFS=[
  {rank:'少校',cat:'軍官'},{rank:'上尉',cat:'軍官'},{rank:'中尉',cat:'軍官'},{rank:'少尉',cat:'軍官'},
  {rank:'士官長',cat:'士官'},{rank:'上士',cat:'士官'},{rank:'中士',cat:'士官'},{rank:'下士',cat:'士官'},
  {rank:'上兵',cat:'士兵'},{rank:'一兵',cat:'士兵'},{rank:'二兵',cat:'士兵'},{rank:'訓練役',cat:'士兵'}
];
function rankIndex(rank){ const i=RANK_DEFS.findIndex(r=>r.rank===rank); return i<0?RANK_DEFS.length:i; }
function rankCategory(rank){ const r=RANK_DEFS.find(r=>r.rank===rank); return r?r.cat:''; }
function rankOptionsHTML(selected){
  const groups=['軍官','士官','士兵'];
  return groups.map(g=>`<optgroup label="${g}">${RANK_DEFS.filter(r=>r.cat===g).map(r=>`<option value="${r.rank}" ${r.rank===selected?'selected':''}>${r.rank}</option>`).join('')}</optgroup>`).join('');
}
/* duty-assignment priority (distinct from roster display order in RANK_DEFS):
   for 低階優先 categories (橋哨/指管) 下士 is the top preferred rank;
   for 需士官帶隊 categories (打飯班) the lead preference order is 下士 → 中士 → 上士 → 士官長 */
const LOW_RANK_PRIORITY=['下士','二兵','一兵','上兵','中士','上士','士官長','少尉','中尉','上尉','少校'];
const NCO_LEAD_PRIORITY=['下士','中士','上士','士官長','少尉','中尉','上尉','少校','二兵','一兵','上兵'];
/* for a needsNCO category (打飯班): slot 0 is the leader (pick an NCO, 下士
   first — see NCO_LEAD_PRIORITY above), every other slot is a helper and
   should go to an enlisted soldier first, only reaching for another NCO or
   an officer if no soldier is available. */
const MEAL_HELPER_PRIORITY=['訓練役','二兵','一兵','上兵','下士','中士','上士','士官長','少尉','中尉','上尉','少校'];
function dutySortIndex(rank, cat, slotIdx, shift){
  // 整天 (all-day) meal duty isn't a leadership shift — the NCO requirement
  // for 打飯班 is satisfied elsewhere (早/午/晚 each get their own leader), so
  // every slot on 整天 just prefers the lowest-rank enlisted first.
  if(cat.needsNCO && shift && shift.label==='整天'){
    const helperOrder = cat.customPriorityHelper || MEAL_HELPER_PRIORITY;
    const i=helperOrder.indexOf(rank);
    return i<0? helperOrder.length : i;
  }
  const order = cat.needsNCO
    ? ((slotIdx||0)===0 ? (cat.customPriority||NCO_LEAD_PRIORITY) : (cat.customPriorityHelper||MEAL_HELPER_PRIORITY))
    : (cat.customPriority ? cat.customPriority : (cat.preferLowRank ? LOW_RANK_PRIORITY : null));
  let base = order ? (order.indexOf(rank)<0? order.length : order.indexOf(rank)) : rankIndex(rank);
  // a rank the category would rather not use (but may, if nobody else is
  // available) gets pushed to the very back of the priority order
  if((cat.avoidRanks||[]).includes(rank)) base += 1000;
  return base;
}
/* a rank a category can NEVER use (hard rule, e.g. 訓練役 can't stand 安全士官)
   — unlike avoidRanks above, this excludes the person entirely, not just
   de-prioritizes them */
function rankExcludedFromCategory(rank, cat){
  return (cat.excludeRanks||[]).includes(rank);
}
const GROUP_OPTIONS=['連部','連部組','行政排','勤務排','運輸排','設維組','醫務組'];
function groupIndex(g){ const i=GROUP_OPTIONS.indexOf(g); return i<0?GROUP_OPTIONS.length:i; }
function groupOptionsHTML(selected){
  return `<option value="" ${!selected?'selected':''}>（未分組）</option>` +
    GROUP_OPTIONS.map(g=>`<option value="${g}" ${g===selected?'selected':''}>${g}</option>`).join('');
}

function defaultCategories(){
  return [
    {id:'safety',name:'安全士官',enforceRest:true,preferLowRank:false,needsNCO:false,isSentry:true,excludeRanks:['訓練役'],avoidRanks:['二兵'],
      shifts:[
        sh('22:00','24:00',1,'','08:00'),sh('00:00','02:00',1,'','08:00'),sh('02:00','04:00',1,'','08:00'),sh('04:00','06:00',1,'','08:00'),
        sh('06:00','08:00',1,'','08:30'),sh('08:00','12:00'),sh('12:00','14:00'),sh('14:00','18:00'),sh('18:00','22:00')
      ]},
    {id:'bridge',name:'橋哨',enforceRest:true,preferLowRank:true,needsNCO:false,isSentry:true,
      shifts:[
        sh('22:00','24:00',1,'','08:00'),sh('00:00','02:00',1,'','08:00'),sh('02:00','04:00',1,'','08:00'),sh('04:00','06:00',1,'','08:00'),
        sh('06:00','08:00',1,'','08:30'),sh('18:00','20:00'),sh('20:00','22:00')
      ]},
    {id:'control',name:'安管中心(指管)',enforceRest:true,preferLowRank:true,needsNCO:false,isSentry:true,
      shifts:[
        sh('06:00','08:00'),sh('08:00','12:00'),sh('12:00','14:00'),sh('14:00','18:00'),sh('18:00','22:00')
      ]},
    {id:'meal',name:'打飯班',enforceRest:false,preferLowRank:false,needsNCO:true,isSentry:false,
      shifts:[
        sh('06:00','07:00',2,'早','08:30'),sh('10:10','13:20',2,'午','15:30'),sh('16:20','19:30',2,'晚'),sh('00:00','24:00',2,'整天')
      ]}
  ];
}
function sh(start,end,count,label,restUntil){ return {id:uid(),start,end,count:count||1,label:label||'',restUntil:restUntil||''}; }
/* fixed display order for the standard categories, regardless of the order
   they were added/restored in state.categories — any extra custom categories
   just appear after these, in whatever order they exist */
const CATEGORY_ORDER=['safety','bridge','control','meal'];
function orderedCategories(){
  return [...state.categories].sort((a,b)=>{
    if(a.sortOrder!==undefined && b.sortOrder!==undefined) return a.sortOrder-b.sortOrder;
    const ai=CATEGORY_ORDER.indexOf(a.id), bi=CATEGORY_ORDER.indexOf(b.id);
    return (ai<0?CATEGORY_ORDER.length:ai) - (bi<0?CATEGORY_ORDER.length:bi);
  });
}
function orderedMiscPresets(){
  return [...state.miscPresets].sort((a,b)=>(a.sortOrder??999)-(b.sortOrder??999));
}
/* the combined 排班類別 + 其他勤務常用項目 list used for the drag-reorder UI —
   a flat array of {kind:'cat'|'misc', ref} sorted by the shared sortOrder
   field, so both kinds of item can be freely interleaved by dragging */
/* where a brand-new category/misc-preset should land by default: right
   after whatever's currently last in the combined order (normally 打飯班,
   unless things have been dragged around), so newly-added items keep
   stacking incrementally in one place instead of always jumping to some
   fixed spot regardless of how the list has been rearranged */
function nextSortOrder(){
  const all = [...state.categories, ...state.miscPresets].map(x=>x.sortOrder??0);
  return (all.length? Math.max(...all) : 0) + 10;
}
function combinedOrderList(){
  const items = [
    ...state.categories.map(c=>({kind:'cat', ref:c})),
    ...state.miscPresets.map(p=>({kind:'misc', ref:p})),
  ];
  return items.sort((a,b)=>(a.ref.sortOrder??999)-(b.ref.sortOrder??999));
}
/* preset quick-add templates for 其他勤務 (misc duty) with usual times, per unit SOP */
const MISC_PRESETS=[
  {role:'採買',times:[{start:'05:30',end:'08:00'}],roles:['駕駛','車長'],requiredLicenses:[],requiredMedCert:false,requiredSkills:[]},
  {role:'愛心便當',times:[{start:'16:00',end:'18:00'}],roles:['駕駛','車長'],requiredLicenses:[],requiredMedCert:false,requiredSkills:[]},
  {role:'消防車',times:[{start:'06:00',end:'08:00'}],roles:['駕駛','車長'],requiredLicenses:['大型車','大客車'],requiredMedCert:false,requiredSkills:[]},
  {role:'救護車',times:[{start:'06:30',end:'06:30'}],roles:['駕駛','車長'],requiredLicenses:[],requiredMedCert:true,requiredSkills:[]},
  {role:'技工',times:[{start:'06:30',end:'07:30'}],roles:null,requiredLicenses:[],requiredMedCert:false,requiredSkills:[]},
  {role:'話務',times:[{start:'06:30',end:'07:30'}],roles:['話務(需小型車以上駕照)'],requiredLicenses:[],requiredMedCert:false,requiredSkills:[]},
  {role:'督伙',times:[{start:'04:30',end:'20:00'}],roles:null,requiredLicenses:[],requiredMedCert:false,requiredSkills:[]},
  {role:'查哨',times:[{start:'22:00',end:'24:00'},{start:'00:00',end:'02:00'},{start:'02:00',end:'04:00'},{start:'04:00',end:'06:00'},{start:'12:00',end:'14:00'}],roles:null,requiredLicenses:[],requiredMedCert:false,requiredSkills:[]},
  {role:'值班',times:[{start:'07:00',end:'07:00'}],roles:null,restUntil:'12:00',requiredLicenses:[],requiredMedCert:false,requiredSkills:[]}
];
/* a preset may carry multiple time slots under one name (e.g. 查哨 at five
   different times a day) — always read them through this so both the old
   single start/end shape and the newer times[] shape work the same way */
function presetTimes(preset){
  if(preset.times && preset.times.length) return preset.times;
  return [{start:preset.start||'06:00', end:preset.end||'07:00'}];
}
/* find the preset a misc entry was created from, by role name — used to
   read its configured requirements (license/cert/skill). Returns null for
   entries whose preset was since deleted/renamed (no requirements applied). */
function presetForEntry(entry){
  return state.miscPresets.find(p=>p.role===entry.role) || null;
}
/* driver requirement checks, data-driven from the preset's configured
   requiredLicenses/requiredMedCert/requiredSkills — returns a list of
   human-readable reasons the given person fails to qualify (empty = OK) */
function driverQualificationIssues(person, preset){
  if(!preset) return [];
  const issues=[];
  const reqLic=preset.requiredLicenses||[];
  if(reqLic.length && (!person.license || !reqLic.includes(person.license))) issues.push(`需持有${reqLic.join('或')}駕照`);
  if(preset.requiredMedCert && !person.medCert) issues.push('需具備EMT或醫生證書');
  (preset.requiredSkills||[]).forEach(sk=>{
    if(!(person.skills||[]).includes(sk)) issues.push(`需具備${sk}專長`);
  });
  return issues;
}
/* validation for structured misc entries (entry.roles present): 車長/駕駛 pairs
   need the driver to meet the preset's configured requirements and the
   chief to be an NCO+ outranking the driver; anything tagged 話務 just needs
   a license. */
function validateMiscEntry(entry){
  if(!entry.roles){
    if(!(entry.personIds&&entry.personIds.length) && !entry.skipAutoFill){
      const preset = presetForEntry(entry);
      const sMin = entry.start? toMin(entry.start) : null;
      const eMinRaw = entry.end? toMin(entry.end) : null;
      const hasTime = sMin!==null && eMinRaw!==null;
      const availableCandidates = state.personnel.filter(p=>
        !(hasTime && isPersonUnavailable(p.id, currentDate, sMin, wrapEndMin(sMin, eMinRaw)))
      );
      const qualifiedCandidates = preset? availableCandidates.filter(p=>driverQualificationIssues(p, preset).length===0) : availableCandidates;
      if(availableCandidates.length && preset && !qualifiedCandidates.length){
        const reqParts=[];
        if((preset.requiredLicenses||[]).length) reqParts.push('駕照：'+preset.requiredLicenses.join('或'));

    const catAssign = dayAssign[cat.id]||{};
    for(const sft of effectiveShifts(cat, date)){
      if(excludeCatShift && excludeCatShift.catId===cat.id && excludeCatShift.shiftId===sft.id) continue;
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapOnce(s,e,shiftBusyStartMin(cat,sft),toMin(sft.end))) return true;
    }
  }
  // avoid double-booking against 其他勤務 (misc) commitments that have a defined time window
  for(const m of (state.misc[date]||[])){
    if(m.start && m.end && (m.personIds||[]).includes(personId) && windowsOverlapOnce(s,e,toMin(m.start),toMin(m.end))) return true;
    // a misc duty may also grant 補休 afterwards (e.g. 值班 07:00-07:00 補休至12:00)
    if(m.restUntil && m.end && (m.personIds||[]).includes(personId) && windowsOverlapRecurring(s,e,toMin(m.end),toMin(m.restUntil))) return true;
  }
  return false;
}

function personName(id){ const p=state.personnel.find(p=>p.id===id); return p?p.name:'—'; }
/* the 🚗駕照·⛑️EMT·🔧專長 badge string used consistently across every person
   dropdown/checkbox in the app, so qualifications are visible wherever
   you're picking someone regardless of which UI widget it's rendered in */
function personBadges(p){

}
/* for the ad-hoc "who's free right now, and for how long" query: steps forward
   in 15-minute increments from queryMin until the person becomes unavailable
   (leave, long-term, comp-rest, or an existing assignment) or the day ends */
/* explains WHY a person is unavailable at a given minute — used by the
   指定時間查詢 so the result shows the actual reason, not just a count */
function unavailabilityReasonsInRange(personId, date, s, e){
  const out=[];
  const person = state.personnel.find(p=>p.id===personId);
  if(person){
    const lt = personLongTerm(person);
    if(lt.mode==='allday') out.push('長期事故：全天不可排');
    else if(lt.mode==='range' && lt.start && lt.end && windowsOverlapRecurring(s,e,toMin(lt.start),toMin(lt.end))) out.push(`長期事故：每天 ${lt.start}-${lt.end} 不可排`);
  }
  (state.unavail[date]||[]).filter(u=>u.personId===personId).forEach(u=>{
    const hit = u.allDay || windowsOverlapOnce(s,e,toMin(u.start),toMin(u.end));
    if(hit) out.push(`${u.allDay? '全天':`${u.start}-${u.end}`}${u.reason? '（'+u.reason+'）':'（未註記原因）'}`);
  });
  for(const w of personCompRestWindows(personId, date)){
    if(windowsOverlapRecurring(s,e,toMin(w.start),toMin(w.end))) out.push(`補休中（${w.catName} ${w.label} 後，至 ${w.end}）`);
  }
  const dayAssign = state.assign[date]||{};
  state.categories.forEach(cat=>{
    const catAssign = dayAssign[cat.id]||{};
    effectiveShifts(cat, date).forEach(sft=>{
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapOnce(s,e,shiftBusyStartMin(cat,sft),toMin(sft.end))){
        out.push(`勤務中：${cat.name} ${sft.label||sft.start+'-'+sft.end}${cat.enforceRest?'（含準備時間）':''}`);
      }
    });
  });
  (state.misc[date]||[]).forEach(m=>{
    if(!(m.personIds||[]).includes(personId)) return;
    if(m.start && m.end && windowsOverlapOnce(s,e,toMin(m.start),toMin(m.end))) out.push(`勤務中：${m.role}${m.start&&m.end?` (${m.start}-${m.end})`:''}`);
    else if(m.restUntil && m.end && windowsOverlapRecurring(s,e,toMin(m.end),toMin(m.restUntil))) out.push(`補休中（${m.role} 後，至 ${m.restUntil}）`);
  });
  // de-dupe: duplicate underlying records (e.g. someone accidentally
  // registered twice) shouldn't repeat the exact same reason text over and
  // over in the displayed list
  const deduped = [...new Set(out)];
  return deduped.length? deduped : ['不可排（原因不明）'];
}
function freeDurationFrom(personId, date, queryMin){
  if(isPersonUnavailable(personId, date, queryMin, queryMin+1)) return 0;
  const step=15; let t=queryMin;
  while(t<1440){
    if(isPersonUnavailable(personId, date, t, Math.min(t+step,1440))) break;
    t+=step;
  }
  return Math.min(t,1440)-queryMin;
}
function personRank(id){ const p=state.personnel.find(p=>p.id===id); return p?p.rank:''; }

/* gather all assignment instances for a person on a date, across enforceRest categories,
   with absolute minute ranges, for rest / daily-hour checking */
function personEnforcedShifts(personId, date, excludeCatShift){
  const dayAssign = state.assign[date]||{};
  const out=[];
  state.categories.filter(c=>c.enforceRest).forEach(cat=>{
    const abs = absoluteShiftTimes(cat, date);
    const catAssign = dayAssign[cat.id]||{};
    effectiveShifts(cat, date).forEach(s=>{
      if(excludeCatShift && excludeCatShift.catId===cat.id && excludeCatShift.shiftId===s.id) return;
      const list = catAssign[s.id]||[];
      if(list.includes(personId)){
        out.push({catId:cat.id,catName:cat.name,shiftId:s.id,label:s.label|| (s.start+'-'+s.end), ...abs[s.id]});
      }
    });
  });
  return out.sort((a,b)=>a.abs_s-b.abs_s);
}

function restIssues(personId, date, catId, shift){
  // returns array of warning strings if assigning personId to this shift breaks the 6h rest / 6h per day rule
  const cat = state.categories.find(c=>c.id===catId);
  if(!cat.enforceRest) return [];
  const abs = absoluteShiftTimes(cat, date)[shift.id];
  const existing = personEnforcedShifts(personId, date, {catId, shiftId:shift.id});
  const all = [...existing, {abs_s:abs.abs_s, abs_e:abs.abs_e, catName:cat.name, label: shift.label||(shift.start+'-'+shift.end)}].sort((a,b)=>a.abs_s-b.abs_s);
  const issues=[];
  let totalMin=0;
  for(let i=0;i<all.length;i++){
    totalMin += (all[i].abs_e-all[i].abs_s);
    if(i>0){
      const gap = all[i].abs_s - all[i-1].abs_e;
      if(gap < 0){ issues.push(`與「${all[i-1].catName} ${all[i-1].label}」時段重疊`); }
      else if(gap < 360){ issues.push(`與「${all[i-1].catName} ${all[i-1].label}」間隔僅 ${Math.round(gap/60*10)/10} 小時（需滿6小時）`); }
    }
  }
  if(totalMin>360){ issues.push(`當日累計勤務 ${Math.round(totalMin/60*10)/10} 小時，超過上限6小時`); }
  return issues;
}

/* would assigning this shift create a 補休(comp-rest) window that overlaps a
   commitment the person ALREADY has — a 其他勤務(misc) entry with a defined
   time, or a non-enforceRest category shift (e.g. 打飯班) — that restIssues
   above doesn't check (it only compares against OTHER enforceRest shifts)? */
function wouldRestWindowConflict(personId, date, shift, excludeCatShift){
  if(!shift.restUntil) return false;
  const winStart=toMin(shift.end), winEnd=toMin(shift.restUntil);
  for(const m of (state.misc[date]||[])){
    if(m.start && m.end && (m.personIds||[]).includes(personId) && windowsOverlapRecurring(toMin(m.start),toMin(m.end),winStart,winEnd)) return true;
  }
  const dayAssign=state.assign[date]||{};
  for(const cat of state.categories){
    if(cat.enforceRest) continue;
    const catAssign=dayAssign[cat.id]||{};
    for(const sft of effectiveShifts(cat, date)){
      if(excludeCatShift && excludeCatShift.catId===cat.id && excludeCatShift.shiftId===sft.id) continue;
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapRecurring(toMin(sft.start),toMin(sft.end),winStart,winEnd)) return true;
    }
  }
  return false;
}

/* 衛哨 shifts need PREP_MINUTES of prep beforehand — check whether the
   person was still doing something else (其他勤務 or a non-rest-enforced
   category shift like 打飯班) too close before this shift starts. This is
   the one place PREP_MINUTES applies; it deliberately does NOT feed into
   the sentry-to-sentry 6-hour rule (restIssues/absoluteShiftTimes), which
   stays on nominal shift times. Example: 採買 ending at 08:00 immediately
   followed by an 08:00-12:00 衛哨 shift leaves no prep time — flagged;
   two 衛哨 shifts 6 hours apart are NOT affected by this rule. */
function prepGapConflict(personId, date, cat, shift){
  if(!cat.enforceRest) return false;
  const shiftStart=toMin(shift.start);
  const prepStart=((shiftStart-PREP_MINUTES)%1440+1440)%1440;
  for(const m of (state.misc[date]||[])){
    if(m.start && m.end && (m.personIds||[]).includes(personId) && windowsOverlapOnce(prepStart,shiftStart,toMin(m.start),toMin(m.end))) return true;
  }
  const dayAssign=state.assign[date]||{};
  for(const c of state.categories){
    if(c.enforceRest) continue;
    const catAssign=dayAssign[c.id]||{};
    for(const sft of effectiveShifts(c, date)){
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapOnce(prepStart,shiftStart,toMin(sft.start),toMin(sft.end))) return true;
    }
  }
  return false;
}

/* the smallest gap this candidate would end up with, immediately before or
   after this shift, against their other enforceRest shifts today — used to
   prefer spacing people out further apart rather than always clustering
   everyone right at the 6-hour minimum */
function minAdjacentGap(personId, date, cat, shift){
  if(!cat.enforceRest) return Infinity;
  const abs=absoluteShiftTimes(cat, date)[shift.id];
  const existing=personEnforcedShifts(personId, date, {catId:cat.id, shiftId:shift.id});
  let minGap=Infinity;
  existing.forEach(ex=>{
    if(ex.abs_e<=abs.abs_s) minGap=Math.min(minGap, abs.abs_s-ex.abs_e);
    else if(abs.abs_e<=ex.abs_s) minGap=Math.min(minGap, ex.abs_s-abs.abs_e);
  });
  return minGap;
}

/* Fills only EMPTY slots for the given date — never overwrites an existing
   manual assignment. Greedy, shift-by-shift in each category's listed order:
   skip anyone unavailable/already double-booked for that slot, then rank
   candidates by (fewest rest-rule issues, duty priority for that category,
   fewest shifts already given out today, roster rank order). */
function autoAssignDay(date){
  if(!state.assign[date]) state.assign[date]={};
  const assignCount={};
  const allSlots=[];
  state.categories.forEach(cat=>{
    if(!state.assign[date][cat.id]) state.assign[date][cat.id]={};
    const abs=absoluteShiftTimes(cat, date);
    effectiveShifts(cat, date).forEach(s=>{
      if(!state.assign[date][cat.id][s.id]) state.assign[date][cat.id][s.id]=[];
      allSlots.push({cat, s, absStart:abs[s.id].abs_s});
    });
  });
  allSlots.sort((a,b)=>a.absStart-b.absStart);
  allSlots.forEach(({cat,s})=>{
    const arr=state.assign[date][cat.id][s.id];
    const sMin=toMin(s.start), eMin=wrapEndMin(sMin, toMin(s.end));
    // "最少需要幾位士官(含)以上" is a HARD floor: while it's still unmet,
    // only 士官/軍官 candidates are considered for the remaining empty
    // slots, so auto-assign leaves a slot empty rather than quietly
    // filling it with a non-NCO just to hit the headcount. Once the floor
    // is met (or every empty slot has been tried), the rest fill normally.
    let ncoStillNeeded = Math.max(0, (s.minNCO||0) - arr.filter(pid=>pid && ['士官','軍官'].includes(rankCategory(personRank(pid)))).length);
    for(let idx=0; idx<s.count; idx++){
      if(!arr[idx]){
        const rawCandidatesAll = state.personnel.filter(p=>
          !arr.includes(p.id) && !rankExcludedFromCategory(p.rank,cat) &&
          !isPersonUnavailable(p.id, date, sMin, eMin, {catId:cat.id, shiftId:s.id})
        );
        const rawCandidates = ncoStillNeeded>0
          ? rawCandidatesAll.filter(p=>['士官','軍官'].includes(rankCategory(p.rank)))
          : rawCandidatesAll;
        const candidates = cat.enforceRest
          ? rawCandidates.filter(p=>restIssues(p.id,date,cat.id,s).length===0 && !assignedSameShiftYesterday(p.id,date,cat.id,s.id) && !wouldRestWindowConflict(p.id,date,s,{catId:cat.id,shiftId:s.id}) && !prepGapConflict(p.id,date,cat,s))
          : rawCandidates;
        if(candidates.length){
        candidates.sort((a,b)=>{
          const aCnt=assignCount[a.id]||0, bCnt=assignCount[b.id]||0;
          if(aCnt!==bCnt) return aCnt-bCnt;
          const aDuty=dutySortIndex(a.rank,cat,idx,s), bDuty=dutySortIndex(b.rank,cat,idx,s);
          if(aDuty!==bDuty) return aDuty-bDuty;
          const aGap=minAdjacentGap(a.id,date,cat,s), bGap=minAdjacentGap(b.id,date,cat,s);
          if(aGap!==bGap) return bGap-aGap;
          return rankIndex(a.rank)-rankIndex(b.rank);
        });
        const chosen=candidates[0];
        arr[idx]=chosen.id;
        assignCount[chosen.id]=(assignCount[chosen.id]||0)+1;
        if(['士官','軍官'].includes(rankCategory(chosen.rank))) ncoStillNeeded=Math.max(0,ncoStillNeeded-1);
        }
      } else {
        assignCount[arr[idx]]=(assignCount[arr[idx]]||0)+1;
      }
    }
  });
  saveState();
}

const MISC_SIBLING_ROLE={'採買':'愛心便當','愛心便當':'採買'};
function autoAssignMiscForDate(date){
  if(!state.misc[date]) state.misc[date]=[];
  state.miscPresets.filter(p=>p.fixed).forEach(preset=>{
    const roles = preset.roles;
    const times = presetTimes(preset);
    if(times.length===1){
      const exists = state.misc[date].some(m=>m.role===preset.role);
      if(!exists){
        const t=times[0];
        state.misc[date].push({
          id:uid(), role:preset.role, start:t.start, end:t.end, restUntil:preset.restUntil||'',
          roles: roles?[...roles]:undefined,
          personIds: roles? roles.map(()=>undefined) : []
        });
      }
      return;
    }
    times.forEach(t=>{
      const exists = state.misc[date].some(m=>m.role===preset.role && m.start===t.start && m.end===t.end);
      if(!exists){
        state.misc[date].push({
          id:uid(), role:preset.role, start:t.start, end:t.end, restUntil:preset.restUntil||'',
          roles: roles?[...roles]:undefined,
          personIds: roles? roles.map(()=>undefined) : []
        });
      }
    });
  });
  state.misc[date].forEach(entry=>{
    if(!entry.roles){
      if(!entry.personIds) entry.personIds=[];
      const alreadyHasSomeone = entry.personIds.some(id=>id);
      if(!alreadyHasSomeone && !entry.skipAutoFill){
        const sMin = entry.start? toMin(entry.start) : null;
        const eMinRaw = entry.end? toMin(entry.end) : null;
        const presetForSort = presetForEntry(entry);
        const candidates = state.personnel.filter(p=>
          !(sMin!==null && eMinRaw!==null && isPersonUnavailable(p.id, date, sMin, wrapEndMin(sMin, eMinRaw))) &&
          driverQualificationIssues(p, presetForSort).length===0
        );
        if(candidates.length){
          candidates.sort((a,b)=>{
            const skillMatch = p=> (p.skills||[]).includes(entry.role) ? 0 : 1;
            const sa=skillMatch(a), sb=skillMatch(b);
            if(sa!==sb) return sa-sb;
            return rankPriorityIndex(a.rank,presetForSort)-rankPriorityIndex(b.rank,presetForSort) || groupIndex(a.group)-groupIndex(b.group);
          });
          entry.personIds[0]=candidates[0].id;
        }
      }
      return;
    }
    if(!entry.personIds) entry.personIds=entry.roles.map(()=>undefined);
    const preset=presetForEntry(entry);
    entry.roles.forEach((r,i)=>{
      if(entry.personIds[i]) return;
      if(entry.lockedSlots && entry.lockedSlots[i]) return;
      const needsMed = preset? preset.requiredMedCert : false;
      let eligibleFn;
      if(r==='駕駛'){
        eligibleFn = p=>driverQualificationIssues(p, preset).length===0;
      } else if(r==='車長'){
        const driverIdx=entry.roles.indexOf('駕駛');
        const driver = driverIdx>-1? state.personnel.find(p=>p.id===entry.personIds[driverIdx]) : null;
        eligibleFn = p=>['士官','軍官'].includes(rankCategory(p.rank)) && (!driver || rankIndex(p.rank)<rankIndex(driver.rank)) && (!needsMed || p.medCert);
      } else if(r.startsWith('話務')){
        eligibleFn = p=>!!p.license;
      } else {
        eligibleFn = ()=>true;
      }
      const sMin = entry.start? toMin(entry.start) : null;
      const eMinRaw = entry.end? toMin(entry.end) : null;
      const candidates = state.personnel.filter(p=>
        !entry.personIds.includes(p.id) && eligibleFn(p) &&
        !(sMin!==null && eMinRaw!==null && isPersonUnavailable(p.id, date, sMin, wrapEndMin(sMin, eMinRaw)))
      );
      if(candidates.length){
        candidates.sort((a,b)=>rankPriorityIndex(a.rank,preset)-rankPriorityIndex(b.rank,preset) || groupIndex(a.group)-groupIndex(b.group));
        let chosen = candidates[0];
        const siblingRole = MISC_SIBLING_ROLE[entry.role];
        if(siblingRole){
          const sibling = state.misc[date].find(m=>m.role===siblingRole && m.roles);
          const siblingIdx = sibling? sibling.roles.indexOf(r) : -1;
          const siblingPersonId = siblingIdx>-1? sibling.personIds[siblingIdx] : null;
          const match = siblingPersonId && candidates.find(c=>c.id===siblingPersonId);
          if(match) chosen = match;
        }
        entry.personIds[i]=chosen.id;
      }
    });
  });
  saveState();
}

function flashPressed(btn){

  void btn.offsetWidth; // restart the animation if clicked again quickly
  btn.classList.add('press-flash');
}

function openExportModal(){
  const dataStr = JSON.stringify(state, null, 2);
  const fileName = 'duty-roster-backup-'+todayStr()+'.json';
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;';
  modal.innerHTML=`
    <div style="background:var(--panel);width:100%;max-height:88vh;overflow:auto;border-radius:12px 12px 0 0;padding:14px;">
      <div class="section-title"><h2 style="margin:0">匯出備份</h2><button class="ghost small" id="closeExport">關閉</button></div>
      <div class="row wrap" style="margin-bottom:8px">
        <button class="primary grow" id="shareExportBtn">📤 分享／儲存檔案</button>
        <button class="ghost grow" id="copyExportBtn">📋 複製全部文字</button>
      </div>
      <div class="hint">若上面按鈕在你的瀏覽器沒有反應，可直接點下面文字方塊全選、複製，貼到備忘錄或傳給自己保存。</div>
      <textarea id="exportText" readonly style="min-height:220px;font-family:monospace;font-size:11px;margin-top:8px;white-space:pre">${esc(dataStr)}</textarea>
    </div>
  `;
  document.body.appendChild(modal);
  document.getElementById('closeExport').onclick=()=>modal.remove();
  const ta=document.getElementById('exportText');
  document.getElementById('shareExportBtn').onclick=async()=>{
    try{
      if(navigator.canShare && window.File){
        const file=new File([dataStr], fileName, {type:'application/json'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:fileName});
          return;
        }
      }
      if(navigator.share){ await navigator.share({title:fileName, text:dataStr}); return; }
    }catch(err){ /* cancelled or unsupported — fall through to download */ }
    try{
      const blob=new Blob([dataStr],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),3000);
    }catch(err){
      showAlert('自動下載在此瀏覽器不支援，請改用「複製全部文字」。');
    }
  };
  document.getElementById('copyExportBtn').onclick=async()=>{
    const btn=document.getElementById('copyExportBtn');
    try{
      await navigator.clipboard.writeText(dataStr);
      btn.textContent='已複製 ✓';
    }catch(err){
      try{ ta.focus(); ta.select(); document.execCommand('copy'); btn.textContent='已複製 ✓'; }
      catch(err2){ showAlert('複製失敗，請手動選取文字方塊內容複製。'); }
    }
  };
}

function renderPeopleGroups(groups, filterFn){

  return list.map(g=>{
    const members = state.personnel.filter(p=>p.group===g && filterFn(p)).sort((a,b)=>rankIndex(a.rank)-rankIndex(b.rank));

    return `<h3>${g? esc(g) : '未分組'}（${members.length}）</h3>` + members.map(p=>`
      <div class="list-item">
        <span class="tag rank-${rankCategory(p.rank)}">${p.rank}</span>
        <span class="grow">${esc(p.name)}${p.license? `<div class="muted">駕照：${esc(p.license)}</div>`:''}${p.medCert? `<div class="muted">救護證照：${esc(p.medCert)}</div>`:''}${(p.skills&&p.skills.length)? `<div class="muted">專長：${p.skills.map(esc).join('、')}</div>`:''}${p.note? `<div class="muted">備考：${esc(p.note)}</div>`:''}${longTermLabel(p)? `<div class="warn">🚫 ${longTermLabel(p)}</div>`:''}${p.outingRestriction==='dayOnly'? `<div class="warn">🚫 僅能外散（不可過夜）</div>`:''}${p.outingRestriction==='none'? `<div class="warn">🚫 完全不可外散宿</div>`:''}</span>
        <button class="ghost small" data-edit-person="${p.id}">編輯</button>

      </div>`).join('');

document.getElementById('importFile').addEventListener('change', (e)=>{
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(data.personnel && data.categories){ state=data; saveState(); render(); showAlert('匯入完成'); }
      else showAlert('檔案格式不正確');
    }catch(err){ showAlert('讀取失敗：'+err.message); }
  };
  reader.readAsText(f);
  e.target.value='';
});

let reverseFilterState={search:'',group:''}; // persists across re-renders until explicitly cleared

function lvPeopleCheckboxesHTML(groupFilter, searchFilter){
  if(!state.personnel.length) return `<div class="empty">尚無人員</div>`;
  let list=[...state.personnel];
  if(groupFilter) list = groupFilter==='__none'? list.filter(p=>!p.group) : list.filter(p=>p.group===groupFilter);
  if(searchFilter) list = list.filter(p=>p.name.includes(searchFilter));
  if(!list.length) return `<div class="empty">找不到符合的人員</div>`;
  const rGroups=[...new Set(list.map(p=>p.group).filter(Boolean))].sort((a,b)=>groupIndex(a)-groupIndex(b));
  const rList = rGroups.length? rGroups : [''];
  return rList.map(g=>{
    const members=list.filter(p=>p.group===g).sort((a,b)=>rankIndex(a.rank)-rankIndex(b.rank));
    if(!members.length) return '';
    return `<h3>${g?esc(g):'未分組'}</h3>` + members.map(p=>`
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0">
        <input type="checkbox" class="lv-person-cb" value="${p.id}" style="width:auto" ${lvCheckedIds.has(p.id)?'checked':''}>
        ${esc(p.name)}（${p.group||'未分組'}·${p.rank}${personBadges(p)}）${longTermLabel(p)? ` <span class="warn">🚫${esc(longTermLabel(p))}</span>`:''}
      </label>`).join('');
  }).join('');
}
function renderReverseCheckboxes(){
  if(!state.personnel.length) return `<div class="empty">尚未新增人員</div>`;
  const {search:kw, group:gf} = reverseFilterState;
  let list=[...state.personnel];
  if(kw) list=list.filter(p=>p.name.includes(kw));
  if(gf==='__none') list=list.filter(p=>!p.group);
  else if(gf) list=list.filter(p=>p.group===gf);
  if(!list.length) return `<div class="empty">找不到符合的人員</div>`;
  const rGroups=[...new Set(list.map(p=>p.group).filter(Boolean))].sort((a,b)=>groupIndex(a)-groupIndex(b));
  const rList = rGroups.length? rGroups : [''];
  return rList.map(g=>{
    const members=list.filter(p=>p.group===g).sort((a,b)=>rankIndex(a.rank)-rankIndex(b.rank));
    if(!members.length) return '';
    return `<h3>${g?esc(g):'未分組'}</h3>` + members.map(p=>`
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0">
        <input type="checkbox" data-reverse-check="${p.id}" style="width:auto" ${reverseCheckedIds.has(p.id)?'checked':''}> ${esc(p.name)}（${p.rank}${personBadges(p)}）
      </label>`).join('');
  }).join('');

function computeDayListFiltered(){
  const list = dayListBaseEntries();
  return list.filter(u=>{
    const p = state.personnel.find(pp=>pp.id===u.personId);
    if(dayListFilterState.search && !(p && p.name.includes(dayListFilterState.search))) return false;
    if(dayListFilterState.group==='__none' && p && p.group) return false;
    if(dayListFilterState.group && dayListFilterState.group!=='__none' && !(p && p.group===dayListFilterState.group)) return false;
    return true;
  });
}
function dayListBaseEntries(){
  return (state.unavail[currentDate]||[]).filter(u=> !isLeaveBufferEntry(u));

function renderLeaveGroupSummary(date){
  const entries = (state.unavail[date]||[]).filter(u=>!isLeaveBufferEntry(u) && isLeaveReason(u.reason));
  const personIds = [...new Set(entries.map(u=>u.personId))];
  const people = personIds.map(id=>state.personnel.find(p=>p.id===id)).filter(Boolean);
  if(!people.length) return `<div class="empty">今天沒有人休假</div>`;
  const byGroup = {};
  people.forEach(p=>{
    const g = p.group || '未分組';
    if(!byGroup[g]) byGroup[g]=[];
    byGroup[g].push(p);
  });
  const total = {軍官:0,士官:0,士兵:0};
  people.forEach(p=>{ const k=rankCategory(p.rank); if(k) total[k]++; });
  let html = `<div class="muted" style="margin-bottom:8px">全連共 ${people.length} 人休假・${total.軍官}官${total.士官}士${total.士兵}兵</div>`;
  html += Object.entries(byGroup).sort((a,b)=>groupIndex(a[0])-groupIndex(b[0])).map(([g,members])=>{
    const bd = {軍官:0,士官:0,士兵:0};
    members.forEach(p=>{ const k=rankCategory(p.rank); if(k) bd[k]++; });
    const sorted = members.slice().sort((a,b)=>rankIndex(a.rank)-rankIndex(b.rank));
    const inner = sorted.map(p=>{

    return collapsibleCardHTML('leaveGroup-'+g, `${esc(g)}（${members.length}人・${bd.軍官}官${bd.士官}士${bd.士兵}兵）`, inner);
  }).join('');
  return html;
}
/* creates one leave block (with its own leaveId + buffer entries) for one
   person — extracted so both the 新增人員休假 form and the 編輯休假 modal
   (which can split one block into several) share the exact same logic */
function createLeaveSegment(personId, s, e, honorRequested){
  const bufferDays=daysBetweenInclusive(prevDateStr(s), nextDateStr(e));
  const honorApplies = honorRequested && bufferDays<=5;
  const firstRoster=prevDateStr(s);
  const lastRoster=nextDateStr(e);
  const firstStart = honorApplies? '12:00':'18:00';
  const reasonLabel = honorApplies? '榮譽假':'休假';
  const leaveId=uid();
  if(!state.unavail[firstRoster]) state.unavail[firstRoster]=[];
  state.unavail[firstRoster].push({id:uid(),personId,allDay:false,start:firstStart,end:'24:00',reason:reasonLabel,leaveId,leaveStart:s,leaveEnd:e});
  dateRangeList(s,e).forEach(d=>{
    if(!state.unavail[d]) state.unavail[d]=[];
    state.unavail[d].push({id:uid(),personId,allDay:true,start:'',end:'',reason:reasonLabel,leaveId,leaveStart:s,leaveEnd:e});
  });
  if(!state.unavail[lastRoster]) state.unavail[lastRoster]=[];
  state.unavail[lastRoster].push({id:uid(),personId,allDay:false,start:'00:00',end:'07:30',reason:reasonLabel,leaveId,leaveStart:s,leaveEnd:e});
}
function deleteLeaveById(leaveId){
  Object.keys(state.unavail).forEach(d=>{
    state.unavail[d]=(state.unavail[d]||[]).filter(u=>u.leaveId!==leaveId);
  });
}
/* the leaveId of a person's leave block active on this date, if any —
   used to attach an 編輯 button next to their name wherever they show up */
function findLeaveIdForPerson(personId, date){
  const hit = (state.unavail[date]||[]).find(u=>u.personId===personId && u.leaveId);
  return hit? hit.leaveId : null;
}

function isLeaveReason(reason){ return !!reason && reason.includes('假'); }
function isLeaveBufferEntry(u){
  if(u.allDay) return false;
  return (u.start==='18:00' && u.end==='24:00') || (u.start==='12:00' && u.end==='24:00') || (u.start==='00:00' && u.end==='07:30');
}
function onDutyList(date){
  const dayEntries = state.unavail[date]||[];
  const awayIds = new Set(dayEntries.filter(u=>u.allDay && (isLeaveReason(u.reason) || u.inCamp===false)).map(u=>u.personId));
  return state.personnel.filter(p=>{
    if(awayIds.has(p.id)) return false;
    const lt = personLongTerm(p);
    // 「在營」only makes someone disappear from this whole-day list when it's
    // a whole-day setting (mode='allday') — a 時段性不可排(mode='range')'s
    // 在營=否 only means they're away during THAT time window each day, not
    // all day, so it must not exclude them from a day-level list like this
    if(lt.mode==='allday' && !lt.inCamp) return false;
    return true;
  }).sort((a,b)=>groupIndex(a.group)-groupIndex(b.group) || rankIndex(a.rank)-rankIndex(b.rank));
}
function isHolidayDate(date){
  const d = new Date(date+'T00:00:00');
  const dow = d.getDay();
  if((state.holidayWeekdays||[]).includes(dow)) return true;
  if((state.holidayDates||[]).includes(date)) return true;
  return false;
}
function outingBlackoutForDate(date){
  if(isHolidayDate(date)) return true;
  if(isHolidayDate(nextDateStr(date))) return true;
  return false;
}
function isEligibleForOuting(personId, date){
  if(outingBlackoutForDate(date)) return false;
  const person = state.personnel.find(p=>p.id===personId);
  if(person && person.outingRestriction==='none') return false;
  const curfewIsShort = (state.outingCurfewDates||[]).includes(date) || !!(person && person.outingRestriction==='dayOnly');
  if(curfewIsShort){
    // shortened outing (18:00-24:00, must be back in camp by 24:00): only
    // a sentry duty actually falling inside that window (prep time
    // included) is a real conflict — an early-morning shift the next
    // segment over is unaffected since the person's already back by then
    const dayAssign = state.assign[date]||{};
    for(const cat of state.categories){
      if(!cat.isSentry) continue;
      const catAssign = dayAssign[cat.id]||{};
      for(const sft of effectiveShifts(cat, date)){
        if(!(catAssign[sft.id]||[]).includes(personId)) continue;
        if(windowsOverlapOnce(18*60, 24*60, shiftBusyStartMin(cat,sft), toMin(sft.end))) return false;
      }
    }
  } else if(state.outingExcludeOvernightSentry){
    const dayAssign = state.assign[date]||{};
    for(const cat of state.categories){
      if(!cat.isSentry) continue;
      const catAssign = dayAssign[cat.id]||{};
      for(const sft of effectiveShifts(cat, date)){
        if(!(catAssign[sft.id]||[]).includes(personId)) continue;
        const sMin=toMin(sft.start);
        if(sMin>=22*60 || sMin<6*60) return false;
      }
    }
  }
  const excluded = state.outingExcludedMiscRoles||[];
  for(const m of (state.misc[date]||[])){
    if(!(m.personIds||[]).includes(personId)) continue;
    if(excluded.includes(m.role)) return false;
    const preset = presetForEntry(m);
    if(preset && preset.isSentry && m.start && m.end){
      if(curfewIsShort){
        if(windowsOverlapOnce(18*60,24*60,toMin(m.start),toMin(m.end))) return false;
      } else if(state.outingExcludeOvernightSentry){
        const sMin=toMin(m.start);
        if(sMin>=22*60 || sMin<6*60) return false;
      }
    }
  }
  return true;
}

let outingFilterState={search:'',group:''};
function renderOutingList(date){
  const filterFn = p=>{
    if(outingFilterState.search && !p.name.includes(outingFilterState.search)) return false;
    if(outingFilterState.group==='__none' && p.group) return false;
    if(outingFilterState.group && outingFilterState.group!=='__none' && p.group!==outingFilterState.group) return false;
    return true;
  };
  const list = outingEligibleList(date, filterFn);
  return list.length? list.map(p=>`<div class="muted">・${esc(p.name)}（${p.group||'未分組'}·${p.rank}）</div>`).join('') : `<div class="empty">找不到符合條件的人</div>`;
}
function outingEligibleList(date, filterFn){
  const onLeaveIds = new Set((state.unavail[date]||[]).filter(u=>u.allDay).map(u=>u.personId));
  let list = state.personnel.filter(p=>!onLeaveIds.has(p.id) && isEligibleForOuting(p.id, date));
  if(filterFn) list = list.filter(filterFn);
  return list.sort((a,b)=>rankIndex(a.rank)-rankIndex(b.rank) || groupIndex(a.group)-groupIndex(b.group));
}
function personDutySummary(personId, date){
  const parts=[];
  (state.unavail[date]||[]).filter(u=>u.personId===personId && isLeaveBufferEntry(u)).forEach(u=>{
    if(u.end==='24:00') parts.push(`今日${u.start}休假${u.start==='12:00'?'（榮譽假）':''}`);
    else if(u.start==='00:00' && u.end==='07:30') parts.push(`今日${u.end}收假`);
  });
  const dayAssign = (state.assign[date]||{});
  state.categories.forEach(cat=>{
    const catAssign = dayAssign[cat.id]||{};
    effectiveShifts(cat, date).forEach(sft=>{
      if((catAssign[sft.id]||[]).includes(personId)){
        parts.push(`${cat.name} ${sft.label||sft.start+'-'+sft.end}`);
      }
    });
  });
  (state.misc[date]||[]).forEach(m=>{
    if((m.personIds||[]).includes(personId)){
      parts.push(`${m.role}${m.start&&m.end? ` (${m.start}-${m.end})`:''}`);
    }
  });
  return parts;
}
function renderOnDutyList(date){
  const people = onDutyList(date);
  if(!people.length) return `<div class="empty">尚未新增人員</div>`;
  return people.map(p=>{
    const duties = personDutySummary(p.id, date);
    return `<div class="muted">・${esc(p.name)}（${p.group||'未分組'}·${p.rank}）：${duties.length? duties.map(esc).join('、') : '無排班'}</div>`;
  }).join('');
}

function personOptions(selected, groupFilter){
  if(!state.personnel.length) return `<option value="">（尚無人員）</option>`;
  let sorted=[...state.personnel].sort((a,b)=> groupIndex(a.group)-groupIndex(b.group) || rankIndex(a.rank)-rankIndex(b.rank));
  if(groupFilter) sorted = groupFilter==='__none'? sorted.filter(p=>!p.group) : sorted.filter(p=>p.group===groupFilter);
  if(!sorted.length) return `<option value="">（此排組無人員）</option>`;
  return sorted.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}（${p.group||'未分組'}·${p.rank}${p.license? '·🚗'+esc(p.license):''}${p.medCert? '·⛑️'+esc(p.medCert):''}${(p.skills&&p.skills.length)? '·🔧'+p.skills.map(esc).join('/'):''}${personLongTerm(p).mode!=='off'?'·🚫長期':''}）</option>`).join('');
}
function personOptionsForIncident(selected, groupFilter, date){
  if(!state.personnel.length) return `<option value="">（尚無人員）</option>`;
  let list=[...state.personnel];
  if(groupFilter) list = groupFilter==='__none'? list.filter(p=>!p.group) : list.filter(p=>p.group===groupFilter);
  if(!list.length) return `<option value="">（此排組無人員）</option>`;
  const hasAllDay = p => (state.unavail[date]||[]).some(u=>u.personId===p.id && u.allDay);
  list.sort((a,b)=>{
    const aa=hasAllDay(a)?1:0, bb=hasAllDay(b)?1:0;
    if(aa!==bb) return aa-bb;
    return groupIndex(a.group)-groupIndex(b.group) || rankIndex(a.rank)-rankIndex(b.rank);
  });
  return list.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}（${p.group||'未分組'}·${p.rank}${p.license? '·🚗'+esc(p.license):''}${p.medCert? '·⛑️'+esc(p.medCert):''}${(p.skills&&p.skills.length)? '·🔧'+p.skills.map(esc).join('/'):''}${hasAllDay(p)?'　✅已登記全天':''}）</option>`).join('');
}

function fmtDate(d){ return d; }
const WEEKDAY_CH=['日','一','二','三','四','五','六'];
function fmtDateShort(dateStr){

function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* small reusable "manage this reason preset pool" widget — a row of pills

      showConfirm('有尚未儲存的修改，確定要放棄並關閉嗎？', ()=>modal.remove());

    }
  };

let collapseState={};
function isExpanded(key){ return !!collapseState[key]; }
function wireDragReorder(containerId, arr, onReorder){
  const container = document.getElementById(containerId);
  if(!container) return;
  const rows = [...container.querySelectorAll('[data-drag-idx]')];
  if(!rows.length) return;
  const rects = rows.map(r=>r.getBoundingClientRect());
  const heights = rects.map(r=>r.height);
  const tops = rects.map(r=>r.top);
  rows.forEach((row, originalIdx)=>{
    const handle = row.querySelector('[data-drag-handle]');
    if(!handle) return;
    handle.style.touchAction='none';
    let startY=0, dragging=false, currentSlot=originalIdx;
    handle.addEventListener('touchstart', (e)=>{
      dragging=true;
      startY = e.touches[0].clientY;
      currentSlot = originalIdx;
      row.style.transition='none';
      row.style.zIndex='5';
      row.style.position='relative';
      row.style.boxShadow='0 4px 10px rgba(0,0,0,.5)';
      rows.forEach(r=>{ if(r!==row) r.style.transition='transform .15s ease'; });
      e.preventDefault();
    }, {passive:false});
    handle.addEventListener('touchmove', (e)=>{
      if(!dragging) return;
      e.preventDefault();
      const deltaY = e.touches[0].clientY - startY;
      row.style.transform = `translateY(${deltaY}px)`;
      const draggedCenter = tops[originalIdx] + heights[originalIdx]/2 + deltaY;
      let target = 0;
      for(let i=0;i<rows.length;i++){
        if(draggedCenter > tops[i] + heights[i]/2) target = i;
      }
      if(target !== currentSlot){
        rows.forEach((r,i)=>{
          if(r===row) return;
          if(target > currentSlot){
            r.style.transform = (i > currentSlot && i <= target) ? `translateY(${-heights[originalIdx]}px)` : '';
          } else {
            r.style.transform = (i >= target && i < currentSlot) ? `translateY(${heights[originalIdx]}px)` : '';
          }
        });
        currentSlot = target;
      }
    }, {passive:false});
    const finish = ()=>{
      if(!dragging) return;
      dragging=false;
      const [item] = arr.splice(originalIdx, 1);
      arr.splice(currentSlot, 0, item);
      row.style.transform=''; row.style.zIndex=''; row.style.position=''; row.style.boxShadow='';
      rows.forEach(r=>{ r.style.transform=''; r.style.transition=''; });
      onReorder();
    };
    handle.addEventListener('touchend', finish);
    handle.addEventListener('touchcancel', finish);
  });
}

  html += `</table>`;
  return html;
}
/* generic drag-to-reorder card list, shared by any tab whose cards the user
   should be able to rearrange (休假/事故, 統計) — each tab keeps its own
   persisted order of card keys in state.cardOrder[tab]; a card not yet in
   the stored order (new feature, or the first time this ever runs) sorts
   after everything else, in its original definition order */
function sortedCardDefs(tab, defs){
  const order = (state.cardOrder && state.cardOrder[tab]) || [];
  return [...defs].sort((a,b)=>{
    const ai=order.indexOf(a.key), bi=order.indexOf(b.key);
    const ra = ai<0? 1000+defs.indexOf(a) : ai;
    const rb = bi<0? 1000+defs.indexOf(b) : bi;
    return ra-rb;
  });
}
function draggableCardWrap(html){
  // cards are built via collapsibleCardHTML, whose template always starts
  // with this exact section-title+h2 opening — inject the grab handle
  // right before the title text so it visually sits in the header
  return html.replace('<h2 style="margin:0">', '<h2 style="margin:0"><span data-drag-handle style="cursor:grab;padding-right:6px;color:var(--dim)">⠿</span>');
}
function renderCardList(containerId, tab, defs){
  const sorted = sortedCardDefs(tab, defs);
  return `<div id="${containerId}">${sorted.map((d,i)=>`<div data-card-key="${esc(d.key)}" data-drag-idx="${i}">${draggableCardWrap(d.html)}</div>`).join('')}</div>`;
}
function wireCardListDrag(containerId, tab, defs){
  const sorted = sortedCardDefs(tab, defs);
  const keys = sorted.map(d=>d.key);
  wireDragReorder(containerId, keys, ()=>{
    if(!state.cardOrder) state.cardOrder={};
    state.cardOrder[tab] = keys;
    saveState();
    render();
  });
}

function generateScheduleText(date){
  const lines=[];
  lines.push('🌟衛哨勤務🌟');
  lines.push(dutyDateRangeLabel(date));
  orderedCategories().filter(c=>c.enforceRest && !c.excludeFromExport).forEach(cat=>{
    lines.push('🔶'+cat.name);
    const dayAssign=(state.assign[date]||{})[cat.id]||{};
    effectiveShifts(cat, date).forEach(s=>{
      const assigned=dayAssign[s.id]||[];
      const names=Array.from({length:s.count}).map((_,i)=>assigned[i]?personName(assigned[i]):'');
      const timeLabel = s.label? s.label : (s.start+'-'+s.end);
      lines.push(`${timeLabel} ${names.filter(Boolean).join('、')||'（未排）'}`);
    });
  });
  lines.push('———勤務———');
  const nonRestCats = orderedCategories().filter(c=>!c.enforceRest && !c.excludeFromExport)
    .map(c=>({kind:'cat', ref:c, sortOrder:c.sortOrder??999}));
  const miscEntries = (state.misc[date]||[]).filter(m=>{
    const preset = state.miscPresets.find(p=>p.role===m.role);
    return !preset || !preset.excludeFromExport;
  }).map(m=>{
    const preset = state.miscPresets.find(p=>p.role===m.role);
    return {kind:'misc', ref:m, sortOrder: preset? (preset.sortOrder??999) : 999};
  });
  [...nonRestCats, ...miscEntries].sort((a,b)=>a.sortOrder-b.sortOrder).forEach(item=>{
    if(item.kind==='cat'){
      const cat=item.ref;
      lines.push('♦️'+cat.name+'：');
      const dayAssign=(state.assign[date]||{})[cat.id]||{};
      effectiveShifts(cat, date).forEach(s=>{
        const assigned=dayAssign[s.id]||[];
        const names=Array.from({length:s.count}).map((_,i)=>assigned[i]?personName(assigned[i]):'').filter(Boolean);
        const label=s.label||(s.start+'-'+s.end);
        lines.push(`${label}：${names.join('、')}`);
      });
    } else {
      const m=item.ref;
      const people=m.personIds.map(pid=>personName(pid)).join('、');
      const timePart = m.start&&m.end? `（${m.start}-${m.end}）`:'';
      lines.push(`♦️${m.role}${timePart}：${people}`);
    }
  });
  return lines.join('\n');
}

function openTextShareModal(title, text){
  const fileName = title.replace(/\s+/g,'')+'-'+todayStr()+'.txt';
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;';
  modal.innerHTML=`
    <div style="background:var(--panel);width:100%;max-height:88vh;overflow:auto;border-radius:12px 12px 0 0;padding:14px;">
      <div class="section-title"><h2 style="margin:0">${esc(title)}</h2><button class="ghost small" id="closeTextShare">關閉</button></div>
      <div class="row wrap" style="margin-bottom:8px">
        <button class="primary grow" id="shareTextBtn">📤 分享</button>
        <button class="ghost grow" id="copyTextBtn">📋 複製</button>
      </div>
      <div class="hint">複製後可直接貼到 LINE／訊息傳給大家。</div>
      <textarea id="shareTextArea" readonly style="min-height:280px;font-size:13px;margin-top:8px;white-space:pre">${esc(text)}</textarea>

    }catch(err){ /* cancelled or unsupported */ }
    try{ ta.focus(); ta.select(); document.execCommand('copy'); document.getElementById('copyTextBtn').textContent='已複製 ✓'; }
    catch(err){ showAlert('分享不支援，請改用「複製」。'); }
  };
  document.getElementById('copyTextBtn').onclick=async()=>{
    const btn=document.getElementById('copyTextBtn');
    try{ await navigator.clipboard.writeText(text); btn.textContent='已複製 ✓'; }
    catch(err){
      try{ ta.focus(); ta.select(); document.execCommand('copy'); btn.textContent='已複製 ✓'; }
      catch(err2){ showAlert('複製失敗，請手動選取文字方塊內容複製。'); }
    }
  };
}

function normalizePriorityArray(arr){
  const result = [...arr];
  RANK_DEFS.forEach(r=>{ if(!result.includes(r.rank)) result.push(r.rank); });
  return result;
}
function defaultPriorityArray(cat){
  if(cat.needsNCO) return normalizePriorityArray(NCO_LEAD_PRIORITY);
  if(cat.preferLowRank) return normalizePriorityArray(LOW_RANK_PRIORITY);
  return RANK_DEFS.map(r=>r.rank);
}
function defaultHelperPriorityArray(){
  return normalizePriorityArray(MEAL_HELPER_PRIORITY);
}
function categoryPriorityLabel(cat){
  if(cat.needsNCO){
    const lead = cat.customPriority || normalizePriorityArray(NCO_LEAD_PRIORITY);
    const helper = cat.customPriorityHelper || normalizePriorityArray(MEAL_HELPER_PRIORITY);
    return `帶隊(第1位)優先：${lead.join('→')}｜其餘成員優先：${helper.join('→')}｜整天班全部依：${helper.join('→')}`;
  }
  if(cat.preferLowRank){
    return `優先順序：${(cat.customPriority || normalizePriorityArray(LOW_RANK_PRIORITY)).join('→')}`;
  }
  return `優先順序：${(cat.customPriority || RANK_DEFS.map(r=>r.rank)).join('→')}`;
}
function buildScheduleCardItems(){
  const dayMisc = state.misc[currentDate]||[];
  const miscByRole = {};
  dayMisc.forEach(m=>{
    if(!miscByRole[m.role]) miscByRole[m.role]=[];
    miscByRole[m.role].push(m);
  });
  const miscGroups = Object.keys(miscByRole).map(role=>{
    const preset = state.miscPresets.find(p=>p.role===role);
    return {kind:'misc', role, entries:miscByRole[role], preset, sortOrder: preset?(preset.sortOrder??999):999};
  });
  const catItems = orderedCategories().map(cat=>({kind:'cat', cat, sortOrder:cat.sortOrder??999}));
  return [...catItems, ...miscGroups].sort((a,b)=>a.sortOrder-b.sortOrder);
}
function renderScheduleCards(){
  return buildScheduleCardItems().map((item,i)=>
    item.kind==='cat'? renderCategoryCard(item.cat, i) : renderMiscDutyCard(item.role, item.entries, item.preset, i)
  ).join('');
}
function wireScheduleCardsDrag(){
  const items = buildScheduleCardItems();
  wireDragReorder('scheduleCardsContainer', items, ()=>{
    items.forEach((item,i)=>{
      const ref = item.kind==='cat'? item.cat : item.preset;
      if(ref) ref.sortOrder = i*10;
    });
    saveState();
    render();
  });
  document.querySelectorAll('.card-exclude-cb').forEach(cb=>{
    cb.onchange=()=>{
      const kind=cb.dataset.excludeKind, id=cb.dataset.excludeId;
      if(kind==='cat'){
        const cat=state.categories.find(c=>c.id===id);
        if(cat) cat.excludeFromExport=cb.checked;
      } else {
        const preset=state.miscPresets.find(p=>p.role===id);
        if(preset) preset.excludeFromExport=cb.checked;
      }
      saveState();
    };
  });
}

/* explains WHY a shift is still short of its "最少需要幾位士官" requirement —
   distinguishes "nobody at all is available for the empty slots" from
   "people are available but none of them are 士官以上", since those call
   for different action (wait/reassign elsewhere vs. can't be filled at all
   without pulling someone from another duty) */
function minNCOStatusHTML(cat, s, date, assigned, ncoCount){
  if(ncoCount>=s.minNCO) return `<div class="hint" style="margin-bottom:6px">此班需至少 ${s.minNCO} 位士官(含)以上，目前 ${ncoCount} 位</div>`;
  const sMin=toMin(s.start), eMin=wrapEndMin(sMin, toMin(s.end));
  const stillEligible = p => !assigned.includes(p.id) && !rankExcludedFromCategory(p.rank,cat) && !isPersonUnavailable(p.id, date, sMin, eMin, {catId:cat.id, shiftId:s.id});
  const anyAvailable = state.personnel.some(stillEligible);
  const ncoAvailable = state.personnel.some(p=>['士官','軍官'].includes(rankCategory(p.rank)) && stillEligible(p));
  let note;
  if(!anyAvailable) note='目前完全沒有人有空可排這一班';
  else if(!ncoAvailable) note='有人有空，但沒有士官以上人員有空，需人工確認調整（自動排班不會硬塞士兵充當帶隊）';
  else note='有士官有空，尚未指派';
  return `<div class="badge-issue" style="margin-bottom:6px">⚠️ 此班需至少 ${s.minNCO} 位士官(含)以上，目前 ${ncoCount} 位（${note}）</div>`;
}

  const extraButtons = `<label style="display:flex;align-items:center;gap:3px;font-size:11px"><input type="checkbox" class="card-exclude-cb" data-exclude-kind="cat" data-exclude-id="${cat.id}" style="width:auto" ${cat.excludeFromExport?'checked':''}>不匯出</label><button class="ghost small" data-edit-cat="${cat.id}">編輯</button><button class="ghost small danger" data-clear-cat="${cat.id}">清空排班</button>`;

            ${pid && cat.enforceRest && assignedSameShiftYesterday(pid,currentDate,cat.id,s.id)? `<div class="badge-issue">⚠️ ${esc(personName(pid))}：昨天也值這個時段，建議換人</div>`:''}
            ${pid && cat.enforceRest && wouldRestWindowConflict(pid,currentDate,s,{catId:cat.id,shiftId:s.id})? `<div class="badge-issue">⚠️ ${esc(personName(pid))}：下班補休時段跟其他已排的勤務衝突</div>`:''}
            ${pid && cat.enforceRest && prepGapConflict(pid,currentDate,cat,s)? `<div class="badge-issue">⚠️ ${esc(personName(pid))}：這班開始前不到30分鐘還在忙其他勤務，沒時間準備</div>`:''}
            ${pid && cat.preferLowRank && rankCategory(personRank(pid))==='軍官'? `<div class="badge-issue">⚠️ 建議優先排下士，其次其他士兵/士官，非必要不派軍官</div>`:''}
            ${pid && cat.needsNCO && rankCategory(personRank(pid))==='軍官'? `<div class="badge-issue">⚠️ 建議盡量避免安排軍官擔任打飯班</div>`:''}
          </div>`;
        }).join('')}
      </div>`;
    }).join('')}
  `;
  return `<div data-cat="${cat.id}" data-drag-idx="${dragIdx}">${collapsibleCardHTML('cat-'+cat.id, title, inner, extraButtons)}</div>`;
}

function assignableOptions(cat, shift, selectedId, slotIdx){
  const sorted=[...state.personnel].sort((a,b)=>dutySortIndex(a.rank,cat,slotIdx,shift)-dutySortIndex(b.rank,cat,slotIdx,shift) || groupIndex(a.group)-groupIndex(b.group));
  return sorted.map(p=>{
    const s=toMin(shift.start), e0=toMin(shift.end);
    const excluded = rankExcludedFromCategory(p.rank, cat);
    const unavailable = excluded || isPersonUnavailable(p.id, currentDate, s, wrapEndMin(s, e0), {catId:cat.id, shiftId:shift.id});
    let flag='';
    if(excluded) flag=' 🚫階級不可排此類別';
    else if(unavailable) flag=' 🚫不可排';
    return `<option value="${p.id}" ${p.id===selectedId?'selected':''}>${esc(p.name)}（${p.group||'未分組'}·${p.rank}${p.license? '·🚗'+esc(p.license):''}）${flag}</option>`;
  }).join('');
}

function wireCategoryEvents(){
  app.querySelectorAll('[data-assign-cat]').forEach(sel=>{
    sel.onchange=()=>{
      const catId=sel.dataset.assignCat, shiftId=sel.dataset.assignShift, idx=Number(sel.dataset.assignIdx);
      if(!state.assign[currentDate]) state.assign[currentDate]={};
      if(!state.assign[currentDate][catId]) state.assign[currentDate][catId]={};
      if(!state.assign[currentDate][catId][shiftId]) state.assign[currentDate][catId][shiftId]=[];
      state.assign[currentDate][catId][shiftId][idx]=sel.value||undefined;
      saveState(); render();
    };
  });
  app.querySelectorAll('[data-clear-cat]').forEach(b=>{
    b.onclick=()=>{
      const cat=state.categories.find(c=>c.id===b.dataset.clearCat);
      showConfirm(`清空「${cat?cat.name:''}」${fmtDate(currentDate)}已排的班表？（類別與班別設定不會被刪除，只清空這天指派的人）`, ()=>{
        if(state.assign[currentDate]) delete state.assign[currentDate][b.dataset.clearCat];
        saveState(); render();
      });
    };
  });
  app.querySelectorAll('[data-edit-cat]').forEach(b=>{
    b.onclick=()=>openCategoryEditor(b.dataset.editCat);
  });
}

  document.getElementById('clearTodayOverrideBtn').onclick=()=>{

      if(state.dailyShiftOverrides[currentDate]) delete state.dailyShiftOverrides[currentDate][cat.id];
      todayShiftsDraft = cat.shifts.map(s=>({...s}));

      if(!state.dailyShiftOverrides[currentDate]) state.dailyShiftOverrides[currentDate]={};
      state.dailyShiftOverrides[currentDate][cat.id] = draftShifts;

        <div style="width:120px"><label>最少需要幾位士官(含)以上(選填，0代表不限)</label><input type="text" class="se-minnco" value="${s.minNCO||0}"></div>
      </div>

function runDailyCheck(){
  const out=[];
  const seen=new Set();
  state.categories.filter(c=>c.enforceRest).forEach(cat=>{
    const dayAssign=(state.assign[currentDate]||{})[cat.id]||{};
    effectiveShifts(cat, currentDate).forEach(s=>{
      (dayAssign[s.id]||[]).forEach(pid=>{
        if(!pid) return;
        const issues=restIssues(pid,currentDate,cat.id,s);
        issues.forEach(i=>{
          const key=pid+'|'+i; if(seen.has(key)) return; seen.add(key);
          out.push(`⚠️ ${personName(pid)}（${cat.name} ${s.label||s.start+'-'+s.end}）：${i}`);
        });
        if(assignedSameShiftYesterday(pid,currentDate,cat.id,s.id)){
          out.push(`⚠️ ${personName(pid)}（${cat.name} ${s.label||s.start+'-'+s.end}）：昨天也值這個時段，連續兩天同時段`);
        }
        if(wouldRestWindowConflict(pid,currentDate,s,{catId:cat.id,shiftId:s.id})){
          out.push(`⚠️ ${personName(pid)}（${cat.name} ${s.label||s.start+'-'+s.end}）：下班補休時段跟其他已排的勤務衝突`);
        }
        if(prepGapConflict(pid,currentDate,cat,s)){
          out.push(`⚠️ ${personName(pid)}（${cat.name} ${s.label||s.start+'-'+s.end}）：開始前不到30分鐘還在忙其他勤務，沒時間準備`);
        }
      });
    });
  });
  const mealCat = state.categories.find(c=>c.needsNCO);
  if(mealCat){
    const dayAssign=(state.assign[currentDate]||{})[mealCat.id]||{};
    const allPeople = effectiveShifts(mealCat, currentDate).flatMap(s=>dayAssign[s.id]||[]).filter(Boolean);
    const hasNCO = allPeople.some(pid=>['士官','軍官'].includes(rankCategory(personRank(pid))));
    if(allPeople.length && !hasNCO) out.push(`⚠️ ${mealCat.name}：當日尚無「士官」以上人員帶隊`);
  }
  state.categories.filter(c=>c.preferLowRank).forEach(cat=>{
    const dayAssign=(state.assign[currentDate]||{})[cat.id]||{};
    effectiveShifts(cat, currentDate).forEach(s=>{
      (dayAssign[s.id]||[]).forEach(pid=>{
        if(pid && rankCategory(personRank(pid))==='軍官') out.push(`⚠️ ${cat.name} ${s.label||s.start+'-'+s.end}：${personName(pid)} 為軍官，建議改排較低階`);
      });
    });
  });
  state.categories.filter(c=>c.needsNCO).forEach(cat=>{
    const dayAssign=(state.assign[currentDate]||{})[cat.id]||{};
    effectiveShifts(cat, currentDate).forEach(s=>{
      (dayAssign[s.id]||[]).forEach(pid=>{
        if(pid && rankCategory(personRank(pid))==='軍官') out.push(`⚠️ ${cat.name} ${s.label||s.start+'-'+s.end}：${personName(pid)} 為軍官，盡量避免安排軍官擔任打飯班`);
      });
    });
  });
  state.categories.forEach(cat=>{
    const dayAssign=(state.assign[currentDate]||{})[cat.id]||{};
    effectiveShifts(cat, currentDate).forEach(s=>{
      (dayAssign[s.id]||[]).forEach(pid=>{
        if(!pid) return;
        const busy = isPersonUnavailable(pid, currentDate, toMin(s.start), wrapEndMin(toMin(s.start), toMin(s.end)), {catId:cat.id, shiftId:s.id});
        if(busy){
          const key='busy|'+pid+'|'+cat.id+'|'+s.id; if(seen.has(key)) return; seen.add(key);
          out.push(`⚠️ ${personName(pid)}（${cat.name} ${s.label||s.start+'-'+s.end}）：此時段該員請假/長期事故/補休中或已排其他勤務`);
        }
      });
    });
  });
  document.getElementById('dailyCheckOut').innerHTML = out.length?
    out.map(o=>`<div class="warn" style="margin-top:6px">${esc(o)}</div>`).join('') :
    `<div class="ok" style="margin-top:6px">✅ 目前排班未發現違規</div>`;
}

/* ---- MISC TAB (簡易勤務，如採買/技工/查哨等免時段的項目) ---- */
let miscSelectedRoles=null;
let miscFreeformFilterState={search:'',group:''};
let miscFreeformCheckedIds=new Set();
let miscEditingId=null;
let adhocQueryState={time:'10:00',officer:0,nco:0,enlisted:0,skill:'',hasRun:false,results:null};
function runAdhocQuery(){
  const {time, officer, nco, enlisted, skill} = adhocQueryState;
  const qMin = toMin(time);
  const wanted = {軍官:Number(officer)||0, 士官:Number(nco)||0, 士兵:Number(enlisted)||0};
  const byCategory = {軍官:[], 士官:[], 士兵:[]};
  state.personnel.forEach(p=>{
    const cat = rankCategory(p.rank);
    if(!cat) return;
    if(skill && !(p.skills||[]).includes(skill)) return;
    if(isPersonUnavailable(p.id, currentDate, qMin, qMin+1)) return;
    const freeMin = freeDurationFrom(p.id, currentDate, qMin);
    const freeUntilMin = qMin+freeMin;
    let nextCommitment = null;
    if(freeUntilMin < 1440){
      const reasons = unavailabilityReasonsInRange(p.id, currentDate, freeUntilMin, Math.min(freeUntilMin+1,1440));
      if(reasons.length) nextCommitment = reasons[0];
    }

function renderAdhocQueryResult(){

  const p2=n=>String(n).padStart(2,'0');
