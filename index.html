  function applyPeopleFilter(){
    const kw=document.getElementById('pplSearch').value.trim();
    const gf=document.getElementById('pplGroupFilter').value;
    const genf=document.getElementById('pplGenderFilter').value;
    const lf=[...document.querySelectorAll('.ppl-license-cb:checked')].map(cb=>cb.value);
    const mf=[...document.querySelectorAll('.ppl-medcert-cb:checked')].map(cb=>cb.value);
    const sf=[...document.querySelectorAll('.ppl-skill-cb:checked')].map(cb=>cb.value);
    pplFilterState = {kw, group:gf, gender:genf, license:lf, medCert:mf, skills:sf};
    const filterFn = p=>{
      if(isDeparted(p)) return false;
      if(kw && !p.name.includes(kw)) return false;
      if(gf==='__none' && p.group) return false;
      if(gf && gf!=='__none' && p.group!==gf) return false;
      if(genf==='__none' && p.gender) return false;
      if(genf && genf!=='__none' && p.gender!==genf) return false;
      if(lf.length){
        const matchLicense = lf.includes('__none')? !p.license : false;
        if(!matchLicense && !lf.includes(p.license)) return false;
      }
      if(mf.length){
        const matchMed = mf.includes('__none')? !p.medCert : false;
        if(!matchMed && !mf.includes(p.medCert)) return false;
      }
      if(sf.length){
        const matchSkill = sf.includes('__none')? !(p.skills&&p.skills.length) : (p.skills||[]).some(s=>sf.includes(s));
        if(!matchSkill) return false;
      }
      return true;
    };
    const area=document.getElementById('pplListArea');
    const html=renderPeopleGroups(groups, filterFn);
    area.innerHTML = html || `<div class="empty">找不到符合的人員</div>`;
    wirePeopleListButtons();
    const activeTotal = state.personnel.filter(p=>!isDeparted(p)).length;
    const filteredPeople = state.personnel.filter(filterFn);
    document.getElementById('pplSummary').innerHTML = personListSummaryHTML(filteredPeople, state.personnel.filter(p=>!isDeparted(p)));

      ? `名冊（篩選出 ${filteredTotal} / 共 ${activeTotal} 人）`
      : `名冊（${activeTotal}人）`;
  }

/* creates one 不在營 block for one person under one category. Categories
   with `buffer` get a front/back buffer around the ticked dates;
   categories without it are just plain allDay entries for each date, no
   extra buffer days. For buffered categories, `tier` picks which of the
   two buffer levels applies (times come from state.unitRules.leaveBuffer,
   not hardcoded, so the unit can adjust them without a code change):
   'honor' — loosest, front buffer starts the day before at honorStart
   'normal' — default, front buffer starts the day before at normalStart
   Both share the same back-buffer end time the day after. A rare case
   where the front buffer needs cancelling entirely (task/discipline delays
   the actual start), or the back buffer needs cancelling (early return the
   night before), is handled separately as a per-block adjustment — see
   adjustLeaveStart/adjustLeaveEnd — not as a third tier here. Every entry
   (buffered or not) gets the same leaveId so the whole block can still be
   found/deleted as one unit regardless of category or tier. */
function createLeaveSegment(personId, s, e, category, tier, approved, note){
  tier = tier===true? 'honor' : (tier===false || tier==null? 'normal' : tier);
  const leaveId=uid();
  const buf = state.unitRules.leaveBuffer;
  if(!category.buffer){
    dateRangeList(s,e).forEach(d=>{
      if(!state.unavail[d]) state.unavail[d]=[];
      const entry={id:uid(),personId,allDay:true,start:'',end:'',reason:category.name,leaveId,leaveStart:s,leaveEnd:e,inCamp:false};
      if(note) entry.note=note;
      state.unavail[d].push(entry);
    });
    return {honorApplied:false, honorDowngraded:false, tierApplied:'none', leaveId};
  }
  const actualDays=daysBetweenInclusive(s, e); // 實際天數，不含前後緩衝
  const honorRequested = tier==='honor';
  const effectiveDays = actualDays + (honorRequested? 0.5 : 0);
  const honorApplies = category.honorOption && honorRequested && (effectiveDays<=5 || approved);
  const dates = dateRangeList(s,e);
  const lastRoster=nextDateStr(e);
  const firstRoster=prevDateStr(s);
  const firstStart = honorApplies? buf.honorStart : buf.normalStart;
  // 榮譽假只是「前一天多出來的那半天緩衝」被多算，不是整段假期的標籤——
  // 實際休假的那幾天跟隔天收假緩衝，永遠都是這個類型本身的名稱（例如
  // 「休假」），不會因為前面選了榮譽假就整段都標成榮譽假
  if(!state.unavail[firstRoster]) state.unavail[firstRoster]=[];
  state.unavail[firstRoster].push({id:uid(),personId,allDay:false,start:firstStart,end:'24:00',reason: honorApplies? '榮譽假':category.name,leaveId,leaveStart:s,leaveEnd:e,inCamp:false});
  dates.forEach(d=>{
    if(!state.unavail[d]) state.unavail[d]=[];
    state.unavail[d].push({id:uid(),personId,allDay:true,start:'',end:'',reason:category.name,leaveId,leaveStart:s,leaveEnd:e,inCamp:false});
  });
  if(!state.unavail[lastRoster]) state.unavail[lastRoster]=[];
  state.unavail[lastRoster].push({id:uid(),personId,allDay:false,start:'00:00',end:buf.backEnd,reason:category.name,leaveId,leaveStart:s,leaveEnd:e,inCamp:false});
  // report back whether the requested 榮譽假 actually took effect, so callers
  // (like the leave-table importer) can surface it instead of it silently
  // falling back to a normal-tier start
  return {honorApplied: honorApplies, honorDowngraded: honorRequested && !honorApplies, tierApplied: honorApplies?'honor':'normal', leaveId};
}

function deleteLeaveById(leaveId){
  Object.keys(state.unavail).forEach(d=>{
    state.unavail[d]=(state.unavail[d]||[]).filter(u=>u.leaveId!==leaveId);

}
/* the leaveId of a person's leave block active on this date, if any —
   used to attach an 編輯 button next to their name wherever they show up */
function findLeaveIdForPerson(personId, date){
  const hit = (state.unavail[date]||[]).find(u=>u.personId===personId && u.leaveId);
  return hit? hit.leaveId : null;
}
/* 不在營名單 (統計分頁): the exact complement of onDutyList — anyone
   excluded from "在勤人員" for whatever reason (休假, 長期事故 在營=否,
   or a 全日出勤/營外 misc duty) shows up here instead, so the two lists
   always add up to the full roster. */
let notInCampFilterState={search:'',group:'',reasons:[]};
function notInCampList(date){
  const onDutyIds = new Set(onDutyList(date).map(p=>p.id));
  return state.personnel.filter(p=>!onDutyIds.has(p.id));
}
function personAwayReason(personId, date){
  const dayEntries = (state.unavail[date]||[]).filter(u=>u.personId===personId && u.allDay);
  const away = dayEntries.find(u=>isLeaveReason(u.reason) || u.inCamp===false);
  if(away) return (away.reason || '（未指定原因）') + (away.note? `（${away.note}）`:'');
  const person = state.personnel.find(p=>p.id===personId);
  if(person){
    const lt = effectiveLongTerm(person, date);
    if(lt.mode==='allday' && !lt.inCamp) return lt.reason || '長期事故';
  }
  return '（原因不明）';
}
function personAwayReasonCategory(personId, date){
  const dayEntries = (state.unavail[date]||[]).filter(u=>u.personId===personId && u.allDay);
  const leaveCatNames=state.leaveCategories.map(c=>c.name);
  const away = dayEntries.find(u=>isLeaveReason(u.reason) || u.inCamp===false || leaveCatNames.includes(u.reason));
  if(away && away.reason){
    // 「榮譽假」現在只標記在前一天那半天緩衝上（見createLeaveSegment），
    // 這天本身的整天記錄一律是類別名稱（例如「休假」）——要知道這天是不是
    // 榮譽假的一部分，得找同一個leaveId的前緩衝記錄，不能只看這天自己的
    // reason
    if(away.leaveId){
      const isHonor = Object.values(state.unavail).some(arr=>(arr||[]).some(u=>u.leaveId===away.leaveId && u.reason==='榮譽假'));
      if(isHonor) return '榮譽假';
    }
    // 先比對正式類別名稱（精準比對），不是先看文字裡有沒有「假」字——不然
    // 「事假」這種名字本身也帶「假」字的正式類別，會在isLeaveReason那關就
    // 被誤判成「休假」，永遠輪不到後面比對到自己真正的類別名稱。只有完全
    // 不在正式類別清單裡的舊資料／自由輸入文字，才退回用「有沒有假字」這
    // 種寬鬆判斷歸到休假。
    if(leaveCatNames.includes(away.reason)) return away.reason;
    if(isLeaveReason(away.reason)) return '休假';
    return '其他事故';
  }
  const person = state.personnel.find(p=>p.id===personId);
  if(person){
    const lt = effectiveLongTerm(person, date);
    if(lt.mode==='allday' && !lt.inCamp){
      // 長期事故的原因如果剛好也是一個正式的休假暨事故類型名稱（例如
      // 「受訓」——有些人是用長期狀態記整段受訓，不是逐日登記），分類要
      // 跟著顯示的原因走，不然篩選「受訓」會漏掉這些人，只能篩到「長期
      // 事故」，兩邊文字對不起來
      if(lt.reason && leaveCatNames.includes(lt.reason)) return lt.reason;
      return '長期事故';
    }
  }
  return '其他事故';
}
/* 依排組分組（預設），或依具體原因分組（篩選「其他事故」時用，取代原本
   獨立的「其他事故/管制分類」卡片——那張卡片本來就是把同一天的事故依
   「具體原因」分組顯示，現在併進不在營名單，篩選到其他事故時用同樣的
   分組方式呈現，不會少了這個瀏覽角度）。 */
function notInCampItemsHTML(list, date, groupByReason){
  if(!list.length) return `<div class="empty">找不到符合的人員</div>`;
  if(groupByReason){
    const byReason={};
    list.forEach(p=>{ const r=personAwayReason(p.id,date)||'（未指定原因）'; if(!byReason[r]) byReason[r]=[]; byReason[r].push(p); });
    return Object.entries(byReason).map(([reason,members])=>{
      const bd=rankGenderBreakdown(members);
      const sorted = members.slice().sort((a,b)=>groupIndex(a.group)-groupIndex(b.group) || rankIndex(a.rank)-rankIndex(b.rank));
      const rows = sorted.map(p=>{
        const lid = findLeaveIdForPerson(p.id, date);
        return `<div class="row" style="margin-bottom:4px;align-items:flex-start">
          <span class="muted grow">・${esc(p.name)}（${p.group||'未分組'}·${p.rank}）</span>
          ${lid? `<button class="ghost small" data-goto-leave-table="${p.id}">去休假暨事故大表改</button>` : `<button class="ghost small" data-quick-incident="${p.id}">編輯</button>`}
        </div>`;
      }).join('');
      return collapsibleCardHTML('notInCampReason-'+reason, `${esc(reason)}（${members.length}人・${fmtRankBreakdown(bd)}）`, rows);
    }).join('');
  }
  const byGroup={};
  list.forEach(p=>{ const g=p.group||'未分組'; if(!byGroup[g]) byGroup[g]=[]; byGroup[g].push(p); });
  return Object.entries(byGroup).sort((a,b)=>groupIndex(a[0])-groupIndex(b[0])).map(([g,members])=>{
    const bd=rankGenderBreakdown(members);
    const sorted = members.slice().sort((a,b)=>rankIndex(a.rank)-rankIndex(b.rank));
    const rows = sorted.map(p=>{
      const reason = personAwayReason(p.id, date);
      const lid = findLeaveIdForPerson(p.id, date);
      return `<div class="row" style="margin-bottom:4px;align-items:flex-start">
        <span class="muted grow">・${esc(p.name)}（${p.rank}）：${esc(reason)}</span>
        ${lid? `<button class="ghost small" data-goto-leave-table="${p.id}">去休假暨事故大表改</button>` : `<button class="ghost small" data-quick-incident="${p.id}">編輯</button>`}
      </div>`;
    }).join('');
    return collapsibleCardHTML('notInCampGroup-'+g, `${esc(g)}（${members.length}人・${fmtRankBreakdown(bd)}）`, rows);
  }).join('');
}

function isLeaveReason(reason){ return !!reason && reason.includes('假'); }
/* 判斷這筆記錄是不是休假的「緩衝」（前一天傍晚/隔天清晨那種墊檔記錄），
   不是使用者實際要休的那幾天——改用「我們的規則」目前設定的時間動態判
   斷，不寫死，這樣以後調整緩衝時間，這裡不用跟著改程式碼、也不會抓錯。 */
function isLeaveBufferEntry(u){
  if(u.allDay) return false;
  const buf = state.unitRules.leaveBuffer;
  if(u.end==='24:00' && (u.start===buf.honorStart || u.start===buf.normalStart)) return true; // 前緩衝
  if(u.start==='00:00' && u.end===buf.backEnd) return true; // 後緩衝
  return false;
}
function isBackBufferEntry(u){
  if(u.allDay || !u.leaveId) return false;
  return u.start==='00:00' && u.end===state.unitRules.leaveBuffer.backEnd;
}
function isFrontBufferEntry(u){
  if(u.allDay || !u.leaveId) return false;
  const buf = state.unitRules.leaveBuffer;
  return u.end==='24:00' && (u.start===buf.honorStart || u.start===buf.normalStart);
}
/* 收假提早——某段假期原本該「隔天0730收假」的那個隔天，讓整批人真的提早
   收假：假期原本的最後一天（後緩衝記錄上的leaveEnd）從這個人這個類型的
   登記天數(state.preplan.leave)裡整天拿掉，連同當天在state.unavail的整
   天記錄一起刪除，同時把隔天早上的後緩衝記錄也刪掉。這樣休假暨事故大表
   月曆才會真的少一天，而不是只拿掉看不見的緩衝、月曆卻完全沒變化。如果
   這段假期本來有超過5天同意記錄(approvedRuns)剛好用這天當結束日，結束日
   也跟著往前調一天，不然縮短後的這段會變成「找不到對應的同意記錄」。 */
function peopleWithBackBufferOn(date){
  return (state.unavail[date]||[]).filter(isBackBufferEntry);
}
function applyEarlyReturn(date, entryIds){
  if(!state.unavail[date]) return 0;
  const entries = state.unavail[date].filter(u=>entryIds.includes(u.id));
  entries.forEach(u=>{
    const lastDay = u.leaveEnd || prevDateStr(date);
    if(u.leaveId && u.personId && u.reason && state.preplan && state.preplan.leave && state.preplan.leave[u.personId] && state.preplan.leave[u.personId][u.reason]){
      const rec = state.preplan.leave[u.personId][u.reason];
      rec.dates = (rec.dates||[]).filter(d=>d!==lastDay);
      rec.honorDates = (rec.honorDates||[]).filter(d=>d!==lastDay);
      if(rec.partialTimes) delete rec.partialTimes[lastDay];
      if(rec.approvedRuns && rec.approvedRuns.length){
        rec.approvedRuns = rec.approvedRuns.map(r=> r.end===lastDay? {...r, end:prevDateStr(lastDay)} : r);
      }
      if(!rec.dates.length) delete state.preplan.leave[u.personId][u.reason];
    }
    if(state.unavail[lastDay]){
      state.unavail[lastDay] = state.unavail[lastDay].filter(x=>!(x.leaveId===u.leaveId && x.allDay));
    }
  });
  const before = state.unavail[date].length;
  state.unavail[date] = state.unavail[date].filter(u=>!entryIds.includes(u.id));
  return before - state.unavail[date].length;
}
/* 開始延後——少數人因為任務/處罰，某段假期實際上要晚一點才開始休假（不
   是單位統一的18:00/12:00），時間也不固定，所以是逐次輸入、按這段假期第
   一天的日期分批處理，同一天可以分好幾批、每批給不同時間。做法：刪掉前
   一天的前緩衝記錄，把「這段假期的第一天」本身從整天登記改成部分時段，
   從輸入的時間開始。只影響假期的開頭，中間跟收假那端完全不受影響。 */
function peopleStartingLeaveOn(date){
  return (state.unavail[date]||[]).filter(u=>u.allDay && u.leaveId && u.leaveStart===date);
}
function applyDelayedStart(date, entryIds, newStartTime){
  const prevDay = prevDateStr(date);
  let count=0;
  (state.unavail[date]||[]).forEach(u=>{
    if(!entryIds.includes(u.id)) return;
    if(state.unavail[prevDay]) state.unavail[prevDay] = state.unavail[prevDay].filter(x=>!(x.leaveId===u.leaveId && isFrontBufferEntry(x)));
    u.allDay = false;
    u.start = newStartTime;
    u.end = '24:00';
    count++;
  });
  return count;
}
function onDutyList(date){
  const dayEntries = state.unavail[date]||[];
  const leaveCatNames=state.leaveCategories.map(c=>c.name);
  const awayIds = new Set(dayEntries.filter(u=>u.allDay && (isLeaveReason(u.reason) || u.inCamp===false || leaveCatNames.includes(u.reason))).map(u=>u.personId));
  // NOTE: 全日出勤（營外）(e.g. 採買/督伙 all day) does NOT remove someone
  // from 在勤人員 — they still have an assigned task and count as "on
  // duty", just physically away; renderOnDutyList annotates them with the
  // task name instead. Only 休假 and 在營=否 (長期事故/單日事故) genuinely
  // take someone off the roster for the day.
  return state.personnel.filter(p=>{
    if(awayIds.has(p.id)) return false;
    const lt = effectiveLongTerm(p, date);

   3=02-04,4=04-06）。 */

   例假日（延伸到假日後一天的04-06為止）。 */
function isPatrolHolidaySlot(date, slotIdx){
  if(slotIdx===0) return isHolidayDate(date); // 12-14
  if(slotIdx===1) return isHolidayDate(date) || isHolidayDate(nextDateStr(date)); // 22-24
  return isHolidayDate(date) || isHolidayDate(prevDateStr(date)); // 00-02,02-04,04-06

/* 算出查哨從 fromDate 到 toDate 每個時段該輪到哪個單位。平日跟假日是兩條

   單純的公式算，因為要知道兩個日期之間實際出現過幾次平日格子、幾次假日
   格子，這跟真實的假日設定（例假日、國定假日）有關，只能逐格數過去。
   從兩個錨點裡較早的那個開始數，數到 toDate 為止，回傳範圍內
   {日期:{時段index:單位名稱}} 的對照表。 */
function computePatrolSequence(fromDate, toDate){
  const cfg = state.patrolSequence;
  const startDate = cfg.anchorWeekday.date < cfg.anchorHoliday.date? cfg.anchorWeekday.date : cfg.anchorHoliday.date;
  const result = {};
  let weekdayPtr = null, holidayPtr = null;
  let d = startDate;
  let guard = 0;
  while(d <= toDate && guard < 100000){
    guard++;

      const isHol = isPatrolHolidaySlot(d, slotIdx);
      if(isHol){
        if(d===cfg.anchorHoliday.date && slotIdx===cfg.anchorHoliday.slotIdx) holidayPtr = cfg.anchorHoliday.unitIndex;
        else if(holidayPtr!==null) holidayPtr = (holidayPtr+1) % cfg.holidayUnits.length;
        if(d>=fromDate && holidayPtr!==null){
          if(!result[d]) result[d]={};
          result[d][slotIdx] = cfg.holidayUnits[holidayPtr];
        }
      } else {
        if(d===cfg.anchorWeekday.date && slotIdx===cfg.anchorWeekday.slotIdx) weekdayPtr = cfg.anchorWeekday.unitIndex;
        else if(weekdayPtr!==null) weekdayPtr = (weekdayPtr+1) % cfg.weekdayUnits.length;
        if(d>=fromDate && weekdayPtr!==null){
          if(!result[d]) result[d]={};

function patrolRankTarget(rank){

/* 查哨2人一組的配對演算法。硬規則（不滿足就不算候選配對）：同性別、至少1位
   士官。軟性優先順序（硬規則都滿足後，依序比較，前面的分不出高下才看下一
   條）：①階級平均公平（用 monthCounts 算出「這個月已經排的次數 - 這個階級
   的平均目標」，兩人相加，數字越小＝越該排他們）②不同排組優先③盡量湊成
   一士一兵（不是兩個都士官）④12-14時段的兵優先有駕照。
   candidates 已經是排除掉不可用的人之後的池子；monthCounts 是
   {personId: 這個月已排次數} 的累計表，由呼叫端在整月自動排的過程中逐格
   更新，讓排班越排越往「還沒排到的人」傾斜。 */
function selectPatrolPair(candidates, monthCounts, slotIdx){
  const isNCO = p=>rankCategory(p.rank)==='士官'||rankCategory(p.rank)==='軍官';
  const pairs=[];
  for(let i=0;i<candidates.length;i++){
    for(let j=i+1;j<candidates.length;j++){
      const a=candidates[i], b=candidates[j];
      if(a.gender && b.gender && a.gender!==b.gender) continue; // 硬規則：同性別(沒填性別的人不擋,視為兩邊都可配)
      if(!isNCO(a) && !isNCO(b)) continue; // 硬規則：至少1位士官
      const fairnessSum = (monthCounts[a.id]||0)-patrolRankTarget(a.rank) + (monthCounts[b.id]||0)-patrolRankTarget(b.rank);
      const differentGroup = (a.group||'')!==(b.group||'') ? 1 : 0;
      const oneEachRank = (isNCO(a)!==isNCO(b)) ? 1 : 0; // 一士一兵=1，兩個都士官=0（兩個都兵已經被硬規則擋掉）
      const licenseBonus = slotIdx===0 ? [a,b].filter(p=>!isNCO(p) && p.license).length : 0; // 12-14時段,兵有駕照加分
      pairs.push({a, b, fairnessSum, differentGroup, oneEachRank, licenseBonus});

  if(!pairs.length) return candidates.slice(0,1); // 湊不出合法配對,至少排一個人好過完全空著
  pairs.sort((x,y)=>

    y.differentGroup - x.differentGroup ||

/* 幫整個月的查哨，依序列排出的單位，逐格配對人員——只有輪到本部連的時段

   讓月曆看得到但不硬塞人。逐格更新 monthCounts，讓排到後面的格子會傾向
   排還沒排過班的人。每個時段的補休時間讀 state.patrolRestDefaults（可在
   「查哨排班設定」畫面調整，不用改程式碼），跟現有的補休擋班機制直接
   串接，查完哨這段時間不會再被排其他班。
   allowedIds：選填，限制候選人範圍（例如只想從某幾個排/組挑人時）；不傳

function autoFillPatrolMonth(ym, allowedIds){

  const seq=computePatrolSequence(fromDate, toDate);
  if(!state.preplan.patrol) state.preplan.patrol={};
  const pool = (allowedIds && allowedIds.size)? state.personnel.filter(p=>allowedIds.has(p.id)) : state.personnel;
  const monthCounts={};
  // 這個月已經排定的既有次數也算進去,讓新排的部分接續現有的公平性,不是每次重算都從0開始
  Object.entries(state.preplan.patrol).forEach(([d,plan])=>{
    if(!d.startsWith(ym) || !plan.slots) return;
    Object.values(plan.slots).forEach(cfg=>{ (cfg.personIds||[]).forEach(pid=>{ if(pid) monthCounts[pid]=(monthCounts[pid]||0)+1; }); });
  });
  let filled=0, skippedOtherUnit=0;
  for(let d=1; d<=total; d++){
    const ds=`${ym}-${String(d).padStart(2,'0')}`;
    const daySlots=seq[ds];
    if(!daySlots) continue;
    if(!state.preplan.patrol[ds]) state.preplan.patrol[ds]={slots:{}};
    PATROL_CHRONO_ORDER.forEach(slotIdx=>{
      const unit=daySlots[slotIdx];
      if(!unit) return;
      const restUntil = state.patrolRestDefaults[slotIdx] || '';
      if(unit!=='本部連'){

      const candidates = pool.filter(p=>!already.has(p.id) && !isPersonUnavailable(p.id, ds, sMin, eMin));
      const picked = selectPatrolPair(candidates, monthCounts, slotIdx);
      state.preplan.patrol[ds].slots[slotIdx] = {personIds:picked.map(p=>p.id), restUntil};
      picked.forEach(p=>{ monthCounts[p.id]=(monthCounts[p.id]||0)+1; });

function outingBlackoutForDate(date){

  if(isHolidayDate(nextDateStr(date))) return true;

function isEligibleForOuting(personId, date){
  if(outingBlackoutForDate(date)) return false;
  const person = state.personnel.find(p=>p.id===personId);
  if(person && person.outingRestriction==='none') return false;
  const curfewIsShort = (state.outingCurfewDates||[]).includes(date) || !!(person && person.outingRestriction==='dayOnly');
  if(curfewIsShort){
    // shortened outing (18:00-24:00, must be back in camp by 24:00): only
    // a sentry duty actually falling inside that window (prep time
    // included) is a real conflict — an early-morning shift the next
    // segment over is unaffected since the person's already back by then
    const dayAssign = state.assign[date]||{};
    for(const cat of state.categories){
      if(!cat.isSentry) continue;
      const catAssign = dayAssign[cat.id]||{};
      for(const sft of effectiveShifts(cat, date)){
        if(!(catAssign[sft.id]||[]).includes(personId)) continue;
        if(windowsOverlapOnce(18*60, 24*60, shiftBusyStartMin(cat,sft), toMin(sft.end))) return false;
      }
    }
  } else if(state.outingExcludeOvernightSentry){
    const dayAssign = state.assign[date]||{};
    for(const cat of state.categories){
      if(!cat.isSentry) continue;
      const catAssign = dayAssign[cat.id]||{};
      for(const sft of effectiveShifts(cat, date)){
        if(!(catAssign[sft.id]||[]).includes(personId)) continue;
        const sMin=toMin(sft.start);
        if(sMin>=22*60 || sMin<6*60) return false;
      }
    }
  }
  const excluded = state.outingExcludedMiscRoles||[];
  for(const m of (state.misc[date]||[])){
    if(!(m.personIds||[]).includes(personId)) continue;
    if(excluded.includes(m.role)) return false;
    const preset = presetForEntry(m);
    if(preset && preset.isSentry && m.start && m.end){
      if(curfewIsShort){
        if(windowsOverlapOnce(18*60,24*60,toMin(m.start),toMin(m.end))) return false;
      } else if(state.outingExcludeOvernightSentry){
        const sMin=toMin(m.start);
        if(sMin>=22*60 || sMin<6*60) return false;
      }
    }
  }
  return true;
}

  if(!list.length) return `<div class="empty">找不到符合的人員</div>`;
  const byGroup={};
  list.forEach(p=>{ const g=p.group||'未分組'; if(!byGroup[g]) byGroup[g]=[]; byGroup[g].push(p); });
  return Object.entries(byGroup).sort((a,b)=>groupIndex(a[0])-groupIndex(b[0])).map(([g,members])=>{
    const bd=rankGenderBreakdown(members);
    const sorted = members.slice().sort((a,b)=>rankIndex(a.rank)-rankIndex(b.rank));
    const rows = sorted.map(p=>{
      const duties = personDutySummary(p.id, date);
      return `<div class="row" style="margin-bottom:4px;align-items:flex-start">
        <span class="muted grow">・${esc(p.name)}（${p.rank}）：${duties.length? duties.map(esc).join('、') : '無排班'}</span>
        <button class="ghost small" data-quick-incident="${p.id}">登記事故</button>
      </div>`;
    }).join('');
    return collapsibleCardHTML('onDutyGroup-'+g, `${esc(g)}（${members.length}人・${fmtRankBreakdown(bd)}）`, rows);
  }).join('');
}

/* On mobile, tapping a checkbox in a filtered list blurs the search box and
   the keyboard slides away — so picking several people while filtering means
   re-tapping the search field every time. Suppressing the default mousedown
   on the list keeps focus (and the keyboard) on the search input; the click
   still reaches the label and toggles the checkbox as usual. */
/* On mobile, tapping a checkbox in a filtered list blurs the search box and
   the keyboard slides away — so picking several people while filtering means
   re-tapping the search field every time. Earlier this suppressed touchstart
   outright, which also killed scrolling; instead let every gesture through
   untouched and simply restore focus to the search box after a pick, which
   keeps the keyboard up without interfering with scrolling or tapping. */
function keepSearchFocusOnPick(listEl, searchEl){
  if(!listEl) return;
  const findSearch=()=>searchEl || (listEl.closest('div,form')||document).querySelector('input[type="text"]');
  listEl.addEventListener('mousedown', e=>{
    // desktop: preventing the default here stops focus leaving the input,
    // and the click still reaches the label so the checkbox toggles
    if(e.target.closest('label')) e.preventDefault();
  });
  listEl.addEventListener('change', e=>{
    if(!e.target.matches('input[type="checkbox"],input[type="radio"]')) return;
    const se=findSearch();
    if(se && document.activeElement!==se && se.value!==undefined && se.dataset.keepFocus!=='off'){
      // only refocus if the user was actually filtering — otherwise popping
      // the keyboard open unprompted is worse than losing it
      if(se.value.trim()) se.focus({preventScroll:true});
    }
  });
}

function wireDragReorder(containerId, arr, onReorder){
  const container = document.getElementById(containerId);
  if(!container) return;
  const rows = [...container.querySelectorAll('[data-drag-idx]')];
  if(!rows.length) return;
  const rects = rows.map(r=>r.getBoundingClientRect());
  const heights = rects.map(r=>r.height);
  const tops = rects.map(r=>r.top);
  rows.forEach((row, originalIdx)=>{
    const handle = row.querySelector('[data-drag-handle]');
    if(!handle) return;
    handle.style.touchAction='none';
    let startY=0, dragging=false, currentSlot=originalIdx;
    handle.addEventListener('touchstart', (e)=>{
      dragging=true;
      startY = e.touches[0].clientY;
      currentSlot = originalIdx;
      row.style.transition='none';
      row.style.zIndex='5';
      row.style.position='relative';
      row.style.boxShadow='0 4px 10px rgba(0,0,0,.5)';
      rows.forEach(r=>{ if(r!==row) r.style.transition='transform .15s ease'; });
      e.preventDefault();
    }, {passive:false});
    handle.addEventListener('touchmove', (e)=>{
      if(!dragging) return;
      e.preventDefault();
      const deltaY = e.touches[0].clientY - startY;
      row.style.transform = `translateY(${deltaY}px)`;
      const draggedCenter = tops[originalIdx] + heights[originalIdx]/2 + deltaY;
      let target = 0;
      for(let i=0;i<rows.length;i++){
        if(draggedCenter > tops[i] + heights[i]/2) target = i;
      }
      if(target !== currentSlot){
        rows.forEach((r,i)=>{
          if(r===row) return;
          if(target > currentSlot){
            r.style.transform = (i > currentSlot && i <= target) ? `translateY(${-heights[originalIdx]}px)` : '';
          } else {
            r.style.transform = (i >= target && i < currentSlot) ? `translateY(${heights[originalIdx]}px)` : '';
          }
        });
        currentSlot = target;
      }
    }, {passive:false});
    const finish = ()=>{
      if(!dragging) return;
      dragging=false;
      const [item] = arr.splice(originalIdx, 1);
      arr.splice(currentSlot, 0, item);
      row.style.transform=''; row.style.zIndex=''; row.style.position=''; row.style.boxShadow='';
      rows.forEach(r=>{ r.style.transform=''; r.style.transition=''; });
      onReorder();
    };
    handle.addEventListener('touchend', finish);
    handle.addEventListener('touchcancel', finish);
  });
}

/* generic drag-to-reorder card list, shared by any tab whose cards the user
   should be able to rearrange (休假/事故, 統計) — each tab keeps its own
   persisted order of card keys in state.cardOrder[tab]; a card not yet in
   the stored order (new feature, or the first time this ever runs) sorts
   after everything else, in its original definition order */
function sortedCardDefs(tab, defs){
  const order = (state.cardOrder && state.cardOrder[tab]) || [];
  return [...defs].sort((a,b)=>{
    const ai=order.indexOf(a.key), bi=order.indexOf(b.key);
    const ra = ai<0? 1000+defs.indexOf(a) : ai;
    const rb = bi<0? 1000+defs.indexOf(b) : bi;
    return ra-rb;
  });
}
function draggableCardWrap(html){
  // cards are built via collapsibleCardHTML, whose template always starts
  // with this exact section-title+h2 opening — inject the grab handle
  // right before the title text so it visually sits in the header
  return html.replace('<h2 style="margin:0">', '<h2 style="margin:0"><span data-drag-handle style="cursor:grab;padding-right:6px;color:var(--dim)">⠿</span>');
}
function renderCardList(containerId, tab, defs){
  const sorted = sortedCardDefs(tab, defs);
  return `<div id="${containerId}">${sorted.map((d,i)=>`<div data-card-key="${esc(d.key)}" data-drag-idx="${i}">${draggableCardWrap(d.html)}</div>`).join('')}</div>`;
}
function wireCardListDrag(containerId, tab, defs){
  const sorted = sortedCardDefs(tab, defs);
  const keys = sorted.map(d=>d.key);
  wireDragReorder(containerId, keys, ()=>{
    if(!state.cardOrder) state.cardOrder={};
    state.cardOrder[tab] = keys;
    saveState();
    render();
  });
}

/* ---------------- 臨時異動 (duty changes) ---------------- */
function reconcileDutyChanges(date){
  const changes = state.dutyChanges[date];
  if(!changes || !changes.length) return;
  let changed=false;
  changes.forEach(ch=>{
    if(ch.status==='filled') return;
    let currentPid = null;
    if(ch.source.kind==='cat'){
      currentPid = (((state.assign[date]||{})[ch.source.catId]||{})[ch.source.shiftId]||[])[ch.source.slotIdx] || null;
    } else if(ch.source.kind==='misc'){
      const entry = (state.misc[date]||[]).find(m=>m.id===ch.source.miscId);
      currentPid = entry? (entry.personIds||[])[ch.source.slotIdx] || null : null;
    }
    if(currentPid && currentPid!==ch.personId){
      ch.status='filled';
      ch.filledPersonId=currentPid;
      changed=true;
    }
  });
  if(changed) saveState();
}
/* every (category-shift-slot / misc-entry-slot) a person currently occupies
   today — used to populate the ⚡臨時異動 modal's checklist */
function personTodaySlots(personId, date){
  const out=[];
  const dayAssign = state.assign[date]||{};
  orderedCategories().forEach(cat=>{
    const catAssign = dayAssign[cat.id]||{};
    effectiveShifts(cat, date).forEach(sft=>{
      const arr = catAssign[sft.id]||[];
      const idx = arr.indexOf(personId);
      if(idx>-1){
        out.push({
          label: `${cat.name} ${sft.label||sft.start+'-'+sft.end}`,
          source: {kind:'cat', catId:cat.id, shiftId:sft.id, slotIdx:idx}
        });
      }
    });
  });
  (state.misc[date]||[]).forEach(m=>{
    (m.personIds||[]).forEach((pid,idx)=>{
      if(pid===personId){
        const roleLabel = m.roles? m.roles[idx] : null;
        out.push({
          label: `${m.role}${roleLabel? '・'+roleLabel:''}${m.start&&m.end?` (${m.start}-${m.end})`:''}`,
          source: {kind:'misc', miscId:m.id, slotIdx:idx}
        });
      }
    });
  });
  return out;
}
function clearDutySlot(date, source){
  if(source.kind==='cat'){
    const arr = (((state.assign[date]||{})[source.catId]||{})[source.shiftId]||[]);
    if(arr) arr[source.slotIdx]=undefined;
  } else if(source.kind==='misc'){
    const entry = (state.misc[date]||[]).find(m=>m.id===source.miscId);
    if(entry && entry.personIds) entry.personIds[source.slotIdx]=undefined;
  }
}

/* ---------------- 當日進度摘要 ---------------- */
/* one-glance counts for the whole day, so opening 排班 immediately shows
   what still needs work instead of requiring each card to be expanded */
function dayProgressSummary(date){
  /* 衛哨 and non-sentry categories (打飯班 etc.) are counted separately —
     lumping them together made "0/29" ambiguous about what was actually
     short-staffed */
  let catFilled=0, catTotal=0, otherCatFilled=0, otherCatTotal=0;
  orderedCategories().forEach(cat=>{
    const dayAssign=(state.assign[date]||{})[cat.id]||{};
    effectiveShifts(cat, date).forEach(s=>{
      const filled=(dayAssign[s.id]||[]).filter(Boolean).length;
      if(cat.isSentry){ catTotal += s.count; catFilled += filled; }
      else { otherCatTotal += s.count; otherCatFilled += filled; }
    });
  });
  let miscFilled=0, miscTotal=0;
  (state.misc[date]||[]).forEach(m=>{
    if(m.roles){
      miscTotal += m.roles.length;
      miscFilled += m.personIds.filter((pid,i)=>pid || (m.lockedSlots&&m.lockedSlots[i])).length;
    } else {
      const n=(m.personIds||[]).filter(Boolean).length;
      const preset=presetForEntry(m);
      miscTotal += Math.max((preset&&preset.requiredCount)||1, n);
      miscFilled += n;
    }
  });
  const pendingChanges = (state.dutyChanges[date]||[]).filter(ch=>ch.status!=='filled').length;
  return {catFilled, catTotal, otherCatFilled, otherCatTotal, miscFilled, miscTotal, pendingChanges};
}
function dayProgressBarHTML(){
  const s = dayProgressSummary(currentDate);
  const catShort = s.catFilled<s.catTotal;
  const otherShort = s.otherCatFilled<s.otherCatTotal;
  const miscShort = s.miscFilled<s.miscTotal;
  const allDone = !catShort && !otherShort && !miscShort && !s.pendingChanges;
  return `<div class="card" style="padding:8px 12px">
    <div class="row wrap" style="gap:10px;align-items:center">
      <span style="font-size:13px;font-weight:600">${allDone? '✅ 今日排班已完成' : '📋 今日進度'}</span>
      ${s.catTotal? `<span class="${catShort?'warn':'muted'}" style="font-size:12px">衛哨 ${s.catFilled}/${s.catTotal}${catShort?' ⚠️':''}</span>`:''}
      ${s.otherCatTotal? `<span class="${otherShort?'warn':'muted'}" style="font-size:12px">打飯班等 ${s.otherCatFilled}/${s.otherCatTotal}${otherShort?' ⚠️':''}</span>`:''}
      ${s.miscTotal? `<span class="${miscShort?'warn':'muted'}" style="font-size:12px">其他勤務 ${s.miscFilled}/${s.miscTotal}${miscShort?' ⚠️':''}</span>`:''}

    </div>

/* ---------------- 找補位 ---------------- */
/* Ranks candidates for a specific empty (or to-be-vacated) slot by how
   disruptive picking them would be, so the common case — "someone dropped
   out mid-day, find cover without unravelling everyone else's schedule" —
   surfaces the people who cost nothing to move first.
   tier 0: free at that time AND has nothing else all day
   tier 1: free at that time but already has other duties today
   tier 2: busy at that time — taking them means dropping that other duty */
/* the non-negotiable part of unavailability: leave, incidents, long-term
   settings and comp-rest — i.e. everything EXCEPT being assigned to another
   duty, which is the movable part the substitute finder is willing to
   trade away. Returns [] when the person is genuinely free. */
function hardUnavailabilityReasons(personId, date, s, e){
  const out=[];
  const person = state.personnel.find(p=>p.id===personId);
  if(person){
    if(person.departureDate && date>=person.departureDate) out.push(`已離退（${minguoLabel(person.departureDate)}起）`);
    const lt = effectiveLongTerm(person, date);
    if(lt.mode==='allday') out.push('長期事故：全天不可排');
    else if(lt.mode==='range' && lt.start && lt.end && windowsOverlapRecurring(s,e,toMin(lt.start),toMin(lt.end))) out.push(`長期事故：每天 ${lt.start}-${lt.end} 不可排`);
  }
  (state.unavail[date]||[]).filter(u=>u.personId===personId).forEach(u=>{
    const hit = u.allDay || incidentBlocksWindow(u, s, e, false);
    if(hit) out.push(`${u.allDay? '全天':`${u.start}-${u.end}`}${u.reason? '（'+u.reason+'）':'（未註記原因）'}`);
  });
  for(const w of personCompRestWindows(personId, date)){
    if(windowsOverlapRecurring(s,e,toMin(w.start),toMin(w.end))) out.push(`補休中（${w.catName} ${w.label} 後，至 ${w.end}）`);
  }
  return [...new Set(out)];
}
function findSubstitutes(date, opts){
  const {sMin, eMin, excludeIds=[], eligibleFn, catId, shiftId, cat, shift} = opts;
  const out=[];
  state.personnel.forEach(p=>{
    if(excludeIds.includes(p.id)) return;
    if(eligibleFn && !eligibleFn(p)){
      out.push({person:p, tier:3, note:'不符合這個位置的資格要求', blockers:[]});
      return;
    }
    if(isPersonOnExclusiveStandby(p.id, date)){
      out.push({person:p, tier:3, note:'只能待命，不接其他任務', blockers:[]});
      return;
    }
    if(isDutyOfficer(p.id, date)){
      out.push({person:p, tier:3, note:'今日值星，負責安排勤務不自行出勤', blockers:[]});
      return;
    }
    const hardReasons = hardUnavailabilityReasons(p.id, date, sMin, eMin);
    if(hardReasons.length){
      out.push({person:p, tier:3, note:hardReasons.join('・'), blockers:[]});
      return;
    }
    // what they're actually doing right now (the movable part)
    const blockers = personDutiesInWindow(p.id, date, sMin, eMin, {catId, shiftId});
    const dutiesToday = personDutySummary(p.id, date);
    if(blockers.length){
      out.push({person:p, tier:2, note:'目前在：'+blockers.map(b=>b.label).join('、'), blockers});
    } else if(dutiesToday.length){
      out.push({person:p, tier:1, note:'今日已有：'+dutiesToday.join('、'), blockers:[]});
    } else {
      out.push({person:p, tier:0, note:'今日完全沒有任務', blockers:[]});
    }
  });
  // within a tier prefer whoever is carrying the lightest load today, then
  // the category's own rank preference — spreads duty instead of always
  // landing on the same person
  out.sort((a,b)=>{
    if(a.tier!==b.tier) return a.tier-b.tier;
    const la=personDutySummary(a.person.id,date).length, lb=personDutySummary(b.person.id,date).length;
    if(la!==lb) return la-lb;
    if(cat && shift) return dutySortIndex(a.person.rank,cat,0,shift)-dutySortIndex(b.person.rank,cat,0,shift);
    return rankIndex(a.person.rank)-rankIndex(b.person.rank);
  });
  return out;
}
/* every duty (category shift or misc entry) the person occupies that
   overlaps the given window — the things that would have to be dropped
   for them to cover this slot instead */
function personDutiesInWindow(personId, date, sMin, eMin, exclude){
  const out=[];
  const dayAssign = state.assign[date]||{};
  orderedCategories().forEach(cat=>{
    const catAssign = dayAssign[cat.id]||{};
    effectiveShifts(cat, date).forEach(sft=>{
      if(exclude && exclude.catId===cat.id && exclude.shiftId===sft.id) return;
      const arr = catAssign[sft.id]||[];
      const idx = arr.indexOf(personId);
      if(idx>-1 && windowsOverlapOnce(sMin,eMin,shiftBusyStartMin(cat,sft),wrapEndMin(toMin(sft.start),toMin(sft.end)))){
        out.push({kind:'cat', catId:cat.id, shiftId:sft.id, slotIdx:idx, label:`${cat.name} ${sft.label||sft.start+'-'+sft.end}`});
      }
    });
  });
  (state.misc[date]||[]).forEach(m=>{
    if(!m.start || !m.end) return;
    (m.personIds||[]).forEach((pid,idx)=>{
      if(pid!==personId) return;
      if((m.nominalIds||[]).includes(pid)) return; // 掛名：not actually occupying this slot
      if(windowsOverlapOnce(sMin,eMin,toMin(m.start),wrapEndMin(toMin(m.start),toMin(m.end)))){
        out.push({kind:'misc', miscId:m.id, slotIdx:idx, label:`${m.role}${m.start&&m.end?` (${m.start}-${m.end})`:''}`});
      }
    });
  });
  return out;
}
function openSubstituteModal(source){
  const date = currentDate;
  let sMin, eMin, label, eligibleFn, cat=null, shift=null, currentPersonId=null, excludeIds=[];
  if(source.kind==='cat'){
    cat = state.categories.find(c=>c.id===source.catId);
    shift = effectiveShifts(cat, date).find(s=>s.id===source.shiftId);
    if(!cat || !shift) return;
    sMin = toMin(shift.start); eMin = wrapEndMin(sMin, toMin(shift.end));
    label = `${cat.name} ${shift.label||shift.start+'-'+shift.end}`;
    const arr = ((state.assign[date]||{})[cat.id]||{})[shift.id]||[];
    currentPersonId = arr[source.slotIdx]||null;
    excludeIds = arr.filter((id,i)=>id && i!==source.slotIdx);
    eligibleFn = p=>!rankExcludedFromCategory(p.rank, cat);
  } else {
    const entry = (state.misc[date]||[]).find(m=>m.id===source.miscId);
    if(!entry) return;
    const preset = presetForEntry(entry);
    if(!entry.start || !entry.end){ showAlert('這個項目沒有設定時間，無法判斷誰有空，請先設定時段。'); return; }
    sMin = toMin(entry.start); eMin = wrapEndMin(sMin, toMin(entry.end));
    const roleName = entry.roles? entry.roles[source.slotIdx] : null;
    label = `${entry.role}${roleName? '・'+roleName:''} (${entry.start}-${entry.end})`;
    currentPersonId = (entry.personIds||[])[source.slotIdx]||null;
    excludeIds = (entry.personIds||[]).filter((id,i)=>id && i!==source.slotIdx);
    if(roleName==='駕駛') eligibleFn = p=>driverQualificationIssues(p, preset).length===0;
    else if(roleName==='車長'){
      const dIdx = entry.roles.indexOf('駕駛');
      const driver = dIdx>-1? state.personnel.find(p=>p.id===entry.personIds[dIdx]) : null;
      eligibleFn = p=>chiefEligible(p, preset, driver);
    }
    else if(roleName && roleName.startsWith('話務')) eligibleFn = p=>!!p.license;
    else eligibleFn = p=>!preset || driverQualificationIssues(p, preset).length===0;
  }
  if(currentPersonId) excludeIds = excludeIds.concat([currentPersonId]);
  const results = findSubstitutes(date, {sMin, eMin, excludeIds, eligibleFn, catId:source.catId, shiftId:source.shiftId, cat, shift});
  const tierMeta = {
    0:{icon:'🟢', title:'完全有空（補進來不影響任何人）'},
    1:{icon:'🟡', title:'有空，但今天已有其他勤務'},
    2:{icon:'🔄', title:'同時段在別的位置（會互換，不會多補人力）'},
    3:{icon:'⛔', title:'不可排'},
  };
  const grouped = {0:[],1:[],2:[],3:[]};
  results.forEach(r=>grouped[r.tier].push(r));
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:flex;align-items:flex-end;';
  modal.innerHTML=`
    <div class="sheet-inner">
      <div class="section-title"><h2 style="margin:0">找補位：${esc(label)}</h2><button class="ghost small" id="closeModal">關閉</button></div>
      <div class="hint" style="margin-bottom:8px">${currentPersonId? `目前是 <b>${esc(personName(currentPersonId))}</b>，選一位補上會把他換掉並留下異動紀錄。`:'這一格目前是空的，選一位補上。'}依「補進來要付出多少代價」由低到高排序，同一層裡今天班較少的人排前面。</div>
      <div class="row wrap" style="margin-bottom:8px">
        <div class="grow"><label>搜尋姓名</label><input type="text" id="subSearch" placeholder="輸入姓名關鍵字"></div>
      </div>
      <div id="subList">
      ${[0,1,2,3].map(t=>{
        if(!grouped[t].length) return '';
        return `<div style="margin-bottom:10px">
          <div class="hint" style="margin-bottom:4px"><b>${tierMeta[t].icon} ${tierMeta[t].title}（${grouped[t].length}）</b></div>
          ${grouped[t].map(r=>`
            <div class="row sub-row" data-sub-name="${esc(r.person.name)}" style="align-items:flex-start;margin-bottom:4px">
              <span class="muted grow">・${esc(r.person.name)}（${r.person.group||'未分組'}·${r.person.rank}${personBadges(r.person)}）<br><span style="font-size:11px;color:var(--dim)">${esc(r.note)}</span></span>
              ${t===3
                ? `<button class="ghost small danger" data-sub-pick="${r.person.id}" data-sub-tier="${t}" data-sub-note="${esc(r.note)}">仍要排</button>`
                : t===2
                  ? `<button class="ghost small" data-sub-pick="${r.person.id}" data-sub-tier="${t}">互換</button>`
                  : `<button class="ghost small" data-sub-pick="${r.person.id}" data-sub-tier="${t}">補上</button>`}
            </div>`).join('')}
        </div>`;
      }).join('') || `<div class="empty">找不到可以補位的人</div>`}
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('closeModal').onclick=()=>modal.remove();
  document.getElementById('subSearch').oninput=(e)=>{
    const term=e.target.value.trim();
    modal.querySelectorAll('.sub-row').forEach(row=>{
      row.style.display = (!term || row.dataset.subName.includes(term))? 'flex':'none';
    });
  };
  modal.querySelectorAll('[data-sub-pick]').forEach(btn=>{
    btn.onclick=()=>{
      const pid = btn.dataset.subPick;
      const tier = Number(btn.dataset.subTier);
      const r = results.find(x=>x.person.id===pid);
      const writeSlot = (src, personId)=>{
        if(src.kind==='cat'){
          if(!state.assign[date]) state.assign[date]={};
          if(!state.assign[date][src.catId]) state.assign[date][src.catId]={};
          if(!state.assign[date][src.catId][src.shiftId]) state.assign[date][src.catId][src.shiftId]=[];
          state.assign[date][src.catId][src.shiftId][src.slotIdx]=personId;
        } else {
          const entry=(state.misc[date]||[]).find(m=>m.id===src.miscId);
          if(entry){ if(!entry.personIds) entry.personIds=[]; entry.personIds[src.slotIdx]=personId; }
        }
      };
      const doIt = ()=>{
        const replaced = currentPersonId;
        /* tier 2 = the candidate is busy at this very time on another
           position. Pulling them one-way just moves the hole, so instead
           SWAP: they come here, whoever was here goes to their old slot.
           When this slot was empty there's nobody to send back, so it
           degrades to a plain move and we offer to refill the vacated
           slot afterwards. */
        const swapTarget = (tier===2 && r.blockers.length)? r.blockers[0] : null;
        if(swapTarget){
          clearDutySlot(date, swapTarget);
          writeSlot(source, pid);
          if(replaced) writeSlot(swapTarget, replaced);
          if(!state.dutyChanges[date]) state.dutyChanges[date]=[];
          state.dutyChanges[date].push({
            id:uid(), personId:replaced||pid, personName:personName(replaced||pid), label,
            source, reason: replaced? `與 ${personName(pid)} 互換位置（原${swapTarget.label}）` : `由 ${swapTarget.label} 調來`,
            status:'filled', filledPersonId:pid
          });
          saveState(); modal.remove(); render();
          if(!replaced){
            showConfirm(`已把 ${r.person.name} 調到「${label}」，但他原本的「${swapTarget.label}」現在空出來了。要現在接著找人補那一格嗎？`, ()=>{
              openSubstituteModal(swapTarget.kind==='cat'
                ? {kind:'cat', catId:swapTarget.catId, shiftId:swapTarget.shiftId, slotIdx:swapTarget.slotIdx}
                : {kind:'misc', miscId:swapTarget.miscId, slotIdx:swapTarget.slotIdx});
            });
          }
          return;
        }
        writeSlot(source, pid);
        if(!state.dutyChanges[date]) state.dutyChanges[date]=[];
        if(replaced){
          state.dutyChanges[date].push({
            id:uid(), personId:replaced, personName:personName(replaced), label,
            source, reason:'臨時換手', status:'filled', filledPersonId:pid,
            override: tier===3? (btn.dataset.subNote||'') : undefined
          });
        } else if(tier===3){
          // no one was replaced, but this pick broke a rule — still record it
          // so the exception is visible afterwards rather than silently applied
          state.dutyChanges[date].push({
            id:uid(), personId:pid, personName:personName(pid), label,
            source, reason:'例外指派', status:'filled', filledPersonId:pid,
            override: btn.dataset.subNote||''
          });
        }
        saveState(); modal.remove(); render();
      };
      if(tier===3){
        showConfirm(`⚠️ ${r.person.name} 目前的狀態是「${btn.dataset.subNote||'不可排'}」，正常情況下不該排這一格。仍要指派嗎？（會在「今日異動紀錄」標註為例外指派）`, doIt);
      } else if(tier===2 && r.blockers.length){
        const swapMsg = currentPersonId
          ? `${r.person.name} 目前在「${r.blockers[0].label}」，同一個時段。確定要讓他跟 ${personName(currentPersonId)} 互換位置嗎？（兩邊都有人，總人力不變）`
          : `${r.person.name} 目前在「${r.blockers[0].label}」，同一個時段。把他調來這裡的話，那個位置會空出來需要再找人（總人力不會增加）。確定嗎？`;
        showConfirm(swapMsg, doIt);
      } else doIt();
    };
  });
}
/* if this exact slot currently holds someone who was placed there as a

function overrideBadgeHTML(date, pid, source){

function generateScheduleText(date){
  const lines=[];
  lines.push('🌟衛哨勤務🌟');
  lines.push(dutyDateRangeLabel(date));
  orderedCategories().filter(c=>c.enforceRest && !c.excludeFromExport).forEach(cat=>{
    lines.push('🔶'+cat.name);
    const dayAssign=(state.assign[date]||{})[cat.id]||{};
    effectiveShifts(cat, date).forEach(s=>{
      const assigned=dayAssign[s.id]||[];
      const names=Array.from({length:s.count}).map((_,i)=>assigned[i]?personName(assigned[i]):'');
      const timeLabel = s.label? s.label : (s.start+'-'+s.end);
      lines.push(`${timeLabel} ${names.filter(Boolean).join('、')||'（未排）'}`);
    });
  });
  lines.push('———勤務———');
  // 預排匯入的項目集中放在最前面（緊接在排班之後），其餘的（手動新增/
  // 自動排班補的）維持原本依各自sortOrder排列
  const preplanExportEntries = (state.misc[date]||[]).filter(m=>{
    if(!m.fromPreplan) return false;
    const preset = state.miscPresets.find(p=>p.role===m.role);
    return !preset || !preset.excludeFromExport;
  });
  if(preplanExportEntries.length){
    lines.push('📥預排項目：');
    preplanExportEntries.forEach(m=>{
      const people=m.personIds.map(pid=>personName(pid)).join('、');
      const timePart = m.start&&m.end? `（${m.start}-${m.end}）`:'';
      lines.push(`♦️${m.role}${timePart}：${people}`);
    });
  }
  const nonRestCats = orderedCategories().filter(c=>!c.enforceRest && !c.excludeFromExport)
    .map(c=>({kind:'cat', ref:c, sortOrder:c.sortOrder??999}));
  const miscEntries = (state.misc[date]||[]).filter(m=>{
    if(m.fromPreplan) return false; // 已經在上面的「預排項目」區塊輸出過了
    const preset = state.miscPresets.find(p=>p.role===m.role);
    return !preset || !preset.excludeFromExport;
  }).map(m=>{
    const preset = state.miscPresets.find(p=>p.role===m.role);
    return {kind:'misc', ref:m, sortOrder: preset? (preset.sortOrder??999) : 999};
  });
  [...nonRestCats, ...miscEntries].sort((a,b)=>a.sortOrder-b.sortOrder).forEach(item=>{
    if(item.kind==='cat'){
      const cat=item.ref;
      lines.push('♦️'+cat.name+'：');
      const dayAssign=(state.assign[date]||{})[cat.id]||{};
      effectiveShifts(cat, date).forEach(s=>{
        const assigned=dayAssign[s.id]||[];
        const names=Array.from({length:s.count}).map((_,i)=>assigned[i]?personName(assigned[i]):'').filter(Boolean);
        const label=s.label||(s.start+'-'+s.end);
        lines.push(`${label}：${names.join('、')}`);
      });
    } else {
      const m=item.ref;
      const people=m.personIds.map(pid=>personName(pid)).join('、');
      const timePart = m.start&&m.end? `（${m.start}-${m.end}）`:'';
      lines.push(`♦️${m.role}${timePart}：${people}`);
    }
  });
  return lines.join('\n');
}

/* splits one line of the exported schedule text into a stable "key" (the
   slot/role label) and its "value" (the names) so two versions can be
   compared line-by-line even though the whole file has no field markers —
   colon-terminated lines ("♦️採買：佩真") split on the last colon, space-
   separated ones ("22-24 億安") split on the first space; anything else
   (section headers) has no value and never gets flagged as changed unless
   the header text itself is genuinely different. */
function splitDiffLine(line){
  const colonIdx = Math.max(line.lastIndexOf('：'), line.lastIndexOf(':'));
  if(colonIdx>-1) return [line.slice(0,colonIdx+1), line.slice(colonIdx+1).trim()];
  const spaceIdx = line.indexOf(' ');
  if(spaceIdx>-1) return [line.slice(0,spaceIdx), line.slice(spaceIdx+1).trim()];
  return [line, ''];
}
/* compares the text you actually published last time against a freshly
   generated version, and appends ⚠️ to every line whose value changed or
   is brand new — this is a manual, per-export tool (you paste the old
   version each time) rather than something the app remembers on its own,
   since not every generated draft actually gets published.
   Time-slot labels like "22-24" repeat across every sentry category
   (安全士官/橋哨/安管中心 all have their own 22-24 line), so the label
   alone isn't a safe key — comparing by label only made entries from
   different categories collide and overwrite each other in the lookup,
   causing both false ⚠️s on unchanged lines and real changes going
   undetected. Every header-only line (a category name, a date banner)
   becomes the current "section", and section+label together form the
   actual key, so same-named slots in different sections never collide. */
function diffScheduleText(oldText, newText){
  const buildMap=(text)=>{
    const map=new Map();
    let section='';
    text.split(/\r?\n/).forEach(l=>{
      if(!l.trim()) return;
      const [k,v]=splitDiffLine(l.trim());
      if(!v){ section=l.trim(); return; }
      map.set(section+'\u0000'+k, v);
    });
    return map;
  };
  const oldMap=buildMap(oldText);
  const newKeys=new Set();
  let section='';
  const outLines=newText.split(/\r?\n/).map(l=>{
    if(!l.trim()) return l;
    const [k,v]=splitDiffLine(l.trim());
    if(!v){ section=l.trim(); return l; } // header-only line, nothing to compare, but updates section context
    const fullKey=section+'\u0000'+k;
    newKeys.add(fullKey);
    if(!oldMap.has(fullKey) || oldMap.get(fullKey)!==v) return `${l}⚠️`;
    return l;
  });
  const removed=[];
  oldMap.forEach((v,fullKey)=>{
    if(!v || newKeys.has(fullKey)) return;
    const k=fullKey.split('\u0000')[1];
    removed.push(`${k}${v}`);
  });
  return {text: outLines.join('\n'), removed};
}

function normalizePriorityArray(arr){
  const result = [...arr];
  RANK_DEFS.forEach(r=>{ if(!result.includes(r.rank)) result.push(r.rank); });
  return result;
}
function defaultPriorityArray(cat){
  if(cat.needsNCO) return normalizePriorityArray(NCO_LEAD_PRIORITY);
  if(cat.preferLowRank) return normalizePriorityArray(LOW_RANK_PRIORITY);
  return RANK_DEFS.map(r=>r.rank);
}
function defaultHelperPriorityArray(){
  return normalizePriorityArray(MEAL_HELPER_PRIORITY);
}
function categoryPriorityLabel(cat){
  if(cat.needsNCO){
    const lead = cat.customPriority || normalizePriorityArray(NCO_LEAD_PRIORITY);
    const helper = cat.customPriorityHelper || normalizePriorityArray(MEAL_HELPER_PRIORITY);
    return `帶隊(第1位)優先：${lead.join('→')}｜其餘成員優先：${helper.join('→')}｜整天班全部依：${helper.join('→')}`;
  }
  if(cat.preferLowRank){
    return `優先順序：${(cat.customPriority || normalizePriorityArray(LOW_RANK_PRIORITY)).join('→')}`;
  }
  return `優先順序：${(cat.customPriority || RANK_DEFS.map(r=>r.rank)).join('→')}`;
}
/* 排班分頁固定分成三個區塊，順序固定、不再互相穿插：
   1. 衛哨卡片（安全士官/橋哨/指管中心等勤務類別）——彼此之間還是可以拖曳排序
   2. 預排項目彙整卡（值星/查哨/督伙/救護車/中央監控值班/採買/驗菜等——凡
      是連結到預排類型的崗位，記錄一律集中在這裡，不管這筆記錄實際上是
      「按過匯入」寫入的、還是常用項目點一下/自動排班直接產生的）
   3. 其他勤務彙整卡（減法思維：勤務設定裡「沒有」連結預排類型的項目，按
      「匯入預設」一次帶進來，不需要的當天自己刪除，不會自己跑回來）
   分組準則是「角色名稱有沒有連結到預排類型」，不是看每筆記錄自己的
   fromPreplan 旗標——那個旗標只在真的執行過「匯入到當天」那個動作時才
   會被寫上，但值星/查哨/救護車這些角色的記錄常常是透過常用項目點一下
   或自動排班直接產生的，沒這個旗標，用旗標分組會讓它們錯誤跑進第三塊。
   跨區塊的相對順序固定，不需要 sortOrder；但區塊內部還是要能拖曳排序：
   區塊1的每張衛哨類別卡片、跟區塊3彙整卡裡的每個角色小節，各自維持獨
   立的拖曳容器（用不同的 containerId，這樣 wireDragReorder 各自抓自己
   範圍內的 [data-drag-idx]，兩邊的索引不會因為巢狀在同一個容器裡而互相
   誤抓、把彼此的拖曳搞亂）。 */
function buildScheduleCardItems(){
  const dayMisc = state.misc[currentDate]||[];
  const linkedRoleNames = new Set(state.dutyDefinitions.filter(d=>d.linkedPreplan).map(d=>d.name));
  const preplanEntries = dayMisc.filter(m=>linkedRoleNames.has(m.role));
  const manualEntries = dayMisc.filter(m=>!linkedRoleNames.has(m.role));
  const catItems = orderedCategories().map(cat=>({kind:'cat', cat, sortOrder:cat.sortOrder??999})).sort((a,b)=>a.sortOrder-b.sortOrder);
  const miscByRole = {};
  manualEntries.forEach(m=>{ if(!miscByRole[m.role]) miscByRole[m.role]=[]; miscByRole[m.role].push(m); });
  const miscRoleGroups = Object.keys(miscByRole).map(role=>{
    const preset = state.miscPresets.find(p=>p.role===role);
    return {role, entries:miscByRole[role], preset, sortOrder: preset?(preset.sortOrder??999):999};
  }).sort((a,b)=>a.sortOrder-b.sortOrder);
  return {catItems, preplanEntries, miscRoleGroups};
}
function renderScheduleCards(){
  const {catItems, preplanEntries, miscRoleGroups} = buildScheduleCardItems();
  // 排班頁三大區塊（衛哨/預排彙整卡/其他勤務卡）各自整塊可收合，各自獨立
  // 記在collapseState（schedblock-*鍵），互不影響彼此的展開/收合狀態，也
  // 不影響區塊1裡每個衛哨類別卡片自己原本就有的收合按鈕（cat-*鍵）。
  const catInner = `<div id="scheduleCardsContainer">${catItems.map((item,i)=>renderCategoryCard(item.cat, i)).join('')}</div>`;
  const catHTML = collapsibleCardHTML('schedblock-sentry', `🛡 衛哨（${catItems.length}）`, catInner);
  const preplanHTML = preplanEntries.length? renderPreplanBundleCard(preplanEntries) : '';
  const miscHTML = renderMiscBundleCard(miscRoleGroups);
  return catHTML + preplanHTML + miscHTML;
}
function wireScheduleCardsDrag(){
  const {catItems, miscRoleGroups} = buildScheduleCardItems();
  wireDragReorder('scheduleCardsContainer', catItems, ()=>{
    catItems.forEach((item,i)=>{ item.cat.sortOrder = i*10; });
    saveState();
    render();
  });
  // 第3區塊（其他勤務彙整卡）內部，各角色小節也能拖曳排序，改各自
  // preset 的 sortOrder——跟區塊1是各自獨立的拖曳容器，互不影響。同時也
  // 把新順序寫回對應的崗位定義(sortOrder)，這樣設定裡「崗位定義→其他勤
  // 務項目」看到的順序，才不會因為在排班頁這邊拖過而跟著過期。
  wireDragReorder('miscBundleContainer', miscRoleGroups, ()=>{
    miscRoleGroups.forEach((g,i)=>{
      if(!g.preset) return;
      g.preset.sortOrder = i*10;
      const def = state.dutyDefinitions.find(d=>d.presetRole===g.role);
      if(def) def.sortOrder = i*10;
    });
    saveState();
    render();
  });
  document.querySelectorAll('.card-exclude-cb').forEach(cb=>{
    cb.onchange=()=>{
      const kind=cb.dataset.excludeKind, id=cb.dataset.excludeId;
      if(kind==='cat'){
        const cat=state.categories.find(c=>c.id===id);
        if(cat) cat.excludeFromExport=cb.checked;
      } else {
        const preset=state.miscPresets.find(p=>p.role===id);
        if(preset) preset.excludeFromExport=cb.checked;
      }
      saveState();
    };
  });
  const importBtn = document.getElementById('importDefaultMiscBtn');
  if(importBtn) importBtn.onclick=()=>{
    const n = importDefaultMiscDuties();
    saveState();
    if(n) showAlert(`已匯入 ${n} 項預設勤務，人選還是空的，自己排或按自動排班。今天不需要的項目可以直接刪除，不會再自己跑回來。`);
    else showAlert('今天勤務設定裡的項目都已經存在了，沒有新的可以匯入。');
    render();
  };
}
/* 減法思維：把「勤務設定」（state.dutyDefinitions 裡沒有連結到預排類型的
   那些——話務/消防車/技工/夜督/日督/軍餐班等）材料化成今天的其他勤務記
   錄，人選留空。已經有同名角色記錄的當天就跳過，不會重複匯入；當天刪掉
   的項目，除非再按一次「匯入預設」，也不會自己補回來。平日/假日是完全
   獨立的兩份清單(dayType)，只匯入跟今天日期類型相符的那一份，不會混在
   一起——假日用的是isHolidayDate()同一套判斷(例假日星期＋國定假日)，跟
   查哨序列、外散宿資格判斷共用同一份定義。 */
function importDefaultMiscDuties(){
  if(!state.misc[currentDate]) state.misc[currentDate]=[];
  const todayType = isHolidayDate(currentDate)? 'holiday' : 'weekday';
  const defs = state.dutyDefinitions.filter(d=>!d.linkedPreplan && d.dayType===todayType);
  let count=0;
  defs.forEach(def=>{
    const already = state.misc[currentDate].some(m=>m.role===def.name);
    if(already) return;
    const times = (def.times&&def.times.length)? def.times : [{start:'',end:''}];
    const roles = def.isVehicle? ['駕駛','車長'] : (def.customRoles||undefined);
    count += addMiscEntriesForToday(def.name, times, {restUntil:def.restUntil, roles});
  });
  return count;
}
/* 排班分頁第2區塊——預排項目集中卡：內部照角色分組顯示（跟原本個別卡片
   看到的內容一樣），只是外層包成同一張卡片。編輯方式不變，還是直接改這
   裡就是改班表本身。固定在第2區塊，不再需要拖曳把手。 */
function renderPreplanBundleCard(entries){
  const byRole={};
  entries.forEach(m=>{ if(!byRole[m.role]) byRole[m.role]=[]; byRole[m.role].push(m); });
  const inner = Object.entries(byRole).map(([role,roleEntries])=>{
    const preset = state.miscPresets.find(p=>p.role===role);
    return renderMiscDutyCardInner(role, roleEntries, preset, false);
  }).join('<div class="divider"></div>');
  const innerWithHint = `<div class="hint" style="margin-bottom:8px">這些是從預排匯入的，要改直接在這裡改就是改班表本身，跟其他勤務分開顯示避免清單太長。</div>${inner}`;
  return collapsibleCardHTML('schedblock-preplan', `📥 預排項目（${entries.length}筆）`, innerWithHint);
}
/* 排班分頁第3區塊——其他勤務彙整卡（減法思維）：按「匯入預設」把「勤務
   設定」裡定義好的項目一次帶進今天，人選留空；不需要的項目當天直接刪
   除，不會自己跑回來。跟手動新增/自動排班補的項目共用同一張卡片，內部
   一樣照角色分組顯示，且各角色小節仍然能拖曳排序（改各自 preset 的
   sortOrder）——外層卡片本身固定在第3區塊、不能整張拖，但內容不是死的。
   roleGroups 是 buildScheduleCardItems() 算好、已依 sortOrder 排序的
   {role, entries, preset} 陣列。 */
function renderMiscBundleCard(roleGroups){
  const entryCount = roleGroups.reduce((n,g)=>n+g.entries.length, 0);
  const inner = roleGroups.map((g,i)=>`<div data-drag-idx="${i}">${renderMiscDutyCardInner(g.role, g.entries, g.preset, true)}</div>`).join('<div class="divider"></div>');
  const innerWithHint = `<div class="hint" style="margin-bottom:8px">按「匯入預設」把「勤務設定」裡定義好的項目一次帶進今天（人選留空，自己排或按自動排班），今天不需要的項目直接刪除就好，不會自己跑回來。長按項目左邊的 ⠿ 可拖曳調整順序。</div><div id="miscBundleContainer">${roleGroups.length? inner : '<div class="empty">今天還沒有其他勤務項目。</div>'}</div>`;
  const extraButtons = `<button class="ghost small" id="importDefaultMiscBtn">📥 匯入預設</button>`;
  return collapsibleCardHTML('schedblock-misc', `🗂 其他勤務${entryCount? `（${entryCount}筆）`:''}`, innerWithHint, extraButtons);
}
/* 其他勤務卡片的實際內容（進度、標題、清單）——抽出來讓「預排項目」集中
   卡也可以重用同一份渲染邏輯，不用重複一次。standalone=true 才會在標題
   加上這張卡自己的拖曳把手；集中卡裡面的每個角色小節不需要各自的把手，
   拖曳是整張集中卡一起動。 */
function renderMiscDutyCardInner(role, entries, preset, standalone){
  const miscFilled = entries.reduce((n,m)=>n+(m.roles? m.personIds.filter((pid,i)=>pid||(m.lockedSlots&&m.lockedSlots[i])).length : (m.personIds||[]).filter(Boolean).length),0);
  // freeform entries' target is the preset's 需求人數 (default 1) — previously
  // this used however many were already filled as its own "total", so the
  // progress readout could never show a shortfall for a freeform item
  const miscTotal = entries.reduce((n,m)=>n+(m.roles? m.roles.length : Math.max(preset&&preset.requiredCount||1,(m.personIds||[]).filter(Boolean).length)),0);

/* explains WHY a shift is still short of its "最少需要幾位士官" requirement —
   distinguishes "nobody at all is available for the empty slots" from
   "people are available but none of them are 士官以上", since those call
   for different action (wait/reassign elsewhere vs. can't be filled at all
   without pulling someone from another duty) */
/* for a category flagged mustOutrankOthers (安全士官): everyone assigned to
   OTHER sentry categories overlapping this shift must not outrank the
   person holding this post. Returns the offending assignments, or [] when
   the ranking is fine. */
function outrankViolations(pid, cat, shift, date){
  if(!cat.mustOutrankOthers || !pid) return [];
  const holder = state.personnel.find(p=>p.id===pid);
  if(!holder) return [];
  const sMin = toMin(shift.start), eMin = wrapEndMin(sMin, toMin(shift.end));
  const out=[];
  const dayAssign = state.assign[date]||{};
  orderedCategories().forEach(other=>{
    if(other.id===cat.id) return;
    const otherAssign = dayAssign[other.id]||{};
    effectiveShifts(other, date).forEach(osft=>{
      const oS = toMin(osft.start), oE = wrapEndMin(oS, toMin(osft.end));
      if(!windowsOverlapOnce(sMin,eMin,oS,oE)) return;
      (otherAssign[osft.id]||[]).forEach(opid=>{
        if(!opid) return;
        const op = state.personnel.find(p=>p.id===opid);
        if(!op) return;
        // lower rankIndex = higher rank; violation when the other post outranks this one
        if(rankIndex(op.rank) < rankIndex(holder.rank)){
          out.push(`${other.name} ${osft.label||osft.start+'-'+osft.end} 的 ${op.name}（${op.rank}）階級高於此處的 ${holder.name}（${holder.rank}）`);
        }
      });
    });
  });
  return out;
}
function minNCOStatusHTML(cat, s, date, assigned, ncoCount){
  if(ncoCount>=s.minNCO) return `<div class="hint" style="margin-bottom:6px">此班需至少 ${s.minNCO} 位士官(含)以上，目前 ${ncoCount} 位</div>`;
  const sMin=toMin(s.start), eMin=wrapEndMin(sMin, toMin(s.end));
  const stillEligible = p => !assigned.includes(p.id) && !rankExcludedFromCategory(p.rank,cat) && !isPersonUnavailable(p.id, date, sMin, eMin, {catId:cat.id, shiftId:s.id});
  const anyAvailable = state.personnel.some(stillEligible);
  const ncoAvailable = state.personnel.some(p=>['士官','軍官'].includes(rankCategory(p.rank)) && stillEligible(p));
  let note;
  if(!anyAvailable) note='目前完全沒有人有空可排這一班';
  else if(!ncoAvailable) note='有人有空，但沒有士官以上人員有空，需人工確認調整（自動排班不會硬塞士兵充當帶隊）';
  else note='有士官有空，尚未指派';
  return `<div class="badge-issue" style="margin-bottom:6px">⚠️ 此班需至少 ${s.minNCO} 位士官(含)以上，目前 ${ncoCount} 位（${note}）</div>`;
}

function assignableOptions(cat, shift, selectedId, slotIdx){
  const s=toMin(shift.start), e0=toMin(shift.end);
  const info = p=>{
    const excluded = rankExcludedFromCategory(p.rank, cat);
    const unavailable = excluded || isPersonUnavailable(p.id, currentDate, s, wrapEndMin(s, e0), {catId:cat.id, shiftId:shift.id}) || isPersonOnExclusiveStandby(p.id, currentDate) || isDutyOfficer(p.id, currentDate);
    return {excluded, unavailable};
  };
  // available people first (in the usual priority/group order), unavailable
  // ones pushed to the bottom — matches the same "eligible people on top"
  // convention as the 其他勤務 picker, instead of mixing them in wherever
  // their rank/group would otherwise place them
  const sorted=[...state.personnel].sort((a,b)=>{
    const ia=info(a), ib=info(b);
    if(ia.unavailable!==ib.unavailable) return ia.unavailable? 1 : -1;
    return dutySortIndex(a.rank,cat,slotIdx,shift)-dutySortIndex(b.rank,cat,slotIdx,shift) || groupIndex(a.group)-groupIndex(b.group);
  });
  return sorted.map(p=>{
    const {unavailable} = info(p);
    return `<option value="${p.id}" ${p.id===selectedId?'selected':''}>${unavailable?'❗ ':''}${esc(p.name)}（${p.group||'未分組'}·${p.rank}${p.license? '·🚗'+esc(p.license):''}）</option>`;
  }).join('');
}

    priorityDraft = defaultPriorityArray(cat);
    if(cat.needsNCO) priorityHelperDraft = defaultHelperPriorityArray();
    rerenderPriorityLists();
  };
  /* --- 班別時段 scope handling: "default" edits cat.shifts (applies to
     every date); "today" and "range" edit a separate working array that's
     only written into state.dailyShiftOverrides on Save (per-date for
     "today", per-date-for-every-date-in-range for "range"), so switching
     the radio back and forth before saving never touches the category-wide
     template. */
  let editScope='default';
  let todayShiftsDraft=null; // lazily built the first time the user switches to "today"
  let rangeShiftsDraft=null; // lazily built the first time the user switches to "range"
  function activeShiftsArray(){
    if(editScope==='today') return todayShiftsDraft;
    if(editScope==='range') return rangeShiftsDraft;
    return cat.shifts;
  }
  function hasTodayOverride(){
    return !!((state.dailyShiftOverrides[currentDate]||{})[cat.id]);
  }
  function updateScopeUI(){
    const hintEl=document.getElementById('scopeHint');
    document.getElementById('scopeRangeRow').style.display = editScope==='range'? 'flex':'none';
    if(editScope==='today'){
      hintEl.textContent = `這裡改的是「${cat.name}」只在今天（${minguoLabel(currentDate)}）套用的班別設定，存檔後不影響其他日期，也不影響這個類別本身的預設值。`;
    } else if(editScope==='range'){
      hintEl.textContent = `這裡改的是「${cat.name}」在指定日期範圍內（含起訖日，每天都會各自存一份）套用的班別設定，範圍外的日期不受影響，也不影響這個類別本身的預設值。`;
    } else {
      hintEl.textContent = `這裡改的是「${cat.name}」這個類別的預設班別設定，會套用到所有日期${hasTodayOverride()? '（但今天已經有專屬設定，實際仍以那份為準，除非切到「只套用到今天」調整或移除它）':''}。只是想改「今天」某一班的人員，不用進這裡——回排班分頁該班別下面的下拉選單直接改人就好。`;
    }
    document.getElementById('clearTodayOverrideBtn').style.display = (editScope==='today' && hasTodayOverride())? 'inline-block':'none';
  }
  updateScopeUI();
  document.querySelectorAll('input[name="editScope"]').forEach(r=>{
    r.addEventListener('change', ()=>{
      editScope = document.querySelector('input[name="editScope"]:checked').value;
      if(editScope==='today' && !todayShiftsDraft){
        const existing = (state.dailyShiftOverrides[currentDate]||{})[cat.id];
        todayShiftsDraft = existing? existing.map(s=>({...s})) : cat.shifts.map(s=>({...s}));
      }
      if(editScope==='range' && !rangeShiftsDraft){
        rangeShiftsDraft = cat.shifts.map(s=>({...s}));
      }
      shiftEditRowRerender();
      updateScopeUI();
    });
  });
  function shiftEditRowRerender(){
    document.getElementById('shiftEditList').innerHTML = activeShiftsArray().map((s,i)=>shiftEditRow(s,i)).join('');
    wireShiftRows();
  }
  function wireShiftRows(){
    document.querySelectorAll('[data-shift-del]').forEach(b=>{
      b.onclick=()=>{ activeShiftsArray().splice(Number(b.dataset.shiftDel),1); shiftEditRowRerender(); };
    });
  }
  wireShiftRows();
  document.getElementById('addShift').onclick=()=>{
    activeShiftsArray().push(sh('08:00','12:00')); shiftEditRowRerender();
  };
  function readShiftDraftValues(){
    const arr = activeShiftsArray();
    return [...document.querySelectorAll('.shiftEditItem')].map((row,i)=>({
      id: arr[i]? arr[i].id : uid(),
      start: getTimeSelectValue('se-start-'+i),
      end: getTimeSelectValue('se-end-'+i),
      count: Math.max(1, Number(row.querySelector('.se-count').value)||1),
      label: row.querySelector('.se-label').value.trim(),
      restUntil: getTimeSelectValue('se-rest-'+i),
      minNCO: Math.max(0, Number(row.querySelector('.se-minnco').value)||0)
    }));
  }
  document.getElementById('restoreShiftsBtn').onclick=()=>{
    const defaults = state.categoryShiftDefaults[cat.id];
    if(!defaults){ showAlert('這個類別目前還沒有存過預設班別，請先按下面「將目前設定存為預設班別」建立一份。'); return; }
    showConfirm(`確定要把${editScope!=='default'? '目前這份':''}班別時段還原成你設定的預設班別嗎？目前編輯中尚未儲存的調整會被取代（已經存檔的排班紀錄不會受影響）。`, ()=>{
      const cloned = defaults.map(s=>({...s, id:uid()}));
      if(editScope==='today') todayShiftsDraft = cloned;
      else if(editScope==='range') rangeShiftsDraft = cloned;
      else cat.shifts = cloned;
      shiftEditRowRerender();
    });
  };
  document.getElementById('setAsDefaultBtn').onclick=()=>{
    showConfirm('確定要把目前畫面上的班別設定存為這個類別的「預設班別」嗎？之後「恢復預設班別」都會用這份（不影響已經排定的班表）。', ()=>{
      state.categoryShiftDefaults[cat.id] = readShiftDraftValues().map(s=>({...s}));
      saveState();
      showAlert('已存為這個類別的預設班別。');
    });
  };
  document.getElementById('clearTodayOverrideBtn').onclick=()=>{
    showConfirm('確定要移除「今天」的專屬班別設定嗎？之後今天會改回套用這個類別的預設班別時段。', ()=>{
      if(state.dailyShiftOverrides[currentDate]) delete state.dailyShiftOverrides[currentDate][cat.id];
      todayShiftsDraft = cat.shifts.map(s=>({...s}));
      saveState();
      shiftEditRowRerender();
      updateScopeUI();
    });
  };
  wireCloseConfirm(modal, document.getElementById('closeModal'));
  document.getElementById('duplicateCatBtn').onclick=()=>{
    showPrompt('新類別名稱？（例：G028後門）', cat.name+'（複製）', (newName)=>{
      const newId=uid();
      const newShifts = cat.shifts.map(s=>({...s, id:uid()}));
      const newCat = {
        ...cat,
        id:newId, name:newName, shifts:newShifts,
        excludeRanks: [...(cat.excludeRanks||[])],
        avoidRanks: [...(cat.avoidRanks||[])],
        customPriority: cat.customPriority? [...cat.customPriority] : undefined,
        customPriorityHelper: cat.customPriorityHelper? [...cat.customPriorityHelper] : undefined,
        sortOrder: nextSortOrder(),
      };
      state.categories.push(newCat);
      state.categoryShiftDefaults[newId] = newShifts.map(s=>({...s}));
      saveState();
      modal.remove();
      showAlert(`已建立「${newName}」，複製自「${cat.name}」的全部設定，可以再進去微調細節。`);
      render();
    });
  };
  document.getElementById('deleteCatBtn').onclick=()=>{
    showConfirm(`確定要刪除「${cat.name}」這個類別嗎？會一併移除這個類別的預設班別設定、所有日期的專屬班別設定，以及所有日期已經排定的人員。如果刪錯了，可以用畫面左上角的復原（↩️）按鈕還原。`, ()=>{
      state.categories = state.categories.filter(c=>c.id!==cat.id);
      delete state.categoryShiftDefaults[cat.id];
      Object.keys(state.dailyShiftOverrides).forEach(d=>{ delete state.dailyShiftOverrides[d][cat.id]; });
      Object.keys(state.assign).forEach(d=>{ delete state.assign[d][cat.id]; });
      Object.keys(state.dutyChanges).forEach(d=>{
        state.dutyChanges[d] = (state.dutyChanges[d]||[]).filter(ch=>!(ch.source.kind==='cat' && ch.source.catId===cat.id));
      });
      saveState();
      modal.remove();
      showAlert(`已刪除「${cat.name}」。`);
      render();
    });
  };
  document.getElementById('saveCat').onclick=()=>{
    cat.name=document.getElementById('catName').value.trim()||cat.name;
    cat.enforceRest=document.getElementById('catRest').checked;
    cat.preferLowRank=document.getElementById('catLow').checked;
    cat.needsNCO=document.getElementById('catNCO').checked;
    cat.isSentry=document.getElementById('catSentry').checked;
    cat.mustOutrankOthers=document.getElementById('catOutrank').checked;
    cat.excludeRanks=[...document.getElementById('catExclude').selectedOptions].map(o=>o.value);
    cat.avoidRanks=[...document.getElementById('catAvoid').selectedOptions].map(o=>o.value);
    cat.customPriority=[...priorityDraft];
    if(cat.needsNCO) cat.customPriorityHelper=[...priorityHelperDraft];
    else delete cat.customPriorityHelper;
    const draftShifts = readShiftDraftValues();
    if(editScope==='today'){
      if(!state.dailyShiftOverrides[currentDate]) state.dailyShiftOverrides[currentDate]={};
      state.dailyShiftOverrides[currentDate][cat.id] = draftShifts;
    } else if(editScope==='range'){
      const rs=document.getElementById('scopeRangeStart').value, re=document.getElementById('scopeRangeEnd').value;
      if(!rs||!re||rs>re){ showAlert('請確認日期範圍正確（起始日不能晚於結束日）'); return; }
      dateRangeList(rs,re).forEach(d=>{
        if(!state.dailyShiftOverrides[d]) state.dailyShiftOverrides[d]={};
        state.dailyShiftOverrides[d][cat.id] = draftShifts.map(s=>({...s, id:uid()}));
      });
    } else {
      cat.shifts.length = 0;
      draftShifts.forEach(d=>cat.shifts.push(d));
    }
    saveState();
    if(editScope==='default' && hasTodayOverride()){
      // 預設班別剛剛更新了，但今天這個日期還套用著專屬設定，effectiveShifts()
      // 會優先顯示那份專屬設定，導致剛剛存的異動（例如新增的班別）在排班頁「消失」。
      // 直接問使用者要不要順便清掉今天的專屬設定，避免像是沒存到一樣的錯覺。
      const catName = cat.name, catId = cat.id, savedDate = currentDate;
      modal.remove(); render();
      showConfirm(`「${catName}」的預設班別已經更新，但今天（${minguoLabel(savedDate)}）目前是套用「只套用到今天」的專屬設定，畫面上暫時還不會顯示剛剛的異動。要順便清除今天的專屬設定，改套用新的預設班別嗎？`, ()=>{
        if(state.dailyShiftOverrides[savedDate]) delete state.dailyShiftOverrides[savedDate][catId];
        saveState();
        render();
      });
    } else {
      modal.remove(); render();
    }
  };
  function shiftEditRow(s,i){
    return `<div class="shift-row shiftEditItem" data-i="${i}">
      <div class="row wrap">
        <div class="grow"><label>標籤(選填)</label><input type="text" class="se-label" value="${esc(s.label||'')}" placeholder="例：早"></div>
        <div style="width:64px"><label>人數</label><input type="text" class="se-count" value="${s.count}"></div>
      </div>
      <div class="row wrap" style="margin-top:6px">
        <div class="grow"><label>開始</label>${timeSelectHTML('se-start-'+i, s.start)}</div>
        <div class="grow"><label>結束</label>${timeSelectHTML('se-end-'+i, s.end)}</div>
        <button class="ghost small danger" data-shift-del="${i}">刪除</button>
      </div>
      <div class="row wrap" style="margin-top:6px">
        <div class="grow"><label>補休至(選填，下班後自動排除其他勤務至此時間)</label>${timeSelectHTML('se-rest-'+i, s.restUntil, {allowEmpty:true})}</div>
      </div>
      <div class="row wrap" style="margin-top:6px">
        <div style="width:120px"><label>最少需要幾位士官(含)以上(選填，0代表不限)</label><input type="text" class="se-minnco" value="${s.minNCO||0}"></div>
      </div>
    </div>`;
