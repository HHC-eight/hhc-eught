<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>衛哨排班</title>
<style>
:root{
  --bg:#11161c;
  --panel:#1a2029;
  --panel2:#212936;
  --line:#2c3542;
  --text:#e7ebf0;
  --dim:#8b97a6;
  --accent:#c98a3c;
  --accent2:#7d9a5f;
  --danger:#c9573c;
  --ok:#5a9a6f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",Segoe UI,sans-serif;}
body{padding-bottom:78px;}
h1,h2,h3{font-weight:600;margin:0 0 10px;}
h1{font-size:17px;letter-spacing:.5px;}
h2{font-size:15px;color:var(--accent);}
h3{font-size:13px;color:var(--dim);font-weight:500;}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);}
.unit-banner{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 14px 6px;background:linear-gradient(180deg,#1a2117,var(--bg));border-bottom:1px solid rgba(125,154,95,.35);}
.unit-banner-badge{width:18px;height:18px;border-radius:50%;background:var(--accent2);color:#0d130a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.unit-banner-text{font-size:12px;letter-spacing:2.5px;color:var(--accent2);font-weight:600;}
.topbar-main{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;}
.container{padding:12px 12px 24px;max-width:640px;margin:0 auto;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;}
.row{display:flex;gap:8px;align-items:center;}
.row.wrap{flex-wrap:wrap;}
.grow{flex:1;min-width:0;}
label{display:block;font-size:11px;color:var(--dim);margin-bottom:3px;}
input[type=text],input[type=date],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:9px 8px;border-radius:6px;font-size:14px;font-family:inherit;
}
select{-webkit-appearance:none;appearance:none;}
button{
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  padding:9px 12px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;
}
button.primary{background:var(--accent);border-color:var(--accent);color:#1a140a;font-weight:600;}
button.ghost{background:transparent;}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent;}
button.small{padding:5px 9px;font-size:12px;}
button:active{opacity:.7;}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom);}
.tabs button{flex:1;background:transparent;border:none;border-radius:0;padding:11px 4px;font-size:12px;color:var(--dim);}
.tabs button.active{color:var(--accent);font-weight:600;}
.list-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;}
.tag.rank-軍官{color:#c9573c;border-color:#c9573c;}
.tag.rank-士官{color:#c98a3c;border-color:#c98a3c;}
.tag.rank-士兵{color:#7d9a5f;border-color:#7d9a5f;}
.muted{color:var(--dim);font-size:12px;}
.warn{color:var(--danger);font-size:12px;}
.ok{color:var(--ok);font-size:12px;}
.shift-row{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;background:var(--panel2);}
.shift-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.shift-time{font-size:13px;font-weight:600;}
.slot-select{margin-bottom:4px;}
.badge-issue{display:inline-block;font-size:11px;color:var(--danger);margin-top:2px;}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.hr-table{width:100%;border-collapse:collapse;font-size:11px;}
.hr-table td,.hr-table th{padding:3px 2px;text-align:center;border-bottom:1px solid var(--line);}
.hr-table th{color:var(--dim);font-weight:500;}
.bar-wrap{background:var(--panel2);border-radius:3px;overflow:hidden;height:14px;position:relative;}
.bar-fill{background:var(--accent2);height:100%;}
.pill-btn{display:inline-block;padding:4px 9px;border-radius:14px;border:1px solid var(--line);font-size:12px;margin:2px 3px 0 0;background:var(--panel2);}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:20px 0;}
.divider{height:1px;background:var(--line);margin:12px 0;}
textarea{min-height:50px;resize:vertical;}
.hint{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5;}
</style>
</head>
<body>

<div class="topbar">
  <div class="unit-banner">
    <span class="unit-banner-badge">★</span>
    <span class="unit-banner-text">陸軍第八軍團 本部連</span>
  </div>
  <div class="topbar-main">
    <h1 id="pageTitle">🌟 衛哨排班系統</h1>
    <button class="ghost small" id="exportBtn">匯出</button>
  </div>
</div>

<div class="container" id="app"></div>

<div class="tabs">
  <button data-tab="people">👤 人員</button>
  <button data-tab="unavail">🚫 請假/管制</button>
  <button data-tab="stats">📊 統計</button>
  <button data-tab="schedule">📋 排班</button>
  <button data-tab="misc">🗂 其他勤務</button>
</div>

<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
/* ---------------- storage ---------------- */
const LS_KEY='drs_data_v1';
function loadState(){
  const raw=localStorage.getItem(LS_KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return {
    personnel: [],
    categories: defaultCategories(),
    unavail: {},      // date -> [{id,personId,allDay,start,end}]
    assign: {},       // date -> categoryId -> shiftId -> [personId,...]
    misc: {},         // date -> [{id,role,text}]
    miscCustomPresets: [] // [{role,start,end}] user-added quick-add presets for 其他勤務
  };
}
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------------- rank system ---------------- */
const RANK_DEFS=[
  {rank:'少校',cat:'軍官'},{rank:'上尉',cat:'軍官'},{rank:'中尉',cat:'軍官'},{rank:'少尉',cat:'軍官'},
  {rank:'士官長',cat:'士官'},{rank:'上士',cat:'士官'},{rank:'中士',cat:'士官'},{rank:'下士',cat:'士官'},
  {rank:'上兵',cat:'士兵'},{rank:'一兵',cat:'士兵'},{rank:'二兵',cat:'士兵'},{rank:'訓練役',cat:'士兵'}
];
function rankIndex(rank){ const i=RANK_DEFS.findIndex(r=>r.rank===rank); return i<0?RANK_DEFS.length:i; }
function rankCategory(rank){ const r=RANK_DEFS.find(r=>r.rank===rank); return r?r.cat:''; }
function rankOptionsHTML(selected){
  const groups=['軍官','士官','士兵'];
  return groups.map(g=>`<optgroup label="${g}">${RANK_DEFS.filter(r=>r.cat===g).map(r=>`<option value="${r.rank}" ${r.rank===selected?'selected':''}>${r.rank}</option>`).join('')}</optgroup>`).join('');
}
/* duty-assignment priority (distinct from roster display order in RANK_DEFS):
   for 低階優先 categories (橋哨/指管) 下士 is the top preferred rank;
   for 需士官帶隊 categories (打飯班) the lead preference order is 下士 → 中士 → 上士 → 士官長 */
const LOW_RANK_PRIORITY=['下士','二兵','一兵','上兵','中士','上士','士官長','少尉','中尉','上尉','少校'];
const NCO_LEAD_PRIORITY=['下士','中士','上士','士官長','少尉','中尉','上尉','少校','二兵','一兵','上兵'];
/* for a needsNCO category (打飯班): slot 0 is the leader (pick an NCO, 下士
   first — see NCO_LEAD_PRIORITY above), every other slot is a helper and
   should go to an enlisted soldier first, only reaching for another NCO or
   an officer if no soldier is available. */
const MEAL_HELPER_PRIORITY=['訓練役','二兵','一兵','上兵','下士','中士','上士','士官長','少尉','中尉','上尉','少校'];
function dutySortIndex(rank, cat, slotIdx, shift){
  // 整天 (all-day) meal duty isn't a leadership shift — the NCO requirement
  // for 打飯班 is satisfied elsewhere (早/午/晚 each get their own leader), so
  // every slot on 整天 just prefers the lowest-rank enlisted first.
  if(cat.needsNCO && shift && shift.label==='整天'){
    const i=MEAL_HELPER_PRIORITY.indexOf(rank);
    return i<0? MEAL_HELPER_PRIORITY.length : i;
  }
  const order = cat.needsNCO
    ? ((slotIdx||0)===0 ? NCO_LEAD_PRIORITY : MEAL_HELPER_PRIORITY)
    : (cat.preferLowRank ? LOW_RANK_PRIORITY : null);
  let base = order ? (order.indexOf(rank)<0? order.length : order.indexOf(rank)) : rankIndex(rank);
  // a rank the category would rather not use (but may, if nobody else is
  // available) gets pushed to the very back of the priority order
  if((cat.avoidRanks||[]).includes(rank)) base += 1000;
  return base;
}
/* a rank a category can NEVER use (hard rule, e.g. 訓練役 can't stand 安全士官)
   — unlike avoidRanks above, this excludes the person entirely, not just
   de-prioritizes them */
function rankExcludedFromCategory(rank, cat){
  return (cat.excludeRanks||[]).includes(rank);
}
const GROUP_OPTIONS=['連部','連部組','行政排','勤務排','運輸排','設維組','醫務組'];
function groupIndex(g){ const i=GROUP_OPTIONS.indexOf(g); return i<0?GROUP_OPTIONS.length:i; }
function groupOptionsHTML(selected){
  return `<option value="" ${!selected?'selected':''}>（未分組）</option>` +
    GROUP_OPTIONS.map(g=>`<option value="${g}" ${g===selected?'selected':''}>${g}</option>`).join('');
}

function defaultCategories(){
  return [
    {id:'safety',name:'安全士官',enforceRest:true,preferLowRank:false,needsNCO:false,excludeRanks:['訓練役'],avoidRanks:['二兵'],
      shifts:[
        sh('22:00','24:00',1,'','08:00'),sh('00:00','02:00',1,'','08:00'),sh('02:00','04:00',1,'','08:00'),sh('04:00','06:00',1,'','08:00'),
        sh('06:00','08:00',1,'','08:30'),sh('08:00','12:00'),sh('12:00','14:00'),sh('14:00','18:00'),sh('18:00','22:00')
      ]},
    {id:'bridge',name:'橋哨',enforceRest:true,preferLowRank:true,needsNCO:false,
      shifts:[
        sh('22:00','24:00',1,'','08:00'),sh('00:00','02:00',1,'','08:00'),sh('02:00','04:00',1,'','08:00'),sh('04:00','06:00',1,'','08:00'),
        sh('06:00','08:00',1,'','08:30'),sh('18:00','20:00'),sh('20:00','22:00')
      ]},
    {id:'control',name:'安管中心(指管)',enforceRest:true,preferLowRank:true,needsNCO:false,
      shifts:[
        sh('06:00','08:00'),sh('08:00','12:00'),sh('12:00','14:00'),sh('14:00','18:00'),sh('18:00','22:00')
      ]},
    {id:'meal',name:'打飯班',enforceRest:false,preferLowRank:false,needsNCO:true,
      shifts:[
        sh('06:00','07:00',2,'早','08:30'),sh('10:10','13:20',2,'午','15:30'),sh('16:20','19:30',2,'晚'),sh('00:00','24:00',2,'整天')
      ]}
  ];
}
function sh(start,end,count,label,restUntil){ return {id:uid(),start,end,count:count||1,label:label||'',restUntil:restUntil||''}; }
/* fixed display order for the standard categories, regardless of the order
   they were added/restored in state.categories — any extra custom categories
   just appear after these, in whatever order they exist */
const CATEGORY_ORDER=['safety','bridge','control','meal'];
function orderedCategories(){
  return [...state.categories].sort((a,b)=>{
    const ai=CATEGORY_ORDER.indexOf(a.id), bi=CATEGORY_ORDER.indexOf(b.id);
    return (ai<0?CATEGORY_ORDER.length:ai) - (bi<0?CATEGORY_ORDER.length:bi);
  });
}
/* preset quick-add templates for 其他勤務 (misc duty) with usual times, per unit SOP */
const MISC_PRESETS=[
  {role:'採買',start:'05:30',end:'08:00',roles:['車長','駕駛']},
  {role:'愛心便當',start:'16:00',end:'18:00',roles:['車長','駕駛']},
  {role:'消防車',start:'06:00',end:'08:00',roles:['車長','駕駛']},
  {role:'救護車',start:'06:00',end:'08:00',roles:['車長','駕駛']},
  {role:'技工',start:'06:30',end:'07:30',roles:null},
  {role:'話務',start:'06:30',end:'07:30',roles:['話務(需小型車以上駕照)']}
];
/* validation for structured misc entries (entry.roles present): 車長/駕駛 pairs
   need the driver to hold at least a 小型車 license and the chief to be an
   NCO+ outranking the driver; anything tagged 話務 just needs a license. */
function validateMiscEntry(entry){
  if(!entry.roles) return [];
  const issues=[];
  const chiefIdx=entry.roles.indexOf('車長');
  const driverIdx=entry.roles.indexOf('駕駛');
  if(chiefIdx>-1 && driverIdx>-1){
    const chief=state.personnel.find(p=>p.id===entry.personIds[chiefIdx]);
    const driver=state.personnel.find(p=>p.id===entry.personIds[driverIdx]);
    if(driver && !driver.license) issues.push(`駕駛 ${driver.name}：沒有駕照，至少需要小型車駕照`);
    if(chief && !['士官','軍官'].includes(rankCategory(chief.rank))) issues.push(`車長 ${chief.name}：需為士官以上`);
    if(chief && driver && rankIndex(chief.rank)>=rankIndex(driver.rank)) issues.push(`車長 ${chief.name} 階級須高於駕駛 ${driver.name}`);
  }
  entry.roles.forEach((r,i)=>{
    if(r.startsWith('話務')){
      const p=state.personnel.find(pp=>pp.id===entry.personIds[i]);
      if(p && !p.license) issues.push(`${p.name}：話務需至少小型車駕照`);
    }
  });
  return issues;
}

let state = loadState();
if(!state.miscCustomPresets) state.miscCustomPresets=[];
let currentTab='people';
let currentDate = todayStr();

function todayStr(){
  const d=new Date(); const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function prevDateStr(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()-1);
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function nextDateStr(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+1);
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
/* every date strictly between start and end (inclusive), as an array of
   'YYYY-MM-DD' strings, in order */
function dateRangeList(startStr, endStr){
  const out=[]; let cur=startStr;
  while(true){
    out.push(cur);
    if(cur===endStr) break;
    cur=nextDateStr(cur);
    if(out.length>366) break; // safety guard
  }
  return out;
}
function daysBetweenInclusive(startStr, endStr){
  const ds=new Date(startStr+'T00:00:00'), de=new Date(endStr+'T00:00:00');
  return Math.round((de-ds)/86400000)+1;
}
const UNAVAIL_REASON_PRESETS=['出車','體檢','體測','開會','帶廠商','留守'];
/* 事故/請假 (uses a preset reason list or a custom typed one) */
/* 衛哨 (安全士官/橋哨/指管) rule: the same person should not stand the same
   time-slot two days running — check whether they held this exact shift
   (same category + same shift) on the immediately preceding calendar date. */
function assignedSameShiftYesterday(personId, date, catId, shiftId){
  const prev=prevDateStr(date);
  const arr=((state.assign[prev]||{})[catId]||{})[shiftId] || [];
  return arr.includes(personId);
}

/* ---------------- time utils ---------------- */
function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function fmtMin(m){ m=((m%1440)+1440)%1440; const h=Math.floor(m/60), mm=m%60; return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
function shiftDuration(s){ let a=toMin(s.start), b=toMin(s.end); if(b<=a) b+=1440; return b-a; }
function timeOptions(){
  let opts=[]; for(let m=0;m<=1440;m+=30){ let h=Math.floor(m/60), mm=m%60; opts.push(String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')); }
  return opts;
}
function timeOptionsFine(step){
  let opts=[]; for(let m=0;m<=1440;m+=step){ let h=Math.floor(m/60), mm=m%60; opts.push(String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')); }
  return opts;
}

/* Build absolute (non-wrapping) start/end minutes for every shift in a category
   so that shifts from DIFFERENT categories land on the SAME shared timeline —
   this is what makes the cross-category 6-hour rest check meaningful.
   The previous version anchored each category's own list independently
   (chaining forward from its first listed shift), which only lined up
   correctly when every category happened to start its list at the same hour
   (22:00, true for 安全士官/橋哨). 指管 and 打飯班 start their lists at 06:00,
   so under that old scheme their shifts landed roughly a full day off from
   安全士官/橋哨's equivalent 06:00-08:00 etc., and real overlaps across
   categories (e.g. someone double-booked in 橋哨 and 指管 the same evening)
   went undetected.
   Fix: anchor every category to one shared reference point instead — the
   roster "day" is treated as running from 22:00 through 22:00 the next
   calendar day (matching the unit's own shift-change convention), so any
   raw start time >=22:00 is "today" and anything earlier is "the next
   calendar day of this same roster cycle". This gives every category's
   shifts a directly comparable absolute position, independent of what order
   its own shift list happens to be written in. */
/* 衛哨 (rest-enforced) shifts need 30 minutes of prep beforehand — the
   assignee is effectively occupied starting that much earlier than the
   shift's listed start time, for every check that cares about real
   occupancy (rest gaps, double-booking, misc-duty conflicts). */
/* 衛哨 shifts need 30 minutes of prep beforehand — but this is a gap
   requirement against whatever the person was doing right before (其他勤務
   or a non-rest-enforced category shift like 打飯班), NOT extra padding on
   the sentry-to-sentry 6-hour rule itself. See prepGapConflict below; the
   6h rest math (absoluteShiftTimes/restIssues) intentionally stays on
   nominal shift times only. */
const PREP_MINUTES = 30;
const DAY_START_MIN = 22*60; // 22:00 — the roster day's reference hour
function absoluteShiftTimes(category){
  const out={};
  category.shifts.forEach(s=>{
    const sr=toMin(s.start), er=toMin(s.end);
    const dur = er<=sr ? (er+1440-sr) : (er-sr);
    const abs_s = sr>=DAY_START_MIN ? sr : sr+1440;
    out[s.id]={abs_s, abs_e:abs_s+dur};
  });
  return out;
}

/* generic "does raw window A overlap raw window B" check.
   - Once: for one-off, same-cycle entries (daily leave, a specific shift's time,
     comp-rest windows we've already anchored) — expands each window only once
     for its own internal midnight wrap, no further shifting.
   - Recurring: for windows that repeat every day (a person's daily recurring
     long-term block) or that must be matched against a query which may land
     on the "next segment" of the same duty-day chain (compensatory rest,
     since night-block shifts are listed with small raw times that
     chronologically follow the late-evening shifts) — tries every day-length
     offset so either side may be the one that's "ahead". */
function expandWindow(s,e){ if(e<=s) e+=1440; return [s,e]; }
function windowsOverlapOnce(aS,aE,bS,bE){
  const [as,ae]=expandWindow(aS,aE);
  const [bs,be]=expandWindow(bS,bE);
  return as<be && bs<ae;
}
function windowsOverlapRecurring(aS,aE,bS,bE){
  const [as,ae]=expandWindow(aS,aE);
  const [bs,be]=expandWindow(bS,bE);
  for(const off of [-1440,0,1440]){
    if(as < be+off && bs+off < ae) return true;
  }
  return false;
}

/* ---------------- long-term unavailability ---------------- */
/* p.longTerm = {mode:'off'|'allday'|'range', start, end}. Falls back to the
   legacy boolean field p.longTermUnavailable from earlier versions. */
function personLongTerm(p){
  if(p.longTerm) return p.longTerm;
  if(p.longTermUnavailable) return {mode:'allday'};
  return {mode:'off'};
}
function longTermLabel(p){
  const lt=personLongTerm(p);
  if(lt.mode==='allday') return '長期全天不可排';
  if(lt.mode==='range') return `長期不可排 ${lt.start}–${lt.end}`;
  return '';
}

/* ---------------- compensatory rest (補休) ---------------- */
/* Shifts may define restUntil: a clock time until which the assignee is
   automatically excused from any other duty after that shift ends
   (e.g. a 22:00-24:00 sentry shift with restUntil '08:00'). This is computed
   live from current assignments — nothing extra to store. */
function personCompRestWindows(personId, date){
  const dayAssign = state.assign[date]||{};
  const out=[];
  state.categories.forEach(cat=>{
    const catAssign=dayAssign[cat.id]||{};
    cat.shifts.forEach(s=>{
      if(!s.restUntil) return;
      if((catAssign[s.id]||[]).includes(personId)){
        out.push({start:s.end, end:s.restUntil, catName:cat.name, label:s.label||(s.start+'-'+s.end)});
      }
    });
  });
  return out;
}

/* ---------------- availability ---------------- */
/* excludeCatShift: {catId,shiftId} — skip this exact shift when checking for
   double-booking against the person's OTHER current assignments (so a shift's
   own dropdown doesn't flag the person it's already assigned to). */
function isPersonUnavailable(personId, date, s, e, excludeCatShift){
  // s,e in minutes-of-day (0-1440-ish), plain (not absolute-unwrapped)
  const person = state.personnel.find(p=>p.id===personId);
  if(person){
    const lt = personLongTerm(person);
    if(lt.mode==='allday') return true;
    if(lt.mode==='range' && lt.start && lt.end && windowsOverlapRecurring(s,e,toMin(lt.start),toMin(lt.end))) return true;
  }
  const entries=(state.unavail[date]||[]).filter(u=>u.personId===personId);
  for(const u of entries){
    if(u.allDay) return true;
    if(windowsOverlapOnce(s,e,toMin(u.start),toMin(u.end))) return true;
  }
  for(const w of personCompRestWindows(personId, date)){
    if(windowsOverlapRecurring(s,e,toMin(w.start),toMin(w.end))) return true;
  }
  // avoid double-booking against the person's other current assignments that day
  const dayAssign = state.assign[date]||{};
  for(const cat of state.categories){
    const catAssign = dayAssign[cat.id]||{};
    for(const sft of cat.shifts){
      if(excludeCatShift && excludeCatShift.catId===cat.id && excludeCatShift.shiftId===sft.id) continue;
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapOnce(s,e,toMin(sft.start),toMin(sft.end))) return true;
    }
  }
  // avoid double-booking against 其他勤務 (misc) commitments that have a defined time window
  for(const m of (state.misc[date]||[])){
    if(m.start && m.end && (m.personIds||[]).includes(personId) && windowsOverlapOnce(s,e,toMin(m.start),toMin(m.end))) return true;
  }
  return false;
}

function personName(id){ const p=state.personnel.find(p=>p.id===id); return p?p.name:'—'; }
/* for the ad-hoc "who's free right now, and for how long" query: steps forward
   in 15-minute increments from queryMin until the person becomes unavailable
   (leave, long-term, comp-rest, or an existing assignment) or the day ends */
function freeDurationFrom(personId, date, queryMin){
  if(isPersonUnavailable(personId, date, queryMin, queryMin+1)) return 0;
  const step=15; let t=queryMin;
  while(t<1440){
    if(isPersonUnavailable(personId, date, t, Math.min(t+step,1440))) break;
    t+=step;
  }
  return Math.min(t,1440)-queryMin;
}
function personRank(id){ const p=state.personnel.find(p=>p.id===id); return p?p.rank:''; }

/* gather all assignment instances for a person on a date, across enforceRest categories,
   with absolute minute ranges, for rest / daily-hour checking */
function personEnforcedShifts(personId, date, excludeCatShift){
  const dayAssign = state.assign[date]||{};
  const out=[];
  state.categories.filter(c=>c.enforceRest).forEach(cat=>{
    const abs = absoluteShiftTimes(cat);
    const catAssign = dayAssign[cat.id]||{};
    cat.shifts.forEach(s=>{
      if(excludeCatShift && excludeCatShift.catId===cat.id && excludeCatShift.shiftId===s.id) return;
      const list = catAssign[s.id]||[];
      if(list.includes(personId)){
        out.push({catId:cat.id,catName:cat.name,shiftId:s.id,label:s.label|| (s.start+'-'+s.end), ...abs[s.id]});
      }
    });
  });
  return out.sort((a,b)=>a.abs_s-b.abs_s);
}

function restIssues(personId, date, catId, shift){
  // returns array of warning strings if assigning personId to this shift breaks the 6h rest / 6h per day rule
  const cat = state.categories.find(c=>c.id===catId);
  if(!cat.enforceRest) return [];
  const abs = absoluteShiftTimes(cat)[shift.id];
  const existing = personEnforcedShifts(personId, date, {catId, shiftId:shift.id});
  const all = [...existing, {abs_s:abs.abs_s, abs_e:abs.abs_e, catName:cat.name, label: shift.label||(shift.start+'-'+shift.end)}].sort((a,b)=>a.abs_s-b.abs_s);
  const issues=[];
  let totalMin=0;
  for(let i=0;i<all.length;i++){
    totalMin += (all[i].abs_e-all[i].abs_s);
    if(i>0){
      const gap = all[i].abs_s - all[i-1].abs_e;
      if(gap < 0){ issues.push(`與「${all[i-1].catName} ${all[i-1].label}」時段重疊`); }
      else if(gap < 360){ issues.push(`與「${all[i-1].catName} ${all[i-1].label}」間隔僅 ${Math.round(gap/60*10)/10} 小時（需滿6小時）`); }
    }
  }
  if(totalMin>360){ issues.push(`當日累計勤務 ${Math.round(totalMin/60*10)/10} 小時，超過上限6小時`); }
  return issues;
}

/* would assigning this shift create a 補休(comp-rest) window that overlaps a
   commitment the person ALREADY has — a 其他勤務(misc) entry with a defined
   time, or a non-enforceRest category shift (e.g. 打飯班) — that restIssues
   above doesn't check (it only compares against OTHER enforceRest shifts)? */
function wouldRestWindowConflict(personId, date, shift, excludeCatShift){
  if(!shift.restUntil) return false;
  const winStart=toMin(shift.end), winEnd=toMin(shift.restUntil);
  for(const m of (state.misc[date]||[])){
    if(m.start && m.end && (m.personIds||[]).includes(personId) && windowsOverlapRecurring(toMin(m.start),toMin(m.end),winStart,winEnd)) return true;
  }
  const dayAssign=state.assign[date]||{};
  for(const cat of state.categories){
    if(cat.enforceRest) continue;
    const catAssign=dayAssign[cat.id]||{};
    for(const sft of cat.shifts){
      if(excludeCatShift && excludeCatShift.catId===cat.id && excludeCatShift.shiftId===sft.id) continue;
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapRecurring(toMin(sft.start),toMin(sft.end),winStart,winEnd)) return true;
    }
  }
  return false;
}

/* 衛哨 shifts need PREP_MINUTES of prep beforehand — check whether the
   person was still doing something else (其他勤務 or a non-rest-enforced
   category shift like 打飯班) too close before this shift starts. This is
   the one place PREP_MINUTES applies; it deliberately does NOT feed into
   the sentry-to-sentry 6-hour rule (restIssues/absoluteShiftTimes), which
   stays on nominal shift times. Example: 採買 ending at 08:00 immediately
   followed by an 08:00-12:00 衛哨 shift leaves no prep time — flagged;
   two 衛哨 shifts 6 hours apart are NOT affected by this rule. */
function prepGapConflict(personId, date, cat, shift){
  if(!cat.enforceRest) return false;
  const shiftStart=toMin(shift.start);
  const prepStart=((shiftStart-PREP_MINUTES)%1440+1440)%1440;
  for(const m of (state.misc[date]||[])){
    if(m.start && m.end && (m.personIds||[]).includes(personId) && windowsOverlapOnce(prepStart,shiftStart,toMin(m.start),toMin(m.end))) return true;
  }
  const dayAssign=state.assign[date]||{};
  for(const c of state.categories){
    if(c.enforceRest) continue;
    const catAssign=dayAssign[c.id]||{};
    for(const sft of c.shifts){
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapOnce(prepStart,shiftStart,toMin(sft.start),toMin(sft.end))) return true;
    }
  }
  return false;
}

/* the smallest gap this candidate would end up with, immediately before or
   after this shift, against their other enforceRest shifts today — used to
   prefer spacing people out further apart rather than always clustering
   everyone right at the 6-hour minimum */
function minAdjacentGap(personId, date, cat, shift){
  if(!cat.enforceRest) return Infinity;
  const abs=absoluteShiftTimes(cat)[shift.id];
  const existing=personEnforcedShifts(personId, date, {catId:cat.id, shiftId:shift.id});
  let minGap=Infinity;
  existing.forEach(ex=>{
    if(ex.abs_e<=abs.abs_s) minGap=Math.min(minGap, abs.abs_s-ex.abs_e);
    else if(abs.abs_e<=ex.abs_s) minGap=Math.min(minGap, ex.abs_s-abs.abs_e);
  });
  return minGap;
}

/* Fills only EMPTY slots for the given date — never overwrites an existing
   manual assignment. Greedy, shift-by-shift in each category's listed order:
   skip anyone unavailable/already double-booked for that slot, then rank
   candidates by (fewest rest-rule issues, duty priority for that category,
   fewest shifts already given out today, roster rank order). */
function autoAssignDay(date){
  if(!state.assign[date]) state.assign[date]={};
  const assignCount={};
  // Flatten every (category, shift) into one list and sort by REAL chronological
  // order across ALL categories (using the same shared anchor as the rest-rule
  // check) before assigning anything. This matters because a comp-rest window
  // or a rest-rule conflict is only visible to later checks once the earlier
  // shift that created it has actually been assigned — processing category by
  // category (rather than by real time) could assign an evening shift before
  // an earlier same-day shift purely because of category order, silently
  // missing the conflict between them.
  const allSlots=[];
  state.categories.forEach(cat=>{
    if(!state.assign[date][cat.id]) state.assign[date][cat.id]={};
    const abs=absoluteShiftTimes(cat);
    cat.shifts.forEach(s=>{
      if(!state.assign[date][cat.id][s.id]) state.assign[date][cat.id][s.id]=[];
      allSlots.push({cat, s, absStart:abs[s.id].abs_s});
    });
  });
  allSlots.sort((a,b)=>a.absStart-b.absStart);
  allSlots.forEach(({cat,s})=>{
    const arr=state.assign[date][cat.id][s.id];
    const sMin=toMin(s.start), eMin=toMin(s.end)===0?1440:toMin(s.end);
    for(let idx=0; idx<s.count; idx++){
      if(!arr[idx]){
        const rawCandidates = state.personnel.filter(p=>
          !arr.includes(p.id) && !rankExcludedFromCategory(p.rank,cat) &&
          !isPersonUnavailable(p.id, date, sMin, eMin, {catId:cat.id, shiftId:s.id})
        );
        // for rest-enforced (衛哨) categories: only pick someone who won't
        // violate the 6h rule, didn't stand this exact shift yesterday, and
        // whose resulting 補休 window won't collide with something they're
        // already committed to (其他勤務 or a non-rest-enforced category)
        const candidates = cat.enforceRest
          ? rawCandidates.filter(p=>restIssues(p.id,date,cat.id,s).length===0 && !assignedSameShiftYesterday(p.id,date,cat.id,s.id) && !wouldRestWindowConflict(p.id,date,s,{catId:cat.id,shiftId:s.id}) && !prepGapConflict(p.id,date,cat,s))
          : rawCandidates;
        if(candidates.length){
        candidates.sort((a,b)=>{
          // fairness first — whoever has fewer shifts today wins, so the
          // schedule doesn't cram one person into many slots while others
          // sit idle
          const aCnt=assignCount[a.id]||0, bCnt=assignCount[b.id]||0;
          if(aCnt!==bCnt) return aCnt-bCnt;
          const aDuty=dutySortIndex(a.rank,cat,idx,s), bDuty=dutySortIndex(b.rank,cat,idx,s);
          if(aDuty!==bDuty) return aDuty-bDuty;
          // among equally-fair, equally-prioritized candidates, prefer
          // whoever ends up with the bigger breathing room around this
          // shift rather than always landing right at the 6h minimum
          const aGap=minAdjacentGap(a.id,date,cat,s), bGap=minAdjacentGap(b.id,date,cat,s);
          if(aGap!==bGap) return bGap-aGap;
          return rankIndex(a.rank)-rankIndex(b.rank);
        });
        const chosen=candidates[0];
        arr[idx]=chosen.id;
        assignCount[chosen.id]=(assignCount[chosen.id]||0)+1;
        }
      } else {
        assignCount[arr[idx]]=(assignCount[arr[idx]]||0)+1;
      }
    }
  });
  saveState();
}

function openExportModal(){
  const dataStr = JSON.stringify(state, null, 2);
  const fileName = 'duty-roster-backup-'+todayStr()+'.json';
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;';
  modal.innerHTML=`
    <div style="background:var(--panel);width:100%;max-height:88vh;overflow:auto;border-radius:12px 12px 0 0;padding:14px;">
      <div class="section-title"><h2 style="margin:0">匯出備份</h2><button class="ghost small" id="closeExport">關閉</button></div>
      <div class="row wrap" style="margin-bottom:8px">
        <button class="primary grow" id="shareExportBtn">📤 分享／儲存檔案</button>
        <button class="ghost grow" id="copyExportBtn">📋 複製全部文字</button>
      </div>
      <div class="hint">若上面按鈕在你的瀏覽器沒有反應，可直接點下面文字方塊全選、複製，貼到備忘錄或傳給自己保存。</div>
      <textarea id="exportText" readonly style="min-height:220px;font-family:monospace;font-size:11px;margin-top:8px;white-space:pre">${esc(dataStr)}</textarea>
    </div>
  `;
  document.body.appendChild(modal);
  document.getElementById('closeExport').onclick=()=>modal.remove();
  const ta=document.getElementById('exportText');
  document.getElementById('shareExportBtn').onclick=async()=>{
    try{
      if(navigator.canShare && window.File){
        const file=new File([dataStr], fileName, {type:'application/json'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:fileName});
          return;
        }
      }
      if(navigator.share){ await navigator.share({title:fileName, text:dataStr}); return; }
    }catch(err){ /* cancelled or unsupported — fall through to download */ }
    try{
      const blob=new Blob([dataStr],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),3000);
    }catch(err){
      showAlert('自動下載在此瀏覽器不支援，請改用「複製全部文字」。');
    }
  };
  document.getElementById('copyExportBtn').onclick=async()=>{
    const btn=document.getElementById('copyExportBtn');
    try{
      await navigator.clipboard.writeText(dataStr);
      btn.textContent='已複製 ✓';
    }catch(err){
      try{ ta.focus(); ta.select(); document.execCommand('copy'); btn.textContent='已複製 ✓'; }
      catch(err2){ showAlert('複製失敗，請手動選取文字方塊內容複製。'); }
    }
  };
}

function renderPeopleGroups(groups, filterFn){

document.getElementById('importFile').addEventListener('change', (e)=>{
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(data.personnel && data.categories){ state=data; saveState(); render(); showAlert('匯入完成'); }
      else showAlert('檔案格式不正確');

function personOptions(selected, groupFilter){
  if(!state.personnel.length) return `<option value="">（尚無人員）</option>`;
  let sorted=[...state.personnel].sort((a,b)=> groupIndex(a.group)-groupIndex(b.group) || rankIndex(a.rank)-rankIndex(b.rank));
  if(groupFilter) sorted = groupFilter==='__none'? sorted.filter(p=>!p.group) : sorted.filter(p=>p.group===groupFilter);
  if(!sorted.length) return `<option value="">（此排組無人員）</option>`;
  return sorted.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}（${p.group||'未分組'}·${p.rank}${p.license? '·🚗'+esc(p.license):''}${personLongTerm(p).mode!=='off'?'·🚫長期':''}）</option>`).join('');
}
function fmtDate(d){ return d; }
const WEEKDAY_CH=['日','一','二','三','四','五','六'];
function fmtDateShort(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function weekdayLabel(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  return WEEKDAY_CH[d.getDay()];
}
/* the roster for a given "date" actually spans from 22:00 the PREVIOUS
   calendar day through 22:00 of the labeled date itself (e.g. picking
   "9/8" covers 9/7 22:00 → 9/8 22:00) — so the exported text shows both
   boundary dates, matching how the unit's own paper roster is headed. */
function dutyDateRangeLabel(date){
  const prev=prevDateStr(date);
  return `${fmtDateShort(prev)}（${weekdayLabel(prev)}）-${fmtDateShort(date)}（${weekdayLabel(date)}）`;
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Custom alert/confirm/prompt — some preview/webview environments block the
   native window.alert/confirm/prompt dialogs (they throw instead of showing
   anything), so every interactive confirmation in this app uses these
   in-page modals instead. */
function showAlert(message){
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.innerHTML=`
    <div style="background:var(--panel);max-width:320px;width:100%;border-radius:10px;padding:16px;border:1px solid var(--line);">
      <div style="margin-bottom:14px;font-size:14px;line-height:1.5;color:var(--text)">${esc(message)}</div>
      <button class="primary" id="alertOk" style="width:100%">確定</button>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('alertOk').onclick=()=>modal.remove();
}
function showConfirm(message, onConfirm){
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.innerHTML=`
    <div style="background:var(--panel);max-width:320px;width:100%;border-radius:10px;padding:16px;border:1px solid var(--line);">
      <div style="margin-bottom:14px;font-size:14px;line-height:1.5;color:var(--text)">${esc(message)}</div>
      <div class="row wrap">
        <button class="ghost grow" id="confirmCancel">取消</button>
        <button class="primary grow" id="confirmOk">確定</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('confirmCancel').onclick=()=>modal.remove();
  document.getElementById('confirmOk').onclick=()=>{ modal.remove(); onConfirm(); };
}
function showPrompt(message, defaultValue, onSubmit){
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.innerHTML=`
    <div style="background:var(--panel);max-width:320px;width:100%;border-radius:10px;padding:16px;border:1px solid var(--line);">
      <div style="margin-bottom:8px;font-size:14px;line-height:1.5;color:var(--text)">${esc(message)}</div>
      <input type="text" id="promptInput" value="${esc(defaultValue||'')}" style="margin-bottom:12px">
      <div class="row wrap">
        <button class="ghost grow" id="promptCancel">取消</button>
        <button class="primary grow" id="promptOk">確定</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  const input=document.getElementById('promptInput');
  input.focus();
  document.getElementById('promptCancel').onclick=()=>modal.remove();
  document.getElementById('promptOk').onclick=()=>{
    const val=input.value.trim();
    modal.remove();
    if(val) onSubmit(val);
  };
}

/* build a plain-text roster in the style of a typical unit duty-roster post
   (🌟衛哨勤務🌟 header, 🔶 sections for post-standing duties, ———勤務——— for
   the rest) so it can be pasted straight into a chat app. */
function generateScheduleText(date){
  const lines=[];
  lines.push('🌟衛哨勤務🌟');
  lines.push(dutyDateRangeLabel(date));
  orderedCategories().filter(c=>c.enforceRest).forEach(cat=>{
    lines.push('🔶'+cat.name);
    const dayAssign=(state.assign[date]||{})[cat.id]||{};
    cat.shifts.forEach(s=>{
      const assigned=dayAssign[s.id]||[];
      const names=Array.from({length:s.count}).map((_,i)=>assigned[i]?personName(assigned[i]):'');
      const timeLabel = s.label? s.label : (s.start+'-'+s.end);
      lines.push(`${timeLabel} ${names.filter(Boolean).join('、')||'（未排）'}`);
    });
  });
  lines.push('———勤務———');
  orderedCategories().filter(c=>!c.enforceRest).forEach(cat=>{
    lines.push('♦️'+cat.name+'：');
    const dayAssign=(state.assign[date]||{})[cat.id]||{};
    cat.shifts.forEach(s=>{
      const assigned=dayAssign[s.id]||[];
      const names=Array.from({length:s.count}).map((_,i)=>assigned[i]?personName(assigned[i]):'').filter(Boolean);
      const label=s.label||(s.start+'-'+s.end);
      lines.push(`${label}：${names.join('、')}`);
    });
  });
  (state.misc[date]||[]).forEach(m=>{
    const people=m.personIds.map(pid=>personName(pid)).join('、');
    const timePart = m.start&&m.end? `（${m.start}-${m.end}）`:'';
    lines.push(`♦️${m.role}${timePart}：${people}`);
  });
  return lines.join('\n');
}

/* generic share/copy modal for any plain-text output (reused by both the
   JSON backup export and the text-roster export) */
function openTextShareModal(title, text){
  const fileName = title.replace(/\s+/g,'')+'-'+todayStr()+'.txt';
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;';
  modal.innerHTML=`
    <div style="background:var(--panel);width:100%;max-height:88vh;overflow:auto;border-radius:12px 12px 0 0;padding:14px;">
      <div class="section-title"><h2 style="margin:0">${esc(title)}</h2><button class="ghost small" id="closeTextShare">關閉</button></div>
      <div class="row wrap" style="margin-bottom:8px">
        <button class="primary grow" id="shareTextBtn">📤 分享</button>
        <button class="ghost grow" id="copyTextBtn">📋 複製</button>
      </div>
      <div class="hint">複製後可直接貼到 LINE／訊息傳給大家。</div>
      <textarea id="shareTextArea" readonly style="min-height:280px;font-size:13px;margin-top:8px;white-space:pre">${esc(text)}</textarea>
    </div>
  `;
  document.body.appendChild(modal);
  document.getElementById('closeTextShare').onclick=()=>modal.remove();
  const ta=document.getElementById('shareTextArea');
  document.getElementById('shareTextBtn').onclick=async()=>{
    try{
      if(navigator.share){ await navigator.share({title, text}); return; }
    }catch(err){ /* cancelled or unsupported */ }
    try{ ta.focus(); ta.select(); document.execCommand('copy'); document.getElementById('copyTextBtn').textContent='已複製 ✓'; }
    catch(err){ showAlert('分享不支援，請改用「複製」。'); }
  };
  document.getElementById('copyTextBtn').onclick=async()=>{
    const btn=document.getElementById('copyTextBtn');
    try{ await navigator.clipboard.writeText(text); btn.textContent='已複製 ✓'; }
    catch(err){
      try{ ta.focus(); ta.select(); document.execCommand('copy'); btn.textContent='已複製 ✓'; }
      catch(err2){ showAlert('複製失敗，請手動選取文字方塊內容複製。'); }
    }
  };
}

      const timeLabel = s.label? s.label+'（'+s.start+'-'+s.end+'）' : (s.start+'-'+s.end);
      return `<div class="shift-row" data-shift="${s.id}">
        <div class="shift-head"><span class="shift-time">${esc(timeLabel)}</span><span class="muted">需 ${s.count} 人${s.restUntil? '・補休至'+s.restUntil:''}</span></div>
        ${Array.from({length:s.count}).map((_,idx)=>{
          const pid = assigned[idx]||'';

          return `<div class="slot-select">
            ${cat.needsNCO? `<div class="muted" style="margin-bottom:2px">${(idx===0 && s.label!=='整天')? '帶隊(士官)':'第'+(idx+1)+'人'}</div>`:''}
            <select data-assign-cat="${cat.id}" data-assign-shift="${s.id}" data-assign-idx="${idx}">

            ${pid && cat.enforceRest && prepGapConflict(pid,currentDate,cat,s)? `<div class="badge-issue">⚠️ ${esc(personName(pid))}：這班開始前不到30分鐘還在忙其他勤務，沒時間準備</div>`:''}

function assignableOptions(cat, shift, selectedId, slotIdx){
  const sorted=[...state.personnel].sort((a,b)=>dutySortIndex(a.rank,cat,slotIdx,shift)-dutySortIndex(b.rank,cat,slotIdx,shift) || groupIndex(a.group)-groupIndex(b.group));
  return sorted.map(p=>{
    const s=toMin(shift.start), e0=toMin(shift.end);
    const excluded = rankExcludedFromCategory(p.rank, cat);
    const unavailable = excluded || isPersonUnavailable(p.id, currentDate, s, e0===0?1440:e0, {catId:cat.id, shiftId:shift.id});
    let flag='';
    if(excluded) flag=' 🚫階級不可排此類別';
    else if(unavailable) flag=' 🚫不可排';
    return `<option value="${p.id}" ${p.id===selectedId?'selected':''}>${esc(p.name)}（${p.group||'未分組'}·${p.rank}${p.license? '·🚗'+esc(p.license):''}）${flag}</option>`;
  }).join('');
}

function wireCategoryEvents(){
  app.querySelectorAll('[data-assign-cat]').forEach(sel=>{
    sel.onchange=()=>{
      const catId=sel.dataset.assignCat, shiftId=sel.dataset.assignShift, idx=Number(sel.dataset.assignIdx);
      if(!state.assign[currentDate]) state.assign[currentDate]={};
      if(!state.assign[currentDate][catId]) state.assign[currentDate][catId]={};
      if(!state.assign[currentDate][catId][shiftId]) state.assign[currentDate][catId][shiftId]=[];
      state.assign[currentDate][catId][shiftId][idx]=sel.value||undefined;
      // compact array (remove trailing undefined holes issues) - keep as is, undefined ok
      saveState(); render();
    };
  });
  app.querySelectorAll('[data-clear-cat]').forEach(b=>{
    b.onclick=()=>{
      const cat=state.categories.find(c=>c.id===b.dataset.clearCat);
      showConfirm(`清空「${cat?cat.name:''}」${fmtDate(currentDate)}已排的班表？（類別與班別設定不會被刪除，只清空這天指派的人）`, ()=>{
        if(state.assign[currentDate]) delete state.assign[currentDate][b.dataset.clearCat];
        saveState(); render();
      });
    };
  });
  app.querySelectorAll('[data-edit-cat]').forEach(b=>{
    b.onclick=()=>openCategoryEditor(b.dataset.editCat);
  });
}

function openCategoryEditor(catId){
  const cat = state.categories.find(c=>c.id===catId);
  const opts = timeOptions();
  const modal = document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;';
  modal.innerHTML = `
    <div style="background:var(--panel);width:100%;max-height:88vh;overflow:auto;border-radius:12px 12px 0 0;padding:14px;">
      <div class="section-title"><h2 style="margin:0">編輯：${esc(cat.name)}</h2><button class="ghost small" id="closeModal">關閉</button></div>
      <label>類別名稱</label><input type="text" id="catName" value="${esc(cat.name)}" style="margin-bottom:8px">
      <div class="row wrap" style="margin-bottom:8px">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="catRest" style="width:auto" ${cat.enforceRest?'checked':''}> 套用6小時規則</label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="catLow" style="width:auto" ${cat.preferLowRank?'checked':''}> 建議低階</label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="catNCO" style="width:auto" ${cat.needsNCO?'checked':''}> 需士官帶隊</label>
      </div>
      <div class="row wrap" style="margin-bottom:8px">
        <div class="grow"><label>不可排階級（硬性，如：訓練役不可站安全士官）</label>
          <select id="catExclude" multiple size="4">${RANK_DEFS.map(r=>`<option value="${r.rank}" ${(cat.excludeRanks||[]).includes(r.rank)?'selected':''}>${r.rank}</option>`).join('')}</select>
        </div>
        <div class="grow"><label>盡量避免階級（軟性，真的沒人才會排）</label>
          <select id="catAvoid" multiple size="4">${RANK_DEFS.map(r=>`<option value="${r.rank}" ${(cat.avoidRanks||[]).includes(r.rank)?'selected':''}>${r.rank}</option>`).join('')}</select>
        </div>
      </div>
      <div class="divider"></div>
      <h3>班別時段</h3>
      <div id="shiftEditList">${cat.shifts.map((s,i)=>shiftEditRow(s,i)).join('')}</div>
      <button class="ghost small" id="addShift">＋新增班別</button>
      <div class="divider"></div>
      <button class="primary" id="saveCat" style="width:100%">儲存</button>
    </div>
  `;
  document.body.appendChild(modal);
  function shiftEditRowRerender(){
    document.getElementById('shiftEditList').innerHTML = cat.shifts.map((s,i)=>shiftEditRow(s,i)).join('');
    wireShiftRows();
  }
  function wireShiftRows(){
    document.querySelectorAll('[data-shift-del]').forEach(b=>{
      b.onclick=()=>{ cat.shifts.splice(Number(b.dataset.shiftDel),1); shiftEditRowRerender(); };
    });
  }
  wireShiftRows();
  document.getElementById('addShift').onclick=()=>{
    cat.shifts.push(sh('08:00','12:00')); shiftEditRowRerender();
  };
  document.getElementById('closeModal').onclick=()=>modal.remove();
  document.getElementById('saveCat').onclick=()=>{
    cat.name=document.getElementById('catName').value.trim()||cat.name;
    cat.enforceRest=document.getElementById('catRest').checked;
    cat.preferLowRank=document.getElementById('catLow').checked;
    cat.needsNCO=document.getElementById('catNCO').checked;
    cat.excludeRanks=[...document.getElementById('catExclude').selectedOptions].map(o=>o.value);
    cat.avoidRanks=[...document.getElementById('catAvoid').selectedOptions].map(o=>o.value);
    document.querySelectorAll('.shiftEditItem').forEach((row,i)=>{
      cat.shifts[i].start=row.querySelector('.se-start').value;
      cat.shifts[i].end=row.querySelector('.se-end').value;
      cat.shifts[i].count=Math.max(1, Number(row.querySelector('.se-count').value)||1);
      cat.shifts[i].label=row.querySelector('.se-label').value.trim();
      cat.shifts[i].restUntil=row.querySelector('.se-rest').value;
    });
    saveState(); modal.remove(); render();
  };
  function shiftEditRow(s,i){
    return `<div class="shift-row shiftEditItem" data-i="${i}">
      <div class="row wrap">
        <div class="grow"><label>標籤(選填)</label><input type="text" class="se-label" value="${esc(s.label||'')}" placeholder="例：早"></div>
        <div style="width:64px"><label>人數</label><input type="text" class="se-count" value="${s.count}"></div>
      </div>
      <div class="row wrap" style="margin-top:6px">
        <div class="grow"><label>開始</label><select class="se-start">${opts.map(t=>`<option ${t===s.start?'selected':''}>${t}</option>`).join('')}</select></div>
        <div class="grow"><label>結束</label><select class="se-end">${opts.map(t=>`<option ${t===s.end?'selected':''}>${t}</option>`).join('')}</select></div>
        <button class="ghost small danger" data-shift-del="${i}">刪除</button>
      </div>
      <div class="row wrap" style="margin-top:6px">
        <div class="grow"><label>補休至(選填，下班後自動排除其他勤務至此時間)</label>
          <select class="se-rest">
            <option value="" ${!s.restUntil?'selected':''}>（無補休）</option>
            ${opts.map(t=>`<option ${t===s.restUntil?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>`;
  }
}

function runDailyCheck(){
  const out=[];
  // rest issues across enforceRest categories, per person (dedupe)
  const seen=new Set();
  state.categories.filter(c=>c.enforceRest).forEach(cat=>{
    const dayAssign=(state.assign[currentDate]||{})[cat.id]||{};
    cat.shifts.forEach(s=>{
      (dayAssign[s.id]||[]).forEach(pid=>{
        if(!pid) return;
        const issues=restIssues(pid,currentDate,cat.id,s);
        issues.forEach(i=>{
          const key=pid+'|'+i; if(seen.has(key)) return; seen.add(key);
          out.push(`⚠️ ${personName(pid)}（${cat.name} ${s.label||s.start+'-'+s.end}）：${i}`);
        });
        if(assignedSameShiftYesterday(pid,currentDate,cat.id,s.id)){
          out.push(`⚠️ ${personName(pid)}（${cat.name} ${s.label||s.start+'-'+s.end}）：昨天也值這個時段，連續兩天同時段`);
        }
        if(wouldRestWindowConflict(pid,currentDate,s,{catId:cat.id,shiftId:s.id})){
          out.push(`⚠️ ${personName(pid)}（${cat.name} ${s.label||s.start+'-'+s.end}）：下班補休時段跟其他已排的勤務衝突`);
        }
        if(prepGapConflict(pid,currentDate,cat,s)){
          out.push(`⚠️ ${personName(pid)}（${cat.name} ${s.label||s.start+'-'+s.end}）：開始前不到30分鐘還在忙其他勤務，沒時間準備`);
        }
      });
    });
  });
  // meal NCO check
  const mealCat = state.categories.find(c=>c.needsNCO);
  if(mealCat){
    const dayAssign=(state.assign[currentDate]||{})[mealCat.id]||{};
    const allPeople = mealCat.shifts.flatMap(s=>dayAssign[s.id]||[]).filter(Boolean);
    const hasNCO = allPeople.some(pid=>['士官','軍官'].includes(rankCategory(personRank(pid))));
    if(allPeople.length && !hasNCO) out.push(`⚠️ ${mealCat.name}：當日尚無「士官」以上人員帶隊`);
  }
  // low rank preference summary
  state.categories.filter(c=>c.preferLowRank).forEach(cat=>{
    const dayAssign=(state.assign[currentDate]||{})[cat.id]||{};
    cat.shifts.forEach(s=>{
      (dayAssign[s.id]||[]).forEach(pid=>{
        if(pid && rankCategory(personRank(pid))==='軍官') out.push(`⚠️ ${cat.name} ${s.label||s.start+'-'+s.end}：${personName(pid)} 為軍官，建議改排較低階`);
      });
    });
  });
  // avoid officers in meal duty
  state.categories.filter(c=>c.needsNCO).forEach(cat=>{
    const dayAssign=(state.assign[currentDate]||{})[cat.id]||{};
    cat.shifts.forEach(s=>{
      (dayAssign[s.id]||[]).forEach(pid=>{
        if(pid && rankCategory(personRank(pid))==='軍官') out.push(`⚠️ ${cat.name} ${s.label||s.start+'-'+s.end}：${personName(pid)} 為軍官，盡量避免安排軍官擔任打飯班`);
      });
    });
  });
  // general conflicts: assigned during leave / long-term / comp-rest / double-booked elsewhere
  state.categories.forEach(cat=>{
    const dayAssign=(state.assign[currentDate]||{})[cat.id]||{};
    cat.shifts.forEach(s=>{
      (dayAssign[s.id]||[]).forEach(pid=>{
        if(!pid) return;
        const busy = isPersonUnavailable(pid, currentDate, toMin(s.start), toMin(s.end)===0?1440:toMin(s.end), {catId:cat.id, shiftId:s.id});
        if(busy){
          const key='busy|'+pid+'|'+cat.id+'|'+s.id; if(seen.has(key)) return; seen.add(key);
          out.push(`⚠️ ${personName(pid)}（${cat.name} ${s.label||s.start+'-'+s.end}）：此時段該員請假/長期事故/補休中或已排其他勤務`);
        }
      });
    });
  });
  document.getElementById('dailyCheckOut').innerHTML = out.length?
    out.map(o=>`<div class="warn" style="margin-top:6px">${esc(o)}</div>`).join('') :
    `<div class="ok" style="margin-top:6px">✅ 目前排班未發現違規</div>`;
}

/* ---- MISC TAB (簡易勤務，如採買/技工/查哨等免時段的項目) ---- */
let miscSelectedRoles=null; // set by clicking a preset with structured roles (車長/駕駛 etc)
function openMiscPresetModal(){
  const opts=timeOptions();
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;';
  modal.innerHTML=`
    <div style="background:var(--panel);width:100%;max-height:88vh;overflow:auto;border-radius:12px 12px 0 0;padding:14px;">
      <div class="section-title"><h2 style="margin:0">新增常用項目</h2><button class="ghost small" id="closeMiscPresetModal">關閉</button></div>
      <label>名稱</label><input type="text" id="mpName" placeholder="例：查哨" style="margin-bottom:8px">
      <div class="row wrap" style="margin-bottom:8px">
        <div class="grow"><label>開始</label><select id="mpStart">${opts.map(t=>`<option ${t==='06:00'?'selected':''}>${t}</option>`).join('')}</select></div>
        <div class="grow"><label>結束</label><select id="mpEnd">${opts.map(t=>`<option ${t==='07:00'?'selected':''}>${t}</option>`).join('')}</select></div>
      </div>
      <button class="primary" id="saveMiscPreset" style="width:100%">新增</button>
    </div>
  `;
  document.body.appendChild(modal);
  document.getElementById('closeMiscPresetModal').onclick=()=>modal.remove();
  document.getElementById('saveMiscPreset').onclick=()=>{
    const role=document.getElementById('mpName').value.trim();
    if(!role){ showAlert('請輸入項目名稱'); return; }
    const start=document.getElementById('mpStart').value, end=document.getElementById('mpEnd').value;
    state.miscCustomPresets.push({role,start,end});
    saveState(); modal.remove(); render();
  };
}
function renderMisc(){
  const list = state.misc[currentDate]||[];
  app.innerHTML = `
    <div class="card">
      <label>日期</label>
      <input type="date" id="dateSel" value="${currentDate}">
    </div>
    <div class="card">
      <h2>常用項目（點一下自動帶入名稱、時間與角色）</h2>
      <div class="row wrap">
        ${MISC_PRESETS.map((mp,i)=>`<button class="pill-btn" data-preset="b${i}" style="cursor:pointer">${esc(mp.role)} ${mp.start}-${mp.end}</button>`).join('')}
        ${state.miscCustomPresets.map((mp,i)=>`<button class="pill-btn" data-preset="c${i}" style="cursor:pointer">${esc(mp.role)} ${mp.start}-${mp.end} <span data-del-preset="${i}" style="color:var(--danger);margin-left:3px">✕</span></button>`).join('')}
      </div>
      <div class="divider"></div>
      <button class="ghost small" id="openAddPresetModal">＋新增常用項目</button>
    </div>
    <div class="card">
      <h2>新增項目</h2>
      <div class="row wrap" style="margin-bottom:8px">
        <div class="grow"><label>項目名稱</label><input type="text" id="mRole" placeholder="例：技工 / 採買 / 查哨"></div>
      </div>
      <div class="row wrap" style="margin-bottom:8px">
        <div class="grow"><label>開始(選填)</label><select id="mStart"><option value="">（不指定）</option>${timeOptions().map(t=>`<option>${t}</option>`).join('')}</select></div>
        <div class="grow"><label>結束(選填)</label><select id="mEnd"><option value="">（不指定）</option>${timeOptions().map(t=>`<option>${t}</option>`).join('')}</select></div>
      </div>
      ${miscSelectedRoles? `
        <div class="hint" style="margin-bottom:6px">此項目需分別指定：${miscSelectedRoles.join('、')}</div>
        ${miscSelectedRoles.map((r,i)=>`
          <div class="row wrap" style="margin-bottom:8px">
            <div class="grow"><label>${esc(r)}</label>
              <select id="mRoleSel${i}"><option value="">（未指派）</option>${personOptions()}</select>
            </div>
          </div>`).join('')}
        <button class="ghost small" id="mFreeform" style="margin-bottom:8px">改用自由複選人員</button>
      ` : `
        <div class="row wrap" style="margin-bottom:8px">
          <div class="grow"><label>人員（可複選，若已填時間會標示 🚫不可排）</label>
            <select id="mPeople" multiple size="5">${personOptions()}</select>
          </div>
        </div>
      `}
      <button class="primary" id="mAdd" style="width:100%">新增</button>
    </div>
    <div class="card">
      <h2>${fmtDate(currentDate)} 其他勤務</h2>
      ${list.length===0? `<div class="empty">尚未新增</div>` : list.map(m=>{
        const issues = validateMiscEntry(m);
        const peopleLabel = m.roles
          ? m.roles.map((r,i)=>`${r}：${m.personIds[i]? esc(personName(m.personIds[i])):'（未指派）'}`).join('　')
          : (m.personIds.map(pid=>esc(personName(pid))).join('、')||'（未指派）');
        return `
        <div class="list-item" style="flex-direction:column;align-items:stretch">
          <div class="row">
            <span class="grow"><b>${esc(m.role)}</b>${m.start&&m.end? ` (${m.start}-${m.end})`:''}：${peopleLabel}</span>
            <button class="ghost small danger" data-del-misc="${m.id}">刪除</button>
          </div>
          ${issues.map(i=>`<div class="badge-issue">⚠️ ${esc(i)}</div>`).join('')}
        </div>`;
      }).join('')}
    </div>
    <div class="hint">此區用於不需6小時規則的項目，如：技工、採買、愛心便當、消防車、救護車、話務、督伙、開關門、健身房簽到等，依你們單位每日需要自行新增，也可以直接點上方常用項目快速帶入。採買/愛心便當/消防車/救護車需分別指定車長與駕駛：駕駛至少要有小型車駕照，車長需士官以上且階級高於駕駛；話務需至少小型車駕照。</div>
  `;
  document.getElementById('dateSel').onchange=(e)=>{ currentDate=e.target.value; render(); };
  function refreshPeopleFlags(){
    const start=document.getElementById('mStart').value, end=document.getElementById('mEnd').value;
    if(!start||!end) return;
    const s=toMin(start), e0=toMin(end);
    const selects = miscSelectedRoles
      ? miscSelectedRoles.map((_,i)=>document.getElementById('mRoleSel'+i))
      : [document.getElementById('mPeople')];
    selects.forEach(sel=>{
      [...sel.options].forEach(opt=>{
        const busy = opt.value && isPersonUnavailable(opt.value, currentDate, s, e0===0?1440:e0);
        opt.style.color = busy? 'var(--danger)':'';
        const base = opt.textContent.replace(/\s*🚫不可排$/,'');
        opt.textContent = base + (busy? ' 🚫不可排':'');
      });
    });
  }
  document.getElementById('mStart').onchange=refreshPeopleFlags;
  document.getElementById('mEnd').onchange=refreshPeopleFlags;
  refreshPeopleFlags();
  if(document.getElementById('mFreeform')){
    document.getElementById('mFreeform').onclick=()=>{ miscSelectedRoles=null; render(); };
  }
  app.querySelectorAll('[data-preset]').forEach(b=>{
    b.onclick=(ev)=>{
      if(ev.target.closest('[data-del-preset]')) return; // let the delete X handle itself
      const key=b.dataset.preset;
      const mp = key.startsWith('b')? MISC_PRESETS[Number(key.slice(1))] : state.miscCustomPresets[Number(key.slice(1))];
      miscSelectedRoles = mp.roles||null;
      render();
      document.getElementById('mRole').value=mp.role;
      document.getElementById('mStart').value=mp.start;
      document.getElementById('mEnd').value=mp.end;
      refreshPeopleFlags();
    };
  });
  app.querySelectorAll('[data-del-preset]').forEach(x=>{
    x.onclick=(ev)=>{
      ev.stopPropagation();
      state.miscCustomPresets.splice(Number(x.dataset.delPreset),1);
      saveState(); render();
    };
  });
  document.getElementById('openAddPresetModal').onclick=()=>openMiscPresetModal();
  document.getElementById('mAdd').onclick=()=>{
    const role=document.getElementById('mRole').value.trim();
    if(!role) return;
    const start=document.getElementById('mStart').value, end=document.getElementById('mEnd').value;
    if(!state.misc[currentDate]) state.misc[currentDate]=[];
    if(miscSelectedRoles){
      const personIds=miscSelectedRoles.map((_,i)=>document.getElementById('mRoleSel'+i).value);
      state.misc[currentDate].push({id:uid(),role,start,end,roles:miscSelectedRoles,personIds});
    } else {
      const personIds=[...document.getElementById('mPeople').selectedOptions].map(o=>o.value);
      state.misc[currentDate].push({id:uid(),role,start,end,personIds});
    }
    miscSelectedRoles=null;
    saveState(); render();
  };
  app.querySelectorAll('[data-del-misc]').forEach(b=>{
    b.onclick=()=>{
      state.misc[currentDate]=state.misc[currentDate].filter(m=>m.id!==b.dataset.delMisc);
      saveState(); render();
    };
  });
}

/* ---------------- init ---------------- */
render();
</script>
</body>
