        chiefSel.innerHTML = `<option value="">（未指派）</option>` + personOptionsPrioritized(curVal, eligibleFn);
        refreshPeopleFlags();
      });
    }
  }
  app.querySelectorAll('[data-preset]').forEach(b=>{
    b.onclick=(ev)=>{
      if(ev.target.closest('[data-edit-preset]')) return; // let the edit ✎ handle itself
      const mp = state.miscPresets[Number(b.dataset.preset)];
      const times = presetTimes(mp);
      if(times.length>1){
        // multi-time preset (e.g. 查哨 at five different times) — create one
        // entry per time slot directly instead of trying to populate a
        // single start/end form that couldn't represent all of them
        showConfirm(`要一次建立「${mp.role}」的全部 ${times.length} 個時段嗎？（${times.map(t=>t.start+'-'+t.end).join('、')}）`, ()=>{
          if(!state.misc[currentDate]) state.misc[currentDate]=[];
          times.forEach(t=>{
            const already = state.misc[currentDate].some(m=>m.role===mp.role && m.start===t.start && m.end===t.end);
            if(!already){
              state.misc[currentDate].push({id:uid(), role:mp.role, start:t.start, end:t.end, restUntil:mp.restUntil||'', roles:mp.roles?[...mp.roles]:undefined, personIds: mp.roles? mp.roles.map(()=>undefined):[]});
            }
          });
          collapseState['miscToday']=true; // auto-expand so the newly created entries are visible
          saveState(); render();
        });
        return;
      }
      collapseState['miscAddForm']=true; // auto-expand so the populated fields are visible
      miscSelectedRoles = mp.roles||null;
      miscSelectedPresetRole = mp.role;
      miscSelectedRestUntil = mp.restUntil||'';
      render();
      document.getElementById('mRole').value=mp.role;
      document.getElementById('mStart').value=times[0].start;
      document.getElementById('mEnd').value=times[0].end;
      refreshPeopleFlags();
      updateNextDayHint();
    };
  });
  app.querySelectorAll('[data-edit-preset]').forEach(x=>{
    x.onclick=(ev)=>{
      ev.stopPropagation();
      openMiscPresetModal(Number(x.dataset.editPreset));
    };
  });
  document.getElementById('openAddPresetModal').onclick=()=>openMiscPresetModal();
  document.getElementById('mAdd').onclick=()=>{
    const role=document.getElementById('mRole').value.trim();
    if(!role) return;
    const start=document.getElementById('mStart').value, end=document.getElementById('mEnd').value;
    if(!state.misc[currentDate]) state.misc[currentDate]=[];
    const existing = miscEditingId? state.misc[currentDate].find(m=>m.id===miscEditingId) : null;
    if(miscSelectedRoles){
      const personIds=miscSelectedRoles.map((_,i)=>document.getElementById('mRoleSel'+i).value);
      if(existing){
        existing.role=role; existing.start=start; existing.end=end; existing.restUntil=miscSelectedRestUntil;
        existing.roles=miscSelectedRoles; existing.personIds=personIds;
      } else {
        state.misc[currentDate].push({id:uid(),role,start,end,restUntil:miscSelectedRestUntil,roles:miscSelectedRoles,personIds});
      }
    } else {
      const personIds=[...miscFreeformCheckedIds];
      if(existing){
        existing.role=role; existing.start=start; existing.end=end; existing.restUntil=miscSelectedRestUntil;
        existing.personIds=personIds; delete existing.roles;
      } else {
        state.misc[currentDate].push({id:uid(),role,start,end,restUntil:miscSelectedRestUntil,personIds});
      }
      miscFreeformCheckedIds.clear();

    miscSelectedRoles=null;
    miscSelectedPresetRole=null;
    miscSelectedRestUntil='';
    miscEditingId=null;
    saveState(); render();
  };
  if(document.getElementById('mCancelEdit')){
    document.getElementById('mCancelEdit').onclick=()=>{
      miscEditingId=null;
      miscSelectedRoles=null;
      miscSelectedPresetRole=null;
      miscSelectedRestUntil='';
      miscFreeformCheckedIds.clear();
      render();
    };
  }
  app.querySelectorAll('[data-edit-misc]').forEach(b=>{
    b.onclick=()=>{
      const m = state.misc[currentDate].find(mm=>mm.id===b.dataset.editMisc);
      if(!m) return;
      miscEditingId = m.id;
      collapseState['miscAddForm']=true;
      if(m.roles){
        miscSelectedRoles=[...m.roles];
        miscSelectedPresetRole=m.role;
        miscSelectedRestUntil=m.restUntil||'';
      } else {
        miscSelectedRoles=null;
        miscSelectedPresetRole=null;
        miscSelectedRestUntil=m.restUntil||'';
        miscFreeformCheckedIds=new Set(m.personIds||[]);
      }
      render();
      document.getElementById('mRole').value=m.role;
      document.getElementById('mStart').value=m.start||'';
      document.getElementById('mEnd').value=m.end||'';
      if(m.roles){
        m.roles.forEach((r,i)=>{
          const sel=document.getElementById('mRoleSel'+i);
          if(sel) sel.value = m.personIds[i]||'';
        });
      }
      refreshPeopleFlags();
      updateNextDayHint();
      window.scrollTo(0,0);
    };
  });
  app.querySelectorAll('[data-del-misc]').forEach(b=>{
    b.onclick=()=>{
      state.misc[currentDate]=state.misc[currentDate].filter(m=>m.id!==b.dataset.delMisc);
      saveState(); render();
    };
  });
}

/* ---------------- init ---------------- */
render();
</script>
</body>
</html>
