/* two levels of "start this date over", both scoped to currentDate only:
   level 1 keeps the day's structural setup (per-day 班別 overrides, 其他
   勤務 item definitions) and just clears who's assigned / what's
   registered; level 2 wipes the date out of every per-day state object
   entirely, so it falls back to looking exactly like a date that was
   never touched. */
/* ---------------- 預排 UI ---------------- */
let preplanMonth = null; // 'YYYY-MM' currently shown in the calendar
/* runs every regular (date-keyed) preplan type's import across a date
   range, plus 留守 (block-anchor based) and 休假暨事故大表 (its own importer) —
   shared by both the real "全部預排匯入" and the dry-run "全部預排檢查",
   which calls this then throws the result away instead of keeping it. */
function runAllPreplanImports(fromDate, toDate){
  const ym = monthOf(fromDate);
  const dates = dateRangeList(fromDate, toDate);
  let touched=0;
  PREPLAN_TYPES.forEach(type=>{
    if(type.mode==='leaveTable'){
      const r=importLeaveTable(ym);
      touched += r.count;
      return;
    }
    if(type.key==='standby'){
      Object.keys(state.preplan.standby||{}).filter(a=>a>=fromDate && a<=toDate).forEach(anchor=>{
        if(importPreplanForDate('standby', anchor)) touched++;
      });
      return;
    }
    dates.forEach(d=>{ if(importPreplanForDate(type.key, d)) touched++; });
  });
  return touched;
}
/* every conflict (someone double-booked, or booked while on leave/事故)
   across every 其他勤務 entry in the range — used after both a real import
   and a dry-run check, since either way you want to see what needs fixing.
   Returned structured (not pre-joined into strings) so callers can group
   by date instead of dumping one long flat list when there's a lot. */
function collectMiscConflicts(fromDate, toDate){
  const clashes=[];
  dateRangeList(fromDate, toDate).forEach(d=>{
    (state.misc[d]||[]).forEach(m=>{
      miscEntryConflictsDetailed(m, d).forEach(c=>clashes.push({date:d, role:m.role, message:c.message, pid:c.pid, isHardBlock:c.isHardBlock, entryId:m.id}));
    });
  });
  return clashes;
}
/* renders the full conflict list grouped by date, scrollable — no
   truncation, since "…還有N筆" isn't much use when you actually need to
   go fix every one of them. 硬性衝突（休假/長期事故/單日事故擋著人卻還
   是被排了）多一個「暫停這次」按鈕——這個人真的會來，只是先跟系統說這次
   的衝突知道了，寫進那一筆班表資料本身的 confirmedConflictIds，不會動到
   這個人的休假/長期事故/事故紀錄。showSuspendBtn 只有在這些衝突對應到
   「真的存在、不會被復原」的班表資料時才該傳true——「全部預排檢查」是
   唯讀模擬、跑完會復原，那時候按了也沒有東西可以綁，所以只有「全部預排
   匯入」（資料真的寫進去了）才顯示這個按鈕。 */
function conflictListHTML(clashes, showSuspendBtn){
  if(!clashes.length) return `<div class="hint">目前看起來沒有衝突。</div>`;
  const byDate={};
  clashes.forEach(c=>{ if(!byDate[c.date]) byDate[c.date]=[]; byDate[c.date].push(c); });
  const dates=Object.keys(byDate).sort();
  return `
    <div class="badge-issue" style="margin-bottom:6px">⚠️ 共 ${clashes.length} 筆衝突</div>
    <div style="max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px">
      ${dates.map(d=>`
        <div style="font-weight:600;margin:8px 0 2px">${minguoLabel(d)}（${byDate[d].length}筆）</div>
        ${byDate[d].map(c=>`<div class="row muted" style="align-items:center">
          <span class="grow">・${esc(c.role)}：${esc(c.message)}</span>
          ${showSuspendBtn && c.isHardBlock && c.pid && c.entryId? `<button class="ghost small" data-conflict-confirm="1" data-conflict-confirm-date="${d}" data-conflict-confirm-entry="${c.entryId}" data-conflict-confirm-pid="${c.pid}">暫停這次</button>` : ''}
        </div>`).join('')}
      `).join('')}
    </div>`;
}

  const getRange=()=>{
    const fromDate=document.getElementById('apFrom').value, toDate=document.getElementById('apTo').value;
    if(!fromDate || !toDate || fromDate>toDate){ showAlert('請確認日期範圍正確（開始不能晚於結束）。'); return null; }
    if(monthOf(fromDate)!==ym || monthOf(toDate)!==ym){ showAlert('範圍要在同一個月內，跨月請分開處理。'); return null; }
    return {fromDate, toDate};
  };
  // 「暫停這次」要綁在真的存在、不會被復原的班表資料上——「檢查」是唯讀
  // 模擬，跑完會復原，那時候按了也沒有東西可以綁，所以只有「全部預排匯
  // 入」的結果會顯示這個按鈕；按了之後直接改那一筆班表資料的
  // confirmedConflictIds，再重新跑一次匯入讓畫面反映最新結果
  const wireConfirmButtons=(rerun)=>{
    document.querySelectorAll('[data-conflict-confirm]').forEach(b=>{
      b.onclick=()=>{
        const d=b.dataset.conflictConfirmDate, entryId=b.dataset.conflictConfirmEntry, pid=b.dataset.conflictConfirmPid;
        const m=(state.misc[d]||[]).find(x=>x.id===entryId);
        if(!m) return;
        if(!m.confirmedConflictIds) m.confirmedConflictIds=[];
        if(!m.confirmedConflictIds.includes(pid)) m.confirmedConflictIds.push(pid);
        saveState();
        rerun();
      };
    });
  };
  const runCheck=()=>{
    const range=getRange(); if(!range) return;
    const {fromDate, toDate}=range;
    const snapshotMisc=JSON.stringify(state.misc), snapshotUnavail=JSON.stringify(state.unavail);
    const touched=runAllPreplanImports(fromDate, toDate);
    const clashes=collectMiscConflicts(fromDate, toDate);
    // this was only a check — put everything back exactly as it was
    state.misc=JSON.parse(snapshotMisc);
    state.unavail=JSON.parse(snapshotUnavail);
    document.getElementById('apResult').innerHTML = `
      <div class="card" style="padding:10px">
        <div class="muted" style="margin-bottom:6px">${minguoLabel(fromDate)}~${minguoLabel(toDate)}：如果現在匯入，會處理 ${touched} 筆。</div>
        <div class="hint" style="margin-bottom:6px">這是模擬結果，還沒真的寫進班表，「暫停這次」要等實際匯入後才能用。</div>
        ${conflictListHTML(clashes, false)}
      </div>`;
  };
  document.getElementById('apCheck').onclick=runCheck;
  document.getElementById('apImport').onclick=()=>{
    const range=getRange(); if(!range) return;
    const {fromDate, toDate}=range;
    showConfirm(`確定要把${minguoLabel(fromDate)}~${minguoLabel(toDate)}這段範圍的9種預排全部匯入實際班表嗎？每種項目會依照各自的規則覆寫對應日期（沒排的日期會清空），不會動到其他項目或範圍外的日期。（休假暨事故大表因為資料本身是整月為單位，會處理整個月，不受這裡選的範圍限制）`, ()=>{
      const runImport=()=>{
        const touched=runAllPreplanImports(fromDate, toDate);
        const clashes=collectMiscConflicts(fromDate, toDate);
        saveState();
        document.getElementById('apResult').innerHTML = `
          <div class="card" style="padding:10px">
            <div class="muted" style="margin-bottom:6px">已處理 ${touched} 筆。</div>
            ${conflictListHTML(clashes, true)}
          </div>`;
        wireConfirmButtons(runImport);
        render();
      };
      runImport();
    });
  };
}

   分頁的可外散宿卡片裡，跟排班（查哨序列）、外散宿資格都會用到，搬到抽屜

   理、可以隨時調整，之後陸續增加的規則也放在這個畫面裡，不用散落在各處
   設定畫面裡讓人找不到。 */
/* 我們的規則——全頁＋分類點入的方式，不是整頁攤開一次滑到底：主畫面列出
   規則分類，點進去才看那一類的內容，跟抽屜的預排項目是同一種瀏覽方式，
   之後規則增加也不會讓主畫面越滑越長。 */
/* 崗位定義清單裡「其他勤務項目」每一列的一行摘要——排班頁按「匯入預設」
   會把這些項目原封不動帶進當天，所以在設定裡先讓人看到時段/人數/補休這
   些關鍵設定，不用點進去才知道匯入後會長怎樣。 */
function dutyDefPreviewLabel(d){
  const parts=[];
  if(d.mode!=='fixedSlots' && d.times && d.times.length && d.times[0] && d.times[0].start){
    parts.push(d.times.map(t=>`${t.start}-${t.end}`).join('、'));
  }
  if(d.isVehicle) parts.push('駕駛＋車長');
  else if(d.customRoles && d.customRoles.length) parts.push(d.customRoles.join('、'));
  else parts.push(d.requiredCount==null? '人數不限' : `${d.requiredCount}人`);
  if(d.restUntil) parts.push(`補休至${d.restUntil}`);
  return parts.join('・');
}

        <label style="font-size:12px;color:var(--text);margin-bottom:2px">需求階級(可複選，不選代表不限)</label>

      `;
    };

    document.getElementById('ddeSave').onclick=()=>{
      const name=document.getElementById('ddeName').value.trim();
      if(!name){ showAlert('請輸入名稱'); return; }
      if(state.dutyDefinitions.some(d=>d.key!==key && d.name===name)){ showAlert('已經有這個名稱的崗位了'); return; }
      def.name = name;
      def.icon = document.getElementById('ddeIcon').value.trim()||'📋';
      def.hint = document.getElementById('ddeHint').value.trim();
      def.isVehicle = vehicleCb? vehicleCb.checked : def.isVehicle;
      def.requiredLicenses = [...modal.querySelectorAll('.ddeDriver-license-cb:checked')].map(cb=>cb.value);
      def.requiredSkills = [...modal.querySelectorAll('.ddeDriver-skill-cb:checked')].map(cb=>cb.value);
      def.requiredRanks = [...modal.querySelectorAll('.ddeDriver-rank-cb:checked')].map(cb=>cb.value);
      if(def.isVehicle){
        def.chiefRequiredLicenses = [...modal.querySelectorAll('.ddeChief-license-cb:checked')].map(cb=>cb.value);
        def.chiefRequiredSkills = [...modal.querySelectorAll('.ddeChief-skill-cb:checked')].map(cb=>cb.value);
        def.chiefRequiredMedCert = !!document.getElementById('ddeChiefMedCert')?.checked;
        def.requiredMedCert = !!document.getElementById('ddeDriverMedCert')?.checked;
        def.chiefRequiredRanks = [...modal.querySelectorAll('.ddeChief-rank-cb:checked')].map(cb=>cb.value);
      } else {
        def.requiredMedCert = !!document.getElementById('ddeSoloMedCert')?.checked;
        def.chiefRequiredLicenses=[]; def.chiefRequiredSkills=[]; def.chiefRequiredMedCert=false; def.chiefRequiredRanks=[];
      }
      const countVal = document.getElementById('ddeCount').value.trim();
      def.requiredCount = countVal? Math.max(1, parseInt(countVal,10)||1) : null;
      if(def.mode!=='fixedSlots'){
        const s=document.getElementById('ddeStart').value, e=document.getElementById('ddeEnd').value;
        def.times = (s||e)? [{start:s,end:e}] : [];
      }
      def.restUntil = document.getElementById('ddeRest').value;
      def.mode = def.isVehicle? 'roles' : (def.mode==='roles'? 'people' : def.mode);
      if(!def.linkedPreplan){
        const dayTypeSel = document.getElementById('ddeDayType');
        if(dayTypeSel) def.dayType = dayTypeSel.value;
      }
      syncDutyDefinitionToLegacy(def);
      saveState();
      editingDutyKey=null;
      draw();
    };
    const delBtn=document.getElementById('ddeDelete');
    if(delBtn) delBtn.onclick=()=>{
      showConfirm(`確定要刪除「${def.name}」這個崗位嗎？已經排定的內容不會被清掉，只是之後這個崗位不會再出現在清單裡。`, ()=>{
        state.dutyDefinitions = state.dutyDefinitions.filter(d=>d.key!==key);
        if(def.linkedPreplan){
          state.customPreplanTypes = state.customPreplanTypes.filter(c=>c.key!==key);
          delete state.unitRules.preplanSkillReqs[key];
          rebuildPreplanTypes();
        }
        saveState();
        editingDutyKey=null;
        draw();
      });
    };
  };
  const drawLeaveBuffer=()=>{
    const buf=state.unitRules.leaveBuffer;
    modal.innerHTML=`
      <div class="section-title"><button class="ghost small" id="urBack">← 返回</button><h2 style="margin:0">休假緩衝時間</h2></div>
      <div class="hint" style="margin-bottom:8px">休假暨事故大表點格子時，同一天可以循環切換這兩層（都是「前一天幾點開始休假」），這裡設定各層實際的時間。如果某段假期因為任務/處罰需要更晚才開始休假、或提早收假，到休假暨事故大表「特殊狀況調整」區塊用「⏰開始延後」「↩️收假提早」個別處理，不會用到這裡的設定。</div>
      <div class="row wrap" style="margin-bottom:8px">
        <div class="grow"><label>榮譽假（最寬鬆）前一天</label><input type="text" id="urHonorStart" value="${esc(buf.honorStart)}" placeholder="12:00"></div>
      </div>
      <div class="row wrap" style="margin-bottom:8px">
        <div class="grow"><label>一般（預設）前一天</label><input type="text" id="urNormalStart" value="${esc(buf.normalStart)}" placeholder="18:00"></div>
      </div>
      <div class="row wrap" style="margin-bottom:8px">
        <div class="grow"><label>所有層級共用：最後一天隔天結束於</label><input type="text" id="urBackEnd" value="${esc(buf.backEnd)}" placeholder="07:30"></div>
      </div>
      <button class="primary" id="urSaveBuffer" style="width:100%">儲存</button>`;
    document.getElementById('urBack').onclick=()=>{ section=null; draw(); };
    document.getElementById('urSaveBuffer').onclick=()=>{
      const honorStart=document.getElementById('urHonorStart').value.trim();
      const normalStart=document.getElementById('urNormalStart').value.trim();
      const backEnd=document.getElementById('urBackEnd').value.trim();
      const timeRe=/^([01]\d|2[0-3]):[0-5]\d$/;
      if(![honorStart,normalStart,backEnd].every(t=>timeRe.test(t))){
        showAlert('時間格式要是 HH:MM（例如 08:00），請檢查每一格。');
        return;
      }
      state.unitRules.leaveBuffer={...state.unitRules.leaveBuffer, honorStart,normalStart,backEnd};
      saveState();
      showAlert('已儲存。之後新登記或重新匯入的休假才會套用新時間，已經匯入過的舊資料不會自動改。');
    };
  };
  const drawTimeStep=()=>{
    modal.innerHTML=`
      <div class="section-title"><button class="ghost small" id="urBack">← 返回</button><h2 style="margin:0">排班時間間隔</h2></div>
      <div class="hint" style="margin-bottom:8px">選人員時段時，時間選單可以選的間隔。</div>
      <select id="urTimeStep" style="margin-bottom:8px">
        <option value="5">5分</option>
        <option value="10">10分</option>
        <option value="30">30分</option>
      </select>`;
    document.getElementById('urBack').onclick=()=>{ section=null; draw(); };
    document.getElementById('urTimeStep').value=String(state.timeStepMinutes);
    document.getElementById('urTimeStep').onchange=(e)=>{
      state.timeStepMinutes=Number(e.target.value);
      saveState();
      render();
    };
  };
  const drawScheduleCategories=()=>{
    // 「其他勤務項目」分成「平日」「假日」兩份完全獨立的清單(dayType)，各
    // 自照sortOrder排序——這就是排班頁按「匯入預設」時實際會用的順序
    // (syncDutyDefinitionToLegacy會把sortOrder寫進legacy的
    // miscPresets.sortOrder，buildScheduleCardItems排序時讀的正是這個欄
    // 位)，讓使用者在這裡看到的順序，就是匯入後排班頁會出現的順序。兩份
    // 清單各自獨立拖曳/新增，互不影響對方的排序。
    const plainFor = dayType => state.dutyDefinitions.filter(d=>!d.linkedPreplan && d.dayType===dayType).sort((a,b)=>(a.sortOrder??999)-(b.sortOrder??999));
    const weekdayItems = plainFor('weekday');
    const holidayItems = plainFor('holiday');
    const plainRow=(d,i)=>{
      const summary = dutyDefPreviewLabel(d);
      return `<div class="list-item" data-drag-idx="${i}">
        <span data-drag-handle style="cursor:grab;padding-top:2px;font-size:16px;color:var(--dim)">⠿</span>
        <div class="grow" data-edit-duty="${esc(d.key)}" style="cursor:pointer">
          <div>${esc(d.icon)} ${esc(d.name)}${d.isVehicle?' <span class="hint">(出車)</span>':''}</div>
          ${summary? `<div class="hint">${esc(summary)}</div>`:''}
        </div>
        <span style="color:var(--dim)">›</span>
      </div>`;
    };
    const addFormHTML=(label, idSuf)=>`
      <h3>＋新增${label}其他勤務項目</h3>
      <div class="row wrap" style="margin-bottom:6px">
        <div style="width:70px"><label>圖示</label><input type="text" id="ddIcon${idSuf}" placeholder="📋" maxlength="2"></div>
        <div class="grow"><label>名稱</label><input type="text" id="ddName${idSuf}" placeholder="例：帶隊官"></div>
      </div>
      <div class="row wrap" style="margin-bottom:8px">
        <div class="grow"><label>說明（選填）</label><input type="text" id="ddHint${idSuf}" placeholder="這個崗位的用途、排班規則"></div>
      </div>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:8px">
        <input type="checkbox" id="ddVehicle${idSuf}" style="width:auto"> 這是出車任務（駕駛／車長分開設定資格）
      </label>
      <button class="ghost" id="ddAdd${idSuf}" style="width:100%">＋新增這個項目</button>`;
    modal.innerHTML=`
      <div class="section-title"><button class="ghost small" id="urBack">← 返回</button><h2 style="margin:0">勤務類別</h2></div>
      <div class="section-title">
        <h3 style="margin:0">衛哨／打飯班類別</h3>
        <button class="ghost small" id="addCat">＋新增類別</button>
      </div>
      <div class="hint">安全士官／橋哨／指管：前後兩班（衛哨對衛哨）需間隔≥6小時、單日累計上限6小時（系統自動檢查，違反會標紅；此規則不含準備時間，純粹以衛哨排定時間計算）。每班衛哨開始前需空30分鐘準備：若前一段時間還在忙其他勤務（如採買、打飯班），系統會擋下並標紅，避免像「採買到08:00、緊接著08:00-12:00衛哨」這種沒時間準備的排法。橋哨／指管優先排下士，其次其他士兵/士官。打飯班早/午/晚每班2人＝1位帶隊士官（優先下士→中士→上士）＋1位士兵，盡量避免安排軍官；整天固定2人優先排訓練役，沒有訓練役才依二兵→一兵→上兵遞補。下拉選單已依此優先順序排序，越上面越優先。有設定「補休至」的班別（例：22:00-06:00 各節衛哨補休至08:00、06-08衛哨與早餐打飯班補休至08:30、午餐打飯班補休至15:30），下班後系統會自動把該員在補休時段內標示為不可排，也會檢查補休時段有沒有跟已排的其他勤務衝突，可到各類別「編輯」調整補休時間。</div>
      <div class="hint">下拉選單中的 🚫不可排 已同時涵蓋：休假/事故、長期事故、補休、以及當天其他勤務的重複指派。</div>
      <div class="hint" style="margin-top:8px">個別類別的名稱/班次/補休等設定，到排班畫面該類別卡片上的「編輯」調整；刪除類別也是同一個地方——這裡只負責新增類別跟看規則說明。</div>
      <div class="divider"></div>
      <h3>🌤️ 其他勤務項目・平日</h3>
      <div class="hint" style="margin-bottom:8px">平日（星期一到五，不含下面「假日設定」裡的例假日/國定假日）按「匯入預設」會用到的清單，跟「假日」是完全獨立的兩份，同一個項目如果平日假日都要有，要分別新增、各自維護。時段/人數/補休可以先在這裡看到，排列順序就是匯入後排班頁會出現的順序——長按左邊 ⠿ 可拖曳調整，點項目本身可以進去編輯細節或刪除。</div>
      <div id="dutyDefsWeekdayContainer">${weekdayItems.length? weekdayItems.map(plainRow).join('') : '<div class="empty">目前沒有</div>'}</div>
      ${addFormHTML('平日','Wd')}
      <div class="divider"></div>
      <h3>🌙 其他勤務項目・假日</h3>
      <div class="hint" style="margin-bottom:8px">例假日（含國定假日，在「假日設定」調整）按「匯入預設」會用到的清單，跟上面「平日」完全獨立，互不影響。</div>
      <div id="dutyDefsHolidayContainer">${holidayItems.length? holidayItems.map(plainRow).join('') : '<div class="empty">目前沒有</div>'}</div>
      ${addFormHTML('假日','Hol')}`;
    document.getElementById('urBack').onclick=()=>{ section=null; draw(); };
    document.getElementById('addCat').onclick=()=>{
      showPrompt('新類別名稱？（例：查哨）', '', (name)=>{
        const newId=uid();
        const newShifts=[sh('08:00','12:00')];
        state.categories.push({id:newId,name,enforceRest:false,preferLowRank:false,needsNCO:false,isSentry:false,shifts:newShifts});
        state.categoryShiftDefaults[newId]=newShifts.map(s=>({...s}));
        saveState();
        drawScheduleCategories();
      });
    };
    modal.querySelectorAll('[data-edit-duty]').forEach(row=>{
      row.onclick=()=>{ editingDutyKey=row.dataset.editDuty; draw(); };
    });
    wireDragReorder('dutyDefsWeekdayContainer', weekdayItems, ()=>{
      weekdayItems.forEach((d,i)=>{ d.sortOrder = i*10; syncDutyDefinitionToLegacy(d); });
      saveState();
      drawScheduleCategories();
    });
    wireDragReorder('dutyDefsHolidayContainer', holidayItems, ()=>{
      holidayItems.forEach((d,i)=>{ d.sortOrder = i*10; syncDutyDefinitionToLegacy(d); });
      saveState();
      drawScheduleCategories();
    });
    const wireAdd=(dayType, idSuf)=>{
      document.getElementById('ddAdd'+idSuf).onclick=()=>{
        const name=document.getElementById('ddName'+idSuf).value.trim();
        const icon=document.getElementById('ddIcon'+idSuf).value.trim()||'📋';
        const hint=document.getElementById('ddHint'+idSuf).value.trim();
        const isVehicle=document.getElementById('ddVehicle'+idSuf).checked;
        if(!name){ showAlert('請輸入名稱'); return; }
        if(state.dutyDefinitions.some(d=>d.name===name)){ showAlert('已經有這個名稱的項目了（平日／假日共用同一個名稱空間，重複要換個名字，例如加註「（假日）」）'); return; }
        const key = 'misc_'+uid();
        const def = {
          key, name, icon, mode: isVehicle?'roles':'people', hint,
          isVehicle, requiredLicenses:[], requiredMedCert:false, requiredSkills:[], requiredRanks:[],
          chiefRequiredLicenses:[], chiefRequiredMedCert:false, chiefRequiredSkills:[], chiefRequiredRanks:[],
          requiredCount:null, restUntil:'', times:[], sortOrder: 900+state.dutyDefinitions.length,
          excludeFromExport:false, isSentry:false, isAllDayAway:false, standbyMode:'off',
          presetRole:name, builtin:false, deletable:true, linkedPreplan:false, dayType,
        };
        state.dutyDefinitions.push(def);
        syncDutyDefinitionToLegacy(def);
        saveState();
        drawScheduleCategories();
      };
    };
    wireAdd('weekday','Wd');
    wireAdd('holiday','Hol');
  };
  const draw=()=>{
    if(editingDutyKey){ drawDutyDefEditor(editingDutyKey); return; }
    if(section==='leaveBuffer') drawLeaveBuffer();
    else if(section==='timeStep') drawTimeStep();
    else if(section==='standbyDefaults') drawStandbyDefaults();
    else if(section==='dutyDayDef') drawDutyDayDef();
    else if(section==='dutyDefs') drawDutyDefs();
    else if(section==='holidays'){ section=null; openHolidaySettingsModal(); draw(); }
    else if(section==='scheduleCategories') drawScheduleCategories();
    else drawMain();
  };
  document.body.appendChild(modal);
  draw();
}
function openHolidaySettingsModal(){
  const modal=document.createElement('div');
  modal.className='sheet-modal'; modal.style.zIndex='94';
  const draw=()=>{
    modal.innerHTML=`
      <div class="sheet-inner">
        <div class="section-title"><h2 style="margin:0">🗓️ 假日設定</h2><button class="ghost small" id="hsClose">關閉</button></div>
        <div class="hint" style="margin-bottom:8px">這裡的假日設定會同時影響外散宿資格判斷跟查哨的平日/假日序列，兩邊共用同一份設定。</div>
        <h3>例假日（每週固定休假日，複選）</h3>
        <div class="row wrap" style="gap:10px;margin-bottom:8px">
          ${['日','一','二','三','四','五','六'].map((d,i)=>`
            <label style="display:flex;align-items:center;gap:6px;font-size:13px">
              <input type="checkbox" class="hs-weekday-cb" value="${i}" style="width:auto" ${(state.holidayWeekdays||[]).includes(i)?'checked':''}> 週${d}
            </label>`).join('')}
        </div>
        <div class="divider"></div>
        <div class="section-title"><h3 style="margin:0">國定假日（個別日期，民國）（${(state.holidayDates||[]).length}筆）</h3></div>
        <div class="row wrap" style="margin-bottom:6px;margin-top:6px">
          ${(state.holidayDates||[]).length? state.holidayDates.slice().sort().map(d=>`
            <span class="pill-btn">${minguoLabel(d)} <span data-hs-del-holiday="${d}" style="color:var(--danger);margin-left:3px;cursor:pointer">✕</span></span>`).join('') : `<span class="muted" style="font-size:12px">尚未新增</span>`}
        </div>
        <button class="ghost small" id="hsAddHolidayBtn" style="margin-bottom:8px">＋新增國定假日</button>
        <button class="ghost small" id="hsAddCommonHolidaysBtn" style="margin-bottom:8px">＋一鍵加入常見國定假日（固定日期）</button>
        <div class="hint">會加入元旦、228、勞動節、國慶日等固定日期假日；農曆假日（春節、清明、端午、中秋）日期每年不同，請自行用上面「新增國定假日」個別新增。</div>
      </div>`;
    document.getElementById('hsClose').onclick=()=>modal.remove();
    modal.querySelectorAll('.hs-weekday-cb').forEach(cb=>{
      cb.onchange=()=>{
        state.holidayWeekdays=[...modal.querySelectorAll('.hs-weekday-cb:checked')].map(x=>Number(x.value));
        saveState(); draw();
      };
    });
    modal.querySelectorAll('[data-hs-del-holiday]').forEach(x=>{
      x.onclick=()=>{
        state.holidayDates=(state.holidayDates||[]).filter(d=>d!==x.dataset.hsDelHoliday);
        saveState(); draw();
      };
    });
    document.getElementById('hsAddHolidayBtn').onclick=()=>{ openHolidayDateModal(()=>draw()); };
    document.getElementById('hsAddCommonHolidaysBtn').onclick=()=>{
      const y = Number(currentDate.slice(0,4));
      let added=0;
      [y-1,y,y+1].forEach(yy=>{
        COMMON_HOLIDAYS_FIXED.forEach(h=>{
          const p=n=>String(n).padStart(2,'0');
          const dateStr=`${yy}-${p(h.m)}-${p(h.d)}`;
          if(!state.holidayDates.includes(dateStr)){ state.holidayDates.push(dateStr); added++; }
        });
      });
      showAlert(added? `已加入 ${added} 個固定日期假日（含前後一年）。`:'固定日期假日已經都加過了。');
      saveState(); draw();
    };
  };
  document.body.appendChild(modal);
  draw();
}
function openPreplanDrawer(){
  const backdrop=document.createElement('div');
  backdrop.className='drawer-backdrop';
  const drawer=document.createElement('div');

  // 勤務混在一起搞混，所以固定放在人員名冊正下方、不放進可拖曳排序的清
  // 單裡；其餘（值星/查哨/督伙/救護車/中央監控值班/採買/驗菜/自訂類型）

    const store=state.preplan[t.key]||{};

       month currently being viewed — this used to be an all-time total,
       so old data from months you'd already finished planning made the
       number look wrong relative to what you'd actually ticked this
       month. 留守 needs its own count: one entry there represents a
       whole span (its own start/end date), not a single day, so
       counting keys the same way as the other types badly undercounts
       a multi-day block — and that span only partially overlapping the
       viewed month still needs just the overlapping days counted. */

      : t.key==='standby'
      ? Object.values(store).filter(plan=>plan && preplanCellMark(t, plan)).reduce((sum,plan)=>sum+dateRangeList(plan.startDate, plan.endDate).filter(d=>d.startsWith(ym)).length, 0)

    draggableTypes = allTypes.filter(t=>!PINNED_PREPLAN_KEYS.includes(t.key));

      <div class="hint" style="margin-bottom:10px">這裡放不太會變的東西：人員名冊、跟固定的常態勤務。先建立好，之後在月曆頁按「匯入整月」寫進實際班表，不用每天重填。長按 ⠿ 可拖曳調整常態勤務的順序。</div>
      <div class="drawer-item" data-open-roster="1">
        <span style="font-size:18px">👤</span>
        <span class="grow">人員名冊<br><span class="hint">共 ${state.personnel.length} 人</span></span>
        <span style="color:var(--dim)">›</span>
      </div>
      ${pinnedTypes.map(t=>`<div class="drawer-item" data-preplan-open="${t.key}">
        <span style="font-size:18px">${t.icon}</span>
        <span class="grow">${t.name}<br><span class="hint">${preplanCountLabel(t)}</span></span>
        <span style="color:var(--dim)">›</span>
      </div>`).join('')}
      <div class="divider"></div>
      <div id="drawerList">
      ${draggableTypes.map((t,i)=>{
        return `<div class="drawer-item" data-pp-idx="${i}" data-preplan-open="${t.key}">
          <span data-pp-handle style="cursor:grab;color:var(--dim);padding-right:2px;touch-action:none">⠿</span>
          <span style="font-size:18px">${t.icon}</span>
          <span class="grow">${t.name}<br><span class="hint">${preplanCountLabel(t)}</span></span>
          <span style="color:var(--dim)">›</span>
        </div>`;
      }).join('')}
      </div>
      <div class="divider"></div>
      <button class="ghost" id="drawerAllPreplan" style="width:100%">🔍 全部預排檢查／匯入</button>`;
    document.getElementById('drawerClose').onclick=close;
    drawer.querySelector('[data-open-roster]').onclick=()=>{ close(); currentTab='people'; render(); };
    document.getElementById('drawerAllPreplan').onclick=()=>{ close(); openAllPreplanImportModal(); };
    drawer.querySelectorAll('[data-preplan-open]').forEach(b=>{
      b.onclick=(e)=>{

      });
      return found;
    };

      const to=target? Number(target.dataset.ppIdx) : null;
      const from=dragIdx;
      dragIdx=null; dragEl=null;
      if(to===null || to===from) { drawDrawer(); return; }

      // 不受影響——data-pp-idx 現在只對應 draggableTypes，不是全部9種。
      const order=draggableTypes.map(t=>t.key);

      state.preplanOrder=[...PINNED_PREPLAN_KEYS, ...order]; saveState(); drawDrawer();
    };

      const row=h.closest('[data-pp-idx]');
      const start=(clientY)=>{ dragIdx=Number(row.dataset.ppIdx); dragEl=row; row.style.opacity='.5'; };
      h.addEventListener('touchstart', e=>{ e.preventDefault(); e.stopPropagation(); start(e.touches[0].clientY); }, {passive:false});
      h.addEventListener('touchmove', e=>{
        if(dragIdx===null) return;
        e.preventDefault();
        const over=rowAt(e.touches[0].clientY);
        drawer.querySelectorAll('[data-pp-idx]').forEach(el=>el.style.borderColor='');
        if(over && Number(over.dataset.ppIdx)!==dragIdx) over.style.borderColor='var(--accent)';
      }, {passive:false});
      h.addEventListener('touchend', e=>{ e.preventDefault(); endDrag(e.changedTouches[0].clientY); }, {passive:false});
      h.addEventListener('mousedown', e=>{
        e.preventDefault(); e.stopPropagation(); start(e.clientY);
        const mm=ev=>{
          const over=rowAt(ev.clientY);
          drawer.querySelectorAll('[data-pp-idx]').forEach(el=>el.style.borderColor='');
          if(over && Number(over.dataset.ppIdx)!==dragIdx) over.style.borderColor='var(--accent)';
        };
        const mu=ev=>{ document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); endDrag(ev.clientY); };
        document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu);
      });
    });
  };
  document.body.appendChild(backdrop);
  document.body.appendChild(drawer);
  const close=()=>{ backdrop.remove(); drawer.remove(); };
  backdrop.onclick=close;

  const all = state.preplan[key]||{};
  for(const anchor of Object.keys(all)){
    const p=all[anchor];

   為，不用另外遷移資料。所有要「列出這天有幾組人」的地方都呼叫這個函式

function peopleGroupsOf(plan){

function preplanCellMark(type, plan){

  const nm = id=>{ const p=state.personnel.find(x=>x.id===id); return p? p.name : ''; };

     style so it's visually obvious "this isn't one of ours" at a glance
     rather than silently missing from the month view */

  const outside = note => note? [`<span class="cal-mark-outside">${esc(note)}</span>`] : [];

    const n=(plan.personIds||[]).length;
    return n? `${n}人` : '';

  if(type.mode==='people'){
    const groups = peopleGroupsOf(plan);
    return groups.map(g=>[...ours(g.personIds), ...outside(g.note)].join('･')).filter(Boolean).join('｜');
  }
  if(type.mode==='roles'){
    const parts=[...ours(plan.personIds), ...(plan.notes||[]).flatMap(n=>outside(n))];
    return parts.join('･');

  if(type.mode==='dayNight'){
    const dayIds=plan.dayPersonIds||(plan.dayPersonId?[plan.dayPersonId]:[]);
    const nightIds=plan.nightPersonIds||(plan.nightPersonId?[plan.nightPersonId]:[]);
    const parts=[];

    const nightNames=[...ours(nightIds), ...outside(plan.nightNote)];

function preplanFillLines(type, plan){

function generatePreplanFillText(key, ym){
  const type=PREPLAN_TYPES.find(t=>t.key===key);
  const total=daysInMonth(ym);
  const [y,m]=ym.split('-').map(Number);
  const lines=[`${type.name}　民國${y-1911}年${m}月`,
    `（在每個項目後面直接打姓名即可，例：${preplanFillLabels(type)[0]} 陳小明；不需要就留空；如果只是掛名備援、不用真的出勤，姓名後面加"(掛)"；找不到的名字也可以直接打上去，不會自動加進名冊）`, ''];
  for(let d=1;d<=total;d++){
    const ds=`${ym}-${String(d).padStart(2,'0')}`;
    const plan=preplanFor(key, ds);
    lines.push(`${m}/${d}`);
    preplanFillLines(type, plan).forEach(l=>lines.push(l));

/* parses a filled-in template back. Tolerant of the header/instruction

function parsePreplanFillText(key, ym, text){

  const nameToId=name=>{
    const matches=state.personnel.filter(p=>p.name===name.trim());
    return matches.length===1? matches[0] : null;
  };

    const ids=[], nominalIds=[], notes=[];
    (raw||'').split(/[、,，\s]+/).filter(Boolean).forEach(tok=>{
      const nominal=/[（(]掛[)）]$/.test(tok);

      else { notes.push(tok); unresolved.push({date:curDate, label, name:tok}); }

        // 輯畫面加過），保留第2組以後的，只換掉第一組的內容，不要整個蓋掉
        const existing = (state.preplan[key]||{})[curDate];
        const extraGroups = existing && existing.groups && existing.groups.length>1 ? existing.groups.slice(1) : [];
        const g0 = {personIds:c.ids, nominalIds:c.nominalIds, note:c.note||undefined};

      const cells=labels.map(r=>parseCell(buf[r], curDate, r));

        result[curDate]={personIds:cells.map(c=>c.ids[0]), nominalIds:cells.flatMap(c=>c.nominalIds), notes:cells.map(c=>c.note||undefined)};
      }

      const dc=parseCell(buf['日班'], curDate, '日班'), nc=parseCell(buf['夜班'], curDate, '夜班');
      if(dc.ids.length||dc.note||nc.ids.length||nc.note){
        result[curDate]={dayPersonIds:dc.ids, dayNominalIds:dc.nominalIds, dayNote:dc.note||undefined,
                          nightPersonIds:nc.ids, nightNominalIds:nc.nominalIds, nightNote:nc.note||undefined};
      }
    } else if(type.mode==='fixedSlots'){
      const slots={};
      labels.forEach((short,i)=>{
        const raw=buf[short];
        if(raw===undefined) return;
        const c=parseCell(raw, curDate, short);

      });

/* 值星's dedicated quick-fill: pick the person(s) once, type a date range
   and a time range, and it writes the same plan into every day in that
   range in one go — instead of opening the calendar and clicking each day
   (or using the generic 複製到其他日期, which still means picking one day
   first). Only offered for 值星 since that's the one where a single
   person covers a multi-day stretch with the same hours throughout. */
/* 唯讀預覽這個月查哨每個時段依序列該輪到哪個單位——只到單位層級，還沒指定
   到實際人員（指定人員是下一批要做的事），先讓你確認序列本身算得對不對。 */
function openPatrolSequenceViewModal(ym){
  const modal=document.createElement('div');
  modal.className='sheet-modal'; modal.style.zIndex='94';
  const draw=()=>{
    const [y,m]=ym.split('-').map(Number);
    const total=daysInMonth(ym);
    const fromDate=`${ym}-01`, toDate=`${ym}-${String(total).padStart(2,'0')}`;
    const seq=computePatrolSequence(fromDate, toDate);
    const slotLabels={0:'12-14',1:'22-24',2:'00-02',3:'02-04',4:'04-06'};
    let rows='';
    for(let d=1; d<=total; d++){
      const ds=`${ym}-${String(d).padStart(2,'0')}`;
      const hol=isHolidayDate(ds);
      const isManualDate=(state.holidayDates||[]).includes(ds);
      const daySlots=seq[ds]||{};
      rows += `<div style="padding:4px 0;border-bottom:1px solid var(--line)">
        <div class="row" style="align-items:center">
          <span class="grow" style="font-weight:600;${hol?'color:var(--danger)':''}">${minguoLabel(ds)}${hol?'（假）':''}</span>
          <button class="ghost small" data-psv-toggle-holiday="${ds}">${isManualDate? '取消假日':(hol?'（依星期自動）':'設為假日')}</button>
        </div>
        <span class="muted" style="font-size:12px">${PATROL_CHRONO_ORDER.map(idx=>`${slotLabels[idx]} ${esc(daySlots[idx]||'—')}`).join('　')}</span>
      </div>`;
    }
    modal.innerHTML=`
      <div class="sheet-inner">
      <div class="section-title"><h2 style="margin:0">民國${y-1911}年${m}月　查哨單位序列</h2><button class="ghost small" id="psvClose">關閉</button></div>
      <div class="hint" style="margin-bottom:8px">依平日/假日雙序列算出來的結果，只到「哪個單位」這一層，還沒指定實際人員。紅字是假日。如果某天實際上要額外算假日（或不該算假日），直接在那天旁邊按按鈕增減，會直接更新到假日設定（跟外散宿共用的同一份國定假日清單）。「（依星期自動）」代表這天是依每週固定的例假日星期算出來的，不是個別日期設定，沒辦法用這個按鈕取消，要調整請去右上角⚙️「我們的規則」裡的「🗓️假日設定」改「例假日星期」。</div>
      <div style="max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px">${rows}</div>
      </div>
    `;
    document.getElementById('psvClose').onclick=()=>modal.remove();
    modal.querySelectorAll('[data-psv-toggle-holiday]').forEach(b=>{
      b.onclick=()=>{
        const ds=b.dataset.psvToggleHoliday;
        if(!state.holidayDates) state.holidayDates=[];
        if(state.holidayDates.includes(ds)){
          state.holidayDates=state.holidayDates.filter(d=>d!==ds);
        } else if(!isHolidayDate(ds)){
          state.holidayDates.push(ds);
        } else {
          return; // 依星期自動算出來的假日,這個按鈕不處理
        }
        saveState();
        draw();
      };
    });
  };
  document.body.appendChild(modal);
  draw();
}

function openPreplanCalendar(key){
  const type = PREPLAN_TYPES.find(t=>t.key===key);
  if(!type) return;
  if(!preplanMonth) preplanMonth = monthOf(currentDate);
  // 休假暨事故大表 is person-first, not date-first — it has its own screen
  if(type.mode==='leaveTable') return openLeaveTableEditor(preplanMonth+'-01', ()=>{});

  modal.className='fullscreen-modal'; modal.style.zIndex='92';
  const draw=()=>{
    const ym=preplanMonth;
    const [y,m]=ym.split('-').map(Number);
    const total=daysInMonth(ym);
    const firstDow=new Date(y,m-1,1).getDay();
    const cells=[];
    for(let i=0;i<firstDow;i++) cells.push('<div class="cal-cell empty"></div>');
    for(let d=1;d<=total;d++){
      const ds=`${ym}-${String(d).padStart(2,'0')}`;
      // a 留守 block is stored once under its anchor date but covers a range,
      // so every day inside the range shows its own mark (and opens the
      // same block for editing) rather than the count appearing only on
      // the first day
      const owner = preplanOwnerFor(key, ds);
      const mark = owner? preplanCellMark(type, owner.plan) : '';
      const hol=isHolidayDate(ds);
      cells.push(`<div class="cal-cell ${mark?'has':''} ${hol?'holiday':''}" data-cal-date="${ds}" data-cal-anchor="${owner? owner.anchor : ds}">
        <div class="cal-day">${d}</div><div class="cal-mark">${mark}</div>
      </div>`);
    }
    const plannedCount=Object.keys(state.preplan[key]||{}).filter(d=>d.startsWith(ym) && preplanCellMark(type, state.preplan[key][d])).length;
    modal.innerHTML=`
      <div class="section-title"><h2 style="margin:0">${type.icon} ${type.name}</h2><button class="ghost small" id="calClose">關閉</button></div>
      <div class="hint" style="margin-bottom:8px">${type.hint}</div>
      <div class="row" style="gap:6px;align-items:center;margin-bottom:8px">
        <button class="ghost small" id="calPrev">◀</button>
        <span class="grow" style="text-align:center;font-weight:600">民國${y-1911}年${m}月<br><span class="hint">本月已排 ${plannedCount} 天</span></span>
        <button class="ghost small" id="calNext">▶</button>
      </div>
      <div class="cal-grid" style="margin-bottom:6px">
        ${['日','一','二','三','四','五','六'].map(w=>`<div class="cal-head">${w}</div>`).join('')}
        ${cells.join('')}
      </div>
      <div class="hint" style="margin-bottom:8px">點日期輸入當天內容；已排的日期外框會變色。假日以紅字標示。名字顏色：<span style="color:var(--accent)">一般顏色</span>＝我們單位的人，<span class="cal-mark-outside">橘色斜體</span>＝找不到、可能是別單位支援的人。</div>
      ${key==='duty'? `<button class="ghost" id="calDutyFill" style="width:100%;margin-bottom:6px">📝 直接設定範圍（選人＋起訖日＋起訖時間，一次套用）</button>` : ''}
      ${key==='patrol'? `
      <button class="ghost" id="calPatrolSeqView" style="width:100%;margin-bottom:6px">🔁 查看本月單位輪值序列</button>
      <button class="ghost" id="calPatrolSeqAnchor" style="width:100%;margin-bottom:6px">⚙️ 序列錨點設定</button>
      <button class="ghost" id="calPatrolRankTargets" style="width:100%;margin-bottom:6px">⚙️ 查哨排班設定（補休、階級平均）</button>
      <button class="ghost" id="calPatrolRange" style="width:100%;margin-bottom:6px">👥 候選名單範圍${state.patrolCandidateIds? `（目前 ${state.patrolCandidateIds.length} 人）` : '（目前：全部人員）'}</button>
      <button class="primary" id="calPatrolAutoFill" style="width:100%;margin-bottom:6px">🎯 依規則自動排本月（本部連）</button>
      ` : ''}
      ${preplanSupportsTextFormat(type)? `
      <button class="ghost" id="calExportText" style="width:100%;margin-bottom:6px">📝 匯出本月文字（給人填空缺）</button>
      <button class="ghost" id="calImportText" style="width:100%;margin-bottom:6px">📝 匯入填好的文字</button>
      ` : ''}
      <button class="primary" id="calImport" style="width:100%;margin-bottom:6px">📥 匯入本月預排到實際班表</button>
      <button class="ghost" id="calCheckpoint" style="width:100%;margin-bottom:6px">📌 存檔點</button>
      <button class="ghost small danger" id="calClearMonth" style="width:100%">清空本月預排</button>`;
    if(key==='duty') document.getElementById('calDutyFill').onclick=()=>openDutyRangeFillModal(()=>{ draw(); });
    if(key==='patrol'){
      document.getElementById('calPatrolSeqView').onclick=()=>openPatrolSequenceViewModal(ym);
      document.getElementById('calPatrolSeqAnchor').onclick=()=>openPatrolAnchorModal(()=>{ draw(); });
      document.getElementById('calPatrolRankTargets').onclick=()=>openPatrolRankTargetsModal(()=>{ draw(); });
      document.getElementById('calPatrolRange').onclick=()=>openPatrolRangeModal(()=>{ draw(); });
      document.getElementById('calPatrolAutoFill').onclick=()=>{
        const candSet=patrolCandidateIdSet();
        const candCount=candSet? candSet.size : state.personnel.length;
        showConfirm(`確定要依規則自動排這個月本部連負責的查哨嗎？候選範圍共 ${candCount} 人（可以在「候選名單範圍」調整）。本部連的時段會依同性別、至少1士官、階級平均公平、不同排組優先、盡量一士一兵、12-14優先駕照這些規則排人，並依「查哨排班設定」裡各時段的補休預設自動帶入；其他連的時段只會標記是哪個連，不會排人。這個月已經排過的格子會被覆蓋。`, ()=>{
          const result=autoFillPatrolMonth(ym, candSet);
          saveState();
          showAlert(`已排好 ${result.filled} 格（本部連），另外 ${result.skippedOtherUnit} 格是其他連負責，只標記單位。`);
          draw();
        });
      };
    }
    document.getElementById('calCheckpoint').onclick=()=>openCheckpointModal(key, type.name,
      ()=>state.preplan[key]||{},
      (data)=>{ state.preplan[key]=data; draw(); });
    if(preplanSupportsTextFormat(type)){
      document.getElementById('calExportText').onclick=()=>{
        openTextShareModal(`${type.name} 民國${y-1911}年${m}月`, generatePreplanFillText(key, ym));
      };
      document.getElementById('calImportText').onclick=()=>openPreplanTextImportModal(key, ym, draw);
    }
    modal.querySelectorAll('[data-cal-date]').forEach(c=>{
      c.onclick=()=>openPreplanDayEditor(key, c.dataset.calAnchor||c.dataset.calDate, draw);
    });
    document.getElementById('calClose').onclick=()=>modal.remove();
    document.getElementById('calPrev').onclick=()=>{ preplanMonth=shiftMonth(preplanMonth,-1); draw(); };
    document.getElementById('calNext').onclick=()=>{ preplanMonth=shiftMonth(preplanMonth,1); draw(); };
    document.getElementById('calImport').onclick=()=>{
      const plannedDates=Object.keys(state.preplan[key]||{}).filter(d=>d.startsWith(ym)).sort();
      if(!plannedDates.length){ showAlert('本月還沒有預排任何日期。'); return; }
      // 留守 is anchor-based (one entry can span several days), so it still
      // only processes days that actually have a block starting — the other
      // 7 types are one-entry-per-day, so re-importing the whole month also
      // clears days you emptied out since the last import, not just the
      // ones that still have content
      const dates = key==='standby'? plannedDates : dateRangeList(`${ym}-01`, `${ym}-${String(daysInMonth(ym)).padStart(2,'0')}`);
      const confirmMsg = key==='standby'
        ? `確定要把「${type.name}」本月已預排的 ${plannedDates.length} 段匯入實際班表嗎？每一段這個項目原本的內容會被覆寫（其他項目不受影響）。`
        : `確定要把「${type.name}」整個月匯入實際班表嗎？這個月每一天都會依照預排現況覆寫（沒排的日期會清空這個項目，其他項目不受影響）。`;
      showConfirm(confirmMsg, ()=>{
        let n=0;
        dates.forEach(d=>{ if(importPreplanForDate(key, d)) n++; });
        saveState();
        /* preplans are made weeks ahead, so by import time leave or another
           duty may already have landed on the same person — surface that immediately
           instead of letting it sit unnoticed in the roster */
        const clashes=[];
        dates.forEach(d=>{
          (state.misc[d]||[]).filter(m=>m.role===(type.presetRole||type.name)).forEach(m=>{
            miscEntryConflicts(m, d).forEach(c=>clashes.push(`${minguoLabel(d)} ${c}`));
          });
        });
        showAlert(`已處理 ${n} 天（含清空跟寫入）。` + (clashes.length
          ? `\n\n⚠️ 有 ${clashes.length} 筆衝突需要處理：\n` + clashes.slice(0,12).join('\n') + (clashes.length>12? `\n…還有 ${clashes.length-12} 筆`:'')
          : ''));
        render();
        draw();
      });
    };
    document.getElementById('calClearMonth').onclick=()=>{
      showConfirm(`確定要清空「${type.name}」本月的所有預排嗎？（只清預排，已經匯入到班表的內容不受影響）`, ()=>{
        Object.keys(state.preplan[key]||{}).filter(d=>d.startsWith(ym)).forEach(d=>delete state.preplan[key][d]);
        // also drop any empty leftovers from other months so the drawer's
        // "已預排 N 天" can't keep counting entries that show nothing
        Object.keys(state.preplan[key]||{}).forEach(d=>{
          if(!preplanCellMark(type, state.preplan[key][d])) delete state.preplan[key][d];
        });
        saveState(); draw();
      });
    };
  };
  document.body.appendChild(modal);
  draw();
}
/* 留守 gets its own compound editor: pick the holiday block's date range,
   choose who stays, then assign those people to the day's sub-duties
   (日督/夜督/話務/伙房...) all in one place. Everyone not on the list goes
   on leave for the block. Per-person time overrides handle the common
   "he's off Monday too, so he leaves Sunday 18:00" case. */
function openStandbyEditor(date, onSaved){
  const existing = preplanFor('standby', date) || {};
  let plan = {
    startDate: existing.startDate || date,
    endDate: existing.endDate || date,
    startTime: existing.startTime || state.unitRules.standbyDefaults.startTime,
    leaveStartTime: existing.leaveStartTime || state.unitRules.standbyDefaults.leaveStartTime,
    endTime: existing.endTime || state.unitRules.standbyDefaults.endTime,
    personIds: [...(existing.personIds||[])],
    overrides: {...(existing.overrides||{})},   // personId -> {start?, end?}
    subDuties: JSON.parse(JSON.stringify(existing.subDuties||{})), // role -> {date -> {personIds, start, end}}
  };
  const modal=document.createElement('div');
  modal.className='fullscreen-modal'; modal.style.zIndex='93';
  const draw=()=>{
    const blockDates = (plan.startDate<=plan.endDate)? dateRangeList(plan.startDate, plan.endDate) : [plan.startDate];
    const staying = plan.personIds;
    const subRoles = state.standbySubRoles||[];
    modal.innerHTML=`
      <div class="section-title"><h2 style="margin:0">🏠 留守</h2><button class="ghost small" id="sbClose">關閉</button></div>
      <div class="hint" style="margin-bottom:8px">留守人員從「起始日前一天」的指定時間開始算留守，到「結束日隔天」的指定時間為止；沒留守的人則從前一天的放假時間開始休假。時間都可以改。</div>
      <div class="row wrap" style="margin-bottom:8px">
        <div class="grow"><label>例假日第一天</label><input type="date" id="sbStartDate" value="${plan.startDate}"></div>
        <div class="grow"><label>例假日最後一天</label><input type="date" id="sbEndDate" value="${plan.endDate}"></div>
      </div>
      <div class="row wrap" style="margin-bottom:4px">
        <div class="grow"><label>留守開始（${prevDateStr(plan.startDate)}）</label>${timeSelectHTML('sbStart', plan.startTime)}</div>
        <div class="grow"><label>放假開始（${prevDateStr(plan.startDate)}）</label>${timeSelectHTML('sbLeave', plan.leaveStartTime)}</div>
        <div class="grow"><label>結束（${nextDateStr(plan.endDate)}）</label>${timeSelectHTML('sbEnd', plan.endTime)}</div>
      </div>
      <div class="hint" style="margin-bottom:10px">目前設定：留守 ${prevDateStr(plan.startDate)} ${plan.startTime} → ${nextDateStr(plan.endDate)} ${plan.endTime}；其餘人員 ${prevDateStr(plan.startDate)} ${plan.leaveStartTime} 起放假。</div>
      <div class="divider"></div>
      <div class="section-title"><h3 style="margin:0">留守名單（${staying.length}人）</h3><button class="ghost small" id="sbPickPeople">選擇人員</button></div>
      <div id="sbPeopleList" style="margin-bottom:8px">
        ${staying.length? staying.map(pid=>{
          const p=state.personnel.find(x=>x.id===pid);
          if(!p) return '';
          const ov=plan.overrides[pid]||{};
          const blockDates=(plan.startDate<=plan.endDate)? dateRangeList(plan.startDate,plan.endDate):[];
          const leaveDates=((state.preplan.leave||{})[pid]||{}).dates||[];
          const clash=blockDates.filter(d=>leaveDates.includes(d));
          return `<div class="list-item" style="flex-direction:column;align-items:stretch">
            <div class="row"><span class="grow">${esc(p.name)}（${p.group||'未分組'}·${p.rank}）</span>
              <button class="ghost small danger" data-sb-remove="${pid}">移除</button></div>
            ${clash.length? `<div class="badge-issue">⚠️ 休假暨事故大表已排他 ${clash.length} 天休假（${clash.map(d=>minguoLabel(d)).join('、')}），跟留守衝突</div>`:''}
            ${(ov.start||ov.end)? `<div class="hint">個別調整：${ov.start? '留守至 '+ov.start : ''}${ov.end? ' ／ 提早於 '+ov.end+' 離營':''}</div>`:''}
            <div class="row"><button class="ghost small" data-sb-override="${pid}">個別調整時間</button></div>
          </div>`;
        }).join('') : `<div class="empty">尚未選擇留守人員</div>`}
      </div>
      <div class="divider"></div>
      <div class="section-title"><h3 style="margin:0">留守日子勤務</h3><button class="ghost small" id="sbEditRoles">設定項目</button></div>
      <div class="hint" style="margin-bottom:8px">只能從上面的留守名單裡指派。時段預設沿用「常用項目」，可個別調整。如果這個項目本身也是抽屜裡的獨立預排（例如中央監控值班），會直接沿用那邊排好的內容，不用在這裡重填。</div>
      ${staying.length? blockDates.map(d=>`
        <div class="card" style="padding:8px 10px">
          <div style="font-weight:600;margin-bottom:6px">${minguoLabel(d)}</div>
          ${subRoles.length? subRoles.map(role=>{
            // if this sub-duty role is ALSO its own top-level preplan type
            // (e.g. 中央監控值班), that's the single source of truth — show
            // it read-only here instead of asking for the same thing twice
            const linkedType = PREPLAN_TYPES.find(t=>t.presetRole===role && t.mode!=='standby' && t.key!=='duty');
            if(linkedType){
              const linkedPlan = preplanFor(linkedType.key, d);
              const linkedLines = preplanFillLines(linkedType, linkedPlan).join('　');
              return `<div class="row" style="align-items:flex-start;margin-bottom:4px">
                <span class="muted grow">${esc(role)}（沿用「${esc(linkedType.name)}」預排）：${linkedPlan? esc(linkedLines.replace(/？？？/g,'未指派')) : '（尚未在該預排項目設定）'}</span>
                <button class="ghost small" data-sb-linked="${linkedType.key}" data-sb-subdate="${d}">前往設定</button>
              </div>`;
            }
            const cfg=((plan.subDuties[role]||{})[d])||{};
            const preset=state.miscPresets.find(p=>p.role===role);
            const t0=preset? (presetTimes(preset)[0]||{start:'',end:''}) : {start:'',end:''};
            const st=cfg.start||t0.start, en=cfg.end||t0.end;
            const names=(cfg.personIds||[]).map(pid=>{const p=state.personnel.find(x=>x.id===pid);return p?p.name:'';}).filter(Boolean);
            return `<div class="row" style="align-items:flex-start;margin-bottom:4px">
              <span class="muted grow">${esc(role)}${st&&en? `（${st}-${en}）`:''}：${names.length? esc(names.join('、')) : '（未指派）'}</span>
              <button class="ghost small" data-sb-sub="${esc(role)}" data-sb-subdate="${d}">編輯</button>
            </div>`;
          }).join('') : `<div class="empty">尚未設定子勤務項目</div>`}
        </div>`).join('') : ''}
      <div class="row wrap" style="margin-top:10px">
        <button class="ghost grow danger" id="sbDelete">清除這筆留守</button>
        <button class="primary grow" id="sbSave">儲存</button>
      </div>`;
    document.getElementById('sbClose').onclick=()=>modal.remove();
    const sync=()=>{
      plan.startDate=document.getElementById('sbStartDate').value||plan.startDate;
      plan.endDate=document.getElementById('sbEndDate').value||plan.endDate;
      plan.startTime=getTimeSelectValue('sbStart')||plan.startTime;
      plan.leaveStartTime=getTimeSelectValue('sbLeave')||plan.leaveStartTime;
      plan.endTime=getTimeSelectValue('sbEnd')||plan.endTime;
    };
    ['sbStartDate','sbEndDate'].forEach(id=>{ document.getElementById(id).onchange=()=>{ sync(); draw(); }; });
    ['sbStart__h','sbStart__m','sbLeave__h','sbLeave__m','sbEnd__h','sbEnd__m'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.onchange=()=>{ sync(); draw(); };
    });
    document.getElementById('sbPickPeople').onclick=()=>{ sync(); openStandbyPeoplePicker(plan, draw); };
    document.getElementById('sbEditRoles').onclick=()=>{ sync(); openStandbySubRolePicker(draw); };
    modal.querySelectorAll('[data-sb-remove]').forEach(b=>{
      b.onclick=()=>{ sync(); plan.personIds=plan.personIds.filter(id=>id!==b.dataset.sbRemove); delete plan.overrides[b.dataset.sbRemove]; draw(); };
    });
    modal.querySelectorAll('[data-sb-override]').forEach(b=>{
      b.onclick=()=>{ sync(); openStandbyOverrideEditor(plan, b.dataset.sbOverride, draw); };
    });
    modal.querySelectorAll('[data-sb-sub]').forEach(b=>{
      b.onclick=()=>{ sync(); openStandbySubDutyEditor(plan, b.dataset.sbSub, b.dataset.sbSubdate, draw); };
    });
    modal.querySelectorAll('[data-sb-linked]').forEach(b=>{
      b.onclick=()=>{ sync(); openPreplanDayEditor(b.dataset.sbLinked, b.dataset.sbSubdate, draw); };
    });
    document.getElementById('sbDelete').onclick=()=>{
      showConfirm('確定要清除這筆留守預排嗎？', ()=>{
        setPreplan('standby', date, null);
        saveState(); modal.remove(); if(onSaved) onSaved();
      });
    };
    document.getElementById('sbSave').onclick=()=>{
      sync();
      if(plan.startDate>plan.endDate){ showAlert('例假日最後一天不能早於第一天'); return; }
      if(!plan.personIds.length){ showAlert('請至少選一位留守人員'); return; }
      setPreplan('standby', date, plan);
      saveState(); modal.remove(); if(onSaved) onSaved();
    };
  };
  document.body.appendChild(modal);
  draw();
}
function openStandbyPeoplePicker(plan, onDone){
  const modal=document.createElement('div');
  modal.className='sheet-modal'; modal.style.zIndex='94';
  const requiredSkills = state.unitRules.preplanSkillReqs.standby||[];
  const sorted=state.personnel.slice()
    .map(p=>({p, skillIssues: requiredSkills.filter(sk=>!(p.skills||[]).includes(sk))}))
    .sort((a,b)=>(a.skillIssues.length>0)-(b.skillIssues.length>0) || groupIndex(a.p.group)-groupIndex(b.p.group) || rankIndex(a.p.rank)-rankIndex(b.p.rank))
    .map(x=>x.p);
  const skillIssuesOf = p=>requiredSkills.filter(sk=>!(p.skills||[]).includes(sk));
  modal.innerHTML=`
    <div class="sheet-inner">
      <div class="section-title"><h2 style="margin:0">選擇留守人員</h2><button class="ghost small" id="spClose">關閉</button></div>
      <div class="row wrap" style="margin-bottom:6px">
        <div class="grow"><label>搜尋姓名</label><input type="text" id="spSearch" placeholder="輸入姓名關鍵字"></div>
      </div>
      <div class="row wrap" style="margin-bottom:6px">
        <button class="ghost small" id="spAll">全選(顯示中)</button>
        <button class="ghost small" id="spNone">全部取消</button>
      </div>
      <div id="spList" style="max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px">
        ${sorted.map(p=>{
          /* if this person already has leave booked inside the standby block,
             say so here — otherwise it's easy to put someone on standby who
             the 休假暨事故大表 already sent home */
          const blockDates=(plan.startDate&&plan.endDate&&plan.startDate<=plan.endDate)? dateRangeList(plan.startDate,plan.endDate):[];
          const leaveDates=((state.preplan.leave||{})[p.id]||{}).dates||[];
          const clash=blockDates.filter(d=>leaveDates.includes(d));
          const skillIssues = skillIssuesOf(p);
          return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0;${skillIssues.length?'opacity:.6':''}">
          <input type="checkbox" class="sp-person" value="${p.id}" style="width:auto" ${plan.personIds.includes(p.id)?'checked':''}>
          ${esc(p.name)}（${p.group||'未分組'}·${p.rank}${personBadges(p)}）${clash.length? ` <span class="warn">🏖️已排休假${clash.length}天</span>`:''}${skillIssues.length? ` <span class="warn">🚫${esc(skillIssues.map(skillRequirementLabel).join('・'))}</span>`:''}
        </label>`;}).join('')}
      </div>
      <button class="primary" id="spSave" style="width:100%">確定</button>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('spClose').onclick=()=>modal.remove();
  const searchEl=document.getElementById('spSearch');
  searchEl.oninput=()=>{
    const term=searchEl.value.trim();
    modal.querySelectorAll('#spList label').forEach(l=>{ l.style.display=(!term||l.textContent.includes(term))?'flex':'none'; });
  };
  document.getElementById('spAll').onclick=()=>modal.querySelectorAll('.sp-person').forEach(cb=>{ if(cb.closest('label').style.display!=='none') cb.checked=true; });
  document.getElementById('spNone').onclick=()=>modal.querySelectorAll('.sp-person').forEach(cb=>cb.checked=false);
  keepSearchFocusOnPick(document.getElementById('spList'), document.getElementById('spSearch'));
  document.getElementById('spSave').onclick=()=>{
    plan.personIds=[...modal.querySelectorAll('.sp-person:checked')].map(cb=>cb.value);
    Object.keys(plan.overrides).forEach(pid=>{ if(!plan.personIds.includes(pid)) delete plan.overrides[pid]; });
    modal.remove(); onDone();
  };
}
function openStandbyOverrideEditor(plan, pid, onDone){
  const p=state.personnel.find(x=>x.id===pid);
  const ov=plan.overrides[pid]||{};
  const modal=document.createElement('div');

function preplanEligiblePeople(type){
  // show everyone, always — qualification gaps are surfaced per-person via

}
