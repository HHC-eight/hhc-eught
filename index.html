<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>衛哨排班</title>
<style>
:root{
  --bg:#11161c;
  --panel:#1a2029;
  --panel2:#212936;
  --line:#2c3542;
  --text:#e7ebf0;
  --dim:#8b97a6;
  --accent:#c98a3c;
  --accent2:#7d9a5f;
  --danger:#c9573c;
  --ok:#5a9a6f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",Segoe UI,sans-serif;}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom));}
h1,h2,h3{font-weight:600;margin:0 0 10px;}
h1{font-size:17px;letter-spacing:.5px;}
h2{font-size:14px;color:var(--accent);}
h3{font-size:13px;color:var(--dim);font-weight:500;}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);}
.unit-banner{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 14px 6px;background:linear-gradient(180deg,#1a2117,var(--bg));border-bottom:1px solid rgba(125,154,95,.35);}
.unit-banner-badge{width:18px;height:18px;border-radius:50%;background:var(--accent2);color:#0d130a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.unit-banner-text{font-size:12px;letter-spacing:2.5px;color:var(--accent2);font-weight:600;}
.topbar-main{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;}
.container{padding:12px 12px 40px;max-width:640px;margin:0 auto;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.2);}
button.primary{box-shadow:0 1px 4px rgba(201,138,60,.35);}
select[data-assign-cat]{border-left:3px solid var(--line);}
select[data-assign-cat]:has(option[value=""]:checked){border-left:3px solid var(--accent);}
.row{display:flex;gap:8px;align-items:center;}
.row.wrap{flex-wrap:wrap;}
.grow{flex:1;min-width:0;}
label{display:block;font-size:11px;color:var(--dim);margin-bottom:3px;}
input[type=text],input[type=date],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:9px 8px;border-radius:6px;font-size:14px;font-family:inherit;
}
select{-webkit-appearance:none;appearance:none;}
input[type=checkbox]{width:22px !important;height:22px !important;min-width:22px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
button{
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  padding:9px 12px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;
}
button.primary{background:var(--accent);border-color:var(--accent);color:#1a140a;font-weight:600;}
button.ghost{background:transparent;}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent;}
button.small{padding:5px 9px;font-size:12px;}
.topbar button.small{padding:3px 6px;font-size:11px;}
.topbar select{font-size:10px;padding:3px 4px;}
.topbar h1#pageTitle{font-size:13px;}
button{transition:transform .12s ease, opacity .12s ease;}
button:active{opacity:.6;transform:scale(.94);}
button:disabled{opacity:.3;cursor:default;}
button:disabled:active{transform:none;}
@keyframes pressFlash{0%{background-color:var(--accent);color:#1a140a;}100%{background-color:inherit;color:inherit;}}
button.press-flash{animation:pressFlash .4s ease;}
button.pressed,.pill-btn.pressed{opacity:.6;transform:scale(.94);}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom);}
.tabs button{flex:1;background:transparent;border:none;border-radius:0;padding:11px 4px;font-size:12px;color:var(--dim);}
.tabs button.active{color:var(--accent);font-weight:600;}
.list-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;}
.tag.rank-軍官{color:#c9573c;border-color:#c9573c;}
.tag.rank-士官{color:#c98a3c;border-color:#c98a3c;}
.tag.rank-士兵{color:#7d9a5f;border-color:#7d9a5f;}
.muted{color:var(--dim);font-size:12px;}
.warn{color:var(--danger);font-size:12px;}
.ok{color:var(--ok);font-size:12px;}
.shift-row{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;background:var(--panel2);}
.shift-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-bottom:6px;}
.shift-head>.muted{margin-left:auto;}
.shift-time{font-size:13px;font-weight:600;}
.slot-select{margin-bottom:4px;}
.badge-issue{display:inline-block;font-size:11px;color:var(--danger);margin-top:2px;}
.section-title{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:0;min-height:22px;}
.section-title h2,.section-title h3{margin:0;flex:1 1 auto;min-width:0;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.section-title>.row,.section-title>button{flex-shrink:0;margin-left:auto;}
.hr-table{width:100%;border-collapse:collapse;font-size:11px;}
.hr-table td,.hr-table th{padding:3px 2px;text-align:center;border-bottom:1px solid var(--line);}
.hr-table th{color:var(--dim);font-weight:500;}
.bar-wrap{background:var(--panel2);border-radius:3px;overflow:hidden;height:14px;position:relative;}
.bar-fill{background:var(--accent2);height:100%;}
.pill-btn{display:inline-block;padding:4px 9px;border-radius:14px;border:1px solid var(--line);font-size:12px;margin:2px 3px 0 0;background:var(--panel2);transition:transform .12s ease, opacity .12s ease;}
.pill-btn:active{opacity:.6;transform:scale(.93);}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:20px 0;}
.divider{height:1px;background:var(--line);margin:12px 0;}
textarea{min-height:50px;resize:vertical;}
.hint{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5;}
.time-select-pair{display:inline-flex;align-items:center;gap:3px;width:100%;}
.time-select-pair select{width:auto;flex:1;min-width:0;}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(84vw,320px);background:var(--panel);border-right:1px solid var(--line);z-index:91;overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));box-shadow:2px 0 12px rgba(0,0,0,.4);}
.fullscreen-modal{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));}
.sheet-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;}
.sheet-inner{background:var(--panel);width:100%;max-height:88vh;overflow:auto;border-radius:12px 12px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));}
.drawer h2{margin:0 0 10px;font-size:16px;}
.drawer-item{display:flex;align-items:center;gap:8px;width:100%;padding:10px 8px;margin-bottom:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:14px;text-align:left;cursor:pointer;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-head{text-align:center;font-size:11px;color:var(--dim);padding:2px 0;}
.cal-cell{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2px;cursor:pointer;overflow:hidden;}
.cal-cell.empty{border:none;background:transparent;cursor:default;}
.cal-cell.has{border-color:var(--accent);}
.cal-cell.standby-marked{border-color:var(--ok);}
.cal-cell.leave-marked{border-color:var(--danger);}
.cal-cell.leave-marked .cal-mark{color:var(--danger);}
.cal-cell.incident-marked{border-color:var(--warn,#d9a441);}
.cal-cell.standby-marked .cal-mark{color:var(--ok);}
.cal-cell.holiday .cal-day{color:var(--danger);}
.cal-day{font-size:11px;color:var(--dim);line-height:1.2;}
.cal-mark{font-size:10px;color:var(--accent);line-height:1.15;text-align:center;word-break:break-all;}
.cal-mark-outside{color:var(--warn,#d9a441);font-style:italic;}
.time-select-colon{color:var(--dim);}
</style>
</head>
<body>

<div class="topbar">
  <div class="unit-banner">
    <span class="unit-banner-badge">★</span>
    <span class="unit-banner-text">陸軍第八軍團 本部連</span>
  </div>
  <div class="topbar-main" style="flex-direction:column;align-items:stretch;gap:6px">
    <div class="row wrap" style="gap:4px;align-items:center">
      <button class="ghost small" id="preplanDrawerBtn" title="設定">☰</button>
      <h1 id="pageTitle" style="margin:0">🌟 衛哨排班系統 <span class="muted" style="font-size:10px;font-weight:400">v92</span></h1>
      <button class="ghost small" id="clearRangeBtn" title="清除一段時間">🧹 清除範圍</button>
      <span style="flex:1"></span>
      <select id="timeStepSelect" style="width:auto">
        <option value="5">5分</option>
        <option value="10">10分</option>
        <option value="30">30分</option>
      </select>
      <button class="ghost small" id="exportBtn">匯出</button>
    </div>
    <div class="row wrap" style="gap:4px;align-items:center">
      <button class="ghost small" id="undoBtn" title="復原上一步" disabled>↩️</button>
      <button class="ghost small" id="redoBtn" title="取消復原（重做）" disabled>↪️</button>
      <span class="muted" style="font-size:11px">日期：</span>
      <button class="ghost small" id="globalDatePrev">◀</button>
      <button class="ghost small" id="globalDateLabel"></button>
      <button class="ghost small" id="globalDateNext">▶</button>
      <button class="ghost small" id="globalDateToday">今天</button>
    </div>
  </div>
</div>

<div class="container" id="app"></div>

<div class="tabs">
  <button data-tab="misc">🗂 其他勤務</button>
  <button data-tab="schedule">📋 排班</button>
  <button data-tab="stats">📊 統計</button>
</div>

<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
/* ---------------- storage ---------------- */
const LS_KEY='drs_data_v1';
/* independent save-checkpoints — separate from the 50-step in-memory undo
   stack, which is lost on reload and only goes back so far. Each of the 9
   預排 types and the personnel roster gets its own checkpoint list (scope
   string), stored under its own localStorage key so restoring one never
   touches another. Capped at 20 per scope, oldest dropped first. */
function checkpointKey(scope){ return 'drs_checkpoint_'+scope; }
function listCheckpoints(scope){
  try{ return JSON.parse(localStorage.getItem(checkpointKey(scope))||'[]'); }
  catch(e){ return []; }
}
function saveCheckpoint(scope, data, label){
  const list = listCheckpoints(scope);
  list.unshift({ts:Date.now(), label:label||'', data:JSON.stringify(data)});
  if(list.length>20) list.length=20;
  localStorage.setItem(checkpointKey(scope), JSON.stringify(list));
}
function deleteCheckpoint(scope, idx){
  const list = listCheckpoints(scope);
  list.splice(idx,1);
  localStorage.setItem(checkpointKey(scope), JSON.stringify(list));
}
function checkpointTimeLabel(ts){
  const d=new Date(ts);
  return `${d.getFullYear()-1911}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
/* generic modal reused by every scope — currentDataFn returns what to save,
   applyDataFn receives a restored snapshot and writes it back into state */
function openCheckpointModal(scope, title, currentDataFn, applyDataFn){
  const modal=document.createElement('div');
  modal.className='sheet-modal'; modal.style.zIndex='97';
  const draw=()=>{
    const list = listCheckpoints(scope);
    modal.innerHTML=`
      <div class="sheet-inner">
        <div class="section-title"><h2 style="margin:0">存檔點：${esc(title)}</h2><button class="ghost small" id="cpClose">關閉</button></div>
        <div class="hint" style="margin-bottom:8px">跟復原/重做不同，存檔點是手動建立、永久保存（最多留20個，滿了會自動丟掉最舊的），關閉分頁或重新整理也不會消失，適合在做大幅調整前先存一份。</div>
        <div class="row wrap" style="margin-bottom:8px">
          <div class="grow"><label>備註（選填）</label><input type="text" id="cpLabel" placeholder="例：9月整月排定"></div>
        </div>
        <button class="primary" id="cpSave" style="width:100%;margin-bottom:8px">📌 建立存檔點</button>
        <div class="divider"></div>
        <h3>已存的存檔點（${list.length}）</h3>
        ${list.length? list.map((c,i)=>`
          <div class="list-item">
            <span class="grow">${checkpointTimeLabel(c.ts)}${c.label? `　${esc(c.label)}`:''}</span>
            <button class="ghost small" data-cp-restore="${i}">回復</button>
            <button class="ghost small danger" data-cp-del="${i}">刪除</button>
          </div>`).join('') : `<div class="empty">還沒有存檔點</div>`}
      </div>`;
    document.getElementById('cpClose').onclick=()=>modal.remove();
    document.getElementById('cpSave').onclick=()=>{
      const label=document.getElementById('cpLabel').value.trim();
      saveCheckpoint(scope, currentDataFn(), label);
      showAlert('已建立存檔點。');
      draw();
    };
    modal.querySelectorAll('[data-cp-restore]').forEach(b=>{
      b.onclick=()=>{
        const idx=Number(b.dataset.cpRestore);
        const c=list[idx];
        showConfirm(`確定要回復到「${checkpointTimeLabel(c.ts)}${c.label?'　'+c.label:''}」嗎？現在的內容會被取代（可以用左上角復原按鈕撤銷這次回復）。`, ()=>{
          applyDataFn(JSON.parse(c.data));
          saveState();
          showAlert('已回復。');
          modal.remove();
          render();
        });
      };
    });
    modal.querySelectorAll('[data-cp-del]').forEach(b=>{
      b.onclick=()=>{
        deleteCheckpoint(scope, Number(b.dataset.cpDel));
        draw();
      };
    });
  };
  document.body.appendChild(modal);
  draw();
}
function loadState(){
  const raw=localStorage.getItem(LS_KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return {
    personnel: [],
    categories: defaultCategories(),
    unavail: {},      // date -> [{id,personId,allDay,start,end}]
    assign: {},       // date -> categoryId -> shiftId -> [personId,...]
    misc: {},         // date -> [{id,role,text}]
    miscCustomPresets: [] // [{role,start,end}] user-added quick-add presets for 其他勤務
  };
}
function saveState(){
  // stash the state as it was BEFORE this change onto the undo stack, so
  // repeated undo presses can keep walking back through history — capped
  // to avoid unbounded memory/localStorage growth over a long session
  if(typeof lastSavedSnapshot!=='undefined'){
    undoStack.push(lastSavedSnapshot);
    if(undoStack.length>UNDO_LIMIT) undoStack.shift();
  }
  redoStack=[]; // a fresh change invalidates whatever "future" redo had
  lastSavedSnapshot = JSON.stringify(state);
  localStorage.setItem(LS_KEY, lastSavedSnapshot);
  if(typeof refreshUndoButton==='function') refreshUndoButton();
}
const UNDO_LIMIT=50;
let undoStack=[];
let redoStack=[];
let lastSavedSnapshot; // set on first load, see below
function undoLastAction(){
  if(!undoStack.length) return;
  const prevSnapshot = undoStack.pop();
  redoStack.push(lastSavedSnapshot);
  state = JSON.parse(prevSnapshot);
  lastSavedSnapshot = prevSnapshot;
  localStorage.setItem(LS_KEY, prevSnapshot);
  if(typeof refreshUndoButton==='function') refreshUndoButton();
  render();
}
function redoLastAction(){
  if(!redoStack.length) return;
  const nextSnapshot = redoStack.pop();
  undoStack.push(lastSavedSnapshot);
  state = JSON.parse(nextSnapshot);
  lastSavedSnapshot = nextSnapshot;
  localStorage.setItem(LS_KEY, nextSnapshot);
  if(typeof refreshUndoButton==='function') refreshUndoButton();
  render();
}

function uid(){ return Math.random().toString(36).slice(2,9); }

/* explicit press feedback for every button/pill, via one delegated listener
   on document (so it keeps working through re-renders without re-wiring) —
   iOS Safari's :active pseudo-class doesn't reliably fire on tap by itself,
   so we toggle a class directly on touch/mouse down and up instead. */
(function(){
  function pressOn(ev){
    const el = ev.target.closest('button, .pill-btn');
    if(el){
      el.classList.add('pressed');
      if(navigator.vibrate){ try{ navigator.vibrate(10); }catch(e){} }
    }
  }
  function pressOff(){
    document.querySelectorAll('.pressed').forEach(el=>el.classList.remove('pressed'));
  }
  document.addEventListener('touchstart', pressOn, {passive:true});
  document.addEventListener('touchend', pressOff, {passive:true});
  document.addEventListener('touchcancel', pressOff, {passive:true});
  document.addEventListener('mousedown', pressOn);
  document.addEventListener('mouseup', pressOff);
  document.addEventListener('mouseleave', pressOff);
})();

/* ---------------- rank system ---------------- */
const RANK_DEFS=[
  {rank:'少校',cat:'軍官'},{rank:'上尉',cat:'軍官'},{rank:'中尉',cat:'軍官'},{rank:'少尉',cat:'軍官'},
  {rank:'士官長',cat:'士官'},{rank:'上士',cat:'士官'},{rank:'中士',cat:'士官'},{rank:'下士',cat:'士官'},
  {rank:'上兵',cat:'士兵'},{rank:'一兵',cat:'士兵'},{rank:'二兵',cat:'士兵'},{rank:'訓練役',cat:'士兵'}
];
function rankIndex(rank){ const i=RANK_DEFS.findIndex(r=>r.rank===rank); return i<0?RANK_DEFS.length:i; }
function rankCategory(rank){ const r=RANK_DEFS.find(r=>r.rank===rank); return r?r.cat:''; }
function rankOptionsHTML(selected){
  const groups=['軍官','士官','士兵'];
  return groups.map(g=>`<optgroup label="${g}">${RANK_DEFS.filter(r=>r.cat===g).map(r=>`<option value="${r.rank}" ${r.rank===selected?'selected':''}>${r.rank}</option>`).join('')}</optgroup>`).join('');
}
/* duty-assignment priority (distinct from roster display order in RANK_DEFS):
   for 低階優先 categories (橋哨/指管) 下士 is the top preferred rank;
   for 需士官帶隊 categories (打飯班) the lead preference order is 下士 → 中士 → 上士 → 士官長 */
const LOW_RANK_PRIORITY=['下士','二兵','一兵','上兵','中士','上士','士官長','少尉','中尉','上尉','少校'];
const NCO_LEAD_PRIORITY=['下士','中士','上士','士官長','少尉','中尉','上尉','少校','二兵','一兵','上兵'];
/* for a needsNCO category (打飯班): slot 0 is the leader (pick an NCO, 下士
   first — see NCO_LEAD_PRIORITY above), every other slot is a helper and
   should go to an enlisted soldier first, only reaching for another NCO or
   an officer if no soldier is available. */
const MEAL_HELPER_PRIORITY=['訓練役','二兵','一兵','上兵','下士','中士','上士','士官長','少尉','中尉','上尉','少校'];
function dutySortIndex(rank, cat, slotIdx, shift){
  // 整天 (all-day) meal duty isn't a leadership shift — the NCO requirement
  // for 打飯班 is satisfied elsewhere (早/午/晚 each get their own leader), so
  // every slot on 整天 just prefers the lowest-rank enlisted first.
  if(cat.needsNCO && shift && shift.label==='整天'){
    const helperOrder = cat.customPriorityHelper || MEAL_HELPER_PRIORITY;
    const i=helperOrder.indexOf(rank);
    return i<0? helperOrder.length : i;
  }
  const order = cat.needsNCO
    ? ((slotIdx||0)===0 ? (cat.customPriority||NCO_LEAD_PRIORITY) : (cat.customPriorityHelper||MEAL_HELPER_PRIORITY))
    : (cat.customPriority ? cat.customPriority : (cat.preferLowRank ? LOW_RANK_PRIORITY : null));
  let base = order ? (order.indexOf(rank)<0? order.length : order.indexOf(rank)) : rankIndex(rank);
  // a rank the category would rather not use (but may, if nobody else is
  // available) gets pushed to the very back of the priority order
  if((cat.avoidRanks||[]).includes(rank)) base += 1000;
  return base;
}
/* a rank a category can NEVER use (hard rule, e.g. 訓練役 can't stand 安全士官)
   — unlike avoidRanks above, this excludes the person entirely, not just
   de-prioritizes them */
function rankExcludedFromCategory(rank, cat){
  return (cat.excludeRanks||[]).includes(rank);
}
const GROUP_OPTIONS=['連部','連部組','行政排','勤務排','運輸排','設維組','醫務組'];
function groupIndex(g){ const i=GROUP_OPTIONS.indexOf(g); return i<0?GROUP_OPTIONS.length:i; }
function groupOptionsHTML(selected){
  return `<option value="" ${!selected?'selected':''}>（未分組）</option>` +
    GROUP_OPTIONS.map(g=>`<option value="${g}" ${g===selected?'selected':''}>${g}</option>`).join('');
}

function defaultCategories(){
  return [
    {id:'safety',name:'安全士官',enforceRest:true,preferLowRank:false,needsNCO:false,isSentry:true,excludeRanks:['訓練役'],avoidRanks:['二兵'],
      shifts:[
        sh('22:00','24:00',1,'','08:00'),sh('00:00','02:00',1,'','08:00'),sh('02:00','04:00',1,'','08:00'),sh('04:00','06:00',1,'','08:00'),

  if(!crossesMidnight) return spillover? false : windowsOverlapOnce(s,e,us,ue);
  if(spillover) return ue>0 && windowsOverlapOnce(s,e,0,ue);
  return windowsOverlapOnce(s,e,us,1440);
}
function isPersonUnavailable(personId, date, s, e, excludeCatShift){
  // s,e in minutes-of-day (0-1440-ish), plain (not absolute-unwrapped)
  const person = state.personnel.find(p=>p.id===personId);
  if(person){
    if(person.departureDate && date>=person.departureDate) return true;
    const lt = effectiveLongTerm(person, date);
    if(lt.mode==='allday') return true;
    if(lt.mode==='range' && lt.start && lt.end && windowsOverlapRecurring(s,e,toMin(lt.start),toMin(lt.end))) return true;
  }
  const entries=(state.unavail[date]||[]).filter(u=>u.personId===personId);
  for(const u of entries){
    if(u.allDay) return true;
    if(incidentBlocksWindow(u, s, e, false)) return true;
  }
  /* an incident logged as e.g. 22:00-02:00 runs past midnight, so the
     00:00-02:00 half belongs to the NEXT calendar day — check yesterday's
     entries for any that spill over into this one */
  const prevEntries=(state.unavail[prevDateStr(date)]||[]).filter(u=>u.personId===personId);
  for(const u of prevEntries){
    if(u.allDay) continue;
    if(incidentBlocksWindow(u, s, e, true)) return true;
  }
  for(const w of personCompRestWindows(personId, date)){
    if(windowsOverlapRecurring(s,e,toMin(w.start),toMin(w.end))) return true;
  }
  /* avoid double-booking against the person's other current assignments.
     The busy window runs from the (possibly prep-time-shifted) start to the
     wrapped end; both ends can fall outside 0-1440 — a sentry shift starting
     00:00 has its 30-minute prep at 23:30 the previous day, and an all-day
     shift like 06:30-06:30 wraps a full 24h — so this must use the
     wrap-aware overlap, otherwise those cases produce a backwards window
     that never matches and the person gets booked twice. */
  const dayAssign = state.assign[date]||{};
  for(const cat of state.categories){
    const catAssign = dayAssign[cat.id]||{};
    for(const sft of effectiveShifts(cat, date)){
      if(excludeCatShift && excludeCatShift.catId===cat.id && excludeCatShift.shiftId===sft.id) continue;
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapRecurring(s,e,shiftBusyStartMin(cat,sft),wrapEndMin(toMin(sft.start),toMin(sft.end)))) return true;
    }
  }
  // avoid double-booking against 其他勤務 (misc) commitments that have a defined time window
  for(const m of (state.misc[date]||[])){
    if((m.nominalIds||[]).includes(personId)) continue; // 掛名：rostered but not actually blocking
    if(m.start && m.end && (m.personIds||[]).includes(personId) && windowsOverlapOnce(s,e,toMin(m.start),toMin(m.end))) return true;
    // a misc duty may also grant 補休 afterwards (e.g. 值班 07:00-07:00 補休至12:00)
    if(m.restUntil && m.end && (m.personIds||[]).includes(personId) && windowsOverlapRecurring(s,e,toMin(m.end),toMin(m.restUntil))) return true;
  }
  return false;
}

function personName(id){ const p=state.personnel.find(p=>p.id===id); return p?p.name:'—'; }
/* the 🚗駕照·⛑️EMT·🔧專長 badge string used consistently across every person
   dropdown/checkbox in the app, so qualifications are visible wherever
   you're picking someone regardless of which UI widget it's rendered in */
function personBadges(p){
  return `${p.license? '·🚗'+esc(p.license):''}${p.medCert? '·⛑️'+esc(p.medCert):''}${(p.skills&&p.skills.length)? '·🔧'+p.skills.map(esc).join('/'):''}`;
}
/* for the ad-hoc "who's free right now, and for how long" query: steps forward
   in 15-minute increments from queryMin until the person becomes unavailable
   (leave, long-term, comp-rest, or an existing assignment) or the day ends */
/* explains WHY a person is unavailable at a given minute — used by the
   指定時間查詢 so the result shows the actual reason, not just a count */
function unavailabilityReasonsInRange(personId, date, s, e){
  const out=[];
  const person = state.personnel.find(p=>p.id===personId);
  if(person){
    if(person.departureDate && date>=person.departureDate) out.push(`已離退（${minguoLabel(person.departureDate)}起）`);
    const lt = effectiveLongTerm(person, date);
    if(lt.mode==='allday') out.push('長期事故：全天不可排');
    else if(lt.mode==='range' && lt.start && lt.end && windowsOverlapRecurring(s,e,toMin(lt.start),toMin(lt.end))) out.push(`長期事故：每天 ${lt.start}-${lt.end} 不可排`);
  }
  (state.unavail[date]||[]).filter(u=>u.personId===personId).forEach(u=>{
    const hit = u.allDay || incidentBlocksWindow(u, s, e, false);
    if(hit) out.push(`${u.allDay? '全天':`${u.start}-${u.end}`}${u.reason? '（'+u.reason+'）':'（未註記原因）'}`);
  });
  for(const w of personCompRestWindows(personId, date)){
    if(windowsOverlapRecurring(s,e,toMin(w.start),toMin(w.end))) out.push(`補休中（${w.catName} ${w.label} 後，至 ${w.end}）`);
  }
  const dayAssign = state.assign[date]||{};
  state.categories.forEach(cat=>{
    const catAssign = dayAssign[cat.id]||{};
    effectiveShifts(cat, date).forEach(sft=>{
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapRecurring(s,e,shiftBusyStartMin(cat,sft),wrapEndMin(toMin(sft.start),toMin(sft.end)))){
        out.push(`勤務中：${cat.name} ${sft.label||sft.start+'-'+sft.end}${cat.enforceRest?'（含準備時間）':''}`);
      }
    });
  });
  (state.misc[date]||[]).forEach(m=>{
    if(!(m.personIds||[]).includes(personId)) return;
    if(m.start && m.end && windowsOverlapOnce(s,e,toMin(m.start),toMin(m.end))) out.push(`勤務中：${m.role}${m.start&&m.end?` (${m.start}-${m.end})`:''}`);
    else if(m.restUntil && m.end && windowsOverlapRecurring(s,e,toMin(m.end),toMin(m.restUntil))) out.push(`補休中（${m.role} 後，至 ${m.restUntil}）`);
  });
  // de-dupe: duplicate underlying records (e.g. someone accidentally
  // registered twice) shouldn't repeat the exact same reason text over and
  // over in the displayed list
  const deduped = [...new Set(out)];
  return deduped.length? deduped : ['不可排（原因不明）'];
}
function freeDurationFrom(personId, date, queryMin){
  if(isPersonUnavailable(personId, date, queryMin, queryMin+1)) return 0;
  const step=15; let t=queryMin;
  while(t<1440){
    if(isPersonUnavailable(personId, date, t, Math.min(t+step,1440))) break;
    t+=step;
  }
  return Math.min(t,1440)-queryMin;
}
function personRank(id){ const p=state.personnel.find(p=>p.id===id); return p?p.rank:''; }

/* gather all assignment instances for a person on a date, across enforceRest categories,
   with absolute minute ranges, for rest / daily-hour checking */
function personEnforcedShifts(personId, date, excludeCatShift){
  const dayAssign = state.assign[date]||{};
  const out=[];
  state.categories.filter(c=>c.enforceRest).forEach(cat=>{
    const abs = absoluteShiftTimes(cat, date);
    const catAssign = dayAssign[cat.id]||{};
    effectiveShifts(cat, date).forEach(s=>{
      if(excludeCatShift && excludeCatShift.catId===cat.id && excludeCatShift.shiftId===s.id) return;
      const list = catAssign[s.id]||[];
      if(list.includes(personId)){
        out.push({catId:cat.id,catName:cat.name,shiftId:s.id,label:s.label|| (s.start+'-'+s.end), ...abs[s.id]});
      }
    });
  });
  return out.sort((a,b)=>a.abs_s-b.abs_s);
}

function restIssues(personId, date, catId, shift){
  // returns array of warning strings if assigning personId to this shift breaks the 6h rest / 6h per day rule
  const cat = state.categories.find(c=>c.id===catId);
  if(!cat.enforceRest) return [];
  const abs = absoluteShiftTimes(cat, date)[shift.id];
  const existing = personEnforcedShifts(personId, date, {catId, shiftId:shift.id});
  const all = [...existing, {abs_s:abs.abs_s, abs_e:abs.abs_e, catName:cat.name, label: shift.label||(shift.start+'-'+shift.end)}].sort((a,b)=>a.abs_s-b.abs_s);
  const issues=[];
  let totalMin=0;
  for(let i=0;i<all.length;i++){
    totalMin += (all[i].abs_e-all[i].abs_s);
    if(i>0){
      const gap = all[i].abs_s - all[i-1].abs_e;
      if(gap < 0){ issues.push(`與「${all[i-1].catName} ${all[i-1].label}」時段重疊`); }
      else if(gap < 360){ issues.push(`與「${all[i-1].catName} ${all[i-1].label}」間隔僅 ${Math.round(gap/60*10)/10} 小時（需滿6小時）`); }
    }
  }
  if(totalMin>360){ issues.push(`當日累計勤務 ${Math.round(totalMin/60*10)/10} 小時，超過上限6小時`); }
  return issues;
}

/* would assigning this shift create a 補休(comp-rest) window that overlaps a
   commitment the person ALREADY has — a 其他勤務(misc) entry with a defined
   time, or a non-enforceRest category shift (e.g. 打飯班) — that restIssues
   above doesn't check (it only compares against OTHER enforceRest shifts)? */
function wouldRestWindowConflict(personId, date, shift, excludeCatShift){
  if(!shift.restUntil) return false;
  const winStart=toMin(shift.end), winEnd=toMin(shift.restUntil);
  for(const m of (state.misc[date]||[])){
    if(m.start && m.end && (m.personIds||[]).includes(personId) && windowsOverlapRecurring(toMin(m.start),toMin(m.end),winStart,winEnd)) return true;
  }
  const dayAssign=state.assign[date]||{};
  for(const cat of state.categories){
    if(cat.enforceRest) continue;
    const catAssign=dayAssign[cat.id]||{};
    for(const sft of effectiveShifts(cat, date)){
      if(excludeCatShift && excludeCatShift.catId===cat.id && excludeCatShift.shiftId===sft.id) continue;
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapRecurring(toMin(sft.start),toMin(sft.end),winStart,winEnd)) return true;
    }
  }
  return false;
}

/* 衛哨 shifts need PREP_MINUTES of prep beforehand — check whether the
   person was still doing something else (其他勤務 or a non-rest-enforced
   category shift like 打飯班) too close before this shift starts. This is
   the one place PREP_MINUTES applies; it deliberately does NOT feed into
   the sentry-to-sentry 6-hour rule (restIssues/absoluteShiftTimes), which
   stays on nominal shift times. Example: 採買 ending at 08:00 immediately
   followed by an 08:00-12:00 衛哨 shift leaves no prep time — flagged;
   two 衛哨 shifts 6 hours apart are NOT affected by this rule. */
function prepGapConflict(personId, date, cat, shift){
  if(!cat.enforceRest) return false;
  const shiftStart=toMin(shift.start);
  const prepStart=((shiftStart-PREP_MINUTES)%1440+1440)%1440;
  for(const m of (state.misc[date]||[])){
    if(m.start && m.end && (m.personIds||[]).includes(personId) && windowsOverlapOnce(prepStart,shiftStart,toMin(m.start),toMin(m.end))) return true;
  }
  const dayAssign=state.assign[date]||{};
  for(const c of state.categories){
    if(c.enforceRest) continue;
    const catAssign=dayAssign[c.id]||{};
    for(const sft of effectiveShifts(c, date)){
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapOnce(prepStart,shiftStart,toMin(sft.start),toMin(sft.end))) return true;
    }
  }
  return false;
}

/* the smallest gap this candidate would end up with, immediately before or
   after this shift, against their other enforceRest shifts today — used to
   prefer spacing people out further apart rather than always clustering
   everyone right at the 6-hour minimum */
function minAdjacentGap(personId, date, cat, shift){
  if(!cat.enforceRest) return Infinity;
  const abs=absoluteShiftTimes(cat, date)[shift.id];
  const existing=personEnforcedShifts(personId, date, {catId:cat.id, shiftId:shift.id});
  let minGap=Infinity;
  existing.forEach(ex=>{
    if(ex.abs_e<=abs.abs_s) minGap=Math.min(minGap, abs.abs_s-ex.abs_e);
    else if(abs.abs_e<=ex.abs_s) minGap=Math.min(minGap, ex.abs_s-abs.abs_e);
  });
  return minGap;
}

/* Fills only EMPTY slots for the given date — never overwrites an existing
   manual assignment. Greedy, shift-by-shift in each category's listed order:
   skip anyone unavailable/already double-booked for that slot, then rank
   candidates by (fewest rest-rule issues, duty priority for that category,
   fewest shifts already given out today, roster rank order). */
/* would placing `person` in this category's shift break the supervising-rank
   rule, either because this IS the supervising post and someone senior is
   already on another overlapping post, or because this is an ordinary post
   and the person would outrank whoever holds the supervising post? */
function wouldBreakOutrankRule(person, cat, shift, date, arr, idx){
  const sMin = toMin(shift.start), eMin = wrapEndMin(sMin, toMin(shift.end));
  const dayAssign = state.assign[date]||{};
  const overlappingAssigned = [];
  orderedCategories().forEach(other=>{
    const otherAssign = dayAssign[other.id]||{};
    effectiveShifts(other, date).forEach(osft=>{
      const oS = toMin(osft.start), oE = wrapEndMin(oS, toMin(osft.end));
      if(!windowsOverlapOnce(sMin,eMin,oS,oE)) return;
      (otherAssign[osft.id]||[]).forEach((opid,oidx)=>{
        if(!opid) return;
        if(other.id===cat.id && osft.id===shift.id && oidx===idx) return; // the slot being filled
        const op = state.personnel.find(p=>p.id===opid);
        if(op) overlappingAssigned.push({cat:other, person:op});
      });
    });
  });
  if(cat.mustOutrankOthers){
    // this is the supervising post — nobody else overlapping may outrank it
    return overlappingAssigned.some(a=>!a.cat.mustOutrankOthers && rankIndex(a.person.rank) < rankIndex(person.rank));
  }
  // ordinary post — must not outrank whoever holds a supervising post
  return overlappingAssigned.some(a=>a.cat.mustOutrankOthers && rankIndex(person.rank) < rankIndex(a.person.rank));
}
function autoAssignDay(date){
  if(!state.assign[date]) state.assign[date]={};
  const assignCount={};
  const allSlots=[];
  state.categories.forEach(cat=>{
    if(!state.assign[date][cat.id]) state.assign[date][cat.id]={};
    const abs=absoluteShiftTimes(cat, date);
    effectiveShifts(cat, date).forEach(s=>{
      if(!state.assign[date][cat.id][s.id]) state.assign[date][cat.id][s.id]=[];
      allSlots.push({cat, s, absStart:abs[s.id].abs_s});
    });
  });
  allSlots.sort((a,b)=>a.absStart-b.absStart);
  allSlots.forEach(({cat,s})=>{
    const arr=state.assign[date][cat.id][s.id];
    const sMin=toMin(s.start), eMin=wrapEndMin(sMin, toMin(s.end));
    // "最少需要幾位士官(含)以上" is a HARD floor: while it's still unmet,
    // only 士官/軍官 candidates are considered for the remaining empty
    // slots, so auto-assign leaves a slot empty rather than quietly
    // filling it with a non-NCO just to hit the headcount. Once the floor
    // is met (or every empty slot has been tried), the rest fill normally.
    let ncoStillNeeded = Math.max(0, (s.minNCO||0) - arr.filter(pid=>pid && ['士官','軍官'].includes(rankCategory(personRank(pid)))).length);
    for(let idx=0; idx<s.count; idx++){
      if(!arr[idx]){
        const rawCandidatesAll = state.personnel.filter(p=>
          !arr.includes(p.id) && !rankExcludedFromCategory(p.rank,cat) &&
          !isPersonUnavailable(p.id, date, sMin, eMin, {catId:cat.id, shiftId:s.id}) &&
          !isPersonOnExclusiveStandby(p.id, date) &&
          !isDutyOfficer(p.id, date)
        );
        const rawCandidates = ncoStillNeeded>0
          ? rawCandidatesAll.filter(p=>['士官','軍官'].includes(rankCategory(p.rank)))
          : rawCandidatesAll;
        const restOk = cat.enforceRest
          ? rawCandidates.filter(p=>restIssues(p.id,date,cat.id,s).length===0 && !assignedSameShiftYesterday(p.id,date,cat.id,s.id) && !wouldRestWindowConflict(p.id,date,s,{catId:cat.id,shiftId:s.id}) && !prepGapConflict(p.id,date,cat,s))
          : rawCandidates;
        /* 安全士官-style rank supervision is applied as a PREFERENCE, not a
           hard filter: prefer candidates that keep the ranking valid, but
           if none exist, still fill the slot rather than leaving a hole
           (the card will show a ⚠️ so it's visible and fixable by hand). */
        const rankOk = restOk.filter(p=>!wouldBreakOutrankRule(p, cat, s, date, arr, idx));
        const candidates = rankOk.length? rankOk : restOk;
        if(candidates.length){
        candidates.sort((a,b)=>{
          const aCnt=assignCount[a.id]||0, bCnt=assignCount[b.id]||0;
          if(aCnt!==bCnt) return aCnt-bCnt;
          const aDuty=dutySortIndex(a.rank,cat,idx,s), bDuty=dutySortIndex(b.rank,cat,idx,s);
          if(aDuty!==bDuty) return aDuty-bDuty;
          const aGap=minAdjacentGap(a.id,date,cat,s), bGap=minAdjacentGap(b.id,date,cat,s);
          if(aGap!==bGap) return bGap-aGap;
          return rankIndex(a.rank)-rankIndex(b.rank);
        });
        const chosen=candidates[0];
        arr[idx]=chosen.id;
        assignCount[chosen.id]=(assignCount[chosen.id]||0)+1;
        if(['士官','軍官'].includes(rankCategory(chosen.rank))) ncoStillNeeded=Math.max(0,ncoStillNeeded-1);
        }
      } else {
        assignCount[arr[idx]]=(assignCount[arr[idx]]||0)+1;
      }
    }
  });
  saveState();
}

const MISC_SIBLING_ROLE={'採買':'愛心便當','愛心便當':'採買'};
function autoAssignMiscForDate(date){
  if(!state.misc[date]) state.misc[date]=[];
  state.miscPresets.filter(p=>p.fixed).forEach(preset=>{
    const roles = preset.roles;
    const times = presetTimes(preset);
    if(times.length===1){
      const exists = state.misc[date].some(m=>m.role===preset.role);
      if(!exists){
        const t=times[0];
        state.misc[date].push({
          id:uid(), role:preset.role, start:t.start, end:t.end, restUntil:preset.restUntil||'',
          roles: roles?[...roles]:undefined,
          personIds: roles? roles.map(()=>undefined) : []
        });
      }
      return;
    }
    times.forEach(t=>{
      const exists = state.misc[date].some(m=>m.role===preset.role && m.start===t.start && m.end===t.end);
      if(!exists){
        state.misc[date].push({
          id:uid(), role:preset.role, start:t.start, end:t.end, restUntil:preset.restUntil||'',
          roles: roles?[...roles]:undefined,
          personIds: roles? roles.map(()=>undefined) : []
        });
      }
    });
  });
  /* process entries with the strictest requirements first (most required
     license/EMT/skill types, weighted by how many of the entry's role
     slots actually need one — an item where BOTH driver and chief need
     EMT is harder to fill than one where only the driver does, so it
     should get first pick of the few EMT-qualified people), so a rare
     qualification doesn't get used up by an earlier, less picky entry
     that could have been filled by almost anyone. Entries tied on
     requirement count fall back to the card's own display order
     (sortOrder) — this only reorders the AUTO-ASSIGN pass itself, not the
     entries' stored order or how they're displayed. */
  function miscEntryRequirementScore(entry){
    const preset = presetForEntry(entry);
    if(!preset) return 0;
    let score = 0;
    if((preset.requiredLicenses||[]).length) score++;
    if(preset.requiredMedCert) score++;
    if((preset.requiredSkills||[]).length) score++;
    if(entry.roles && entry.roles.includes('車長')){
      if(preset.requiredMedCert) score++; // chief shares the same EMT requirement as the driver
      if(preset.chiefRequiredMedCert) score++;
      if((preset.chiefRequiredLicenses||[]).length) score++;
      if((preset.chiefRequiredSkills||[]).length) score++;
    }
    return score;
  }
  const processingOrder = [...state.misc[date]].sort((a,b)=>{
    const sa=miscEntryRequirementScore(a), sb=miscEntryRequirementScore(b);
    if(sa!==sb) return sb-sa;
    const pa=presetForEntry(a), pb=presetForEntry(b);
    return (pa?(pa.sortOrder??999):999) - (pb?(pb.sortOrder??999):999);
  });
  processingOrder.forEach(entry=>{
    if(!entry.roles){
      if(!entry.personIds) entry.personIds=[];
      const alreadyHasSomeone = entry.personIds.some(id=>id);
      if(!alreadyHasSomeone && !entry.skipAutoFill){
        const sMin = entry.start? toMin(entry.start) : null;
        const eMinRaw = entry.end? toMin(entry.end) : null;
        const presetForSort = presetForEntry(entry);
        const candidates = state.personnel.filter(p=>
          !(sMin!==null && eMinRaw!==null && isPersonUnavailable(p.id, date, sMin, wrapEndMin(sMin, eMinRaw))) &&
          driverQualificationIssues(p, presetForSort).length===0 &&
          !personHasConflictingStandby(p.id, date, presetForSort, entry.id) &&
          !isPersonOnExclusiveStandby(p.id, date, entry.id) &&
          (entry.role==='值星' || !isDutyOfficer(p.id, date))
        );
        if(candidates.length){
          candidates.sort((a,b)=>{
            const skillMatch = p=> (p.skills||[]).includes(entry.role) ? 0 : 1;
            const sa=skillMatch(a), sb=skillMatch(b);
            if(sa!==sb) return sa-sb;
            return rankPriorityIndex(a.rank,presetForSort)-rankPriorityIndex(b.rank,presetForSort) || groupIndex(a.group)-groupIndex(b.group);
          });
          entry.personIds[0]=candidates[0].id;
        }
      }
      return;
    }
    if(!entry.personIds) entry.personIds=entry.roles.map(()=>undefined);
    const preset=presetForEntry(entry);
    const sMinEntry = entry.start? toMin(entry.start) : null;
    const eMinRawEntry = entry.end? toMin(entry.end) : null;
    const freeForEntry = p=>
      !entry.personIds.includes(p.id) &&
      !(sMinEntry!==null && eMinRawEntry!==null && isPersonUnavailable(p.id, date, sMinEntry, wrapEndMin(sMinEntry, eMinRawEntry))) &&
      !personHasConflictingStandby(p.id, date, preset, entry.id) &&
      !isPersonOnExclusiveStandby(p.id, date, entry.id) &&
      (entry.role==='值星' || !isDutyOfficer(p.id, date));
    /* 駕駛+車長 must be solved as a PAIR, not one slot at a time. Filling
       駕駛 greedily with the highest-priority candidate can strand the
       車長 slot: 車長 may not rank below 駕駛, so picking the most senior
       qualified person as driver leaves nobody eligible to be chief, and
       the slot silently stays empty even when a workable pairing existed
       (e.g. 上士+中士 both EMT-qualified → should be 駕駛=中士,
       車長=上士, not 駕駛=上士 + empty). Search valid (driver, chief)
       combinations and prefer the one that fills BOTH slots. */
    const driverIdx = entry.roles.indexOf('駕駛');
    const chiefIdx = entry.roles.indexOf('車長');
    if(driverIdx>-1 && chiefIdx>-1 && !entry.personIds[driverIdx] && !entry.personIds[chiefIdx]
       && !(entry.lockedSlots && (entry.lockedSlots[driverIdx] || entry.lockedSlots[chiefIdx]))){
      const driverPool = state.personnel.filter(p=>freeForEntry(p) && driverQualificationIssues(p, preset).length===0);
      const chiefPool = state.personnel.filter(p=>freeForEntry(p) && chiefEligible(p, preset, null));
      const rankOf = p=>rankPriorityIndex(p.rank,preset);
      let best=null;
      driverPool.forEach(d=>{
        chiefPool.forEach(c=>{
          if(c.id===d.id) return;
          if(!chiefEligible(c, preset, d)) return;
          // prefer the pairing whose combined priority is best, so the
          // usual "lower rank drives" outcome falls out naturally
          const score = rankOf(d)+rankOf(c);
          if(!best || score<best.score) best={d,c,score};
        });
      });
      if(best){
        entry.personIds[driverIdx]=best.d.id;
        entry.personIds[chiefIdx]=best.c.id;
      } else {
        // no pairing fills both — fall back to filling whichever single
        // slot we can, rather than leaving the whole item untouched
        if(driverPool.length) entry.personIds[driverIdx]=driverPool.sort((a,b)=>rankOf(a)-rankOf(b))[0].id;
        else if(chiefPool.length) entry.personIds[chiefIdx]=chiefPool.sort((a,b)=>rankOf(a)-rankOf(b))[0].id;
      }
    }
    entry.roles.forEach((r,i)=>{
      if(entry.personIds[i]) return;
      if(entry.lockedSlots && entry.lockedSlots[i]) return;
      let eligibleFn;
      if(r==='駕駛'){
        eligibleFn = p=>driverQualificationIssues(p, preset).length===0;
      } else if(r==='車長'){
        const dIdx=entry.roles.indexOf('駕駛');
        const driver = dIdx>-1? state.personnel.find(p=>p.id===entry.personIds[dIdx]) : null;
        eligibleFn = p=>chiefEligible(p, preset, driver);
      } else if(r.startsWith('話務')){
        eligibleFn = p=>!!p.license;
      } else {
        eligibleFn = ()=>true;
      }
      const candidates = state.personnel.filter(p=>freeForEntry(p) && eligibleFn(p));
      if(candidates.length){
        candidates.sort((a,b)=>rankPriorityIndex(a.rank,preset)-rankPriorityIndex(b.rank,preset) || groupIndex(a.group)-groupIndex(b.group));
        let chosen = candidates[0];
        const siblingRole = MISC_SIBLING_ROLE[entry.role];
        if(siblingRole){
          const sibling = state.misc[date].find(m=>m.role===siblingRole && m.roles);
          const siblingIdx = sibling? sibling.roles.indexOf(r) : -1;
          const siblingPersonId = siblingIdx>-1? sibling.personIds[siblingIdx] : null;
          const match = siblingPersonId && candidates.find(c=>c.id===siblingPersonId);
          if(match) chosen = match;
        }
        entry.personIds[i]=chosen.id;
      }
    });
  });
  saveState();
}

function openPreplanDrawer(){
  const backdrop=document.createElement('div');

  drawer.className='drawer';
  const drawDrawer=()=>{

           but be empty (e.g. everything cleared out of it), and counting
           bare keys made "清空本月" look like it hadn't worked */
        const planned = t.key==='leave'
          ? Object.values(store).filter(r=>(r.dates||[]).length).length
          : Object.keys(store).filter(d=>preplanCellMark(t, store[d])).length;
        return `<div class="drawer-item" data-pp-idx="${i}" data-preplan-open="${t.key}">
          <span data-pp-handle style="cursor:grab;color:var(--dim);padding-right:2px;touch-action:none">⠿</span>
          <span style="font-size:18px">${t.icon}</span>
          <span class="grow">${t.name}<br><span class="hint">${planned? (t.key==='leave'? `已排 ${planned} 人`:`已預排 ${planned} 天`):'尚未預排'}</span></span>
          <span style="color:var(--dim)">›</span>
        </div>`;
      }).join('')}
      </div>`;
    document.getElementById('drawerClose').onclick=close;
    drawer.querySelector('[data-open-roster]').onclick=()=>{ close(); currentTab='people'; render(); };
    drawer.querySelectorAll('[data-preplan-open]').forEach(b=>{
      b.onclick=(e)=>{
        if(e.target.hasAttribute('data-pp-handle')) return;
        close(); openPreplanCalendar(b.dataset.preplanOpen);
      };
    });
    /* reorder by dragging the ⠿ handle. HTML5 drag-and-drop doesn't fire on
       touch screens, so this tracks touch/pointer movement directly and
       works out which row the finger is currently over. */
    let dragIdx=null, dragEl=null;
    const rowAt=(clientY)=>{
      let found=null;
      drawer.querySelectorAll('[data-pp-idx]').forEach(el=>{
        const r=el.getBoundingClientRect();
        if(clientY>=r.top && clientY<=r.bottom) found=el;
      });
      return found;
    };
    const endDrag=(clientY)=>{
      if(dragIdx===null) return;
      if(dragEl) dragEl.style.opacity='';
      const target=rowAt(clientY);
      const to=target? Number(target.dataset.ppIdx) : null;
      const from=dragIdx;
      dragIdx=null; dragEl=null;
      if(to===null || to===from) { drawDrawer(); return; }
      const order=orderedPreplanTypes().map(t=>t.key);
      const [moved]=order.splice(from,1);
      order.splice(to,0,moved);
      state.preplanOrder=order; saveState(); drawDrawer();
    };
    drawer.querySelectorAll('[data-pp-handle]').forEach(h=>{
      const row=h.closest('[data-pp-idx]');
      const start=(clientY)=>{ dragIdx=Number(row.dataset.ppIdx); dragEl=row; row.style.opacity='.5'; };
      h.addEventListener('touchstart', e=>{ e.preventDefault(); e.stopPropagation(); start(e.touches[0].clientY); }, {passive:false});
      h.addEventListener('touchmove', e=>{
        if(dragIdx===null) return;
        e.preventDefault();
        const over=rowAt(e.touches[0].clientY);
        drawer.querySelectorAll('[data-pp-idx]').forEach(el=>el.style.borderColor='');
        if(over && Number(over.dataset.ppIdx)!==dragIdx) over.style.borderColor='var(--accent)';
      }, {passive:false});
      h.addEventListener('touchend', e=>{ e.preventDefault(); endDrag(e.changedTouches[0].clientY); }, {passive:false});
      h.addEventListener('mousedown', e=>{
        e.preventDefault(); e.stopPropagation(); start(e.clientY);
        const mm=ev=>{
          const over=rowAt(ev.clientY);
          drawer.querySelectorAll('[data-pp-idx]').forEach(el=>el.style.borderColor='');
          if(over && Number(over.dataset.ppIdx)!==dragIdx) over.style.borderColor='var(--accent)';
        };
        const mu=ev=>{ document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); endDrag(ev.clientY); };
        document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu);
      });
    });
  };
  document.body.appendChild(backdrop);
  document.body.appendChild(drawer);
  const close=()=>{ backdrop.remove(); drawer.remove(); };
  backdrop.onclick=close;
  drawDrawer();
}
function monthOf(dateStr){ return dateStr.slice(0,7); }
function daysInMonth(ym){
  const [y,m]=ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function shiftMonth(ym, delta){
  const [y,m]=ym.split('-').map(Number);

/* which stored plan (if any) covers this date — normally the plan keyed by
   the date itself, but a 留守 block is keyed by its anchor and spans a
   range, so any day inside that range resolves back to the same block */
function preplanOwnerFor(key, date){
  const direct = preplanFor(key, date);
  if(direct) return {anchor:date, plan:direct};
  const all = state.preplan[key]||{};
  for(const anchor of Object.keys(all)){
    const p=all[anchor];
    if(p && p.startDate && p.endDate && date>=p.startDate && date<=p.endDate) return {anchor, plan:p};
  }
  return null;
}
/* short text shown inside a calendar cell for a given day's plan */
function preplanCellMark(type, plan){
  if(!plan) return '';
  const nm = id=>{ const p=state.personnel.find(x=>x.id===id); return p? p.name : ''; };
  /* names resolved to a real person in the roster render in the normal
     accent color; free text that couldn't be matched (支援/別單位的人，見
     parsePreplanFillText 的 note 欄位) renders in a distinct muted-orange
     style so it's visually obvious "this isn't one of ours" at a glance
     rather than silently missing from the month view */
  const ours = ids => (ids||[]).filter(Boolean).map(id=>esc(nm(id))).filter(Boolean);
  const outside = note => note? [`<span class="cal-mark-outside">${esc(note)}</span>`] : [];
  if(type.mode==='standby'){
    const n=(plan.personIds||[]).length;
    return n? `${n}人` : '';
  }
  if(type.mode==='people'){
    const parts=[...ours(plan.personIds), ...outside(plan.note)];
    return parts.join('･');
  }
  if(type.mode==='roles'){
    const parts=[...ours(plan.personIds), ...(plan.notes||[]).flatMap(n=>outside(n))];
    return parts.join('･');
  }
  if(type.mode==='dayNight'){
    const dayIds=plan.dayPersonIds||(plan.dayPersonId?[plan.dayPersonId]:[]);
    const nightIds=plan.nightPersonIds||(plan.nightPersonId?[plan.nightPersonId]:[]);
    const parts=[];
    const dayNames=[...ours(dayIds), ...outside(plan.dayNote)];
    const nightNames=[...ours(nightIds), ...outside(plan.nightNote)];
    if(dayNames.length) parts.push('日'+dayNames.join('/'));
    if(nightNames.length) parts.push('夜'+nightNames.join('/'));
    return parts.join('･');
  }
  if(type.mode==='fixedSlots'){
    // show the actual shift time for each filled slot (e.g. "00-02") rather
    // than just a count, so the month view says WHEN something's on, not
    // just how many
    const parts=[];
    Object.entries(plan.slots||{}).forEach(([idx,cfg])=>{
      const ids=cfg&&(cfg.personIds||(cfg.personId?[cfg.personId]:[]));
      const hasNote=cfg&&cfg.note;
      if((!ids||!ids.length) && !hasNote) return;
      const label=type.slots[Number(idx)]||'';
      const short=label.replace(/:\d\d/g,'');  // "00:00-02:00" -> "00-02"
      parts.push(short);
    });
    return parts.join('･');
  }
  return '';
}
/* which duty types support the fill-in-the-blank text format: only the
   simple per-day shapes (one line per slot) — 留守 and 休假大表 have
   date-range/checkbox structure that doesn't reduce to fill-in-the-blank
   lines cleanly, so they stay JSON-only via the whole-store export. */
function preplanSupportsTextFormat(type){
  return ['people','roles','dayNight','fixedSlots'].includes(type.mode);
}
/* one line per slot for a single date, in the fill-in-the-blank shape:
   "驗菜：___", "駕駛：___" / "車長：___", "日班：___" / "夜班：___",
   or one line per fixed time-slot for 查哨. Existing values are filled in;
   empty slots show the blank placeholder for someone else to type into. */
/* the label each mode's day-block uses in the fill-in text — matched
   literally when parsing a filled-in file back, so has to line up exactly
   with what preplanFillLines below prints */
function preplanFillLabels(type){
  if(type.mode==='people') return [type.name];
  if(type.mode==='roles') return [...type.roles];
  if(type.mode==='dayNight') return ['日班','夜班'];
  if(type.mode==='fixedSlots') return type.slots.map(sl=>sl.replace(/:\d\d/g,''));
  return [];
}
function preplanFillLines(type, plan){
  const nm=id=>{ const p=state.personnel.find(x=>x.id===id); return p? p.name : ''; };
  /* a filled cell shows: real names, a trailing (掛) per name that was
     marked nominal (掛名/on-call — rostered but not actually blocking their
     day, see nominalIds), and any raw unresolved text someone typed that
     didn't match a known name (kept as-is rather than dropped, since it's
     often "轮到别单位" or a name just not in this roster yet) */
  const cellText=(ids, nominalSet, note)=>{
    const parts=(ids||[]).filter(Boolean).map(id=>nm(id)+(nominalSet&&nominalSet.has(id)?'(掛)':'')).filter(Boolean);
    if(note) parts.push(note);
    return parts.join('、');
  };
  const labels=preplanFillLabels(type);
  if(type.mode==='people') return [`${labels[0]} ${plan? cellText(plan.personIds, new Set(plan.nominalIds), plan.note) : ''}`.trimEnd()];
  if(type.mode==='roles') return labels.map((r,i)=>`${r} ${plan? cellText([(plan.personIds||[])[i]], new Set(plan.nominalIds), (plan.notes||[])[i]) : ''}`.trimEnd());
  if(type.mode==='dayNight'){
    const dayIds=plan? (plan.dayPersonIds||(plan.dayPersonId?[plan.dayPersonId]:[])) : [];
    const nightIds=plan? (plan.nightPersonIds||(plan.nightPersonId?[plan.nightPersonId]:[])) : [];
    return [`日班 ${plan? cellText(dayIds, new Set(plan.dayNominalIds), plan.dayNote):''}`.trimEnd(),
            `夜班 ${plan? cellText(nightIds, new Set(plan.nightNominalIds), plan.nightNote):''}`.trimEnd()];
  }
  if(type.mode==='fixedSlots'){
    return type.slots.map((sl,i)=>{
      const short=sl.replace(/:\d\d/g,'');
      const cfg=plan? (plan.slots||{})[i] : null;
      const ids=cfg? (cfg.personIds||(cfg.personId?[cfg.personId]:[])) : [];
      return `${short} ${cfg? cellText(ids, new Set(cfg.nominalIds), cfg.note):''}`.trimEnd();
    });
  }
  return [];
}
function generatePreplanFillText(key, ym){
  const type=PREPLAN_TYPES.find(t=>t.key===key);
  const total=daysInMonth(ym);
  const [y,m]=ym.split('-').map(Number);
  const lines=[`${type.name}　民國${y-1911}年${m}月`,
    `（在每個項目後面直接打姓名即可，例：${preplanFillLabels(type)[0]} 陳小明；不需要就留空；如果只是掛名備援、不用真的出勤，姓名後面加"(掛)"；找不到的名字也可以直接打上去，不會自動加進名冊）`, ''];
  for(let d=1;d<=total;d++){
    const ds=`${ym}-${String(d).padStart(2,'0')}`;
    const plan=preplanFor(key, ds);
    lines.push(`${m}/${d}`);
    preplanFillLines(type, plan).forEach(l=>lines.push(l));
  }
  return lines.join('\n');
}
/* parses a filled-in template back. Tolerant of the header/instruction
   lines being left in place (only date headers "M/D" and "label：value"
   lines are meaningful); anything else is ignored rather than rejected,
   since the file passed through someone else's hands. */
function parsePreplanFillText(key, ym, text){
  const type=PREPLAN_TYPES.find(t=>t.key===key);
  const [y,m]=ym.split('-').map(Number);
  const labels=preplanFillLabels(type);
  const nameToId=name=>{
    const matches=state.personnel.filter(p=>p.name===name.trim());
    return matches.length===1? matches[0] : null;
  };
  /* one filled cell ("陳小明、王小華(掛)、友軍支援") into resolved ids +
     which of those are 掛名 (nominal — rostered but not actually blocking
     their day) + leftover text for names that don't match exactly one
     person, kept verbatim as a note rather than dropped or guessed at */
  const parseCell=(raw, curDate, label)=>{
    const ids=[], nominalIds=[], notes=[];
    (raw||'').split(/[、,，\s]+/).filter(Boolean).forEach(tok=>{
      const nominal=/[（(]掛[)）]$/.test(tok);
      const name=tok.replace(/[（(]掛[)）]$/,'');
      const p=nameToId(name);
      if(p){ ids.push(p.id); if(nominal){ nominalIds.push(p.id); nominalMatches.push({date:curDate, label, name:p.name}); } }
      else { notes.push(tok); unresolved.push({date:curDate, label, name:tok}); }
    });
    return {ids, nominalIds, note:notes.join('、')};
  };
  const lines=text.split(/\r?\n/);
  let curDate=null, buf={};
  const result={}; // date -> plan
  const unresolved=[]; // {date,label,name} — couldn't match exactly one person; kept as a note, not dropped
  const nominalMatches=[]; // {date,label,name} — successfully recognised as 掛名, for confirming the marker was actually read
  const flush=()=>{
    if(!curDate) return;
    if(type.mode==='people'){
      const c=parseCell(buf[labels[0]], curDate, labels[0]);
      if(c.ids.length || c.note) result[curDate]={personIds:c.ids, nominalIds:c.nominalIds, note:c.note||undefined};
    } else if(type.mode==='roles'){
      const cells=labels.map(r=>parseCell(buf[r], curDate, r));
      if(cells.some(c=>c.ids.length||c.note)){
        result[curDate]={personIds:cells.map(c=>c.ids[0]), nominalIds:cells.flatMap(c=>c.nominalIds), notes:cells.map(c=>c.note||undefined)};
      }
    } else if(type.mode==='dayNight'){
      const dc=parseCell(buf['日班'], curDate, '日班'), nc=parseCell(buf['夜班'], curDate, '夜班');
      if(dc.ids.length||dc.note||nc.ids.length||nc.note){
        result[curDate]={dayPersonIds:dc.ids, dayNominalIds:dc.nominalIds, dayNote:dc.note||undefined,
                          nightPersonIds:nc.ids, nightNominalIds:nc.nominalIds, nightNote:nc.note||undefined};
      }
    } else if(type.mode==='fixedSlots'){
      const slots={};
      labels.forEach((short,i)=>{
        const raw=buf[short];
        if(raw===undefined) return;
        const c=parseCell(raw, curDate, short);
        if(c.ids.length || c.note) slots[i]={personIds:c.ids, nominalIds:c.nominalIds, note:c.note||undefined};
      });
      if(Object.keys(slots).length) result[curDate]={slots};
    }
    buf={};
  };
  const labelStarts = labels.slice().sort((a,b)=>b.length-a.length); // longest-first so "日班" doesn't get shadowed by a shorter prefix
  lines.forEach(line=>{
    const trimmed=line.trim();
    const dm=trimmed.match(/^(\d{1,2})\/(\d{1,2})$/);
    if(dm){
      flush();
      curDate=`${y}-${String(m).padStart(2,'0')}-${String(Number(dm[2])).padStart(2,'0')}`;
      return;
    }
    if(!curDate) return;
    for(const lbl of labelStarts){
      if(trimmed===lbl){ buf[lbl]=''; return; }
      // no space/colon required after the label — "00-02陳小明" is just as
      // valid as "00-02 陳小明"; treating a missing space as "nothing filled"
      // silently threw away real answers
      if(trimmed.startsWith(lbl)){
        buf[lbl]=trimmed.slice(lbl.length).replace(/^[：:\s]+/,'').trim();
        return;
      }
    }
  });
  flush();
  return {result, unresolved, nominalMatches};
}
function openPreplanTextImportModal(key, ym, onDone){
  const type=PREPLAN_TYPES.find(t=>t.key===key);
  const modal=document.createElement('div');
  modal.className='sheet-modal'; modal.style.zIndex='96';
  modal.innerHTML=`
    <div class="sheet-inner">
      <div class="section-title"><h2 style="margin:0">匯入填好的文字：${type.name}</h2><button class="ghost small" id="tiClose">關閉</button></div>
      <div class="hint" style="margin-bottom:8px">把對方填好的整段文字貼回這裡。系統會依姓名比對名冊，「？？？」或空白代表沒有變動。</div>
      <textarea id="tiText" placeholder="貼上內容…" style="min-height:200px;font-size:13px;margin-bottom:8px"></textarea>
      <button class="primary" id="tiCheck" style="width:100%">檢查並套用</button>
      <div id="tiResult" style="margin-top:10px"></div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('tiClose').onclick=()=>modal.remove();
  document.getElementById('tiCheck').onclick=()=>{
    const text=document.getElementById('tiText').value;
    if(!text.trim()){ showAlert('請先貼上內容。'); return; }
    const {result, unresolved, nominalMatches}=parsePreplanFillText(key, ym, text);
    const dates=Object.keys(result).sort();
    const box=document.getElementById('tiResult');
    if(!dates.length && !unresolved.length){
      box.innerHTML=`<div class="badge-issue">⚠️ 沒有解析出任何內容，請確認格式（日期行要是「9/1」這種格式，項目名稱後面直接接名字）</div>`;
      return;
    }
    box.innerHTML=`
      <div class="card" style="padding:10px">
        <div style="font-weight:600;margin-bottom:6px">解析結果：</div>
        <div class="muted">・可套用：${dates.length} 天</div>
        ${nominalMatches.length? `<div class="hint">✅ 已辨識為「掛名」的共 ${nominalMatches.length} 筆：<br>${nominalMatches.slice(0,10).map(x=>`${minguoLabel(x.date)} ${esc(x.label)}：${esc(x.name)}(掛)`).join('<br>')}${nominalMatches.length>10?'<br>…':''}</div>`:''}
        ${unresolved.length? `<div class="badge-issue">⚠️ 有 ${unresolved.length} 個名字在名冊裡找不到唯一符合的人，會以文字方式保留在該筆勤務的備註（不會加入名冊，也不會誤配對）：<br>${unresolved.slice(0,10).map(u=>`${minguoLabel(u.date)} ${esc(u.label)}：「${esc(u.name)}」`).join('<br>')}${unresolved.length>10?'<br>…':''}</div>`:''}
        ${dates.length? `<button class="primary" id="tiApply" style="width:100%;margin-top:8px">套用這 ${dates.length} 天</button>`:''}
      </div>`;
    if(dates.length){
      document.getElementById('tiApply').onclick=()=>{
        dates.forEach(d=>setPreplan(key, d, result[d]));
        saveState();
        showAlert(`已套用 ${dates.length} 天的內容到「${type.name}」預排。`);
        modal.remove();
        if(onDone) onDone();
      };
    }
  };
}
function openPreplanCalendar(key){
  const type = PREPLAN_TYPES.find(t=>t.key===key);
  if(!type) return;
  if(!preplanMonth) preplanMonth = monthOf(currentDate);
  // 休假大表 is person-first, not date-first — it has its own screen
  if(type.mode==='leaveTable') return openLeaveTableEditor(preplanMonth+'-01', ()=>{});
  if(type.mode==='personCalendar') return openPersonCalendarEditor(preplanMonth+'-01', ()=>{});
  const modal=document.createElement('div');
  modal.className='fullscreen-modal'; modal.style.zIndex='92';
  const draw=()=>{
    const ym=preplanMonth;
    const [y,m]=ym.split('-').map(Number);
    const total=daysInMonth(ym);
    const firstDow=new Date(y,m-1,1).getDay();
    const cells=[];
    for(let i=0;i<firstDow;i++) cells.push('<div class="cal-cell empty"></div>');
    for(let d=1;d<=total;d++){
      const ds=`${ym}-${String(d).padStart(2,'0')}`;
      // a 留守 block is stored once under its anchor date but covers a range,
      // so every day inside the range shows its own mark (and opens the
      // same block for editing) rather than the count appearing only on
      // the first day
      const owner = preplanOwnerFor(key, ds);
      const mark = owner? preplanCellMark(type, owner.plan) : '';
      const hol=isHolidayDate(ds);
      cells.push(`<div class="cal-cell ${mark?'has':''} ${hol?'holiday':''}" data-cal-date="${ds}" data-cal-anchor="${owner? owner.anchor : ds}">
        <div class="cal-day">${d}</div><div class="cal-mark">${mark}</div>
      </div>`);
    }
    const plannedCount=Object.keys(state.preplan[key]||{}).filter(d=>d.startsWith(ym) && preplanCellMark(type, state.preplan[key][d])).length;
    modal.innerHTML=`
      <div class="section-title"><h2 style="margin:0">${type.icon} ${type.name}</h2><button class="ghost small" id="calClose">關閉</button></div>
      <div class="hint" style="margin-bottom:8px">${type.hint}</div>
      <div class="row" style="gap:6px;align-items:center;margin-bottom:8px">
        <button class="ghost small" id="calPrev">◀</button>
        <span class="grow" style="text-align:center;font-weight:600">民國${y-1911}年${m}月<br><span class="hint">本月已排 ${plannedCount} 天</span></span>
        <button class="ghost small" id="calNext">▶</button>
      </div>
      <div class="cal-grid" style="margin-bottom:6px">
        ${['日','一','二','三','四','五','六'].map(w=>`<div class="cal-head">${w}</div>`).join('')}
        ${cells.join('')}
      </div>
      <div class="hint" style="margin-bottom:8px">點日期輸入當天內容；已排的日期外框會變色。假日以紅字標示。名字顏色：<span style="color:var(--accent)">一般顏色</span>＝我們單位的人，<span class="cal-mark-outside">橘色斜體</span>＝找不到、可能是別單位支援的人。</div>
      ${preplanSupportsTextFormat(type)? `
      <button class="ghost" id="calExportText" style="width:100%;margin-bottom:6px">📝 匯出本月文字（給人填空缺）</button>
      <button class="ghost" id="calImportText" style="width:100%;margin-bottom:6px">📝 匯入填好的文字</button>
      ` : ''}
      <button class="primary" id="calImport" style="width:100%;margin-bottom:6px">📥 匯入本月預排到實際班表</button>
      <button class="ghost" id="calCheckpoint" style="width:100%;margin-bottom:6px">📌 存檔點</button>
      <button class="ghost small danger" id="calClearMonth" style="width:100%">清空本月預排</button>`;
    document.getElementById('calCheckpoint').onclick=()=>openCheckpointModal(key, type.name,
      ()=>state.preplan[key]||{},
      (data)=>{ state.preplan[key]=data; draw(); });
    if(preplanSupportsTextFormat(type)){
      document.getElementById('calExportText').onclick=()=>{
        openTextShareModal(`${type.name} 民國${y-1911}年${m}月`, generatePreplanFillText(key, ym));
      };
      document.getElementById('calImportText').onclick=()=>openPreplanTextImportModal(key, ym, draw);
    }
    modal.querySelectorAll('[data-cal-date]').forEach(c=>{
      c.onclick=()=>openPreplanDayEditor(key, c.dataset.calAnchor||c.dataset.calDate, draw);
    });
    document.getElementById('calClose').onclick=()=>modal.remove();
    document.getElementById('calPrev').onclick=()=>{ preplanMonth=shiftMonth(preplanMonth,-1); draw(); };
    document.getElementById('calNext').onclick=()=>{ preplanMonth=shiftMonth(preplanMonth,1); draw(); };
    document.getElementById('calImport').onclick=()=>{
      const plannedDates=Object.keys(state.preplan[key]||{}).filter(d=>d.startsWith(ym)).sort();
      if(!plannedDates.length){ showAlert('本月還沒有預排任何日期。'); return; }
      // 留守 is anchor-based (one entry can span several days), so it still
      // only processes days that actually have a block starting — the other
      // 7 types are one-entry-per-day, so re-importing the whole month also
      // clears days you emptied out since the last import, not just the
      // ones that still have content
      const dates = key==='standby'? plannedDates : dateRangeList(`${ym}-01`, `${ym}-${String(daysInMonth(ym)).padStart(2,'0')}`);
      const confirmMsg = key==='standby'
        ? `確定要把「${type.name}」本月已預排的 ${plannedDates.length} 段匯入實際班表嗎？每一段這個項目原本的內容會被覆寫（其他項目不受影響）。`
        : `確定要把「${type.name}」整個月匯入實際班表嗎？這個月每一天都會依照預排現況覆寫（沒排的日期會清空這個項目，其他項目不受影響）。`;
      showConfirm(confirmMsg, ()=>{
        let n=0;
        dates.forEach(d=>{ if(importPreplanForDate(key, d)) n++; });
        saveState();
        /* preplans are made weeks ahead, so by import time leave or another
           duty may already have landed on the same person — surface that immediately
           instead of letting it sit unnoticed in the roster */
        const clashes=[];
        dates.forEach(d=>{
          (state.misc[d]||[]).filter(m=>m.role===(type.presetRole||type.name)).forEach(m=>{
            miscEntryConflicts(m, d).forEach(c=>clashes.push(`${minguoLabel(d)} ${c}`));
          });
        });
        showAlert(`已處理 ${n} 天（含清空跟寫入）。` + (clashes.length
          ? `\n\n⚠️ 有 ${clashes.length} 筆衝突需要處理：\n` + clashes.slice(0,12).join('\n') + (clashes.length>12? `\n…還有 ${clashes.length-12} 筆`:'')
          : ''));
        render();
        draw();
      });
    };
    document.getElementById('calClearMonth').onclick=()=>{
      showConfirm(`確定要清空「${type.name}」本月的所有預排嗎？（只清預排，已經匯入到班表的內容不受影響）`, ()=>{
        Object.keys(state.preplan[key]||{}).filter(d=>d.startsWith(ym)).forEach(d=>delete state.preplan[key][d]);
        // also drop any empty leftovers from other months so the drawer's
        // "已預排 N 天" can't keep counting entries that show nothing
        Object.keys(state.preplan[key]||{}).forEach(d=>{
          if(!preplanCellMark(type, state.preplan[key][d])) delete state.preplan[key][d];
        });
        saveState(); draw();
      });
    };
  };
  document.body.appendChild(modal);
  draw();
}

    });
    modal.querySelectorAll('[data-sb-override]').forEach(b=>{
      b.onclick=()=>{ sync(); openStandbyOverrideEditor(plan, b.dataset.sbOverride, draw); };
    });
    modal.querySelectorAll('[data-sb-sub]').forEach(b=>{
      b.onclick=()=>{ sync(); openStandbySubDutyEditor(plan, b.dataset.sbSub, b.dataset.sbSubdate, draw); };

    document.getElementById('sbDelete').onclick=()=>{
      showConfirm('確定要清除這筆留守預排嗎？', ()=>{
        setPreplan('standby', date, null);
        saveState(); modal.remove(); if(onSaved) onSaved();
      });

      setPreplan('standby', date, plan);
      saveState(); modal.remove(); if(onSaved) onSaved();

  document.body.appendChild(modal);
  draw();
}

function preplanEligiblePeople(type){
  // show everyone, always — qualification gaps are surfaced per-person via
  // reasonsFn (🚫 + reason) in the picker instead of hiding people outright,
  // consistent with how the rest of the app handles "nobody's ideal but you
  // may still need to pick someone". Departed people are the one exception:
  // they're not a qualification gap, they're not part of the roster anymore.
  return state.personnel.filter(p=>!isDeparted(p)).sort((a,b)=>groupIndex(a.group)-groupIndex(b.group)||rankIndex(a.rank)-rankIndex(b.rank));
}
function openPreplanDayEditor(key, date, onSaved){
  if(key==='standby') return openStandbyEditor(date, onSaved);
  if(key==='leave') return openLeaveTableEditor(date, onSaved);
  const type = PREPLAN_TYPES.find(t=>t.key===key);
  const preset = type.presetRole? state.miscPresets.find(p=>p.role===type.presetRole) : null;
  const plan = preplanFor(key, date) || {};
  const pool = preplanEligiblePeople(type);
  const t0 = preset? (presetTimes(preset)[0]||{start:'',end:''}) : {start:'',end:''};
  const modal=document.createElement('div');
  modal.className='sheet-modal'; modal.style.zIndex='93';
  const searchBlock = (id)=>`<div class="row wrap" style="margin-bottom:6px">
      <div class="grow"><label>搜尋姓名</label><input type="text" id="${id}" placeholder="輸入姓名關鍵字"></div>
    </div>`;
  const listBox = (inner, id)=>`<div id="${id}-selsum" class="hint" style="margin-bottom:4px">已選：（無）</div><div id="${id}" class="pp-picklist" style="max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px">${inner}</div>`;
  /* checkbox/radio lists can run to dozens of names — without this, seeing
     who you've actually picked means scrolling back up through the whole
     filtered list. Keeps a running "已選：X、Y" line above each list. */
  const wireSelectedSummary=(listId)=>{
    const listEl=document.getElementById(listId), sumEl=document.getElementById(listId+'-selsum');
    if(!listEl||!sumEl) return;
    const update=()=>{
      const checked=[...listEl.querySelectorAll('input:checked')].filter(i=>i.value);
      const names=checked.map(i=>{ const p=state.personnel.find(x=>x.id===i.value); return p?p.name:''; }).filter(Boolean);
      sumEl.textContent='已選：'+(names.length? names.join('、') : '（無）');
    };
    listEl.addEventListener('change', update);
    update();
  };
  const checkRows = (selectedIds, cls, reasonsFn)=>{
    if(!pool.length) return `<div class="empty">目前沒有人員</div>`;
    const withReasons = pool.map(p=>({p, reasons: reasonsFn? reasonsFn(p) : []}));
    withReasons.sort((a,b)=>(a.reasons.length>0)-(b.reasons.length>0));
    return withReasons.map(({p,reasons})=>`
      <label style="display:flex;align-items:flex-start;gap:6px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);${reasons.length?'opacity:.6':''}">
        <input type="checkbox" class="${cls}" value="${p.id}" style="width:auto;flex-shrink:0;margin-top:2px" ${selectedIds.includes(p.id)?'checked':''}>
        <span>${esc(p.name)}（${p.group||'未分組'}·${p.rank}${personBadges(p)}）${reasons.length? `<br><span class="warn" style="font-size:11px">🚫${esc(reasons.join('・'))}</span>`:''}</span>
      </label>`).join('');
  };
  const radioRows = (selectedId, cls, name, reasonsFn)=>{
    if(!pool.length) return `<div class="empty">沒有符合資格的人員</div>`;
    const withReasons = pool.map(p=>({p, reasons: reasonsFn? reasonsFn(p) : []}));
    withReasons.sort((a,b)=>(a.reasons.length>0)-(b.reasons.length>0));
    return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0">
        <input type="radio" name="${name}" class="${cls}" value="" style="width:auto" ${!selectedId?'checked':''}> （未指派）
      </label>`+withReasons.map(({p,reasons})=>`
      <label style="display:flex;align-items:flex-start;gap:6px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);${reasons.length?'opacity:.6':''}">
        <input type="radio" name="${name}" class="${cls}" value="${p.id}" style="width:auto;margin-top:2px" ${p.id===selectedId?'checked':''}>
        <span>${esc(p.name)}（${p.group||'未分組'}·${p.rank}${personBadges(p)}）${reasons.length? `<br><span class="warn" style="font-size:11px">🚫${esc(reasons.join('・'))}</span>`:''}</span>
      </label>`).join('');
  };
  const timeRow = (idBase, st, en, label)=>`
    <div class="row wrap" style="margin-bottom:6px">
      <div class="grow"><label>${label||'開始'}</label>${timeSelectHTML(idBase+'Start', st, {allowEmpty:true})}</div>
      <div class="grow"><label>結束</label>${timeSelectHTML(idBase+'End', en, {allowEmpty:true})}</div>
    </div>`;
  const restRow = (id, val, label)=>`
    <div class="row wrap" style="margin-bottom:6px">
      <div class="grow"><label>${label||'補休至（選填）'}</label>${timeSelectHTML(id, val||'', {allowEmpty:true})}</div>

  const supportRow = (id, val)=>`
    <div class="row wrap" style="margin-bottom:6px">
      <div class="grow"><label>支援單位/人員（選填，直接打字）</label><input type="text" id="${id}" value="${esc(val||'')}" placeholder="例：三連 王小明"></div>
    </div>`;
  let body='';
  // one shared preset-based eligibility check for every non-roles mode —

  if(type.mode==='people'){
    body = (type.editableTime? timeRow('ppT', plan.start||preplanDefault(key,'start',t0.start), plan.end||preplanDefault(key,'end',t0.end)) : '')

      + supportRow('ppSupport', plan.support)
      + searchBlock('ppSearch')
      + `<div class="row wrap" style="margin-bottom:6px">
           <button class="ghost small" id="ppSelectAll">全選(顯示中)</button>

         </div>`
      + listBox(checkRows(plan.personIds||[], 'pp-person', presetReasonsFn), 'ppList');
  } else if(type.mode==='roles'){
    const driverIdx=type.roles.indexOf('駕駛'), chiefIdx=type.roles.indexOf('車長');
    const currentDriver = driverIdx>-1? state.personnel.find(p=>p.id===(plan.personIds||[])[driverIdx]) : null;
    body = (type.editableTime? timeRow('ppT', plan.start||preplanDefault(key,'start',t0.start), plan.end||preplanDefault(key,'end',t0.end)) : '')

      + supportRow('ppSupport', plan.support)
      + type.roles.map((r,i)=>{
          const reasonsFn = (r==='車長')? (p=>{
            const reasons=[];
            if(!['士官','軍官'].includes(rankCategory(p.rank))) reasons.push('需為士官以上');
