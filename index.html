/* Inline editing for an existing 其他勤務 entry — edits happen directly in
   the row/card where the entry is shown (both in the 其他勤務 tab's list and
   in the 排班 tab's per-role misc card), instead of jumping up to the
   "新增項目" form at the top. Only one entry can be inline-edited at a time. */
let miscInlineEditId=null;
/* same availability check as isPersonUnavailable, but ignores the misc
   entry currently being edited — otherwise a person already assigned to
   that entry's own time slot would show up flagged 🚫 against themselves */
function isPersonBusyForMiscEdit(personId, date, s, eRaw, excludeEntryId){
  const e = wrapEndMin(s, eRaw);
  const person = state.personnel.find(p=>p.id===personId);
  if(person){
    const lt = personLongTerm(person);
    if(lt.mode==='allday') return true;
    if(lt.mode==='range' && lt.start && lt.end && windowsOverlapRecurring(s,e,toMin(lt.start),toMin(lt.end))) return true;
  }
  for(const u of (state.unavail[date]||[]).filter(u=>u.personId===personId)){
    if(u.allDay) return true;
    if(windowsOverlapOnce(s,e,toMin(u.start),toMin(u.end))) return true;
  }
  for(const w of personCompRestWindows(personId, date)){
    if(windowsOverlapRecurring(s,e,toMin(w.start),toMin(w.end))) return true;
  }
  const dayAssign = state.assign[date]||{};
  for(const cat of state.categories){
    const catAssign = dayAssign[cat.id]||{};
    for(const sft of effectiveShifts(cat, date)){
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapOnce(s,e,shiftBusyStartMin(cat,sft),toMin(sft.end))) return true;
    }
  }
  for(const mm of (state.misc[date]||[])){
    if(mm.id===excludeEntryId) continue;
    if(mm.start && mm.end && (mm.personIds||[]).includes(personId) && windowsOverlapOnce(s,e,toMin(mm.start),toMin(mm.end))) return true;
    if(mm.restUntil && mm.end && (mm.personIds||[]).includes(personId) && windowsOverlapRecurring(s,e,toMin(mm.end),toMin(mm.restUntil))) return true;
  }
  return false;
}
function miscEditBusyReasons(personId, date, s, eRaw, excludeEntryId){
  const e = wrapEndMin(s, eRaw);
  const out=[];
  const person = state.personnel.find(p=>p.id===personId);
  if(person){
    const lt = personLongTerm(person);
    if(lt.mode==='allday') out.push('長期事故：全天不可排');
    else if(lt.mode==='range' && lt.start && lt.end && windowsOverlapRecurring(s,e,toMin(lt.start),toMin(lt.end))) out.push(`長期事故：每天 ${lt.start}-${lt.end} 不可排`);
  }
  (state.unavail[date]||[]).filter(u=>u.personId===personId).forEach(u=>{
    const hit = u.allDay || windowsOverlapOnce(s,e,toMin(u.start),toMin(u.end));
    if(hit) out.push(`${u.allDay? '全天':`${u.start}-${u.end}`}${u.reason? '（'+u.reason+'）':'（未註記原因）'}`);
  });
  for(const w of personCompRestWindows(personId, date)){
    if(windowsOverlapRecurring(s,e,toMin(w.start),toMin(w.end))) out.push(`補休中（${w.catName} ${w.label} 後，至 ${w.end}）`);
  }
  const dayAssign = state.assign[date]||{};
  state.categories.forEach(cat=>{
    const catAssign = dayAssign[cat.id]||{};
    effectiveShifts(cat, date).forEach(sft=>{
      if((catAssign[sft.id]||[]).includes(personId) && windowsOverlapOnce(s,e,shiftBusyStartMin(cat,sft),toMin(sft.end))){
        out.push(`勤務中：${cat.name} ${sft.label||sft.start+'-'+sft.end}${cat.enforceRest?'（含準備時間）':''}`);
      }
    });
  });
  (state.misc[date]||[]).forEach(mm=>{
    if(mm.id===excludeEntryId) return;
    if(!(mm.personIds||[]).includes(personId)) return;
    if(mm.start && mm.end && windowsOverlapOnce(s,e,toMin(mm.start),toMin(mm.end))) out.push(`勤務中：${mm.role}${mm.start&&mm.end?` (${mm.start}-${mm.end})`:''}`);
    else if(mm.restUntil && mm.end && windowsOverlapRecurring(s,e,toMin(mm.end),toMin(mm.restUntil))) out.push(`補休中（${mm.role} 後，至 ${mm.restUntil}）`);
  });
  return [...new Set(out)];
}
/* the searchable, sorted (available-first) person checkbox list used by the
   freeform (no defined roles) branch of the inline 其他勤務 editor — reads
   the entry's OWN current start/end select values (so changing the time
   live-updates who's flagged busy) and applies the entry's preset
   requirements (license/EMT/skill) the same way the top "新增項目" form does */
function inlineMiscPeopleListHTML(m, searchFilter){
  const preset = presetForEntry(m);
  const startExists = !!document.getElementById('inlineStart-'+m.id+'__h');
  const startVal = startExists? getTimeSelectValue('inlineStart-'+m.id) : m.start;
  const endExists = !!document.getElementById('inlineEnd-'+m.id+'__h');
  const endVal = endExists? getTimeSelectValue('inlineEnd-'+m.id) : m.end;
  const hasTime = !!(startVal && endVal);
  const s = hasTime? toMin(startVal) : null;
  const eRaw = hasTime? toMin(endVal) : null;
  const checkedIds = new Set(m.personIds||[]);
  const container = document.getElementById('inlineMiscPeopleList-'+m.id);
  if(container){
    container.querySelectorAll('.inline-misc-person-cb').forEach(cb=>{
      if(cb.checked) checkedIds.add(cb.value); else checkedIds.delete(cb.value);
    });
  }
  let list=[...state.personnel];
  if(searchFilter) list = list.filter(p=>p.name.includes(searchFilter));
  if(!list.length) return `<div class="empty">找不到符合的人員</div>`;
  const withInfo = list.map(p=>{
    const reasons=[];
    if(hasTime && isPersonBusyForMiscEdit(p.id, currentDate, s, eRaw, m.id)){
      miscEditBusyReasons(p.id, currentDate, s, eRaw, m.id).forEach(r=>reasons.push(r));
    }
    if(preset) driverQualificationIssues(p, preset).forEach(r=>reasons.push(r));
    return {p, checked:checkedIds.has(p.id), reasons};
  });
  withInfo.sort((a,b)=>{
    const ba=a.reasons.length>0?1:0, bb=b.reasons.length>0?1:0;
    if(ba!==bb) return ba-bb;
    return rankPriorityIndex(a.p.rank,preset)-rankPriorityIndex(b.p.rank,preset) || groupIndex(a.p.group)-groupIndex(b.p.group);
  });
  return withInfo.map(({p,checked,reasons})=>{
    const busy = reasons.length>0;
    return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0;${busy?'color:var(--danger)':''}">
      <input type="checkbox" class="inline-misc-person-cb" value="${p.id}" style="width:auto" ${checked?'checked':''}>
      ${esc(p.name)}（${p.group||'未分組'}·${p.rank}${personBadges(p)}）${busy? ` 🚫不可排（${[...new Set(reasons)].join('・')}）`:''}
    </label>`;
  }).join('');
}
function miscEntryEditorHTML(m){

  let rolesHtml;
  if(m.roles){

function wireMiscInlineEditors(){
  if(miscInlineEditId){
    const m = (state.misc[currentDate]||[]).find(mm=>mm.id===miscInlineEditId);
    if(m && !m.roles){
      const searchInput = document.getElementById('inlineMiscSearch-'+m.id);
      const refreshList = ()=>{
        const val = searchInput? searchInput.value.trim() : '';
        const container = document.getElementById('inlineMiscPeopleList-'+m.id);
        if(container) container.innerHTML = inlineMiscPeopleListHTML(m, val);
      };
      if(searchInput) searchInput.oninput = refreshList;
      ['inlineStart-'+m.id+'__h','inlineStart-'+m.id+'__m','inlineEnd-'+m.id+'__h','inlineEnd-'+m.id+'__m'].forEach(subId=>{
        const el=document.getElementById(subId);
        if(el) el.addEventListener('change', refreshList);
      });
    }
  }
  document.querySelectorAll('[data-inline-save]').forEach(btn=>{
    btn.onclick=()=>{
      const id = btn.dataset.inlineSave;
      const m = (state.misc[currentDate]||[]).find(mm=>mm.id===id);
      if(!m) return;
      const roleInput = document.getElementById('inlineRole-'+id);
      if(roleInput) m.role = roleInput.value.trim()||m.role;
      m.start = getTimeSelectValue('inlineStart-'+id);
      m.end = getTimeSelectValue('inlineEnd-'+id);
      if(m.roles){
        m.personIds = m.roles.map((_,i)=>{
          const sel=document.querySelector(`[data-inline-role-sel="${i}"]`);
          return sel? sel.value : m.personIds[i];
        });
        m.lockedSlots = m.roles.map((_,i)=>{
          const cb=document.querySelector(`[data-inline-lock="${i}"]`);
          return cb? cb.checked : false;
        });
      } else {
        m.personIds = [...document.querySelectorAll('.inline-misc-person-cb:checked')].map(cb=>cb.value);
        const skipCb=document.getElementById('inlineSkipAutoFill-'+id);
        m.skipAutoFill = skipCb? skipCb.checked : false;
      }
      miscInlineEditId=null;
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-inline-cancel]').forEach(btn=>{
    btn.onclick=()=>{ miscInlineEditId=null; render(); };
  });
}

        refreshPeopleFlags();
      });
    }
  }
  app.querySelectorAll('[data-preset]').forEach(b=>{
    b.onclick=(ev)=>{
      if(ev.target.closest('[data-edit-preset]')) return;
      const mp = state.miscPresets[Number(b.dataset.preset)];
      const times = presetTimes(mp);
      if(times.length>1){
        showConfirm(`要一次建立「${mp.role}」的全部 ${times.length} 個時段嗎？（${times.map(t=>t.start+'-'+t.end).join('、')}）`, ()=>{
          if(!state.misc[currentDate]) state.misc[currentDate]=[];
          times.forEach(t=>{
            const already = state.misc[currentDate].some(m=>m.role===mp.role && m.start===t.start && m.end===t.end);
            if(!already){
              state.misc[currentDate].push({id:uid(), role:mp.role, start:t.start, end:t.end, restUntil:mp.restUntil||'', roles:mp.roles?[...mp.roles]:undefined, personIds: mp.roles? mp.roles.map(()=>undefined):[]});
            }
          });
          collapseState['miscToday']=true;
          autoAssignMiscForDate(currentDate);
          saveState(); render();
        });
        return;
      }
      collapseState['miscAddForm']=true;
      miscSelectedRoles = mp.roles||null;
      miscSelectedPresetRole = mp.role;
      miscSelectedRestUntil = mp.restUntil||'';
      render();
      document.getElementById('mRole').value=mp.role;
      setTimeSelectValue('mStart', times[0].start);
      setTimeSelectValue('mEnd', times[0].end);
      refreshPeopleFlags();
      updateNextDayHint();
    };
  });
  app.querySelectorAll('[data-edit-preset]').forEach(x=>{
    x.onclick=(ev)=>{
      ev.stopPropagation();
      openMiscPresetModal(Number(x.dataset.editPreset));
    };
  });
  document.getElementById('ahQueryBtn').onclick=()=>{
    adhocQueryState.time=getTimeSelectValue('ahTime');
    adhocQueryState.officer=Number(document.getElementById('ahOfficer').value)||0;
    adhocQueryState.nco=Number(document.getElementById('ahNCO').value)||0;
    adhocQueryState.enlisted=Number(document.getElementById('ahEnlisted').value)||0;
    adhocQueryState.skill=document.getElementById('ahSkill').value;
    runAdhocQuery();
    const resultEl = document.getElementById('ahResult');
    resultEl.innerHTML = renderAdhocQueryResult();
    wireAdhocAddButtons();
  };
  function wireAdhocAddButtons(){
    document.querySelectorAll('[data-adhoc-add]').forEach(b=>{
      b.onclick=()=>openAdhocAddModal(b.dataset.adhocAdd, b.dataset.adhocStart, b.dataset.adhocEnd);
    });
  }
  wireAdhocAddButtons();
  document.getElementById('openAddPresetModal').onclick=()=>openMiscPresetModal();
  document.getElementById('mAdd').onclick=()=>{
    const role=document.getElementById('mRole').value.trim();
    if(!role) return;
    const start=getTimeSelectValue('mStart'), end=getTimeSelectValue('mEnd');
    if(!state.misc[currentDate]) state.misc[currentDate]=[];
    const existing = miscEditingId? state.misc[currentDate].find(m=>m.id===miscEditingId) : null;
    if(miscSelectedRoles){
      const personIds=miscSelectedRoles.map((_,i)=>document.getElementById('mRoleSel'+i).value);
      const lockedSlots=miscSelectedRoles.map((_,i)=>{
        const cb=document.querySelector(`.mp-lock-slot[data-lock-idx="${i}"]`);
        return cb? cb.checked : false;
      });
      if(existing){
        existing.role=role; existing.start=start; existing.end=end; existing.restUntil=miscSelectedRestUntil;
        existing.roles=miscSelectedRoles; existing.personIds=personIds; existing.lockedSlots=lockedSlots;
      } else {
        state.misc[currentDate].push({id:uid(),role,start,end,restUntil:miscSelectedRestUntil,roles:miscSelectedRoles,personIds,lockedSlots});
      }
    } else {
      const personIds=[...miscFreeformCheckedIds];
      const skipAutoFill = document.getElementById('mSkipAutoFill') ? document.getElementById('mSkipAutoFill').checked : false;
      if(existing){
        existing.role=role; existing.start=start; existing.end=end; existing.restUntil=miscSelectedRestUntil;
        existing.personIds=personIds; existing.skipAutoFill=skipAutoFill; delete existing.roles;
      } else {
        state.misc[currentDate].push({id:uid(),role,start,end,restUntil:miscSelectedRestUntil,personIds,skipAutoFill});
      }
      miscFreeformCheckedIds.clear();
    }
    const wasNewEntry = !existing;
    miscSelectedRoles=null;
    miscSelectedPresetRole=null;
    miscSelectedRestUntil='';
    miscEditingId=null;
    if(wasNewEntry){
      autoAssignMiscForDate(currentDate);
    }
    saveState(); render();
  };
  if(document.getElementById('mCancelEdit')){
    document.getElementById('mCancelEdit').onclick=()=>{
      miscEditingId=null;
      miscSelectedRoles=null;
      miscSelectedPresetRole=null;
      miscSelectedRestUntil='';
      miscFreeformCheckedIds.clear();
      render();
    };
  }
  wireMiscCardEvents();
}

/* ---------------- init ---------------- */
render();
</script>
</body>
</html>
