<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="任務SOP">
<meta name="theme-color" content="#4A5A2E">
<title>任務SOP</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* 任務SOP系統 v2 —— 色票：營舍灰綠底、草綠(OD)主色、警示琥珀、關鍵紅 */
:root{
  --field:#E5E9E2;--paper:#FFFFFF;--ink:#1E2A21;--muted:#56625A;--rule:#C9D1C6;--rule2:#E0E5DD;
  --od:#4A5A2E;--od-ink:#FFFFFF;--od-soft:#E2E9D4;
  --amber:#875800;--amber-bg:#FCEFCD;--amber-line:#E2AE38;
  --red:#B3261E;--red-bg:#FBE4E1;--lock:#939C93;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--field:#101410;--paper:#1A201A;--ink:#E3E9DF;--muted:#9DA89D;--rule:#343D34;--rule2:#262D26;
    --od:#88A45A;--od-ink:#0E120B;--od-soft:#26321F;
    --amber:#F1C451;--amber-bg:#352B12;--amber-line:#9C7720;
    --red:#FF8A80;--red-bg:#3A1C1A;--lock:#5F6A5F;color-scheme:dark}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--field)}
body{margin:0;min-height:100vh;background:var(--field);color:var(--ink);font:16px/1.6 var(--sans);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
a{color:inherit}
h1,h2,h3{line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
input:not([type=checkbox]),textarea{display:block;width:100%;padding:10px 11px;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;-webkit-appearance:none;appearance:none}
textarea{resize:vertical;line-height:1.55}
input:focus,textarea:focus{outline:2px solid var(--od);outline-offset:-1px;border-color:var(--od)}
:focus-visible{outline:2px solid var(--od);outline-offset:2px}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-5px}
.ic.sm{width:17px;height:17px;vertical-align:-3px}
.wrap{max-width:680px;margin:0 auto;padding:14px 16px calc(104px + env(safe-area-inset-bottom))}

/* 頂部列 */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:2px;min-height:54px;padding:4px 6px;max-width:700px;margin:0 auto}
.bar .tt{flex:1;min-width:0;padding:0 6px}
.bar .tt.pad{padding-left:12px}
.bar h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ts{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;flex:none;border:0;border-radius:6px;background:none;color:var(--ink);text-decoration:none}
.ib:active{background:var(--rule2)}
.ib.sm{width:34px;height:34px}
.ib:disabled{opacity:.25}
.tb{flex:none;border:0;background:none;padding:8px 12px;border-radius:6px;font-size:16px;color:var(--muted)}
.tb.pri{color:var(--od);font-weight:700}

/* 底部分頁 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tabs a{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 6px;font-size:12px;color:var(--muted);text-decoration:none}
.tabs a.on{color:var(--od);font-weight:700}
.tabs a.on::before{content:"";position:absolute;top:-1px;left:32%;right:32%;height:3px;background:var(--od)}
.bdg{display:inline-block;min-width:18px;margin-left:3px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-style:normal;font-size:11px;line-height:18px;text-align:center}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 16px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font-size:16px;font-weight:600;text-decoration:none;line-height:1.3;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--od);border-color:var(--od);color:var(--od-ink)}
.btn.big{display:flex;width:100%;min-height:58px;font-size:19px;font-weight:700}
.btn.wide{display:flex;width:100%;margin-top:12px}
.btn.sm{min-height:38px;padding:6px 12px;font-size:15px}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.warnb{color:var(--amber);border-color:var(--amber-line);background:var(--amber-bg)}
.btn:disabled{opacity:.38}
.dangert{color:var(--red)!important}
.lnk{border:0;background:none;padding:8px 0;color:var(--od);font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.add{display:flex;align-items:center;gap:6px;width:100%;margin-top:8px;padding:10px 12px;border:1px dashed var(--rule);border-radius:6px;background:none;color:var(--od);font-size:15px;font-weight:600}
.hint{margin:6px 0;font-size:14px;color:var(--muted)}

/* 首頁 */
.doing{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:12px 14px;border-radius:6px;background:var(--od);color:var(--od-ink);text-decoration:none}
.doing .dg{display:flex;flex-direction:column;line-height:1.4}
.doing .dg span{font-size:14px;opacity:.9}
.pub{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding:12px 14px;border:1px solid var(--amber-line);border-radius:6px;background:var(--amber-bg)}
.pub b{display:block;color:var(--amber)}
.pub span{font-size:14px;color:var(--muted)}
.pub .btn{flex:none}
.search{margin-bottom:6px}
.gh{margin:18px 2px 6px;font-size:14px;font-weight:700;color:var(--muted)}
.list{background:var(--paper);border:1px solid var(--rule);border-radius:6px}
.list>*{border-top:1px solid var(--rule2)}
.list>:first-child{border-top:0}
.trow{display:block;padding:13px 14px;text-decoration:none}
.tn{display:block;font-size:17px;font-weight:700;line-height:1.4}
.tm{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:2px;font-size:13px;color:var(--muted)}
.wn{color:var(--amber);font-weight:600}
.empty{padding:20px 18px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
.empty h2{margin:0 0 8px;font-size:19px}
.empty p{margin:6px 0;color:var(--muted)}
.empty p b{color:var(--ink)}

/* SOP全文 */
.purpose{margin:2px 0 12px;color:var(--muted)}
.vh1{margin:24px 0 2px;padding-bottom:5px;border-bottom:2px solid var(--ink);font-size:18px}
.vh2{margin:14px 0 2px;font-size:16px}
.vst{display:grid;grid-template-columns:28px 1fr;gap:0 10px;padding:10px 0;border-bottom:1px solid var(--rule2)}
.vst .n{font-family:var(--num);font-weight:700;font-size:24px;line-height:1.1;color:var(--od);text-align:right}
.vst .t{font-weight:600;line-height:1.45}
.vst .d{margin-top:3px;font-size:15px;color:var(--muted)}
.vfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--rule)}
.dock .btn{max-width:648px;margin:0 auto}

/* 標籤、注意事項 */
.tag{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid currentColor;border-radius:3px;font-size:12px;font-weight:700;line-height:18px;vertical-align:2px;white-space:nowrap}
.tag.key{color:var(--red)}
.tag.inp{color:var(--od)}
.tag.wn{color:var(--amber)}
.note{margin-top:8px;padding:8px 10px 8px 12px;border-left:4px solid var(--amber-line);border-radius:0 4px 4px 0;background:var(--amber-bg);font-size:15px}
.note>b{display:flex;align-items:center;gap:5px;margin-bottom:2px;font-size:14px;color:var(--amber)}
.note .ni+.ni{margin-top:6px;padding-top:6px;border-top:1px dashed var(--amber-line)}
.nby{display:block;font-size:12px;color:var(--muted)}

/* 執行中 */
.prog{display:flex;align-items:center;gap:12px;max-width:700px;margin:0 auto;padding:0 16px 10px}
.pc{flex:none;font-family:var(--num);font-size:16px;color:var(--muted);white-space:nowrap}
.pc b{font-size:28px;font-weight:700;color:var(--ink)}
.pb{flex:1;display:flex;gap:2px;height:10px}
.pb i{flex:1;border-radius:1px;background:var(--rule2)}
.pb i.d{background:var(--od)}
.pb i.n{background:var(--amber-line)}
.pb i.c{background:var(--ink)}
.pb1{flex:1;height:10px;overflow:hidden;border-radius:2px;background:var(--rule2)}
.pb1 i{display:block;height:100%;background:var(--od)}
.rh1{margin:22px 0 0;padding-bottom:4px;border-bottom:2px solid var(--ink);font-size:16px;font-weight:700}
.rh2{margin:10px 0 0;font-size:14px;font-weight:700;color:var(--muted)}
.row{display:flex;align-items:baseline;gap:8px;width:100%;padding:9px 2px;border:0;border-bottom:1px solid var(--rule2);background:none;text-align:left;font-size:15px;line-height:1.45}
.row .mk{flex:none;align-self:center;display:flex}
.row .rn{flex:none;min-width:20px;font-family:var(--num);font-size:17px;font-weight:700}
.row .rt{flex:1;min-width:0}
.row .rv{display:block;font-size:13px}
.row .rtime{flex:none;font-family:var(--num);font-size:15px}
.row.done{color:var(--muted)}
.row.done .mk,.row.done .rn{color:var(--od)}
.row.na .mk,.row.na .rn{color:var(--amber)}
.row.lock{color:var(--lock)}
.undo{flex:none;padding:2px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--muted);font-size:13px}
.cur{margin:10px -6px 12px;padding:14px 14px 12px 16px;border:2px solid var(--ink);border-left:9px solid var(--od);border-radius:6px;background:var(--paper);scroll-margin-top:calc(152px + env(safe-area-inset-top))}
.cpath{font-size:13px;font-weight:600;color:var(--muted)}
.chead{display:flex;align-items:flex-start;gap:12px;margin-top:4px}
.cnum{flex:none;min-width:28px;font-family:var(--num);font-size:50px;font-weight:700;line-height:.95;color:var(--od)}
.ctit{margin:0;padding-top:4px;font-size:22px;font-weight:700}
.ctags{margin:8px 0 0 -6px}
.cdesc{margin-top:10px;font-size:17px;line-height:1.65}
.myrep{margin-top:8px;padding:8px 10px;border:1px dashed var(--amber-line);border-radius:4px;font-size:15px}
.myrep b{display:block;font-size:13px;color:var(--amber)}
.myrep span{color:var(--muted)}
.cin{display:block;margin-top:14px;font-size:15px;font-weight:700}
.cin input{margin-top:4px;font-weight:400}
.cerr,.err{margin-top:6px;font-size:14px;font-weight:600;color:var(--red)}
.cur .btn.big{margin-top:14px}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.khint{margin-top:8px;font-size:13px;color:var(--red)}
.cidx{margin-top:10px;font-size:13px;color:var(--muted);text-align:right}
.cur.cool .btn{pointer-events:none}
.cur.arrive{animation:arrive .55s ease-out}
@keyframes arrive{from{background:var(--od-soft)}to{background:var(--paper)}}
.fin{margin:18px 0;padding:18px 16px;border:2px solid var(--od);border-radius:6px;background:var(--paper);scroll-margin-top:calc(152px + env(safe-area-inset-top))}
.fin h2{margin:0 0 6px;font-size:20px}
.fin p{margin:0 0 4px;color:var(--muted)}

/* 紀錄 */
.rsum{padding:12px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
.chip{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:3px;font-size:13px;font-weight:700;line-height:20px;white-space:nowrap}
.chip.done{background:var(--od);color:var(--od-ink)}
.chip.abort{background:var(--red);color:#fff}
.chip.doing{background:var(--ink);color:var(--paper)}
.chip.imp{border:1px solid var(--rule);color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 0}
.kv dt{font-size:14px;color:var(--muted)}
.kv dd{margin:0;font-size:15px}
.sendbox{margin-top:12px}
.sendbox.need{padding:12px;border:2px solid var(--amber-line);border-radius:6px;background:var(--amber-bg)}
.sendbox.need>b{color:var(--amber)}
.sh{margin:22px 0 6px;font-size:16px}
.tli{display:flex;gap:10px;padding:9px 12px;font-size:15px}
.tli .mk{flex:none;padding-top:1px;color:var(--od)}
.tli.na .mk{color:var(--amber)}
.tlb{flex:1;min-width:0}
.tlt{font-weight:600}
.tlv{font-size:14px;color:var(--muted)}
.tlm{flex:none;font-family:var(--num);font-size:15px;line-height:1.35;color:var(--muted);text-align:right}
.tlm .fast{font-weight:700;color:var(--amber)}
.repi,.pend{padding:10px 12px;font-size:15px}
.rrow{display:block;padding:11px 14px;text-decoration:none}
.rrow .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rrow .r2{display:block;font-size:13px;color:var(--muted)}
.rrow .r3{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.rrow .alert{font-weight:700;color:var(--red)}

/* 設定 */
.ss{margin-bottom:12px;padding:14px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
.ss h2{margin:0 0 4px;font-size:16px}
.ss>.btn{margin-top:8px}
.about{border:0;background:none}

/* 編輯：逐行輸入 */
.fl{display:block;margin-bottom:12px;font-size:14px;font-weight:700;color:var(--muted)}
.fl input,.fl textarea{margin-top:4px;font-weight:400}
.edhint{margin:2px 0 12px;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);font-size:13.5px;line-height:1.75;color:var(--muted)}
.edhint summary{display:block;cursor:pointer;list-style:none;font-size:14px;font-weight:700;color:var(--ink)}
.edhint summary::-webkit-details-marker{display:none}
.edhint summary::after{content:"　點這裡看怎麼打";font-size:13px;font-weight:400;color:var(--od)}
.edhint[open] summary::after{content:""}
#lines{padding:4px 8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
.ln{display:flex;align-items:flex-start}
.ln .lb{flex:none;min-width:50px;min-height:42px;margin:0;padding:10px 6px 0 0;border:0;background:none;color:var(--od);font-size:15px;font-weight:700;line-height:1.4;text-align:right;white-space:nowrap}
.ln .lt{flex:1;min-width:0;min-height:42px;padding:9px 6px;border:0;border-bottom:1px solid var(--rule2);border-radius:0;background:transparent;resize:none;overflow:hidden;line-height:1.5}
.ln.t-o{margin-top:16px}
.ln.t-o:first-child{margin-top:4px}
.ln.t-o .lb{padding-top:9px;font-size:17px;color:var(--ink)}
.ln.t-o .lt{font-size:17px;font-weight:700;border-bottom:2px solid var(--ink)}
.ln.t-i{margin-top:6px;padding-left:10px}
.ln.t-i .lb{color:var(--ink)}
.ln.t-i .lt{font-weight:700}
.ln.t-s{padding-left:22px}
.ln.t-s .lb{padding-top:8px;font-family:var(--num);font-size:20px}
.ln.t-d,.ln.t-n,.ln.t-f{padding-left:22px}
.ln.t-d .lb,.ln.t-n .lb,.ln.t-f .lb{padding-top:13px;font-size:12px;font-weight:600;color:var(--muted)}
.ln.t-d .lt{font-size:15px;color:var(--muted)}
.ln.t-n .lb{color:var(--amber)}
.ln.t-n .lt{background:var(--amber-bg)}
.ln.t-f .lb{color:var(--od)}
.ln.zone{padding-left:0}
.ln.bad .lb{color:var(--red)}
.ln.bad .lt{background:var(--red-bg)}
.ln .lt:focus{outline:none;border-bottom-color:var(--od);background:var(--od-soft)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}

/* 對話框 */
#modal .layer{position:fixed;inset:0;z-index:100}
.layer .ov{position:absolute;inset:0;background:rgba(12,16,12,.5);opacity:0;transition:opacity .15s}
.layer .sheet{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 12px);max-width:560px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px - env(safe-area-inset-top));margin:0 auto;padding:18px 16px 16px;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:10px;background:var(--paper);box-shadow:0 12px 40px rgba(0,0,0,.28);opacity:0;transform:translateY(-8px);transition:transform .16s,opacity .16s}
.layer.in .ov{opacity:1}
.layer.in .sheet{opacity:1;transform:none}
.sheet h3{margin:0 0 8px;font-size:19px}
.sheet .msg{margin-bottom:12px;font-size:15px;color:var(--muted)}
.sbtns{display:flex;gap:10px;margin-top:14px}
.sbtns .btn{flex:1}
.chs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.menu{display:flex;flex-direction:column;margin:4px -16px 0}
.menu button{display:flex;align-items:center;gap:10px;padding:14px 18px;border:0;border-top:1px solid var(--rule2);background:none;text-align:left;font-size:16px}
.ck{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:15px}
.ck input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--od)}
.smv{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lockmsg{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));z-index:200;max-width:90vw;padding:10px 16px;border-radius:6px;background:var(--ink);color:var(--paper);font-size:15px;opacity:0;pointer-events:none;transform:translateX(-50%);transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.layer .ov,.layer .sheet,#toast{transition:none}.cur.arrive{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filein" hidden>
<noscript>這個系統需要開啟 JavaScript 才能使用。</noscript>
<script>
'use strict';
/* ============================================================
   任務SOP系統 v2
   結構：任務 → 大綱（一、）→ 項目（（一））→ 項次（1.）＋說明
   資料存在本機 localStorage（key: hhcSop_v1，不會碰到同網域的其他系統）
   v2：拿掉管理密碼；編輯改成整頁逐行打字
   ============================================================ */
const APP_VER = 'v2';
const LS_KEY = 'hhcSop_v1';
const FAST_MS = 5000;   // 與上一項間隔少於這個毫秒數，回報裡會標出來

/* ---------- 小工具 ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br = s => esc(s).replace(/\n/g, '<br>');
const uid = () => Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 6);
const now = () => Date.now();
const clone = o => JSON.parse(JSON.stringify(o));
const p2 = n => String(n).padStart(2, '0');
const WD = '日一二三四五六', CNN = '零一二三四五六七八九';
function cn(n) {
  if (n < 1) return String(n);
  if (n < 10) return CNN[n];
  if (n === 10) return '十';
  if (n < 20) return '十' + CNN[n - 10];

function parseLines(text, curType) {

const LAYERS = [];
function pushLayer(html, handlers) {
  const el = document.createElement('div'); el.className = 'layer';
  el.innerHTML = `<div class="ov"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  $('#modal').appendChild(el);
  const L = { el, handlers }; LAYERS.push(L);
  el.querySelector('.ov').addEventListener('click', () => handlers.cancel && handlers.cancel());
  el.addEventListener('click', e => { const a = e.target.closest('[data-x]'); if (!a || a.disabled) return; const f = handlers[a.dataset.x]; if (f) { e.preventDefault(); f(a, e); } });
  document.body.classList.add('noscroll');
  requestAnimationFrame(() => el.classList.add('in'));
  return L;
}
function popLayer(L) { L = L || LAYERS[LAYERS.length - 1]; const i = LAYERS.indexOf(L); if (i < 0) return; LAYERS.splice(i, 1); L.el.remove(); if (!LAYERS.length) document.body.classList.remove('noscroll'); }
function closeAllLayers() { while (LAYERS.length) popLayer(); }
function dlg(o) {
  return new Promise(res => {
    const F = o.fields || [];
    const fh = F.map(f => `<label class="fl">${esc(f.label)}${f.multi
      ? `<textarea id="f_${f.key}" rows="${f.rows || 3}" placeholder="${esc(f.ph || '')}">${esc(f.value || '')}</textarea>`
      : `<input id="f_${f.key}" type="${f.type || 'text'}"${f.mode ? ` inputmode="${f.mode}"` : ''} value="${esc(f.value || '')}" placeholder="${esc(f.ph || '')}" autocomplete="off">`}</label>`).join('');
    const html = `${o.title ? `<h3>${esc(o.title)}</h3>` : ''}${o.msg ? `<div class="msg">${o.html ? o.msg : nl2br(o.msg)}</div>` : ''}${fh}<div class="err" hidden></div>
      <div class="sbtns">${o.cancel === false ? '' : `<button class="btn" data-x="cancel">${esc(o.cancel || '取消')}</button>`}<button class="btn ${o.danger ? 'danger' : 'pri'}" data-x="ok">${esc(o.ok || '確定')}</button></div>`;
    let L;
    const fin = v => { popLayer(L); res(v); };
    const err = m => { const e = L.el.querySelector('.err'); e.textContent = m; e.hidden = false; };
    L = pushLayer(html, {
      cancel: () => fin(null),
      ok: () => {
        const v = {};
        for (const f of F) { const el = L.el.querySelector('#f_' + f.key); v[f.key] = el.value.trim(); if (f.req && !v[f.key]) { err(`請填寫「${f.label}」`); el.focus(); return; } }
        const m = o.validate && o.validate(v); if (m) { err(m); return; }
        fin(F.length ? v : true);
      }
    });
    L.el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); L.handlers.ok(); } });
    const first = L.el.querySelector('input,textarea'); if (first) setTimeout(() => first.focus(), 60);
  });
}
const alertDlg = (title, msg) => dlg({ title, msg, cancel: false, ok: '知道了' });
function choose(title, msg, opts) {
  return new Promise(res => {
    let L; const hs = { cancel: () => { popLayer(L); res(null); } };
    opts.forEach(op => { hs['o_' + op.k] = () => { popLayer(L); res(op.k); }; });
    L = pushLayer(`<h3>${esc(title)}</h3>${msg ? `<div class="msg">${nl2br(msg)}</div>` : ''}<div class="chs">${opts.map(op => `<button class="btn ${op.cls || ''}" data-x="o_${op.k}">${esc(op.label)}</button>`).join('')}<button class="btn" data-x="cancel">取消</button></div>`, hs);
  });
}
function showTextDlg(title, text) {
  let L; L = pushLayer(`<h3>${esc(title)}</h3><div class="msg">沒辦法自動複製。請長按下面的文字，全選後複製。</div><textarea rows="10" readonly>${esc(text)}</textarea><div class="sbtns"><button class="btn pri" data-x="cancel">關閉</button></div>`, { cancel: () => popLayer(L) });
  const ta = L.el.querySelector('textarea'); setTimeout(() => { ta.focus(); ta.select(); }, 80);
}
let TT;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(TT); TT = setTimeout(() => el.classList.remove('on'), 2400); }

/* ---------- 分享、複製、檔案 ---------- */
async function copyText(t) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}
async function shareText(t, title) {
  if (navigator.share) { try { await navigator.share({ text: t }); return 'shared'; } catch (e) { if (e && e.name === 'AbortError') return 'cancel'; } }
  if (await copyText(t)) { toast('已複製，貼到LINE傳出去'); return 'copied'; }
  showTextDlg(title || '回報內容', t); return 'manual';
}
async function shareFile(content, name, dlOnly) {
  const blob = new Blob([content], { type: 'application/json' });
  if (!dlOnly && navigator.canShare && typeof File === 'function') {
    // 有些手機的分享選單不收 .json，就改用 .txt（內容一樣，匯入時都讀得懂）
    for (const [n, ty] of [[name, 'application/json'], [name.replace(/\.json$/, '.txt'), 'text/plain']]) {
      try {
        const file = new File([content], n, { type: ty });
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return 'shared'; }
      } catch (e) { if (e && e.name === 'AbortError') return 'cancel'; break; }
    }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 3000);
  return 'downloaded';
}

/* ---------- 共用畫面元件 ---------- */
function topBar(o) {
  const left = o.back ? `<a class="ib" href="${o.back}" aria-label="返回">${IC.back}</a>` : (o.left || '');
  const sub = o.subHtml ? `<div class="ts">${o.subHtml}</div>` : o.sub ? `<div class="ts">${esc(o.sub)}</div>` : '';
  return `<header class="top"><div class="bar">${left}<div class="tt${left ? '' : ' pad'}"><h1>${esc(o.title)}</h1>${sub}</div>${o.right || ''}</div>${o.extra || ''}</header>`;
}
function tabs(cur) {
  const n = DB.pending.length;
  return `<nav class="tabs"><a href="#/" class="${cur === 'home' ? 'on' : ''}">${IC.list}<span>任務</span></a><a href="#/recs" class="${cur === 'recs' ? 'on' : ''}">${IC.clock}<span>紀錄</span></a>${isAdmin() ? `<a href="#/review" class="${cur === 'review' ? 'on' : ''}">${IC.inbox}<span>待審${n ? `<em class="bdg">${n}</em>` : ''}</span></a>` : ''}</nav>`;

function notFound(title, msg) { return topBar({ title: '找不到', back: '#/' }) + `<main class="wrap"><div class="empty"><h2>${esc(title)}</h2>${msg ? `<p>${esc(msg)}</p>` : ''}<div class="btns"><a class="btn" href="#/">回首頁</a></div></div></main>`; }
function tagsOf(s) { return (s.key ? '<span class="tag key">關鍵</span>' : '') + (s.input ? `<span class="tag inp">要填：${esc(s.input)}</span>` : ''); }
function notesBox(notes, head) {
  if (!notes || !notes.length) return '';
  return `<div class="note"><b>${IC.warn} ${esc(head || '注意')}</b>${notes.map(n => `<div class="ni">${nl2br(n.text)}${n.by || n.at ? `<span class="nby">${esc(n.by)}${n.at ? ' ' + fmtD(n.at) : ''}</span>` : ''}</div>`).join('')}</div>`;
}

function filterTasks(q) {
  q = q.trim().toLowerCase();
  document.querySelectorAll('.trow').forEach(a => { a.hidden = !!q && !a.dataset.s.includes(q); });
  document.querySelectorAll('[data-grp]').forEach(g => { g.hidden = ![...g.querySelectorAll('.trow')].some(a => !a.hidden); });
}

/* ---------- SOP全文 ---------- */
function vTask(id) {
  const t = getTask(id); if (!t) return notFound('找不到這個任務', '可能已被刪除，或SOP已更新。');
  const admin = isAdmin(), f = flat(t), nRec = DB.runs.filter(r => r.taskId === t.id).length;
  const sub = [t.cat, revLabel(t) + (admin && t.dirty && t.rev ? '（有修改未發佈）' : ''), f.length + ' 項次'].filter(Boolean).join('　');
  let h = topBar({ title: t.name, sub, back: '#/', right: admin ? `<a class="ib" href="#/edit/${t.id}" aria-label="編輯">${IC.pencil}</a>` : '' });
  h += '<main class="wrap">';
  if (t.purpose) h += `<p class="purpose">${nl2br(t.purpose)}</p>`;
  h += notesBox(t.notes, '執行前注意');
  if (!f.length) h += `<div class="empty"><p>這個任務還沒有項次。${admin ? '按右上角的筆來新增。' : ''}</p></div>`;
  t.outlines.forEach((o, oi) => {
    h += `<h2 class="vh1">${cn(oi+1)}、${esc(o.title || '（未命名大綱）')}</h2>`;
    o.items.forEach((it, ii) => {
      if (it.title) h += `<h3 class="vh2">（${cn(ii+1)}）${esc(it.title)}</h3>`;
      it.steps.forEach((s, si) => {
        h += `<div class="vst"><div class="n">${si+1}</div><div><div class="t">${esc(s.title)}${tagsOf(s)}</div>${s.desc ? `<div class="d">${nl2br(s.desc)}</div>` : ''}${notesBox(s.notes)}</div></div>`;
      });

  h += `<div class="vfoot"><a class="lnk" href="#/recs/${t.id}">執行紀錄 ${nRec} 筆</a><button class="lnk" data-act="copySop" data-id="${t.id}">複製成文字</button></div></main>`;
  h += `<div class="dock"><button class="btn pri big" data-act="startRun" data-id="${t.id}" ${f.length ? '' : 'disabled'}>${IC.play} 開始執行</button></div>`;

}

/* ---------- 執行中 ---------- */
function pbar(st) {
  if (!st.total || st.total > 60) { const p = st.total ? Math.round(st.doneN / st.total * 100) : 0; return `<div class="pb1"><i style="width:${p}%"></i></div>`; }
  return `<div class="pb">${st.f.map(x => { const l = st.lm.get(x.s.id); return `<i class="${l ? (l.na ? 'n' : 'd') : (st.cur && st.cur.s.id === x.s.id ? 'c' : '')}"></i>`; }).join('')}</div>`;
}
function curCard(run, x, k, total) {
  const s = x.s, reps = run.reps.filter(r => r.sid === s.id);
  return `<div class="cur" id="cur">
    <div class="cpath">${cn(x.oi+1)}、${esc(x.o.title)}${x.it.title ? `　（${cn(x.ii+1)}）${esc(x.it.title)}` : ''}</div>
    <div class="chead"><span class="cnum">${x.si+1}</span><h2 class="ctit">${esc(s.title)}</h2></div>
    ${s.key || s.input ? `<div class="ctags">${tagsOf(s)}</div>` : ''}

    ${reps.length ? `<div class="myrep"><b>這次回報的狀況</b>${reps.map(r => `<div>${nl2br(r.what)}${r.how ? `<br><span>處置：${nl2br(r.how)}</span>` : ''}</div>`).join('')}</div>` : ''}
    ${s.input ? `<label class="cin">${esc(s.input)}<input id="cval" type="text" autocomplete="off" enterkeyhint="done" placeholder="填了才能按完成"></label><div class="cerr" id="cerr" hidden></div>` : ''}
    <button class="btn pri big" data-act="stepDone" data-id="${run.id}" data-sid="${s.id}">${IC.check} 完成這一步</button>
    <div class="crow"><button class="btn warnb" data-act="stepReport" data-id="${run.id}" data-sid="${s.id}">${IC.warn} 回報狀況</button><button class="btn" data-act="stepNA" data-id="${run.id}" data-sid="${s.id}" ${s.key ? 'disabled' : ''}>${IC.na} 不適用</button></div>
    ${s.key ? '<div class="khint">關鍵步驟：一定要做，不能標不適用。</div>' : ''}
    <div class="cidx">第 ${k+1} 項，共 ${total} 項</div>
  </div>`;
}
function vRun(id) {
  const run = getRun(id); if (!run) return notFound('找不到這筆執行');
  if (run.status !== 'doing') { setTimeout(() => location.replace('#/rec/' + id)); return ''; }
  const st = runState(run), t = st.task;
  const prog = `<div class="prog"><div class="pc"><b>${st.doneN}</b> / ${st.total}</div>${pbar(st)}</div>`;
  let h = topBar({ title: run.taskName, subHtml: `${esc(run.by)}　已進行 <span id="elapsed">${fmtClock(now() - run.startAt)}</span>`, back: '#/', right: `<button class="ib" data-act="runMenu" data-id="${run.id}" aria-label="更多選項">${IC.more}</button>`, extra: prog });
  h += '<main class="wrap">';
  if (!t) return h + `<div class="empty"><h2>這個任務已不在目前的SOP裡</h2><p>可能管理者更新了SOP。這筆執行可以中止。</p><div class="btns"><button class="btn" data-act="abortRun" data-id="${run.id}">中止這筆執行</button></div></div></main>`;
  h += notesBox(t.notes, '執行前注意');
  const last = run.log.length ? run.log[run.log.length - 1] : null;
  let co = -1, ci = -1;
  st.f.forEach((x, k) => {
    if (x.oi !== co) { co = x.oi; ci = -1; h += `<div class="rh1">${cn(x.oi+1)}、${esc(x.o.title || '（未命名大綱）')}</div>`; }
    if (x.ii !== ci) { ci = x.ii; if (x.it.title) h += `<div class="rh2">（${cn(x.ii+1)}）${esc(x.it.title)}</div>`; }
    const l = st.lm.get(x.s.id);
    if (l) {
      h += `<div class="row done${l.na ? ' na' : ''}"><span class="mk">${l.na ? IC.na : IC.check}</span><span class="rn">${x.si+1}.</span><span class="rt">${esc(x.s.title)}${l.val ? `<span class="rv">${esc(x.s.input || '結果')}：${esc(l.val)}</span>` : ''}${l.na ? `<span class="rv">不適用：${esc(l.na)}</span>` : ''}</span><span class="rtime">${fmtT(l.at)}</span>${last && last.sid === x.s.id ? `<button class="undo" data-act="undoStep" data-id="${run.id}">撤回</button>` : ''}</div>`;
    } else if (st.cur && st.cur.s.id === x.s.id) {
      h += curCard(run, x, k, st.total);
    } else {
      h += `<button class="row lock" data-act="peek" data-id="${run.id}" data-sid="${x.s.id}"><span class="mk">${IC.lock}</span><span class="rn">${x.si+1}.</span><span class="rt">${esc(x.s.title)}</span></button>`;
    }
  });
  if (!st.cur && st.total) {
    const c = runCounts(run);
    h += `<div class="fin" id="cur"><h2>所有項次都處理完了</h2><p>完成 ${c.ok} 項${c.na ? `，不適用 ${c.na} 項` : ''}${c.rep ? `，回報狀況 ${c.rep} 則` : ''}。</p><p>按下面的按鈕結束任務，然後把回報傳給管理者。</p><div class="btns"><button class="btn pri big" data-act="finishRun" data-id="${run.id}">結束任務</button></div></div>`;
  }
  return h + '</main>';
}
let TIMER = null, SMOOTH = false;
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function afterRun(id) {
  const run = getRun(id); if (!run || run.status !== 'doing') return;
  const el = $('#elapsed'); if (el) TIMER = setInterval(() => { el.textContent = fmtClock(now() - run.startAt); }, 1000);

/* ---------- 單筆紀錄 ---------- */

    <dt>SOP</dt><dd>${run.rev ? `第${run.rev}版` : '未發佈版'}${t && t.rev && t.rev !== run.rev ? `（目前是第${t.rev}版）` : ''}${run.mod ? '<br><span class="wn">執行的手機上，SOP有改過，跟發佈的版本不同</span>' : ''}</dd>

    ${fast ? `<dt>快速連按</dt><dd>${fast} 項與上一項間隔不到 ${FAST_MS / 1000} 秒</dd>` : ''}

  if (run.status === 'doing' && run.src === 'local') h += `<div class="btns"><a class="btn pri big" href="#/run/${run.id}">${IC.play} 繼續執行</a></div>`;
  if (run.src === 'local') {
    const need = !run.sent && !admin && run.status !== 'doing';
    h += `<div class="sendbox${need ? ' need' : ''}">${need ? '<b>還沒回報給管理者</b><p class="hint">按「分享回報」選LINE傳出去；或按「複製回報」再貼到LINE。</p>' : ''}<div class="btns2"><button class="btn pri" data-act="shareRep" data-id="${run.id}">${IC.share} 分享回報</button><button class="btn" data-act="copyRep" data-id="${run.id}">${IC.copy} 複製回報</button></div></div>`;
  }
  h += '<h2 class="sh">逐項紀錄</h2>';
  if (!run.log.length) h += '<p class="hint">還沒有完成任何項次。</p>';
  else {
    h += '<div class="list">';

/* ---------- 編輯任務：逐行打字 ----------
   換行 → 接下一行（大綱→項目→項次→說明→項次…）
   空白行按換行 → 往上一層（說明→項次→項目→大綱）
   點左邊編號 → 改類型、設關鍵、上下移、刪除 */
let EDIT = null, COMP_END = 0;
const LT = { o: '大綱', i: '項目', s: '項次', d: '說明', n: '注意', f: '要填' };
const LT_NEXT = { o: 'i', i: 's', s: 'd', d: 's', n: 's', f: 's' };
const LT_UP = { o: 'o', i: 'o', s: 'i', d: 's', n: 's', f: 's' };
const LT_PH = { o: '大綱（階段），例：通報', i: '項目（分組），例：發現者', s: '項次：要做的動作', d: '說明：怎麼做、做到什麼程度', n: '注意事項', f: '完成時要填什麼，例：數量、車號' };
const lnIdx = id => EDIT.lines.findIndex(l => l.id === id);
const lineEl = id => document.querySelector(`.ln[data-id="${id}"]`);
const taOf = id => document.querySelector(`.lt[data-lid="${id}"]`);
function inZone(idx) { for (let k = 0; k < idx; k++) if (isStruct(EDIT.lines[k].type)) return false; return true; }
function nextType(idx) { const ty = EDIT.lines[idx].type; return !isStruct(ty) && inZone(idx) ? 'o' : LT_NEXT[ty]; }
function upType(idx) { const ty = EDIT.lines[idx].type; return !isStruct(ty) && inZone(idx) ? 'o' : LT_UP[ty]; }
const lineHtml = l => `<div class="ln" data-id="${l.id}"><button type="button" class="lb" data-act="lnMenu" data-id="${l.id}" aria-label="改這一行的類型"></button><textarea class="lt" rows="1" data-lid="${l.id}" autocomplete="off" spellcheck="false">${esc(l.text)}</textarea></div>`;
function grow(ta) { if (!ta) return; ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
function renumber() {
  let oN = 0, iN = 0, sN = 0, zone = true;
  EDIT.lines.forEach(l => {
    const el = lineEl(l.id); if (!el) return;
    let lb, ph = LT_PH[l.type];
    if (l.type === 'o') { oN++; iN = 0; sN = 0; zone = false; lb = cn(oN) + '、'; }
    else if (l.type === 'i') { zone = false; iN++; sN = 0; lb = `（${cn(iN)}）`; }
    else if (l.type === 's') { zone = false; sN++; lb = (l.key ? '★' : '') + sN + '.'; }
    else if (l.type === 'd') { lb = zone ? '任務說明' : '說明'; if (zone) ph = '任務目的或整體說明（可空白）'; }
    else if (l.type === 'n') { lb = zone ? '執行前注意' : '注意'; if (zone) ph = '執行前要先注意的事'; }
    else lb = '要填';
    el.className = `ln t-${l.type}${zone && !isStruct(l.type) ? ' zone' : ''}${EDIT.bad === l.id ? ' bad' : ''}`;
    el.firstElementChild.textContent = lb;
    el.lastElementChild.placeholder = ph;
  });
}
function redrawLines() { $('#lines').innerHTML = EDIT.lines.map(lineHtml).join(''); renumber(); document.querySelectorAll('.lt').forEach(grow); }
function afterEdit() { if (!EDIT || !$('#lines')) return; renumber(); document.querySelectorAll('.lt').forEach(grow); }
function focusLine(id, pos) { const ta = taOf(id); if (!ta) return; ta.focus(); const p = pos === 'end' ? ta.value.length : pos; try { ta.setSelectionRange(p, p); } catch (e) {} }
function insertLine(afterIdx, nl, focus) {
  EDIT.lines.splice(afterIdx + 1, 0, nl); EDIT.dirty = true;
  const prev = afterIdx >= 0 ? lineEl(EDIT.lines[afterIdx].id) : null;
  if (prev) prev.insertAdjacentHTML('afterend', lineHtml(nl)); else $('#lines').insertAdjacentHTML('afterbegin', lineHtml(nl));
  renumber(); grow(taOf(nl.id));
  if (focus) focusLine(nl.id, 0);
}
function removeLine(idx, focusPrev) {
  const l = EDIT.lines[idx]; if (!l) return;
  if (EDIT.lines.length === 1) { l.text = ''; const ta = taOf(l.id); if (ta) ta.value = ''; return; }
  EDIT.lines.splice(idx, 1); const el = lineEl(l.id); if (el) el.remove();
  EDIT.dirty = true; if (EDIT.bad === l.id) EDIT.bad = null; renumber();
  if (focusPrev) focusLine(EDIT.lines[Math.max(0, idx - 1)].id, 'end');
}
// 在游標位置換行
function splitAt(ta, s, e) {
  const idx = lnIdx(ta.dataset.lid); if (idx < 0) return;
  const l = EDIT.lines[idx], v = ta.value, before = v.slice(0, s), after = v.slice(e);
  if (!before.trim() && !after.trim()) {            // 空白行按換行：往上一層
    const nt = upType(idx);
    if (nt !== l.type) { l.type = nt; l.key = false; l.text = ''; ta.value = ''; EDIT.dirty = true; renumber(); }
    return;
  }
  if (!before.trim()) { insertLine(idx - 1, { id: uid(), type: l.type, text: '' }, false); return; }   // 游標在行首：上面插一行
  l.text = before; ta.value = before; grow(ta);
  insertLine(idx, { id: uid(), type: nextType(idx), text: after }, true);
}
function pasteLines(ta, pasted) {
  const idx = lnIdx(ta.dataset.lid); if (idx < 0) return;
  const cur = EDIT.lines[idx], items = parseLines(pasted, cur.type);
  if (!items.length) return;
  if (!ta.value.trim()) { const f = items.shift(); cur.type = f.type; cur.text = f.text; cur.key = f.key; }
  const rest = items.map(it => ({ id: uid(), type: it.type, text: it.text, key: it.key }));
  EDIT.lines.splice(idx + 1, 0, ...rest); EDIT.dirty = true; EDIT.bad = null;
  redrawLines();
  focusLine((rest.length ? rest[rest.length - 1] : cur).id, 'end');

}
function onLineInput(ta) {

    if (v.split('\n').length === 2) { const p = v.indexOf('\n'); ta.value = v.slice(0, p) + v.slice(p + 1); splitAt(ta, p, p); }
    else { ta.value = ''; EDIT.lines[idx].text = ''; pasteLines(ta, v); }
    return;
  }
  EDIT.lines[idx].text = v; EDIT.dirty = true;
  if (EDIT.bad === EDIT.lines[idx].id) { EDIT.bad = null; renumber(); }
  grow(ta);
}
function onLineKey(e) {

  if (e.key === 'Enter') {
    if (e.isComposing || e.keyCode === 229 || now() - COMP_END < 80) return;   // 中文選字中按的換行不算
    e.preventDefault(); splitAt(ta, ta.selectionStart, ta.selectionEnd); return;
  }
  if (e.key === 'Backspace' && !e.isComposing && ta.value === '') {

  }
}
function onLinePaste(e) {
  const cd = e.clipboardData || window.clipboardData, txt = cd ? cd.getData('text') : '';
  if (!txt || !txt.trim().includes('\n')) return;     // 只有一行就照一般貼上
  e.preventDefault(); pasteLines(e.target, txt);
}
function vEdit(id) {
  if (!EDIT || EDIT.id !== id) {
    const t = id === 'new' ? null : getTask(id);
    if (id !== 'new' && !t) return notFound('找不到這個任務');
    EDIT = { id, isNew: !t, dirty: false, bad: null, name: t ? t.name : '', cat: t ? t.cat : '', lines: t ? taskToLines(t) : [{ id: uid(), type: 'o', text: '' }] };
  }

  h += '<main class="wrap">';
  h += `<label class="fl">任務名稱<input data-f="name" value="${esc(EDIT.name)}" placeholder="例：營區火災應變" autocomplete="off"></label>`;
  h += `<label class="fl">分類（可空白）<input data-f="cat" value="${esc(EDIT.cat)}" list="catlist" placeholder="例：勤務、行政、戰備" autocomplete="off"></label><datalist id="catlist">${[...new Set(DB.tasks.map(t => t.cat).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('')}</datalist>`;
  h += `<details class="edhint"${EDIT.isNew ? ' open' : ''}><summary>直接一行一行打</summary>按「換行」接下一行，會自動排成：項次 → 說明 → 項次 …<br>空白行再按一次「換行」＝往上一層：說明 → 項次 → 項目 → 大綱<br>點左邊的編號：改類型、設關鍵步驟、上下移、刪除<br>Word 或 LINE 的文字可以整份貼上，會自動分層</details>`;

  async stepNA(a) {
    const run = getRun(a.dataset.id); const st = runState(run);
    if (!st.cur || st.cur.s.id !== a.dataset.sid || st.cur.s.key) return;
    const v = await dlg({ title: '這一步不適用？', msg: `「${st.cur.s.title}」\n標成不適用會寫進回報，管理者看得到。`, fields: [{ key: 'r', label: '不適用的原因', multi: true, rows: 2, req: true, ph: '例：今天沒有派車，不用檢查車輛' }],
      validate: v => v.r.length < 2 ? '原因請寫清楚一點' : '', ok: '標成不適用' });
    if (!v) return;
    const st2 = runState(run); if (!st2.cur || st2.cur.s.id !== a.dataset.sid) return render();
    run.log.push({ sid: a.dataset.sid, at: now(), na: v.r }); markMod(run); save(); SMOOTH = true; render();
  },
  stepReport(a) { reportFlow(getRun(a.dataset.id), a.dataset.sid || ''); },
  async undoStep(a) {
    const run = getRun(a.dataset.id); const last = run.log[run.log.length - 1]; if (!last) return;
    const ok = await dlg({ title: '撤回上一步？', msg: `${stepLabel(getTask(run.taskId), last.sid)}\n撤回後要重新按完成，時間會重新記錄。`, ok: '撤回' });
    if (!ok) return;
    run.log.pop(); save(); SMOOTH = true; render();
  },
  peek(a) {
    const run = getRun(a.dataset.id), t = getTask(run.taskId), x = stepInfo(t, a.dataset.sid); if (!x) return;
    let L; L = pushLayer(`<div class="cpath">${cn(x.oi+1)}、${esc(x.o.title)}${x.it.title ? `　（${cn(x.ii+1)}）${esc(x.it.title)}` : ''}</div><h3>${x.si+1}. ${esc(x.s.title)}${tagsOf(x.s)}</h3>${x.s.desc ? `<div class="cdesc">${nl2br(x.s.desc)}</div>` : ''}${notesBox(x.s.notes, '注意')}<p class="lockmsg">${IC.lock} 還沒輪到這一步，前面的項次完成後才能執行。</p><div class="sbtns"><button class="btn" data-x="cancel">關閉</button></div>`, { cancel: () => popLayer(L) });
  },
  runMenu(a) {
    const run = getRun(a.dataset.id); let L;
    L = pushLayer(`<h3>${esc(run.taskName)}</h3><div class="menu"><button data-x="rep">${IC.warn} 回報狀況（不屬於某一步）</button><button data-x="send">${IC.share} 把目前進度傳給管理者</button><button data-x="sop">${IC.list} 看整份SOP</button><button data-x="abort" class="dangert">${IC.x} 中止任務</button></div><div class="sbtns"><button class="btn" data-x="cancel">關閉</button></div>`, {
      cancel: () => popLayer(L),
      rep: () => { popLayer(L); reportFlow(run, ''); },
      send: () => { popLayer(L); shareText(reportText(run)); },
      sop: () => { popLayer(L); location.hash = '#/t/' + run.taskId; },
      abort: () => { popLayer(L); abortFlow(run); },
    });
  },
  finishRun(a) {
    const run = getRun(a.dataset.id); if (!run || runState(run).cur) return render();
    markMod(run); run.status = 'done'; run.endAt = now(); save(); location.hash = '#/rec/' + run.id;
  },
  abortRun(a) { abortFlow(getRun(a.dataset.id)); },

  /* 回報 */
  async shareRep(a) {
    const run = getRun(a.dataset.id); const r = await shareText(reportText(run));
    if (r === 'cancel') return;
    if (run.status !== 'doing') { run.sent = true; save(); } render();
  },
  async copyRep(a) {
    const run = getRun(a.dataset.id), txt = reportText(run);
    if (await copyText(txt)) { toast('已複製，貼到LINE傳給管理者'); if (run.status !== 'doing') { run.sent = true; save(); } render(); }
    else showTextDlg('回報內容', txt);
  },
  async delRun(a) {
    const ok = await dlg({ title: '刪除這筆紀錄？', msg: '刪除後不能復原。', ok: '刪除', danger: true }); if (!ok) return;
    DB.runs = DB.runs.filter(r => r.id !== a.dataset.id); save(); location.hash = '#/recs';
  },
  async copySop(a) {
    const t = getTask(a.dataset.id), txt = taskToText(t);
    if (await copyText(txt)) toast('已複製整份SOP文字'); else showTextDlg('SOP文字', txt);
  },

  /* 待審 */
  async pasteReports() {
    const v = await dlg({ title: '貼上回報', msg: '把LINE上的回報訊息整則複製貼上（要包含最後「#SOP回報#」開頭的代碼）。可以一次貼很多則。', fields: [{ key: 't', label: '回報內容', multi: true, rows: 8, req: true }], ok: '匯入' });
    if (!v) return;
    const r = importReports(v.t), m = [];
    if (!r.found) m.push('沒有找到回報代碼。請確認有複製到最後「#SOP回報#」開頭的那一段。');
    if (r.added) m.push(`新增 ${r.added} 筆執行紀錄`);
    if (r.updated) m.push(`更新 ${r.updated} 筆執行紀錄`);
    if (r.reps) m.push(`${r.reps} 則臨時狀況放進待審`);
    if (r.dup) m.push(`${r.dup} 則之前已經匯入過`);
    if (r.bad) m.push(`${r.bad} 段代碼讀不出來，可能複製得不完整`);
    render(); await alertDlg('匯入結果', m.join('\n'));
  },
  async pendAdd(a) {
    const p = DB.pending.find(x => x.id === a.dataset.id); if (!p) return;
    const t = getTask(p.taskId); if (!t) return;
    const x = stepInfo(t, p.sid);
    const v = await dlg({ title: '加入注意事項', msg: `加到：${x ? `${x.path} ${x.s.title}` : '整個任務的「執行前注意」'}\n可以先修改文字，讓下一個人一看就懂。`,
      fields: [{ key: 'txt', label: '注意事項', multi: true, rows: 3, req: true, value: p.what + (p.how ? `（處置：${p.how}）` : '') }], ok: '加入' });
    if (!v) return;
    const note = { id: uid(), text: v.txt, by: p.by, at: p.at };
    if (x) x.s.notes.push(note); else t.notes.push(note);
    t.dirty = true; t.updatedAt = now();
    DB.pending = DB.pending.filter(q => q.id !== p.id); save(); render();
    toast('已加入。記得匯出SOP檔發給大家');
  },
  async pendDrop(a) {
    const ok = await dlg({ title: '不採用這則狀況？', msg: '會從待審移除，執行紀錄裡還是看得到。', ok: '不採用' }); if (!ok) return;
    DB.pending = DB.pending.filter(p => p.id !== a.dataset.id); save(); render();
  },

  /* 編輯 */
  async editCancel() {
    if (EDIT && EDIT.dirty) { const ok = await dlg({ title: '放棄修改？', msg: '剛才的修改都不會儲存。', ok: '放棄修改', cancel: '繼續編輯', danger: true }); if (!ok) return; }
    const back = EDIT && !EDIT.isNew ? '#/t/' + EDIT.id : '#/'; EDIT = null; location.hash = back;
  },
  editSave() {
    if (!EDIT) return;
    const name = EDIT.name.trim();
    if (!name) { alertDlg('請填任務名稱', ''); return; }
    const r = linesToTask(EDIT.lines);
    if (r.err) {
      EDIT.bad = r.err.id; renumber();
      const el = lineEl(r.err.id); if (el) el.scrollIntoView({ block: 'center' });
      alertDlg('有一行放錯位置', r.err.msg); return;
    }
    const base = EDIT.isNew ? null : getTask(EDIT.id);
    const t = normTask({ id: base ? base.id : uid(), name, cat: EDIT.cat.trim(), purpose: r.purpose, notes: r.notes, outlines: r.outlines,
      rev: base ? base.rev : 0, dirty: base ? base.dirty : true, updatedAt: base ? base.updatedAt : now() });
    if (base) {
      const sig = x => JSON.stringify([x.name, x.cat, x.purpose, x.notes, x.outlines]);
      if (sig(base) !== sig(t)) { t.dirty = true; t.updatedAt = now(); }
      DB.tasks[DB.tasks.indexOf(base)] = t;
    } else DB.tasks.push(t);
    save(); EDIT = null; location.hash = '#/t/' + t.id; toast('已儲存');
  },
  async delTask() {
    const t = getTask(EDIT.id);
    const ok = await dlg({ title: '刪除這個任務？', msg: `「${t ? t.name : EDIT.name}」會從SOP移除，執行紀錄會保留。\n刪除後要重新匯出SOP檔，大家匯入後才會消失。`, ok: '刪除', danger: true });
    if (!ok) return;
    DB.tasks = DB.tasks.filter(x => x.id !== EDIT.id); DB.packDirty = true; save(); EDIT = null; location.hash = '#/'; toast('已刪除');
  },
  addLine() {
    const last = EDIT.lines.length - 1;
    insertLine(last, { id: uid(), type: last >= 0 ? nextType(last) : 'o', text: '' }, true);
  },
  lnMenu(a) {
    const idx = lnIdx(a.dataset.id); if (idx < 0) return;
    const l = EDIT.lines[idx], n = EDIT.lines.length; let L;
    const close = () => popLayer(L);
    const move = d => { const j = idx + d; if (j < 0 || j >= n) return; [EDIT.lines[idx], EDIT.lines[j]] = [EDIT.lines[j], EDIT.lines[idx]]; EDIT.dirty = true; close(); redrawLines(); };
    const hs = {
      cancel: close, up: () => move(-1), down: () => move(1),
      ins: () => { close(); insertLine(idx, { id: uid(), type: nextType(idx), text: '' }, true); },
      del: () => { close(); removeLine(idx, false); },
    };
    Object.keys(LT).forEach(k => { hs['t_' + k] = () => { l.type = k; if (k !== 's') l.key = false; EDIT.dirty = true; EDIT.bad = null; close(); renumber(); grow(taOf(l.id)); }; });
    L = pushLayer(`<h3>這一行是…</h3><div class="msg">${esc(l.text || '（空白）')}</div>
      <div class="tgrid">${Object.keys(LT).map(k => `<button class="btn${l.type === k ? ' pri' : ''}" data-x="t_${k}">${LT[k]}</button>`).join('')}</div>
      <p class="hint">大綱＝階段，項目＝分組，項次＝要做的動作；說明＝項次怎麼做，注意＝要小心的地方，要填＝完成時要填的結果。</p>
      ${l.type === 's' ? `<label class="ck"><input type="checkbox" id="lkey" ${l.key ? 'checked' : ''}><span><b>關鍵步驟</b>：執行時不能標「不適用」</span></label>` : ''}
      <div class="smv"><button class="btn sm" data-x="up" ${idx === 0 ? 'disabled' : ''}>${IC.up} 上移</button><button class="btn sm" data-x="down" ${idx === n - 1 ? 'disabled' : ''}>${IC.down} 下移</button><button class="btn sm" data-x="ins">${IC.plus} 下面加一行</button><button class="btn sm dangert" data-x="del">${IC.x} 刪除這一行</button></div>
      <div class="sbtns"><button class="btn" data-x="cancel">關閉</button></div>`, hs);
    L.el.addEventListener('change', e => { if (e.target.id === 'lkey') { l.key = e.target.checked; EDIT.dirty = true; renumber(); } });
  },
};
async function reportFlow(run, sid) {
  if (!run) return;
  const v = await dlg({ title: '回報狀況', msg: sid ? stepLabel(getTask(run.taskId), sid) : '整個任務',
    fields: [{ key: 'what', label: '發生什麼狀況', multi: true, rows: 3, req: true, ph: '例：滅火器壓力指針在紅區' }, { key: 'how', label: '你怎麼處理（可空白）', multi: true, rows: 2, ph: '例：改用二樓的滅火器，已報告值星官' }], ok: '記錄' });
  if (!v) return;
  const at = now();
  run.reps.push({ id: uid(), sid, what: v.what, how: v.how, at });
  DB.pending.push({ id: uid(), taskId: run.taskId, sid, what: v.what, how: v.how, by: run.by, at, runId: run.id });
  save(); render(); toast('已記錄，會附在這次的回報裡');
}
async function abortFlow(run) {
  if (!run) return;
  const v = await dlg({ title: '中止任務？', msg: '中止後這筆執行就結束了，不能再繼續。中止和原因都會寫進回報。', fields: [{ key: 'r', label: '中止原因', multi: true, rows: 2, req: true }], ok: '中止任務', danger: true });
  if (!v) return;
  markMod(run); run.status = 'abort'; run.abortReason = v.r; run.endAt = now(); save(); location.hash = '#/rec/' + run.id;
}

/* ---------- 匯入檔案 ---------- */
async function handleFile(text) {
  let o;
  try { o = JSON.parse(String(text).replace(/^﻿/, '')); } catch (e) { return alertDlg('看不懂這個檔案', '請選管理者傳來的「SOP_日期」檔，或之前下載的備份檔。'); }
  if (o && o.type === 'sop-pack' && Array.isArray(o.tasks)) {
    const warn = isAdmin() && DB.tasks.length && unpublished();
    const ok = await dlg({ title: '匯入SOP檔', msg: `${o.unit ? o.unit + '，' : ''}${fmtDT(o.exportedAt)} 匯出，共 ${o.tasks.length} 個任務。\n這支手機上的SOP會換成這份，執行紀錄會保留。${warn ? '\n\n注意：你有還沒匯出的修改，匯入後會被蓋掉。' : ''}`, ok: '匯入' });
    if (!ok) return;
    DB.tasks = o.tasks.map(t => normTask({ ...t, dirty: false }));
    if (o.unit) DB.unit = String(o.unit);
    if (!DB.role) DB.role = 'member';
    DB.packInfo = { exportedAt: +o.exportedAt || now(), importedAt: now() }; DB.packDirty = false;
    save(); EDIT = null; location.hash = '#/'; render(); toast(`已匯入 ${o.tasks.length} 個任務`);
    return;
  }
  if (o && o.type === 'sop-backup' && o.data) {
    const ok = await dlg({ title: '還原備份？', msg: `${fmtDT(o.exportedAt)} 的備份。\n這支手機目前的所有資料（SOP、執行紀錄、待審）都會換成備份裡的內容。`, ok: '還原', danger: true });
    if (!ok) return;
    DB = fromRaw(o.data); save(); EDIT = null; location.hash = '#/'; render(); toast('已還原備份');
    return;
  }
  alertDlg('看不懂這個檔案', '這不是SOP檔，也不是備份檔。');
}

/* ---------- 路由 ---------- */
function route() { const p = (location.hash.slice(1) || '/').split('/').filter(Boolean); return { name: p[0] || 'home', id: p[1] || '' }; }
function render() {
  if (TIMER) { clearInterval(TIMER); TIMER = null; }
  const r = route(); let h = '', after = null;
  switch (r.name) {
    case 't': h = vTask(r.id); break;
    case 'run': h = vRun(r.id); after = () => afterRun(r.id); break;
    case 'rec': h = vRec(r.id); break;
    case 'recs': h = vRecs(r.id); break;
    case 'review': h = isAdmin() ? vReview() : vHome(); break;
    case 'edit': if (isAdmin()) { h = vEdit(r.id); after = afterEdit; } else h = vHome(); break;
    case 'set': h = vSet(); break;
    default: h = vHome();
  }
  $('#app').innerHTML = h; document.body.dataset.view = r.name;
  if (after) after();
}
function onHash() {
  const r = route();
  if (EDIT && EDIT.dirty && r.name !== 'edit') {
    if (!confirm('編輯的內容還沒儲存，確定要離開嗎？')) { location.hash = '#/edit/' + EDIT.id; return; }
  }
  if (r.name !== 'edit') EDIT = null;
  closeAllLayers(); window.scrollTo(0, 0); render();
}

/* ---------- 啟動 ---------- */
const APP = $('#app');
APP.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a || a.disabled) return; const f = ACT[a.dataset.act]; if (!f) return; e.preventDefault(); f(a, e); });
APP.addEventListener('input', e => {
  const t = e.target;
  if (t.classList.contains('lt')) onLineInput(t);
  else if (t.dataset.f === 'name' || t.dataset.f === 'cat') { if (EDIT) { EDIT[t.dataset.f] = t.value; EDIT.dirty = true; } }
  else if (t.id === 'q') filterTasks(t.value);
  else if (t.dataset.set) settingsInput(t);
});
APP.addEventListener('keydown', e => {
  if (e.target.classList && e.target.classList.contains('lt')) onLineKey(e);
  else if (e.key === 'Enter' && e.target.id === 'cval') { e.preventDefault(); e.target.blur(); }
});
APP.addEventListener('paste', e => { if (e.target.classList && e.target.classList.contains('lt')) onLinePaste(e); });
APP.addEventListener('compositionend', () => { COMP_END = now(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && LAYERS.length) { const L = LAYERS[LAYERS.length - 1]; if (L.handlers.cancel) L.handlers.cancel(); } });
let RZ; window.addEventListener('resize', () => { clearTimeout(RZ); RZ = setTimeout(() => { if (EDIT) document.querySelectorAll('.lt').forEach(grow); }, 150); });
$('#filein').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => handleFile(rd.result);
  rd.onerror = () => alertDlg('讀取失敗', '檔案讀不出來，請重新選一次。');
  rd.readAsText(f);
});
window.addEventListener('hashchange', onHash);
render();
</script>
</body>
</html>
